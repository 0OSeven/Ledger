{id:"q706",m:"m7",t:"k",s:"An employer is liable for harassment by a client or customer when it:",o:["Has fewer than 15 employees","Knew or should have known and failed to take prompt corrective action","Paid the client","Did nothing wrong"],a:1,e:"Employers must protect employees from third-party harassment they know or should know about: warn the client, change staffing, or end the relationship."},
{id:"q707",m:"m7",t:"sj",s:"A key client's executive harasses an account manager, and the sales VP says not to jeopardize the account. What should HR do?",o:["Do nothing","Tell the employee to tolerate it","Reassign the employee with a pay cut","Intervene: confront the client, protect the employee (reassign the account, not the victim punitively), and document"],a:3,e:"Revenue does not excuse inaction on known third-party harassment; HR must act against the harasser's access while avoiding retaliation against the complainant."},
{id:"q708",m:"m7",t:"k",s:"In Stericycle (2023), the NLRB adopted which standard for evaluating facially neutral work rules?",o:["All rules are lawful","A rule is presumptively unlawful if an employee could reasonably interpret it to chill NLRA rights; the employer must then show a legitimate, substantial business interest pursued narrowly","Only union shops are covered","Rules are judged by management intent"],a:1,e:"Stericycle replaced Lutheran Heritage with an employee-perspective test: overbroad rules fall unless the employer proves a substantial interest that cannot be achieved more narrowly."},
{id:"q709",m:"m7",t:"sj",s:"A handbook bans 'disparaging the company on social media.' Under current NLRB law, what is the risk?",o:["The rule is presumptively unlawful under Stericycle because employees could reasonably read it to bar protected concerted complaints about working conditions","No risk","Only a risk in union shops","Only a risk for managers"],a:0,e:"Broad disparagement bans chill Section 7 activity like wage or safety complaints; rules must be narrowly drawn around specific legitimate interests such as confidentiality of trade secrets."},
{id:"q710",m:"m7",t:"k",s:"The NLRB's February 2026 final rule on joint employment:",o:["Banned staffing agencies","Expanded the 2023 rule","Withdrew the 2023 rule and restored the 2020 standard: a business must possess and exercise substantial direct and immediate control over essential terms of employment","Eliminated joint employment"],a:2,e:"The 2026 rule reinstated the 2020 test requiring both possession and actual exercise of substantial direct and immediate control before joint-bargaining obligations attach."},
{id:"q711",m:"m7",t:"sj",s:"A company uses staffing-firm workers, sets their schedules, disciplines them, and controls their daily tasks. Under the 2026 NLRB standard, what follows?",o:["Nothing: the staffing firm is the employer","The workers become union members","Only tax consequences","Likely joint-employer status, with potential bargaining obligations and unfair-labor-practice exposure"],a:3,e:"Possessing and exercising direct, immediate control over essential terms meets the restored 2020 joint-employer test; structure the relationship or accept the obligations."},
{id:"q712",m:"m7",t:"k",s:"Two employees discuss their wages on the company Slack and are disciplined for it. What is the violation?",o:["None: Slack is company property","Protected concerted activity under NLRA Section 7: discussing wages is core protected conduct","A trade secret violation","Insubordination"],a:1,e:"Section 7 protects employees acting together (or one acting for others) over terms and conditions of employment; wage discussions are its classic example."},
{id:"q713",m:"m7",t:"sj",s:"A manager wants to fire an employee for circulating a petition about break-room temperatures signed by six coworkers. What should HR advise?",o:["Block the termination: the petition is protected concerted activity","Approve it","Confiscate the petition","Suspend all six"],a:0,e:"Group complaints about working conditions are protected even without a union; discipline for the petition itself violates Section 8(a)(1)."},
{id:"q714",m:"m7",t:"k",s:"For the H-1B lottery, DHS finalized a rule in February 2026 that:",o:["Doubled the visa cap","Ended the lottery","Banned staffing firms","Replaced random selection with a wage-weighted process favoring higher-paid positions"],a:3,e:"The final rule (90 Fed. Reg. 60864) weights H-1B selection toward higher wage levels, so accurate prevailing-wage data and higher offers improve selection odds."},
{id:"q715",m:"m7",t:"sj",s:"A company plans H-1B filings under the new wage-weighted lottery. What is the BEST workforce-planning advice?",o:["File at the lowest wage level to save money","Delay all filings","File at the wage level that accurately reflects the role, recognizing higher-wage offers are weighted more favorably","Guarantee selection"],a:2,e:"Under weighted selection, lowball wage levels reduce lottery odds; plan realistic prevailing-wage offers and budget accordingly."},
{id:"q716",m:"m7",t:"k",s:"E-Verify is:",o:["Required of every US employer","Required for federal contractors and subcontractors under the FAR clause, and voluntary for most other private employers except where states mandate it","Banned","Only for agricultural workers"],a:1,e:"Federal E-Verify mandates attach mainly to federal contractors; many states add their own mandates, so coverage depends on jurisdiction and contracts."},
{id:"q717",m:"m7",t:"k",s:"The company receives an SSA 'no-match' letter for an employee. What does it establish?",o:["Nothing conclusive about work authorization: it is not evidence the employee is unauthorized","That the employee is undocumented","That termination is required","That ICE must be called"],a:0,e:"No-match letters flag record discrepancies (name changes, errors); employers should follow a verification process, not terminate on the letter alone."},
{id:"q718",m:"m7",t:"sj",s:"After a no-match letter, the manager wants the employee fired Friday. What should HR do?",o:["Fire Friday","Call ICE","Suspend without pay","Follow the verification procedure: notify the employee, allow time to resolve the discrepancy, and document; do not assume unauthorized status"],a:3,e:"Treating a no-match as proof of unauthorized status risks discrimination claims (IRCA's anti-discrimination provision) and wrongful termination; verify first."},
{id:"q719",m:"m7",t:"k",s:"Under the One Big Beautiful Bill Act (2025), for tax years 2025-2028 employees may:",o:["Deduct all wages","Skip filing","Deduct the FLSA-required overtime premium (the 'half' above the regular rate), capped at $12,500 ($25,000 joint), with phaseouts for higher earners","Deduct state-law-only overtime"],a:2,e:"OBBBA's overtime deduction covers only the FLSA-mandated premium portion within caps; employers face new W-2 reporting duties (with IRS penalty relief for 2025)."},
{id:"q720",m:"m7",t:"sj",s:"Employees ask HR whether their overtime is now 'tax free.' What is the BEST response?",o:["Promise it is fully tax free","Explain only the FLSA-required premium may qualify within caps, note payroll reporting changes, and refer them to a tax advisor","Refuse to discuss","Deduct nothing"],a:1,e:"HR should communicate accurately without giving tax advice: the deduction is limited to the FLSA premium portion, capped, and state-law overtime does not qualify."},
{id:"q721",m:"m7",t:"k",s:"In August 2025, DOL finalized rules dismantling federal-contractor affirmative action requirements. What changed?",o:["Regulations implementing Executive Order 11246 were rescinded, ending the race/sex AAP framework; Section 503 and VEVRAA rules were also substantially revised","Nothing changed","Title VII was repealed","Only state contractors affected"],a:0,e:"The August 2025 final rules (effective October 2025) removed the EO 11246 regulatory infrastructure including written AAPs and goals; contractors must reassess remaining 503/VEVRAA duties with counsel."},
{id:"q722",m:"m7",t:"sj",s:"A federal contractor asks whether it still needs a written affirmative action program. What should HR advise?",o:["Yes, exactly as before","No obligations remain at all","Ignore it","The EO 11246 race/sex AAP regulations were rescinded, so confirm current Section 503/VEVRAA posture and other legal duties with employment counsel before dismantling programs"],a:3,e:"The 2025 rollback ended the EO 11246 AAP regime, but disability and veteran obligations were revised rather than clearly eliminated, and Title VII still bars discrimination; get advice before acting."},
{id:"q723",m:"m7",t:"k",s:"A lawful approach to workforce diversity after Students for Fair Admissions and current EEOC enforcement is:",o:["Racial quotas","Sex-based hiring preferences","Broad outreach, structured job-related selection, and monitoring for adverse impact, without preferences or quotas","Ignoring demographics entirely"],a:2,e:"Title VII bars race and sex preferences in employment; lawful diversity efforts expand pipelines and de-bias processes rather than allocating opportunities by protected trait."},
{id:"q724",m:"m7",t:"sj",s:"A VP directs HR to 'make 50 percent of hires women this year.' What is the BEST response?",o:["Implement the quota","Refuse and propose lawful alternatives: wider sourcing, structured interviews, validated criteria, and adverse-impact monitoring","Hire only women","Keep it secret"],a:1,e:"Quotas and preferences by sex violate Title VII even when well-intentioned; HR should redirect leadership to process-based strategies that survive scrutiny."},
{id:"q725",m:"m7",t:"k",s:"After the FTC's 2024 noncompete rule was abandoned, what governs employee noncompetes?",o:["State law: several states ban or sharply restrict noncompetes, while others enforce only reasonable ones protecting legitimate interests","No law at all","Federal criminal law","Only the FTC"],a:0,e:"With no federal ban in effect, enforceability turns on state law, which ranges from near-total bans to reasonableness tests; multistate employers need jurisdiction-specific review."},
{id:"q726",m:"m7",t:"sj",s:"A company wants every hourly employee to sign a two-year noncompete. What should HR recommend?",o:["Do it: protection matters","Noncompetes for all hourly staff are fine","Shorten to one year","Drop broad noncompetes for rank-and-file roles: use NDAs, non-solicitation agreements, and garden-leave or training-repayment terms where lawful"],a:3,e:"Courts and legislatures disfavor noncompetes for low-wage and rank-and-file workers; targeted protections of genuine confidential interests fare far better."},
{id:"q727",m:"m7",t:"k",s:"The Defend Trade Secrets Act of 2016 gives employers:",o:["Only state remedies","Criminal immunity","A federal civil cause of action for trade secret misappropriation, including ex parte seizure in extraordinary circumstances","Copyright protection"],a:2,e:"The DTSA created a federal civil remedy for trade secret theft with nationwide service and, rarely, ex parte seizure; employers must give whistleblower-immunity notice in covered agreements."},
{id:"q728",m:"m7",t:"k",s:"Under the inevitable disclosure doctrine, a court may:",o:["Award stock options","Enjoin a departing employee from a new job where trade secret use would be inevitable, in states recognizing the doctrine","Order arbitration","Require a raise"],a:1,e:"Some states allow injunctions blocking competitive employment when the new role would inevitably disclose trade secrets, even without proof of actual misappropriation."},
{id:"q729",m:"m7",t:"k",s:"On involuntary termination, final-pay timing is governed by:",o:["State law: many states require payment by the next payday or sooner, with penalties for delay","Federal law requiring same-day pay nationwide","Employer preference","The employee's request"],a:0,e:"No federal final-pay deadline exists; state wage-payment laws set the clock (some demand immediate payment on firing) and often add waiting-time penalties."},
{id:"q730",m:"m7",t:"sj",s:"Payroll wants to include a fired employee's final check in the regular two-week cycle, but state law requires payment within 24 hours of termination. What must happen?",o:["Follow the normal cycle","Ask the employee to wait","Deduct a processing fee","Pay within the state deadline: waiting-time penalties accrue daily in many states"],a:3,e:"State deadlines override payroll convenience; missing them can trigger daily penalties and attorney's fees, so expedite final pay for involuntary terminations."},
{id:"q731",m:"m7",t:"k",s:"Under Title III of the Consumer Credit Protection Act, an employer:",o:["May fire for any garnishment","Must honor all garnishments without limits","May not fire an employee because of a single garnishment, and garnishment amounts are capped","May reduce pay instead"],a:2,e:"The CCPA bars termination for one indebtedness garnishment and generally limits garnishment to 25 percent of disposable earnings (higher for support orders)."},
{id:"q732",m:"m7",t:"sj",s:"A manager wants to fire an employee whose wages were just garnished for a credit card debt. What should HR advise?",o:["Approve it","Stop: federal law prohibits firing for a single garnishment; address any performance issues separately","Garnish the manager's pay","Ignore the law"],a:1,e:"A single garnishment cannot be grounds for termination under the CCPA; only multiple garnishments lose that protection, and state laws may add more."},
{id:"q733",m:"m7",t:"k",s:"The Employee Polygraph Protection Act generally:",o:["Bans private employers from requiring or requesting polygraph tests, with narrow exemptions","Requires polygraphs for all hires","Applies only to government","Allows random testing"],a:0,e:"The EPPA prohibits most private-sector polygraph use; exemptions include security services and ongoing investigations of economic loss with reasonable suspicion."},
{id:"q734",m:"m7",t:"sj",s:"After a cash shortage, the owner wants every cashier polygraphed. What is the BEST advice?",o:["Test everyone","Test only the newest hires","Test the owner instead","Do not conduct blanket testing: the EPPA bars it, and even the ongoing-investigation exemption requires reasonable suspicion of particular employees plus strict procedures"],a:3,e:"Blanket polygraph sweeps violate the EPPA; the narrow exemption demands an identifiable economic loss, reasonable suspicion, and detailed notices, so investigate by other means first."},
{id:"q735",m:"m7",t:"k",s:"When giving a job reference, the employer's statements are protected by:",o:["Absolute immunity","Attorney-client privilege","A qualified privilege for good-faith, truthful, job-related statements, lost through malice or knowing falsehood","The Fifth Amendment"],a:2,e:"Most states grant qualified privilege to good-faith references; knowing falsehoods, spite, or excessive publication defeat it and invite defamation claims."},
{id:"q736",m:"m7",t:"sj",s:"A reference check asks about a former employee fired for theft. The caller wants details. What is the BEST approach?",o:["Share the full investigation file","Provide truthful, job-related, documented facts consistent with company policy, or stick to a name-rank-serial policy applied evenly","Lie to protect the former employee","Refuse all references"],a:1,e:"Truthful, documented, job-related disclosures generally keep the qualified privilege; many employers use a neutral policy for consistency, applied without exception."},
{id:"q737",m:"m7",t:"k",s:"In June 2026, a federal court vacated the 2025 proclamation imposing a $100,000 fee on new H-1B petitions. What is the practical effect?",o:["The fee is gone unless stayed or reversed on appeal; employers should re-budget but monitor the litigation","The fee still applies","All H-1B workers must leave","Refunds are automatic"],a:0,e:"The Massachusetts ruling vacated the fee as an unauthorized tax, but appeals could revive it; plan without the fee while tracking the case."},
{id:"q738",m:"m7",t:"k",s:"Under VEVRAA, federal contractors must:",o:["Hire only veterans","List most job openings with the state workforce agency system","Pay veterans extra","Avoid background checks"],a:1,e:"VEVRAA requires covered contractors to list openings with the state employment service (except executive, senior management, and internal positions) and invite self-identification."},
{id:"q739",m:"m7",t:"sj",s:"A state protects employees' off-duty marijuana use, but a forklift operator tests positive after an incident. What should HR consider?",o:["Federal law controls everything","Automatic termination","Safety-sensitive roles often remain an exception under state laws, and DOT-regulated positions still require testing; check the statute's exceptions before acting","Ignore the test"],a:2,e:"Many state cannabis-employment laws exempt safety-sensitive positions and preserve federal testing mandates; the analysis turns on the specific statute's carve-outs."},
{id:"q740",m:"m7",t:"k",s:"Many states now prohibit employers from:",o:["Drug testing","Requesting or requiring employees' personal social media passwords","Checking references","Using email"],a:1,e:"Social media privacy laws in a majority of states bar requesting passwords or coerced access to personal accounts; investigations must use lawful, non-coercive means."}
);

<script>
"use strict";
/* ---- 1000Q EXPANSION batch 5 ---- */
QUESTIONS.push(
{id:"q741",m:"m8",t:"k",s:"The Total Recordable Incident Rate (TRIR) is calculated as:",o:["Recordable incidents divided by number of employees","Lost workdays divided by total payroll","Recordable incidents times the experience modification rate","(Number of OSHA-recordable incidents x 200,000) / total hours worked"],a:3,e:"TRIR = (recordables x 200,000) / hours worked. The 200,000 represents 100 full-time workers for a year, allowing comparison across employers of different sizes."},
{id:"q742",m:"m8",t:"k",s:"The DART rate differs from TRIR because DART counts only cases involving:",o:["Days away from work, restricted work, or job transfer","All OSHA-recordable incidents","First-aid-only cases","Near misses"],a:0,e:"DART = Days Away, Restricted, or Transferred. It is a subset of recordables measuring severity, while TRIR measures overall recordable frequency."},
{id:"q743",m:"m8",t:"sj",s:"The company's workers' compensation experience modification rate (EMR) rose to 1.25, triggering a premium surcharge. Leadership wants it down before renewal. What is the BEST first move?",o:["Shop for a carrier that ignores EMR","Blame the broker for the increase","Audit recent claims for root causes and launch targeted injury-prevention and return-to-work efforts","Stop reporting minor injuries to lower the rate"],a:2,e:"EMR above 1.0 means worse-than-average loss experience. The durable fix is fewer and less severe claims through prevention and return-to-work, not shopping or underreporting (which is illegal)."},
{id:"q744",m:"m8",t:"k",s:"Under OSHA's multi-employer worksite policy, the 'controlling employer' is the one with:",o:["The most employees on site","General supervisory authority over the worksite, including the power to correct hazards","The lowest bid","The oldest contract"],a:1,e:"OSHA recognizes creating, exposing, correcting, and controlling employers. The controlling employer has general supervision and must exercise reasonable care to prevent violations it could foresee and correct."},
{id:"q745",m:"m8",t:"k",s:"An employee alleging retaliation for raising a safety concern must file an OSHA 11(c) complaint within:",o:["180 days","30 days","One year","10 business days"],a:1,e:"Section 11(c) of the OSH Act gives employees just 30 days to file retaliation complaints with OSHA, one of the shortest whistleblower deadlines in federal law."},
{id:"q746",m:"m8",t:"sj",s:"A machine operator refuses to run equipment she says is imminently dangerous. Her supervisor wants to discipline her for insubordination. What should HR advise?",o:["Pause discipline and assess whether the refusal meets the protected criteria: reasonable belief of imminent danger, no time for OSHA enforcement, and no reasonable alternative","Support the discipline to maintain authority","Transfer her to another department immediately","Call OSHA to report her"],a:0,e:"Employees may refuse work facing imminent danger when they reasonably believe it could cause death or serious harm, raised it with the employer, and there is no time for OSHA action. Disciplining protected refusal creates retaliation liability."},
{id:"q747",m:"m8",t:"k",s:"The OSHA 300A summary must be posted in the workplace from:",o:["January 1 to March 1","February 1 to April 30","July 1 to September 30","Only after an inspection"],a:1,e:"The 300A summary of the prior year's injuries and illnesses must be certified by a company executive and posted February 1 through April 30 each year."},
{id:"q748",m:"m8",t:"k",s:"OSHA requires each recordable injury or illness to be entered on the 300 Log within:",o:["24 hours","30 days","7 calendar days","The end of the quarter"],a:2,e:"Recordable cases must be logged within 7 calendar days of the employer learning of them. Late logging is a common citation in recordkeeping audits."},
{id:"q749",m:"m8",t:"k",s:"When counting days away or on restriction for the OSHA 300 Log, the count is capped at:",o:["30 days","90 days","180 days","365 days"],a:2,e:"OSHA caps day counts at 180 days per case. Count calendar days (not workdays), and stop counting once the cap or case resolution is reached."},
{id:"q750",m:"m8",t:"sj",s:"A temporary worker supplied by a staffing agency is seriously injured at the host employer's facility. Both companies point at each other on safety responsibility. What is the correct position?",o:["Only the staffing agency is responsible since it is the employer of record","Only the host is responsible since it controlled the worksite","Both share responsibility: the agency and host are joint employers for safety under OSHA's Temporary Worker Initiative","Neither is responsible because the worker was temporary"],a:2,e:"OSHA's Temporary Worker Initiative treats staffing agencies and host employers as joint employers. Both must ensure training, hazard communication, and injury recording (the host typically logs it). Contracts cannot waive this duty."},
{id:"q751",m:"m8",t:"k",s:"The DOL's economic reality test for independent contractor status under the FLSA focuses on:",o:["Whether the worker signed an independent contractor agreement","The totality of circumstances, including control, opportunity for profit or loss, permanence, and integration into the business","The worker's job title","How the worker is paid"],a:1,e:"Labels and contracts do not control. The economic reality test weighs factors like the employer's control, the worker's opportunity for profit or loss, investment, permanence, and whether the work is integrated into the business."},
{id:"q752",m:"m8",t:"sj",s:"An internal audit finds 40 'contractors' working full-time schedules, using company equipment, under direct supervision, some for over two years. What is the BEST action?",o:["Have them sign new contractor agreements with stronger language","Reclassify the relationship based on the actual working conditions, remediate back wages, taxes, and benefits exposure with counsel","Do nothing since they agreed to contractor status","Convert them to part-time employees to reduce exposure"],a:1,e:"Misclassification is judged on reality, not paperwork. Proactive reclassification with legal counsel limits exposure to back overtime, payroll taxes, benefits claims, and workers' comp gaps. New agreements alone change nothing."},
{id:"q753",m:"m8",t:"k",s:"The workers' compensation 'exclusive remedy' doctrine generally bars employees from suing their employer for work injuries, EXCEPT:",o:["When the injury is minor","When the injury occurred off-site","When the employee has health insurance","When the employer intentionally harmed the employee (recognized in many states)"],a:3,e:"Exclusive remedy is the workers' comp bargain: no-fault benefits in exchange for no lawsuits. Most states carve out intentional torts by the employer, and uninsured employers lose the protection entirely."},
{id:"q754",m:"m8",t:"k",s:"The 'going and coming' rule in workers' compensation holds that injuries during an ordinary commute are generally not compensable, EXCEPT when:",o:["The employee was listening to work calls","The employee was on a special errand or mission for the employer","The employee carpooled","The commute was longer than 30 minutes"],a:1,e:"The special-errand exception covers travel undertaken at the employer's request outside the normal commute. Traveling employees (no fixed worksite) get broader coverage."},
{id:"q755",m:"m8",t:"sj",s:"A remote employee trips over her dog while walking to her home office during work hours and fractures her wrist. She files a workers' compensation claim. How should HR evaluate it?",o:["Deny it automatically because the home is not a company facility","Apply the standard test: did the injury arise out of and in the course of employment, considering the work activity at the time","Approve it because all remote injuries are compensable","Deny it because the dog is a personal hazard"],a:1,e:"Remote injuries use the same arising-out-of/in-the-course-of test. Trips during work activity in the home workspace can be compensable; purely personal detours generally are not. Facts, not location, decide."},
{id:"q756",m:"m8",t:"k",s:"When an employee's serious health condition qualifies under both FMLA and workers' compensation, the employer:",o:["Must let the employee choose which applies","May designate the leave as FMLA leave so both run concurrently, with proper notice","Must run them consecutively","Cannot apply FMLA during workers' comp"],a:1,e:"FMLA and workers' comp can run concurrently when the condition is a serious health condition. The employer must designate FMLA in writing; otherwise the 12-week clock may not run."},
{id:"q757",m:"m8",t:"k",s:"After FMLA and workers' compensation leave are exhausted, an employee's request for additional unpaid leave may still be required as:",o:["A gift from the employer","A reasonable accommodation under the ADA, subject to undue hardship analysis","An automatic entitlement of six more months","A union right only"],a:1,e:"The EEOC treats additional leave as a potential reasonable accommodation. Employers must engage in the interactive process and assess undue hardship rather than applying rigid maximum-leave policies."},
{id:"q758",m:"m8",t:"sj",s:"A warehouse associate exhausts 12 weeks of FMLA for a back injury and asks for two more months of unpaid leave before returning. The policy says 'maximum 12 weeks, no exceptions.' What is the BEST response?",o:["Enforce the policy as written","Terminate for inability to return","Begin the ADA interactive process: assess whether extended leave is a reasonable accommodation or an undue hardship","Grant it without any assessment"],a:2,e:"Inflexible maximum-leave policies violate the ADA when additional leave would be reasonable. The interactive process with medical input and hardship analysis is required; automatic termination is the highest-risk move."},
{id:"q759",m:"m8",t:"k",s:"Workers' compensation statutory benefits typically include all EXCEPT:",o:["Medical treatment","Temporary total disability payments","Permanent partial disability payments","Pain and suffering damages"],a:3,e:"Workers' comp provides medical care, wage-loss benefits (TTD/TPD/PPD/PTD), vocational rehab, and death benefits. Pain and suffering, available in tort suits, is excluded, which is the trade-off of the no-fault system."},
{id:"q760",m:"m8",t:"k",s:"OSHA's Hazard Communication Standard requires employers to maintain:",o:["A written hazard communication program, container labeling, Safety Data Sheet access, and employee training","Only Safety Data Sheets in a binder","Annual air sampling for all chemicals","A chemical inventory shared with competitors"],a:0,e:"HazCom (GHS-aligned) requires a written program, labeled containers, readily accessible SDSs, and training on chemical hazards and protective measures. It covers any workplace with hazardous chemicals, not just manufacturing."},
{id:"q761",m:"m8",t:"sj",s:"A new plant manager wants employees to buy their own hard hats and safety glasses to 'build ownership of safety.' What should HR advise?",o:["Support the idea since ownership improves compliance","Put it to an employee vote","Allow it for glasses but not hard hats","Reject it: OSHA generally requires the employer to pay for required PPE, with only narrow exceptions"],a:3,e:"OSHA's PPE payment rule requires employers to pay for required PPE. Limited exceptions exist (e.g., ordinary safety-toe footwear, prescription safety eyewear), but hard hats and standard safety glasses are the employer's cost."},
{id:"q762",m:"m8",t:"sj",s:"During a chemical spill, the supervisor cannot locate the Safety Data Sheet and wants to 'figure it out as we go.' What is the FIRST priority?",o:["Find the SDS before doing anything else","Evacuate and secure the area per the emergency action plan, then obtain the SDS to guide response","Let the most senior employee decide the cleanup method","Call the chemical manufacturer after cleanup"],a:1,e:"People first: evacuate and secure per the EAP. SDS access is required precisely so responders know hazards and proper cleanup, but never delay evacuation to search for paperwork."},
{id:"q763",m:"m8",t:"sj",s:"Maintenance workers routinely skip lockout/tagout on a conveyor because 'it only takes a minute to clear a jam.' A supervisor has looked the other way. What is the BEST intervention?",o:["Post a reminder sign near the conveyor","Enforce the energy-control program: retrain, discipline for bypassing, hold the supervisor accountable, and audit compliance","Accept it since no one has been hurt","Only enforce lockout during OSHA inspections"],a:1,e:"Skipping LOTO on 'quick' tasks is how amputations and fatalities happen. OSHA's control-of-hazardous-energy standard requires procedures, training, and enforcement. Supervisor tolerance must be addressed directly."},
{id:"q764",m:"m8",t:"k",s:"OSHA's Bloodborne Pathogens standard requires employers with occupational exposure to:",o:["Offer the hepatitis B vaccine at no cost and maintain a written Exposure Control Plan","Test all employees monthly","Ban all sharp objects","Provide hazard pay"],a:0,e:"The standard covers workers with reasonably anticipated exposure (healthcare, first-aid responders, housekeeping in some settings): written exposure control plan, free HBV vaccination, PPE, and post-exposure evaluation."},
{id:"q765",m:"m8",t:"k",s:"Under OSHA's access-to-records standard (1910.1020), employee exposure records must be preserved for:",o:["One year","Five years","30 years","The duration of employment only"],a:2,e:"Exposure records (air monitoring, chemical inventories) must be kept 30 years; medical records for duration of employment plus 30 years. Employees and OSHA have the right to access them."},
{id:"q766",m:"m8",t:"sj",s:"A former employee requests copies of his medical surveillance records from the company's occupational health program. HR is unsure whether to comply. What is the correct action?",o:["Deny the request since he no longer works there","Provide access: current and former employees (and their designated representatives) have the right to access their exposure and medical records","Provide them only with a court order","Charge a prohibitive fee to discourage requests"],a:1,e:"Access rights under 1910.1020 extend to former employees and their representatives. Denying or obstructing access is itself a violation."},
{id:"q767",m:"m8",t:"k",s:"California's workplace violence prevention law (SB 553) requires most California employers to:",o:["Hire armed guards","Maintain a written Workplace Violence Prevention Plan, keep a violent incident log, and train employees","Ban all visitors","Install metal detectors"],a:1,e:"Effective July 2024, SB 553 requires covered California employers to have a written WVPP integrated with their IIPP, maintain a violent incident log, and provide employee training. Cal/OSHA can enforce it."},
{id:"q768",m:"m8",t:"sj",s:"A coworker reports that an employee has been making vague threatening statements and was seen researching weapons online. What should the threat assessment team do FIRST?",o:["Gather facts promptly: interview the reporter, assess credibility and context, and determine the level of concern before acting","Terminate the employee immediately to eliminate the risk","Confront the employee in front of coworkers as a deterrent","Wait to see if the behavior escalates"],a:0,e:"Threat assessment is fact-driven, not fear-driven: gather information, evaluate context and credibility, and match the response to the assessed risk. Immediate termination without assessment can escalate risk and create liability."},
{id:"q769",m:"m8",t:"k",s:"The Department of Homeland Security's recommended response to an active shooter is, in order:",o:["Hide, Run, Fight","Run, Hide, Fight","Fight, Run, Hide","Lockdown only"],a:1,e:"DHS guidance: Run (evacuate if safe), Hide (lock/barricade if evacuation is not possible), Fight (as a last resort). Training should cover all three, in priority order."},
{id:"q770",m:"m8",t:"sj",s:"An employee discloses she has a protective order against a former partner who has come to the parking lot twice. Her manager suggests moving her to a different shift 'to avoid drama.' What is the BEST response?",o:["Move her shift as suggested","Tell her to handle it with the police alone","Terminate her for bringing personal issues to work","Develop a safety plan with her: security measures, photo of the individual to guards, escort options, and EAP resources, without penalizing her"],a:3,e:"Domestic violence spillover is a workplace safety issue. The employer should collaborate on a safety plan. Reassigning or penalizing the victim can be retaliatory and discriminatory; the focus stays on the threat, not the victim."},
{id:"q771",m:"m8",t:"k",s:"New York's electronic monitoring law requires private employers that monitor employee communications to:",o:["Get a court order first","Provide written notice to new hires and post the notice conspicuously","Only monitor executives","Disclose monitoring in annual reports only"],a:1,e:"New York (Civil Rights Law 52-c) requires written notice upon hiring that electronic monitoring may occur, plus conspicuous posting. Connecticut and Delaware have similar notice laws."},
{id:"q772",m:"m8",t:"k",s:"Illinois' Biometric Information Privacy Act (BIPA) requires private entities to do what before collecting fingerprints or face scans?",o:["Obtain a written release after providing written notice of the purpose and retention period","Post a sign in the lobby","Get state approval","Nothing if used for timekeeping"],a:0,e:"BIPA requires informed written consent before collecting biometric identifiers, a public retention/destruction policy, and prohibits selling biometric data. It carries a private right of action with statutory damages, and timekeeping is not exempt."},
{id:"q773",m:"m8",t:"sj",s:"Operations wants to replace badge swipes with fingerprint time clocks across all sites, including Illinois. What is the BEST compliance step before rollout?",o:["Roll out first and handle complaints later","Implement BIPA-compliant written notice and consent, a retention and destruction schedule, and vendor data protections","Use the fingerprints for background checks too since you have them","Store the prints indefinitely for future use"],a:1,e:"Biometric timekeeping triggers BIPA in Illinois (and similar laws elsewhere). Consent, purpose limitation, retention schedules, and vendor safeguards must precede collection. Function creep into other uses compounds exposure."},
{id:"q774",m:"m8",t:"k",s:"Since January 1, 2023, employee and applicant personal data held by employers subject to California privacy law is:",o:["Exempt from all privacy requirements","Covered by the CCPA as amended by the CPRA, giving workers rights to know, delete, and correct their data","Only covered if the employee is a California resident working remotely from another state","Regulated solely by federal law"],a:1,e:"The CPRA ended the HR-data exemption. Covered employers must honor employee/applicant rights (know, delete, correct, limit sensitive data) and provide privacy notices at collection."},
{id:"q775",m:"m8",t:"k",s:"Under the GDPR, processing employee personal data requires:",o:["Employee consent in all cases","A lawful basis (such as contract or legal obligation), data minimization, and respect for data subject rights","Only a privacy policy","Approval from a works council in every case"],a:1,e:"GDPR requires a lawful basis for each processing purpose; consent is often invalid in employment due to power imbalance. Data subject rights (access, erasure, portability) apply to workers, and works councils may have co-determination rights."},
{id:"q776",m:"m8",t:"sj",s:"Ransomware locks the payroll vendor's systems two days before payday. What is HR's FIRST move?",o:["Activate the payroll continuity plan: manual or backup processing, employee communications, and coordination with the vendor and IT","Wait for the vendor to resolve it","Tell employees payday is canceled","Pay everyone estimated amounts in cash"],a:0,e:"Payroll continuity is an HR-owned business continuity element: backup processing, clear employee communication, and documented procedures. Waiting passively risks wage-payment violations and panic."},
{id:"q777",m:"m8",t:"k",s:"The BEST defense against W-2 phishing scams targeting HR and payroll staff is:",o:["Faster email servers","Requiring executives to send requests only on Fridays","Banning email attachments","Out-of-band verification of any unusual sensitive-data request, even if it appears to come from an executive"],a:3,e:"Business email compromise spoofs executives to steal W-2s. Policy must require verifying unusual requests through a separate channel (call, in person). Technology helps, but the verification habit is the control."},
{id:"q778",m:"m8",t:"sj",s:"Payroll receives an urgent email appearing to be from the CEO requesting all employee W-2s 'for an audit,' with a personal Gmail reply-to. What should payroll do?",o:["Send the files immediately since it is from the CEO","Verify through an independent channel before sending anything, and report the suspected phishing attempt","Reply asking for more details","Send a sample of three W-2s first"],a:1,e:"Urgency plus a reply-to mismatch are classic BEC indicators. Never transmit sensitive data on an unverified request; verify via a known number or in person and report to IT security."},
{id:"q779",m:"m8",t:"k",s:"Negligent retention differs from negligent hiring because it focuses on:",o:["The interview process","Keeping an employee after the employer knew or should have known the employee posed a foreseeable risk","Reference checks","Pre-employment testing"],a:1,e:"Negligent retention liability arises when an employer learns of an employee's dangerous propensities (violence, theft, misconduct) and fails to act. Ongoing supervision and response to complaints are the defense."},
{id:"q780",m:"m8",t:"k",s:"During an OSHA inspection, employees have the right to:",o:["Have an employee representative accompany the inspector on the walkaround","Refuse entry to the inspector","Shut down the facility","Negotiate the citation on the spot"],a:0,e:"Workers may designate a representative to join the walkaround and speak privately with the inspector. Employers cannot retaliate for exercising these rights."},
{id:"q781",m:"m8",t:"k",s:"OSHA classifies a violation as 'serious' when:",o:["The employer has been cited before","There is a substantial probability that death or serious physical harm could result from the hazard","Any injury occurred","The employer disagrees with the standard"],a:1,e:"Serious = substantial probability of death or serious harm from a hazard the employer knew or should have known about. Willful and repeated violations carry higher penalties."},
{id:"q782",m:"m8",t:"sj",s:"An OSHA compliance officer arrives unannounced for an inspection. The plant manager wants to refuse entry until the company lawyer arrives. What should HR advise?",o:["Refuse entry until counsel arrives","Cooperate: hold an opening conference, accompany the walkaround, document everything, and notify counsel promptly","Demand a warrant immediately","Send employees home for the day"],a:1,e:"Employers may insist on a warrant, but refusal without one escalates conflict and inspectors can return with one. Best practice: cooperate professionally, manage the walkaround, take parallel notes and photos, and get counsel involved early."},
{id:"q783",m:"m8",t:"k",s:"OSHA's Voluntary Protection Programs (VPP) recognize employers that:",o:["Pay the highest wages","Implement exemplary safety and health management systems with employee involvement, earning exemption from programmed inspections","Have zero employees","Are located in State Plan states only"],a:1,e:"VPP Star sites demonstrate safety excellence through management commitment, employee involvement, hazard analysis, and training. Benefits include exemption from programmed inspections and industry recognition."},
{id:"q784",m:"m8",t:"sj",s:"A heat wave is forecast during a week of outdoor paving work. What is the BEST immediate action?",o:["Implement the heat illness prevention plan: water, rest, shade, acclimatization for new workers, and training on symptoms","Tell workers to drink coffee for energy","Cancel all breaks to finish faster","Rely on workers to self-monitor without guidance"],a:0,e:"OSHA's heat emphasis (NEP and general duty) expects employers to provide water, rest, and shade, acclimatize new/returning workers, and train on heat illness signs. Heat stroke can be fatal within minutes."},
{id:"q785",m:"m8",t:"k",s:"OSHA's National Emphasis Program on heat injury and illness means the agency is:",o:["Ignoring heat hazards","Requiring air conditioning everywhere","Targeting inspections at high-risk industries and workplaces during hot conditions","Banning all outdoor work"],a:2,e:"The heat NEP directs targeted inspections in industries like construction, agriculture, and warehousing. Employers can also be cited under the general duty clause for recognized heat hazards."},
{id:"q786",m:"m8",t:"k",s:"In safety management, near-miss reporting and safety-training completion are examples of:",o:["Lagging indicators","Vanity metrics","Financial metrics","Leading indicators"],a:3,e:"Leading indicators measure proactive safety activity before injuries occur; lagging indicators (TRIR, DART) measure harm already done. Mature programs manage both."},
{id:"q787",m:"m8",t:"k",s:"Safety culture differs from safety climate in that safety culture refers to:",o:["Daily weather conditions","The number of safety posters","Employee survey scores","The deep, enduring shared values about safety; climate is the measurable snapshot of perceptions at a point in time"],a:3,e:"Culture is the underlying value system; climate is what surveys measure right now. Leaders shape culture over time but manage climate day to day."},
{id:"q788",m:"m8",t:"k",s:"A common criticism of behavior-based safety (BBS) programs is that they:",o:["Can blame workers and suppress reporting when used punitively, instead of fixing system hazards","Eliminate all hazards","Replace engineering controls","Are required by OSHA"],a:0,e:"BBS observes at-risk behaviors, but critics note it can drift into blaming workers for system problems and discourage injury reporting. Best practice pairs it with hazard elimination and a just culture."},
{id:"q789",m:"m8",t:"sj",s:"The joint safety committee exists on paper but is dominated by managers; frontline workers rarely speak. Injury rates are flat. What is the BEST fix?",o:["Disband the committee","Hold meetings less often","Restructure for genuine joint participation: frontline representation, co-chairs, authority to recommend fixes, and visible follow-through","Add more managers"],a:2,e:"Committees work when workers have real voice and see action on their input. Token committees breed cynicism; empowered ones surface hazards management never sees."},
{id:"q790",m:"m8",t:"sj",s:"A low-bid contractor will supply 50 workers for a plant expansion. Their safety record is unknown. Before signing, what should HR/safety require?",o:["Nothing; the contractor handles its own safety","A handshake agreement on safety","The lowest price guaranteed","Prequalification: EMR, TRIR/DART history, written safety programs, and safety requirements written into the contract"],a:3,e:"Under the multi-employer doctrine the host can be cited for contractor-created hazards. Prequalify on safety performance and put safety obligations in the contract."},
{id:"q791",m:"m8",t:"k",s:"Effective crisis communication plans designate:",o:["Everyone as a spokesperson","No communication until lawsuits end","A single trained spokesperson, holding statements, and pre-approved notification trees","Only the CEO's personal phone"],a:2,e:"One voice prevents contradictory statements that become exhibits. Holding statements ('we are aware, investigating, will update at X') buy time without speculation."},
{id:"q792",m:"m8",t:"sj",s:"A worker is fatally injured on site. In the first hours, what are HR's priorities?",o:["Secure the scene, cooperate with authorities, ensure the family is notified compassionately and before media, and activate support resources","Post about it on social media immediately","Interview witnesses aggressively","Resume operations at once"],a:0,e:"Preserve the scene for investigation, notify OSHA within 8 hours of a fatality, ensure dignified family notification ahead of press, and provide grief/trauma resources. Operations resume only when safe."},
{id:"q793",m:"m8",t:"k",s:"Critical incident stress debriefing after a workplace trauma should be:",o:["Mandatory for all employees","Held only for managers","A criminal investigation","Voluntary and peer-supported, facilitated by trained professionals, not a substitute for clinical care"],a:3,e:"Mandatory debriefing can retraumatize. Best practice: voluntary participation, trained facilitators, normalization of reactions, and referral paths to EAP or clinical care."},
{id:"q794",m:"m8",t:"k",s:"Regarding marijuana and employment drug testing, the current landscape is BEST described as:",o:["Federal law requires all employers to accommodate medical marijuana","All drug testing is now illegal","A patchwork: many states protect off-duty use or require impairment-based action, while federal law still classifies marijuana as illegal and DOT testing continues","Employers may never test for THC"],a:2,e:"State laws increasingly restrict adverse action based solely on a positive THC test (especially for non-safety-sensitive roles), but safety-sensitive and DOT-regulated positions remain testable. Policies must be jurisdiction-specific."},
{id:"q795",m:"m8",t:"sj",s:"A forklift operator tests positive for THC in a state that protects off-duty cannabis use. He was not impaired at work and had no incident. What is the BEST approach?",o:["Apply the policy's safety-sensitive provisions: assess impairment and safety risk under the written policy and state law, rather than acting on the test alone","Terminate immediately based on the positive test","Ignore the result entirely","Transfer him to a desk job permanently without discussion"],a:0,e:"In protective states, action must rest on impairment or safety-sensitive designation, not the metabolite alone. Safety-sensitive roles still justify testing, but the response must follow the policy and the statute's specific requirements."},
{id:"q796",m:"m8",t:"k",s:"A 'last-chance agreement' in substance-abuse cases typically provides:",o:["Immediate termination","A raise","Unlimited additional chances","A final opportunity to retain employment conditioned on treatment compliance and future testing, where a violation means termination"],a:3,e:"Last-chance agreements follow a policy violation (often post-rehab): the employee keeps the job subject to strict conditions. They must be clear, voluntary, and consistently applied."},
{id:"q797",m:"m8",t:"k",s:"An employer may require a fitness-for-duty examination when it is:",o:["Requested by coworkers","Based on a rumor","Job-related and consistent with business necessity, based on objective evidence of performance or safety concerns","Done annually for everyone"],a:2,e:"The ADA permits fitness-for-duty exams only with objective evidence raising questions about ability or safety. The exam must be narrowly tailored to the essential functions at issue."},
{id:"q798",m:"m8",t:"k",s:"The primary risk factors for work-related musculoskeletal disorders include:",o:["Repetition, force, awkward postures, and vibration","Office carpeting color","Employee age alone","Short commutes"],a:0,e:"MSDs arise from ergonomic risk factors: repetition, forceful exertion, awkward/static postures, vibration, and contact stress. Controls follow the hierarchy: engineer out the hazard before relying on training or PPE."},
{id:"q799",m:"m8",t:"sj",s:"MSD complaints are rising on a packaging line. Management wants a stretching program and new posters. What is the BEST first step?",o:["Order the posters","Tell employees to stretch at home","Blame the employees' fitness","Conduct an ergonomic risk assessment and prioritize engineering controls: workstation design, tooling, and rotation"],a:3,e:"Stretching programs alone do not fix ergonomic hazards. Assess the job's risk factors first, then apply the hierarchy of controls: eliminate or engineer out the hazard before administrative measures."},
{id:"q800",m:"m8",t:"k",s:"Effective fatigue risk management in shift operations includes:",o:["Only disciplinary action for drowsiness","Banning all night shifts immediately","Forward-rotating schedules, adequate rest between shifts, limits on consecutive long shifts, and sleep-hygiene education","Energy drinks in break rooms"],a:2,e:"Fatigue is a physiological hazard, not a discipline problem. Schedule design (forward rotation, rest periods, overtime limits) plus education reduces fatigue-related incidents."},
{id:"q801",m:"m8",t:"k",s:"A lone-worker safety program should include:",o:["Working alone without any contact","Check-in procedures, reliable communication devices, and emergency response plans for isolated work","Only a flashlight","Verbal promises to be careful"],a:1,e:"Lone workers face delayed rescue if injured. Programs need scheduled check-ins, communication capability, location awareness, and a defined emergency response."},
{id:"q802",m:"m8",t:"sj",s:"An employee must travel to a region with elevated security risks for a client project. What does HR's duty of care require?",o:["Conduct a travel risk assessment, provide a pre-travel briefing, establish check-in and emergency extraction resources, and allow opt-out without penalty","Forbid all business travel","Send the employee with no preparation","Make the employee sign away all rights"],a:0,e:"Duty of care for travelers: assess destination risk, brief the traveler, provide 24/7 assistance and extraction capability, track travel, and respect an employee's right to decline unsafe travel."},
{id:"q803",m:"m8",t:"k",s:"OSHA's electronic recordkeeping rule expanded in 2024 to require certain establishments with 100 or more employees in high-hazard industries to submit:",o:["Only the 300A summary","Nothing; electronic submission was repealed","Their tax returns","The 300 Log and 301 incident reports electronically, in addition to the 300A summary"],a:3,e:"The 2023 final rule (effective 2024) requires 100+ employee establishments in designated high-hazard industries to electronically file Forms 300 and 301 annually, expanding OSHA's injury data."},
{id:"q804",m:"m8",t:"k",s:"Workers' compensation claims for purely psychological injury without physical trauma ('mental-mental' claims) are:",o:["Compensable in every state under identical rules","Barred in all states","Compensability varies widely by state, with many requiring extraordinary or unusual workplace stress","Automatically denied if the employee has a prior diagnosis"],a:2,e:"States split on mental-mental claims: some allow them, some require abnormal working conditions, and a few bar them. HR must know the states where it operates."},
{id:"q805",m:"m8",t:"sj",s:"After a serious incident, reporters are calling employees directly and rumors are spreading on social media. What is the BEST guidance to staff?",o:["Let everyone talk freely to the press","Announce the cause of the incident immediately","Refer all media inquiries to the designated spokesperson, share only verified facts internally, and avoid speculation","Delete all social media accounts"],a:2,e:"Uncoordinated statements create liability and distress. One spokesperson, verified facts only, no speculation about cause or fault while the investigation is pending."},
{id:"q806",m:"m9",t:"k",s:"New York City Local Law 144 requires employers using automated employment decision tools for NYC candidates to:",o:["Register the tool with the state","Commission an annual independent bias audit, publish a summary of results, and give candidates at least 10 business days' notice","Get candidate consent for every interview","Disclose the vendor's source code"],a:1,e:"Local Law 144 (enforced since July 2023) requires an independent bias audit within the prior year, a publicly posted summary, 10 business days' candidate notice, and disclosure of data collected. Penalties run $500 to $1,500 per violation per day."},
{id:"q807",m:"m9",t:"k",s:"Illinois HB 3773, effective January 1, 2026, provides that employers may not:",o:["Use AI that has a discriminatory effect on protected classes or use ZIP codes as a proxy for protected classes, and must notify employees when AI is used in employment decisions","Use any software in HR","Send emails to applicants","Use video interviews"],a:0,e:"HB 3773 amends the Illinois Human Rights Act: AI with discriminatory effect is a civil rights violation, ZIP-code proxies are banned, and notice is required. Enforcement runs through IDHR charges and private lawsuits."},
{id:"q808",m:"m9",t:"sj",s:"A vendor pitches an AI screening tool as 'bias-free and EEOC-compliant.' What is the BEST due diligence before purchase?",o:["Accept the marketing claims","Buy it because competitors use it","Demand independent validation evidence and bias-audit results, test for adverse impact on your own applicant data, and negotiate indemnification and audit rights","Ask for a discount"],a:2,e:"Vendors cannot certify your compliance; the employer owns the liability. Require validation documentation, run your own adverse-impact analyses, and secure contractual audit rights and indemnification."},
{id:"q809",m:"m9",t:"k",s:"California's Civil Rights Council automated-decision regulations, effective October 1, 2025, include which requirement?",o:["A ban on all AI in hiring","Mandatory bias audits for every employer","Only a notice requirement","Four-year recordkeeping of automated-decision data, with vendors acting on an employer's behalf treated as the employer's agents"],a:3,e:"The FEHA regulations bring automated decisions under anti-discrimination law, require four years of ADS-related records, and attribute vendor actions to the employer. Bias testing is not strictly mandatory but its absence weakens any defense."},
{id:"q810",m:"m9",t:"k",s:"Under the EU AI Act, AI systems used for recruitment, promotion, or termination decisions are classified as:",o:["High-risk AI, triggering obligations for risk management, data governance, human oversight, logging, and transparency","Prohibited in all cases","Unregulated","Low-risk with no obligations"],a:0,e:"Employment AI is high-risk under Annex III. Deployers face duties including risk management, data quality, human oversight, record-keeping, and transparency to affected workers."},
{id:"q811",m:"m9",t:"sj",s:"The company is deploying one AI screening tool across the US and EU. What is the BEST governance approach?",o:["Use the strictest single standard everywhere without analysis","Build an AI inventory, risk-tier each use case, map jurisdiction-specific obligations (NYC, Illinois, California, EU), and assign ownership for ongoing monitoring","Let each hiring manager decide independently","Ban the tool entirely"],a:1,e:"AI governance starts with knowing what you deploy: inventory, risk classification, and a jurisdiction map. Assign owners for audits, notices, and monitoring rather than leaving compliance to individual managers."},
{id:"q812",m:"m9",t:"k",s:"To check an AI screening tool for adverse impact, HR should apply the four-fifths rule by:",o:["Comparing the vendor's revenue across clients","Surveying candidates about fairness","Comparing each group's selection rate to the highest group's rate; a ratio below 80% signals potential adverse impact","Counting total applicants"],a:2,e:"The 4/5ths rule works the same for AI: selection rate of each protected group divided by the highest group's rate. Below 80% triggers deeper validation and job-relatedness analysis under the Uniform Guidelines."},
{id:"q813",m:"m9",t:"k",s:"'Human in the loop' in AI-assisted hiring means:",o:["A human makes or meaningfully reviews each consequential decision rather than rubber-stamping the AI's output","A human watches the server room","AI runs fully autonomously","Humans train the model once"],a:0,e:"Meaningful human review requires authority and engagement to override the AI. A perfunctory glance at an AI shortlist does not satisfy GDPR Article 22 or defensible oversight."},
{id:"q814",m:"m9",t:"sj",s:"Recruiters routinely approve an AI tool's rejections without reviewing them, saying 'the system is usually right.' What is the risk?",o:["None; efficiency is good","The human review is not meaningful, undermining oversight duties and leaving the employer exposed if the tool is biased","Recruiters will be replaced","Candidates prefer it"],a:1,e:"Automation bias plus rubber-stamping equals no real human decision. Regulators and courts look past labels: if the human cannot or does not genuinely evaluate, the AI is the decision-maker."},
{id:"q815",m:"m9",t:"k",s:"Illinois' Artificial Intelligence Video Interview Act requires employers using AI to analyze video interviews to:",o:["Pay candidates for interviews","Use only Illinois vendors","Hire a data scientist","Notify applicants, explain how the AI works and what it assesses, obtain consent, and delete videos within 30 days of a request"],a:3,e:"AIVICA (2020) requires advance notice, an explanation of the AI's role, applicant consent, and deletion within 30 days of request. It operates alongside HB 3773 and BIPA for video-interview tools."},
{id:"q816",m:"m9",t:"k",s:"'Model drift' in a deployed HR AI system refers to:",o:["The server physically moving","Degradation of the model's accuracy as real-world data diverges from training data","Employees leaving the company","A vendor going bankrupt"],a:0,e:"Models decay as applicant pools, labor markets, and job requirements change. Ongoing monitoring, revalidation, and adverse-impact checks are required, not just pre-deployment testing."},
{id:"q817",m:"m9",t:"sj",s:"The screening vendor pushes a model update without notice, and selection rates shift noticeably. What contractual protection should HR have secured?",o:["A lower price","Free t-shirts","A longer contract term","Change-notification clauses, rights to re-validate and re-audit after material updates, and the ability to pause use pending review"],a:3,e:"AI contracts must treat model changes like system changes: advance notice, revalidation rights, and suspension rights. A silent update can invalidate your bias audit overnight."},
{id:"q818",m:"m9",t:"sj",s:"Two HRIS vendors gave impressive demos and leadership wants to pick one this week. What is the BEST next step?",o:["Pick the slicker demo","Sign both and decide later","Pause and complete requirements first: document must-have processes, integration needs, and total cost of ownership, then score vendors against them","Let IT choose alone"],a:2,e:"Demo-led selection buys sizzle, not fit. Requirements, scripted use-case demos, reference checks, and TCO analysis prevent buying a system that cannot handle payroll complexity or integrations."},
{id:"q819",m:"m9",t:"k",s:"Total cost of ownership for an HRIS includes:",o:["Licenses, implementation, integration, data migration, change management, training, and ongoing support, not just the subscription fee","Only the annual subscription","Only the implementation fee","Hardware only"],a:0,e:"TCO captures the full lifecycle: subscription, implementation services, integrations, migration, change management, training, and support. Subscription-only comparisons mislead badly."},
{id:"q820",m:"m9",t:"sj",s:"The company is replacing its HRIS, including payroll for 5,000 employees. The vendor proposes a single big-bang go-live. What is the BEST approach?",o:["Accept big-bang to finish faster","Go live without testing","Phase the rollout and run parallel payrolls until the new system reconciles cleanly","Delay indefinitely"],a:2,e:"Payroll errors are unforgiving. Phased rollouts with parallel runs let you reconcile every check before cutover. Big-bang payroll go-lives are how companies miss paydays."},
{id:"q821",m:"m9",t:"k",s:"Data migration best practice for an HRIS implementation emphasizes:",o:["Migrating everything including known bad data","Cleanse, deduplicate, and validate data before migration, then reconcile record counts and totals after","Letting the vendor guess at field mappings","Migrating only executive records"],a:1,e:"Migration is a data-quality project: profile the legacy data, cleanse and dedupe, map fields deliberately, and reconcile counts and control totals. Garbage migrated is garbage systematized."},
{id:"q822",m:"m9",t:"k",s:"Segregation of duties in an HRIS means:",o:["Structuring system roles so no single user can both initiate and approve sensitive transactions like pay changes","Giving everyone admin access","Separating HR from payroll entirely","Requiring paper forms"],a:0,e:"SoD prevents fraud and error: the person entering a pay change cannot approve it. Role-based access should enforce this systematically, with periodic access reviews."},
{id:"q823",m:"m9",t:"sj",s:"An HR analyst can enter new-hire pay rates and also approve them in the HRIS, and she processes her own department's changes. What is the risk and fix?",o:["No risk; she is trusted","A minor inefficiency","A segregation-of-duties failure enabling undetected pay fraud or error; restrict roles and require independent approval","A training issue only"],a:2,e:"Trust is not a control. SoD failures enable ghost employees and unauthorized raises. Fix with role redesign, approval workflows, and quarterly access recertification."},
{id:"q824",m:"m9",t:"k",s:"When contracting for HR technology, the MOST critical data provisions include:",o:["The vendor's logo placement","Customer ownership of its data, return and certified destruction on termination, breach-notification timelines, and audit rights","Free upgrades forever","The vendor's right to sell employee data"],a:1,e:"Your employee data must remain yours: contractual ownership, exit/transition assistance, certified destruction, defined breach notification, SLAs, and audit rights. Never accept vendor ownership of HR data."},
{id:"q825",m:"m9",t:"k",s:"A SOC 2 Type II report on an HR tech vendor provides:",o:["A guarantee of no breaches","An independent auditor's assessment that the vendor's security and privacy controls operated effectively over a period of time","A financial audit","A marketing brochure"],a:1,e:"SOC 2 Type II tests controls over 6-12 months against trust criteria (security, availability, confidentiality). It is evidence of control operation, not a breach guarantee; read the auditor's exceptions."},
{id:"q826",m:"m9",t:"sj",s:"The benefits administration vendor reports a breach exposing employee SSNs and bank details. What is HR's FIRST step?",o:["Email all employees the full details immediately","Invoke the contract's breach provisions: confirm the vendor's notification timeline, engage legal and IT, preserve evidence, and prepare required notifications","Wait for the vendor to handle everything","Blame the vendor publicly"],a:1,e:"Follow the incident response plan and the contract: legal assesses notification duties (state breach laws, with tight timelines), IT contains exposure, and communications are coordinated and accurate. The employer retains notification liability."},
{id:"q827",m:"m9",t:"k",s:"The people-analytics maturity model progresses through:",o:["Descriptive (what happened), diagnostic (why), predictive (what will happen), prescriptive (what to do)","Prescriptive first, then descriptive","Only predictive analytics","Reporting, then guessing"],a:0,e:"Maturity climbs from reporting what happened to diagnosing why, predicting what is next, and prescribing actions. Most HR teams stall at descriptive dashboards."},
{id:"q828",m:"m9",t:"k",s:"Organizational network analysis (ONA) is used to:",o:["Calculate payroll","Run benefits enrollment","Map collaboration patterns to find overloaded connectors, silos, and hidden influencers","File tax forms"],a:2,e:"ONA uses communication metadata (not content) to reveal how work really gets done: who brokers between teams, who is overloaded, and where collaboration breaks down."},
{id:"q829",m:"m9",t:"sj",s:"Network analysis shows five engineers are the sole connectors between product and support, and all five are at high burnout risk. What is the BEST action?",o:["Give them bonuses and change nothing","Tell them to work harder","Publicly rank all employees by network centrality","Redistribute connections: build redundant bridges, protect the connectors' time, and address the structural bottleneck"],a:3,e:"ONA insights demand structural fixes: create alternate pathways, reduce the connectors' load, and formalize knowledge transfer. Bonuses without load relief accelerate burnout."},
{id:"q830",m:"m9",t:"sj",s:"HR wants to test whether a new onboarding buddy program improves 90-day retention. What is the BEST design?",o:["Randomly assign new hires to buddy or control groups, track retention comparably, and compare outcomes","Give everyone buddies and survey them","Ask managers which they prefer","Compare this year's retention to last year's without controls"],a:0,e:"Randomized controlled comparison isolates the program's effect from seasonality and hiring-mix changes. Pre-post comparisons without controls confound the result."},
{id:"q831",m:"m9",t:"k",s:"Statistical significance differs from practical significance in that:",o:["They are identical","Statistical significance is harder to achieve","A result can be statistically significant yet too small to matter; practical significance asks whether the effect justifies action","Practical significance is only for finance"],a:2,e:"With large samples, trivial effects reach p<0.05. Always pair significance with effect size: a 0.2% retention lift from a costly program is not worth doing."},
{id:"q832",m:"m9",t:"sj",s:"An analytics vendor reports its engagement module 'significantly' lifts retention (p<0.05), but the effect is 0.3 percentage points on a $400,000 contract. How should HR respond?",o:["Buy it because it is significant","Ask for a bigger discount","Renew automatically","Decline on ROI grounds: statistical significance without practical or economic significance does not justify the spend"],a:3,e:"Demand effect sizes and cost-benefit math, not p-values. A significant but trivial effect is a vendor's favorite statistic."},
{id:"q833",m:"m9",t:"k",s:"Nonresponse bias in an engagement survey occurs when:",o:["Survey nonrespondents differ systematically from respondents, skewing results","Too many people respond","There is a payroll error","Surveys are too short"],a:0,e:"If disengaged employees skip the engagement survey, scores inflate. Check response rates by group and weight or follow up with nonrespondents before trusting the headline number."},
{id:"q834",m:"m9",t:"k",s:"Cohort analysis in people analytics means:",o:["Analyzing competitors","A financial audit","Tracking groups that share a starting experience (e.g., hire cohort) over time to compare outcomes","Counting job applicants"],a:2,e:"Cohort analysis compares, say, Q1 vs Q3 hire classes on 12-month retention, revealing whether onboarding or sourcing changes worked, free of tenure-mix distortion."},
{id:"q835",m:"m9",t:"sj",s:"A vendor claims its recognition platform 'caused a 20% turnover drop' based on before-and-after data from clients who bought it. What is the BEST response?",o:["Buy it immediately","Accept the claim at face value","Ask for the methodology, check for selection bias and confounders, and pilot with a control group before attributing causality","Negotiate price only"],a:3,e:"Buyers self-select and economies shift; before-and-after vendor data rarely isolates causation. Insist on methodology transparency and run your own controlled pilot."},
{id:"q836",m:"m9",t:"k",s:"A key limitation of sentiment analysis on employee survey comments is:",o:["Sarcasm, cultural nuance, and context that algorithms frequently misread","It is always perfectly accurate","It only works in English","It replaces surveys entirely"],a:0,e:"NLP sentiment tools stumble on sarcasm ('great, another reorg'), idiom, and cultural expression. Use them to triage themes for human review, not as verdicts."},
{id:"q837",m:"m9",t:"k",s:"De-identifying HR analytics data involves:",o:["Deleting all data","Encrypting passwords","Removing direct identifiers, though small or unique groups can still enable re-identification","Publishing names with consent"],a:2,e:"De-identification removes names and IDs, but quasi-identifiers (rare role + location + tenure) can re-identify people in small slices. Apply cell-suppression minimums."},
{id:"q838",m:"m9",t:"sj",s:"A diversity dashboard slice shows one employee in a remote office location by demographic group, effectively identifying them. What is the BEST fix?",o:["Publish it anyway","Email the team about it","Remove the dashboard entirely","Suppress small cells: set minimum group sizes and aggregate or mask slices below the threshold"],a:3,e:"Analytics must not out individuals. Standard practice: minimum cell sizes (often 5-10), aggregation, and masking, documented in the dashboard's governance rules."},
{id:"q839",m:"m9",t:"k",s:"The cardinal rule for generative AI use in HR is:",o:["Never paste non-public employee data or PII into public generative AI tools, since prompts may be retained or used for training","Public AI tools are safe for all HR data","Only paste salaries, not names","AI tools delete everything instantly"],a:0,e:"Public LLM prompts can be logged, reviewed, or used in training. Use approved enterprise tools with data-protection terms, and train HR staff on what never goes into a prompt."},
{id:"q840",m:"m9",t:"sj",s:"A manager pasted an employee's performance issues and medical details into a public AI chatbot to 'draft a PIP.' What should HR do?",o:["Praise the initiative","Ignore it","Contain the exposure per the incident process, counsel the manager, reinforce the AI acceptable-use policy, and provide an approved alternative","Fire the manager immediately"],a:2,e:"Treat it as a data incident: assess exposure, follow notification duties if thresholds are met, and close the gap with policy, training, and an enterprise AI tool with proper data terms."},
{id:"q841",m:"m9",t:"k",s:"AI literacy duties under the EU AI Act are BEST described as:",o:["Optional everywhere","Only for data scientists","Only for EU-headquartered companies","Required for deployers of AI systems, with duties in force since February 2025"],a:3,e:"The EU AI Act's AI-literacy duty requires those deploying AI to ensure staff have sufficient understanding of the systems they use. HR teams using hiring AI need role-appropriate training."},
{id:"q842",m:"m9",t:"k",s:"Predictive scheduling ('fair workweek') laws are BEST described as:",o:["Laws in cities like New York requiring advance notice of schedules and premium pay for last-minute changes in covered industries","A ban on all scheduling software","Federal laws governing all scheduling","Requirements that employees be on call 24/7"],a:0,e:"Fair-workweek laws (NYC, San Francisco, Seattle, and others) mandate advance schedule notice and predictability pay for late changes in covered industries like retail and hospitality."},
{id:"q843",m:"m9",t:"sj",s:"New scheduling software auto-trims shifts the night before based on demand forecasts at NYC retail stores. What is the compliance risk?",o:["None; software is efficient","Only a morale issue","Potential fair-workweek violations: late schedule changes can trigger premium pay and notice requirements","Only a tax issue"],a:2,e:"Algorithmic scheduling must be configured for each jurisdiction's predictive-scheduling rules. Auto-trimming the night before is exactly the conduct these laws penalize."},
{id:"q844",m:"m9",t:"k",s:"Robotic process automation (RPA) in HR is BEST applied to:",o:["Replacing all HR staff","A robot that walks around offices","Only manufacturing","High-volume, rules-based tasks like data entry, onboarding workflows, and report distribution"],a:3,e:"RPA suits repetitive, rule-driven work: copying data between systems, generating offer letters, distributing reports. It fails on judgment-heavy or highly variable tasks."},
{id:"q845",m:"m9",t:"k",s:"Chatbot 'containment rate' measures:",o:["The share of HR service inquiries fully resolved by a chatbot or self-service without human handoff","The number of chatbots owned","Server capacity","Employee headcount"],a:0,e:"Containment rate measures deflection success, but must be paired with resolution quality and satisfaction. High containment with wrong answers is worse than low containment."},
{id:"q846",m:"m9",t:"sj",s:"The HR chatbot gave an employee wrong information about benefits eligibility, and the employee made an irreversible election. Who is accountable and what is the fix?",o:["The employee, for trusting a bot","The chatbot vendor alone","HR remains accountable: correct the outcome if possible, add human review and testing for high-stakes topics, and govern bot content like any HR communication","No one; bots are not liable"],a:2,e:"Employers own their chatbot's answers. High-stakes topics (benefits, leave, pay) need curated content, testing, escalation paths, and disclaimers, with errors remediated like any HR misinformation."},
{id:"q847",m:"m9",t:"k",s:"HR self-service success is BEST measured by:",o:["Number of HR staff","Office square footage","Software license counts","Adoption rate, task completion rate, and ticket deflection for employee/manager self-service"],a:3,e:"Self-service success = employees actually completing transactions themselves (adoption, completion, deflection), not just portal availability. Low adoption signals design or change-management failure."},
{id:"q848",m:"m9",t:"sj",s:"Leadership wants an internal talent marketplace, but skills data is a mess: 40 job titles for the same work and no standard skill definitions. What comes FIRST?",o:["Build a skills taxonomy and normalize job architecture before buying marketplace technology","Buy the marketplace software immediately","Ask employees to self-tag with free text only","Launch with the messy data"],a:0,e:"Marketplaces match on skills; without a governed taxonomy and clean job architecture, matching fails. Data foundation first, technology second."},
{id:"q849",m:"m9",t:"k",s:"Digital accessibility for HR systems means:",o:["Accessibility is optional for internal tools","Only the careers site needs accessibility","HR portals and systems should meet WCAG standards so employees with disabilities can use them independently","Accessibility applies only to buildings"],a:2,e:"Digital accessibility (WCAG 2.x) applies to HR portals, LMS content, and recruiting sites. Inaccessible systems exclude employees and create ADA exposure."},
{id:"q850",m:"m9",t:"sj",s:"The new HR portal fails basic accessibility checks: screen readers cannot navigate benefits enrollment. What is the BEST response?",o:["Tell affected employees to call HR instead","Launch anyway and fix later","Offer a PDF workaround permanently","Require remediation to WCAG standards, add accessibility criteria to future RFPs, and provide an equivalent alternative in the interim"],a:3,e:"'Call HR instead' is not equal access. Remediate the portal, bake accessibility into procurement, and provide a genuinely equivalent interim path."},
{id:"q851",m:"m9",t:"sj",s:"Executives ignore the 40-page monthly HR report. What is the BEST redesign?",o:["Replace it with a one-page dashboard: a few decision-relevant metrics, trends, benchmarks, and the 'so what' with recommended actions","Make it 80 pages","Email raw data extracts","Stop reporting entirely"],a:0,e:"Executives act on concise, decision-oriented views: trend, benchmark, insight, action. If a metric has no decision attached, cut it."},
{id:"q852",m:"m9",t:"k",s:"APIs differ from batch integration in HR systems because:",o:["They are the same","Batch is always better","APIs enable real-time, event-driven data exchange between HR systems, while batch integration moves data on a schedule","APIs are only for websites"],a:2,e:"Real-time APIs keep systems like HRIS, payroll, and benefits in sync continuously; batch files sync on schedules. Integration architecture determines data freshness and error rates."},
{id:"q853",m:"m9",t:"sj",s:"Payroll and HRIS fall out of sync monthly: new hires missing, terminations still paid. What is the BEST fix?",o:["Hire more payroll clerks","Blame the vendor","Manually reconcile forever","Establish integration governance: define the system of record, fix the API or file mappings, add automated reconciliation and error alerts"],a:3,e:"Recurring sync failures are an architecture and ownership problem. Name the system of record per data element, repair the integration, and monitor with reconciliations, not heroics."},
{id:"q854",m:"m9",t:"sj",s:"Headcount differs across the HRIS, finance system, and a manager's spreadsheet, and each owner insists theirs is right. What is the BEST resolution?",o:["Designate a single system of record per data domain, define how other systems consume it, and retire shadow spreadsheets","Average the three numbers","Let each team keep its own","Delete two systems"],a:0,e:"Master data management: one authoritative source per domain, integration outward, and governance over definitions. Competing truths make every metric debatable."},
{id:"q855",m:"m9",t:"k",s:"HR data quality depends MOST on:",o:["Data quality does not affect analytics","Only IT owning data quality","Disciplined entry at the source: valid values, required fields, and trained users","More data always meaning better data"],a:2,e:"Analytics inherit source discipline. Dropdowns over free text, required fields, validation rules, and training for everyone who enters data beat downstream cleansing."},
