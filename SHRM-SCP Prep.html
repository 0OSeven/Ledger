{id:"q210",m:"m12",t:"sj",s:"HR learns a VP is interviewing with a competitor while leading a critical project. What is the BEST action?",o:["Tell the whole company","Ensure knowledge transfer and succession coverage discreetly; don't punish job-seeking","Fire the VP immediately","Confront them angrily"],a:1,e:"Job-seeking isn't misconduct. HR's move: quietly de-risk (knowledge transfer, succession readiness) without retaliation or drama."},
{id:"q211",m:"m12",t:"k",s:"SOX whistleblower protections (Section 806) cover:",o:["All complaints about anything","Employees of publicly traded companies reporting reasonably believed securities fraud/misleading financials","Only CEOs","Union grievances"],a:1,e:"SOX 806: protects public-company employees reporting mail/wire/securities fraud. Dodd-Frank expanded bounty/anti-retaliation avenues via the SEC."},
{id:"q212",m:"m12",t:"k",s:"A conflict of interest exists when:",o:["Two employees disagree","Personal interests could improperly influence professional judgment — it must be disclosed and managed","Someone works hard","A vendor is expensive"],a:1,e:"Conflicts (hiring relatives, vendor ties, side businesses) aren't always prohibited — but they must be disclosed and managed per policy. Concealment is the violation."},
{id:"q213",m:"m12",t:"sj",s:"The board asks HR to investigate the CEO for misconduct. What is the BEST structure?",o:["HR investigates alone quietly","Engage independent outside counsel/investigators reporting to the board (or a board committee), with HR supporting","Refuse","Ask the CEO to investigate themselves"],a:1,e:"Investigating your own ultimate boss requires independence: outside investigators reporting to the board preserves credibility and privilege. HR supports, doesn't lead."},
{id:"q214",m:"m12",t:"k",s:"SHRM recertification requires:",o:["Retaking the exam every year","60 PDCs (professional development credits) every 3 years or retaking the exam","Nothing","Paying dues only"],a:1,e:"Recert: 60 PDCs per 3-year cycle (across BASK domains, max per category) OR retake the exam. Plan PDCs from day one."},
{id:"q215",m:"m12",t:"k",s:"Authentic leadership centers on:",o:["Charisma","Self-awareness, transparency, balanced processing, and an internalized moral compass","Strict rules","Popularity"],a:1,e:"Authentic leadership: genuine self-awareness, relational transparency, balanced (unbiased) processing, moral grounding. Followers detect fakery fast."},
{id:"q216",m:"m12",t:"sj",s:"An HR colleague shares confidential investigation details at a party. You overhear. What should you do?",o:["Spread it further","Address it directly with the colleague and, if serious, escalate — confidentiality breaches destroy HR credibility","Ignore it","Post about it"],a:1,e:"HR's currency is trust. Address the breach with the colleague immediately; escalate if the disclosure was material. Silence makes you complicit."},
{id:"q217",m:"m12",t:"k",s:"The primary ethical obligation of HR regarding employee data is:",o:["Share freely","Stewardship: collect minimally, protect confidentiality, use only for legitimate purposes","Sell it","Post it"],a:1,e:"Data stewardship: minimal collection, purpose limitation, confidentiality, and security — an ethical duty beyond mere legal compliance."},
{id:"q218",m:"m12",t:"k",s:"Courage as an HR competency most often means:",o:["Physical bravery","Willingly delivering unwelcome truths and holding the line on ethics, law, and standards under pressure","Never disagreeing","Avoiding conflict"],a:1,e:"HR courage: telling the CEO the plan is unlawful, blocking the biased hire, refusing the backdated termination. The competency behind every hard call on this exam."},
{id:"q219",m:"m12",t:"sj",s:"Finance proposes cutting the investigation budget to 'save money.' What is HR's BEST argument?",o:["Agree — budgets matter","Quantify the cost of getting investigations wrong: litigation, turnover, reputation, regulatory penalties — prevention is cheaper","Threaten to quit","Hide the budget"],a:1,e:"Speak finance: expected cost of failure (lawsuit exposure, settlements, turnover, brand damage) dwarfs investigation costs. Risk math beats moral appeals in budget fights."},
{id:"q220",m:"m12",t:"k",s:"Professional skepticism for HR means:",o:["Distrusting everyone","Questioning assumptions, verifying facts, and resisting pressure to reach convenient conclusions — especially in investigations","Avoiding decisions","Cynicism"],a:1,e:"Skepticism = disciplined objectivity: verify, don't assume; follow evidence in investigations; resist outcome-driven pressure. A core ethical practice."},
{id:"q221",m:"m12",t:"sj",s:"You discover your own hiring decision from last year was biased — the data now shows adverse impact. What should you do?",o:["Hide it","Disclose to leadership, fix the process prospectively, and remediate where appropriate — owning the error builds the ethical culture","Blame the hiring manager","Quit"],a:1,e:"Owning errors is ethical leadership in action: disclose, fix the system, remediate fairly. Cover-ups compound liability and destroy credibility."},
{id:"q222",m:"m12",t:"k",s:"The 'front page' test for ethical decisions asks:",o:["Is it profitable?","How would this look if published on the front page tomorrow?","Is it legal only?","Will the CEO approve?"],a:1,e:"Front-page test: if you'd be ashamed to see it reported, don't do it. Ethics exceeds legal minimums — 'legal' is the floor, not the ceiling."},
{id:"q223",m:"m12",t:"sj",s:"A star salesperson's harassment complaint is deemed 'not that serious' by sales leadership. HR's file shows a pattern. What is the BEST move?",o:["Defer to sales leadership","Escalate with the pattern data: repeat behavior + revenue protection is short-sighted; liability and culture cost more","Drop it","Transfer the complainant"],a:1,e:"Patterns change the calculus: repeat harassers generate escalating liability. HR must escalate with data — protecting revenue today by tolerating harassment is how companies end up in headlines."},
{id:"q224",m:"m12",t:"k",s:"Sustainable HR leadership development requires:",o:["One training event","Ongoing investment: assessment, experience, exposure, and coaching over time","Promoting the loudest","Luck"],a:1,e:"Leadership grows through the 70-20-10 mix over time: challenging experiences, feedback relationships, and formal learning — not single events."},
);
</script>
<script>
"use strict";
/* ---- GAP FILL: q179-q188 (m7/m8/m9) ---- */
QUESTIONS.push(
{id:"q179",m:"m7",t:"k",s:"Executive Order 11246 requires federal contractors with 50+ employees and $50K+ in contracts to:",o:["Hire only veterans","Maintain written affirmative action plans for women and minorities","Pay above minimum wage","Avoid all background checks"],a:1,e:"EO 11246: covered federal contractors must have written AAPs with placement goals and good-faith efforts for women/minorities (plus Section 503 for disability and VEVRAA for veterans)."},
{id:"q180",m:"m7",t:"k",s:"The EEO-1 report must be filed by:",o:["All employers","Employers with 100+ employees (and certain federal contractors with 50+)","Only government agencies","Employers with 15+ employees"],a:1,e:"EEO-1: 100+ employees (50+ for covered federal contractors) report workforce demographics by job category, race/ethnicity, and sex annually."},
{id:"q181",m:"m7",t:"k",s:"USERRA provides:",o:["Unemployment benefits","Reemployment rights and anti-discrimination protections for service members returning from military duty","Free college","Extra vacation"],a:1,e:"USERRA: eligible service members get prompt reemployment, protection from discrimination based on service, and continued health/retirement benefits rights."},
{id:"q182",m:"m8",t:"k",s:"OSHA's stance on safety incentive programs that discourage injury reporting is:",o:["Encouraged","Prohibited if they deter reporting — programs must reward participation and hazard identification, not low injury rates","Required","Irrelevant"],a:1,e:"OSHA (and the anti-retaliation rule): incentives tied to low injury rates suppress reporting. Reward safety participation, near-miss reporting, and hazard correction instead."},
{id:"q183",m:"m8",t:"sj",s:"An emergency (chemical spill) occurs at 2 AM with a skeleton crew. What matters MOST in HR's emergency preparedness?",o:["A plan that exists only on paper","Pre-trained roles, clear alarm/communication procedures, and drills covering all shifts — including nights","Expensive equipment alone","Hoping it never happens"],a:1,e:"Emergency plans fail on off-shifts without drills: every shift needs trained roles, working alarms, and practiced evacuation. Paper plans don't evacuate buildings."},
{id:"q184",m:"m8",t:"k",s:"Documentation of a workplace investigation should include all EXCEPT:",o:["Complaint details and dates","Witness statements and evidence reviewed","The investigator's personal opinions about the parties' character","Findings and rationale"],a:2,e:"Investigation files: facts, statements, evidence, findings, rationale. Personal character judgments are irrelevant, inflammatory, and discoverable — keep them out."},
{id:"q185",m:"m9",t:"k",s:"An HR shared-services center's SLA (service-level agreement) typically measures:",o:["Employee happiness only","Response/resolution times and accuracy for HR transactions (e.g., benefits questions resolved in 2 days)","Stock price","Marketing reach"],a:1,e:"Shared-services SLAs: time-to-resolve, first-contact resolution, accuracy, customer satisfaction — bringing service discipline to HR operations."},
{id:"q186",m:"m9",t:"k",s:"The fully loaded cost of turnover for a role is often estimated at:",o:["Zero","50–200% of the role's annual salary depending on complexity (separation, vacancy, recruiting, ramp-up)","One day's pay","Only the job ad cost"],a:1,e:"Turnover cost models (SHRM): separation + vacancy coverage + recruiting + onboarding + ramp-up productivity loss — often 50–200% of salary. Use it to justify retention spend."},
{id:"q187",m:"m9",t:"k",s:"Selection ratio is:",o:["Hires ÷ applicants — lower ratios mean more selective hiring and higher utility of valid tools","Applicants ÷ hires","Interviews ÷ offers","Always 1:1"],a:0,e:"Selection ratio = hires/applicants. Low ratios (many applicants, few hires) increase the payoff of valid selection — a key input to utility analysis."},
{id:"q188",m:"m9",t:"sj",s:"HR analytics shows a strong link between manager 1:1 frequency and retention. What's the BEST next step?",o:["Mandate weekly 1:1s immediately","Pilot the practice, measure retention impact vs control groups, then scale what works","Publish the finding and hope","Ignore it"],a:1,e:"Correlation → pilot with controls → causal evidence → scale. Mandating company-wide on correlational data risks backlash if the link doesn't hold."},
);
</script>
<script>
"use strict";
/* ---- 1000Q EXPANSION batch 1 ---- */
QUESTIONS.push(
{id:"q225",m:"m1",t:"k",s:"Under Barney's VRIO framework, a firm's human capital creates sustained competitive advantage only when it is:",o:["Valuable and rare","Difficult for competitors to imitate","Valuable, rare, costly to imitate, and supported by the organization","Highly compensated"],a:2,e:"VRIO requires all four: Valuable, Rare, costly to Imitate, and Organized to exploit. Missing any one, the advantage is temporary or unrealized."},
{id:"q226",m:"m1",t:"k",s:"In McKinsey's 7-S model, the 'soft' elements that shape culture and execution are:",o:["Strategy, structure, and systems","Shared values, skills, style, and staff","Budgets, bonuses, and headcount","Mission statements and slogans"],a:1,e:"The 7-S soft elements are shared values, skills, style, and staff; the hard elements are strategy, structure, and systems. Change fails when soft elements are ignored."},
{id:"q227",m:"m1",t:"k",s:"In Greiner's model of organizational growth, the 'crisis of red tape' emerges after which phase?",o:["Creativity","Direction","Delegation","Coordination"],a:3,e:"Greiner's sequence: creativity, direction, delegation, coordination, collaboration. Excessive formalization during coordination triggers the red-tape crisis, resolved by collaboration."},
{id:"q228",m:"m1",t:"k",s:"A diversified company classifies one division as a BCG 'dog' and decides to divest it. HR's most strategic contribution is:",o:["Retaining critical talent through the transition while planning redeployment or separation","Immediately terminating all division employees","Hiring aggressively for the division","Freezing all HR activity until the sale closes"],a:0,e:"Divestitures destroy value when key talent flees. HR should secure critical skills through the transition, then redeploy or separate deliberately."},
{id:"q229",m:"m1",t:"k",s:"Under Ansoff's growth matrix, a market-development strategy (existing products, new markets) most challenges HR to:",o:["Cut training budgets","Centralize all hiring at headquarters","Adapt talent practices to new cultural, legal, and labor-market conditions","Eliminate local leadership roles"],a:2,e:"Market development stretches existing capabilities into unfamiliar contexts. HR must localize employment practices, leadership profiles, and talent sourcing."},
{id:"q230",m:"m1",t:"k",s:"Prahalad and Hamel define a 'core competence' as:",o:["Any strength listed in a SWOT analysis","Collective organizational learning that is difficult to imitate and opens access to markets","A patented technology","The lowest cost position in an industry"],a:1,e:"Core competencies are bundles of collective learning that are hard to copy and span products. HR builds them through hiring, development, and knowledge sharing."},
{id:"q231",m:"m1",t:"k",s:"The AMO framework (Appelbaum) holds that high employee performance requires:",o:["Authority, money, and overtime","Annual reviews, merit pay, and open-door policies","Alignment, measurement, and outsourcing","Ability, motivation, and opportunity to perform"],a:3,e:"AMO: Ability (selection/training), Motivation (rewards/engagement), Opportunity (job design/voice). High-performance work systems work by activating all three."},
{id:"q232",m:"m1",t:"k",s:"In Lepak and Snell's HR architecture, employees with high-value, firm-specific knowledge should be managed through:",o:["Long-term commitment-based employment with heavy development investment","Short-term contracts","Spot-market hiring","Outsourcing"],a:0,e:"Lepak and Snell match employment mode to human-capital value and uniqueness: firm-specific, high-value talent gets commitment-based investment; generic, low-value work gets contracting."},
{id:"q233",m:"m1",t:"k",s:"The 'best fit' (contingency) perspective on strategic HRM argues that:",o:["A universal set of best practices works in every company","Benchmarking competitors is sufficient","HR practices must align with the firm's strategy and context to drive performance","HR should copy high-performing firms exactly"],a:2,e:"Best fit (contingency) says effectiveness depends on vertical alignment with strategy and horizontal alignment among practices. Best practice (universalist) claims some practices always help."},
{id:"q234",m:"m1",t:"k",s:"Open systems theory implies that strategic HR must:",o:["Isolate HR from operations","Continuously scan the external environment and adapt talent practices to inputs like labor markets and regulation","Standardize one global policy set","Focus only on internal efficiency"],a:1,e:"Open systems view organizations as exchanging inputs and outputs with the environment. HR must sense environmental shifts and adapt faster than the change hits."},
{id:"q235",m:"m1",t:"k",s:"In the Nadler-Tushman congruence model, organizational performance problems are diagnosed as:",o:["Individual skill gaps only","Insufficient technology","Poor marketing","Misalignment among work, people, formal structures, and informal culture"],a:3,e:"Congruence: inputs (environment, resources, strategy) feed a transformation process of four components (work, people, formal org, informal org). Misfit among them causes poor outputs."},
{id:"q236",m:"m1",t:"k",s:"The TOWS matrix advances SWOT analysis by:",o:["Systematically pairing internal and external factors to generate SO, WO, ST, and WT strategies","Adding more weaknesses","Removing threats from consideration","Focusing only on financials"],a:0,e:"TOWS (Weihrich) turns SWOT from a list into strategy: use strengths to capture opportunities (SO), fix weaknesses to pursue them (WO), and so on."},
{id:"q237",m:"m1",t:"k",s:"In Porter's value chain, human resource management is classified as:",o:["A primary activity like operations","Outside the value chain","A support activity that enables primary activities to create margin","A cost with no strategic role"],a:2,e:"HRM is a support activity (with firm infrastructure, technology, procurement) that underpins primary activities. Its strategic value lies in how it amplifies the whole chain."},
{id:"q238",m:"m1",t:"k",s:"Under the SEC's 2020 Regulation S-K amendments, public companies must disclose:",o:["Every employee's salary","A description of human capital resources, including objectives and measures used to manage the business","Only the CEO's compensation","Union membership rates"],a:1,e:"The principles-based rule requires describing human capital resources and any objectives or measures management focuses on (e.g., turnover, development, DEI metrics). HR data became investor-facing."},
{id:"q239",m:"m1",t:"k",s:"SHRM's BASK organizes the HR body of knowledge into three clusters:",o:["Hiring, firing, and retiring","Strategy, finance, and marketing","Local, state, and federal law","People, Organization, and Workplace"],a:3,e:"BASK clusters: People (talent), Organization (structure, effectiveness), Workplace (legal, risk, global). Behavioral competencies (Leadership, Interpersonal, Business) cut across all three."},
{id:"q240",m:"m1",t:"k",s:"A strategy map (Kaplan and Norton) primarily communicates:",o:["Cause-and-effect linkages showing how intangible assets drive strategic outcomes across scorecard perspectives","Office floor plans","Competitor locations","Project timelines"],a:0,e:"Strategy maps visualize the causal chain: learning and growth enables internal processes, which deliver customer value, which drives financial results."},
{id:"q241",m:"m1",t:"k",s:"Which metric is a leading indicator of future turnover?",o:["Last year's turnover rate","Total headcount","Declining engagement pulse scores and rising absenteeism","Average tenure"],a:2,e:"Leading indicators predict; lagging indicators confirm. Engagement and absenteeism shifts precede quits, giving HR time to intervene."},
{id:"q242",m:"m1",t:"k",s:"The Delphi forecasting technique is characterized by:",o:["Public debates among experts","Anonymous, iterative expert rounds with controlled feedback until consensus emerges","Voting by all employees","Computer simulation only"],a:1,e:"Delphi preserves independent expert judgment through anonymity and structured iteration, avoiding the groupthink that plagues committees."},
{id:"q243",m:"m1",t:"k",s:"Freeman's stakeholder theory holds that:",o:["Shareholders are the only legitimate concern","Employees outrank customers","Profit is unethical","Firms should create value for all stakeholders who affect or are affected by the business"],a:3,e:"Stakeholder theory broadens corporate purpose beyond shareholder primacy to employees, customers, communities, and others. HR operationalizes it through employee and community practices."},
{id:"q244",m:"m1",t:"k",s:"Agency theory's central HR implication is that:",o:["Incentive systems should align managers' interests with owners' to reduce agency costs","Managers always act in owners' interests","Employees cannot be trusted","Boards should run daily operations"],a:0,e:"Agency theory (Jensen and Meckling): owners (principals) use monitoring and incentives to align managers (agents). Executive compensation design is applied agency theory."},
{id:"q245",m:"m1",t:"k",s:"Double-loop learning (Argyris and Schon) differs from single-loop learning because it:",o:["Is faster","Requires no reflection","Questions the underlying assumptions and goals, not just corrects errors within them","Applies only to individuals"],a:2,e:"Single-loop fixes the error (the thermostat adjusts). Double-loop questions whether the setting is right (why this temperature?). Organizations need both."},
{id:"q246",m:"m1",t:"k",s:"Intellectual capital is commonly divided into:",o:["Cash, inventory, and equipment","Human, structural, and relational capital","Stocks, bonds, and real estate","Revenue, profit, and margin"],a:1,e:"Human capital (people's knowledge), structural capital (systems, IP, processes), relational capital (customer and partner relationships). HR directly builds the first and enables the others."},
{id:"q247",m:"m1",t:"k",s:"Drucker argued that knowledge workers are most productive when managed as:",o:["Assembly-line operators","Contractors paid by the hour","Interchangeable parts","Volunteers: with autonomy, purpose, and continuous learning rather than command and control"],a:3,e:"Drucker's insight: knowledge workers own the means of production (their expertise) and must be managed for autonomy and mission, like volunteers who can walk away."},
{id:"q248",m:"m1",t:"k",s:"An ambidextrous organization (O'Reilly and Tushman) is one that:",o:["Simultaneously exploits the current business and explores new opportunities","Uses both hands for typing","Avoids all risk","Centralizes every decision"],a:0,e:"Ambidexterity means running today's business efficiently while experimenting for tomorrow. HR must staff and reward these conflicting demands differently."},
{id:"q249",m:"m1",t:"k",s:"Grove's 'strategic inflection point' describes:",o:["A quarterly earnings beat","A new product launch","A fundamental shift in industry dynamics (a 10x force) that demands strategic response","A leadership change"],a:2,e:"Inflection points (the internet, AI) change competitive rules. HR's early-warning role is sensing skill shifts, talent flows, and workforce signals before the curve breaks."},
{id:"q250",m:"m1",t:"k",s:"Blue ocean strategy (Kim and Mauborgne) pursues:",o:["Beating rivals in existing markets","Uncontested market space through value innovation that makes competition irrelevant","Cutting prices below cost","Acquiring competitors"],a:1,e:"Blue oceans create new demand rather than fighting over existing share. HR's role is building the novel capabilities and culture such leaps require."},
{id:"q251",m:"m1",t:"k",s:"The GE-McKinsey nine-box matrix evaluates business units on:",o:["Performance and potential of employees","Revenue and headcount","Age and size","Industry attractiveness and competitive strength"],a:3,e:"Not the talent 9-box: GE-McKinsey plots industry attractiveness against business-unit strength to guide invest, harvest, or divest portfolio decisions."},
{id:"q252",m:"m1",t:"k",s:"Hoshin kanri deploys strategy through 'catchball,' which means:",o:["Iterative dialogue up and down the hierarchy to align goals and plans","Annual bonuses","A sports sponsorship","Random goal assignment"],a:0,e:"Catchball means goals are tossed back and forth between levels until aligned, creating shared ownership rather than top-down dictation."},
{id:"q253",m:"m1",t:"k",s:"OKRs differ from KPIs in that OKRs:",o:["Monitor routine operational health","Are set only by executives","Set ambitious, time-bound objectives with measurable key results to drive change","Never change"],a:2,e:"KPIs track ongoing health (stable, lagging); OKRs drive stretch change (aspirational, quarterly). HR uses both: KPIs for operations, OKRs for transformation."},
{id:"q254",m:"m1",t:"k",s:"In Osterwalder's Business Model Canvas, workforce considerations appear primarily in:",o:["Customer segments","Key resources, key activities, and cost structure","Channels","Revenue streams"],a:1,e:"People are key resources; what they do are key activities; their cost hits cost structure. HR leaders who read the canvas connect talent to the business model."},
{id:"q255",m:"m1",t:"k",s:"The 'Social' pillar of ESG most directly implicates HR through:",o:["Carbon accounting","Board composition only","Tax strategy","Labor practices, human capital development, DEI, and workforce health and safety"],a:3,e:"The S covers how companies treat people: labor standards, development, inclusion, safety. HR owns the data investors now scrutinize."},
{id:"q256",m:"m1",t:"k",s:"Effective board oversight of human capital typically includes:",o:["Regular CHRO briefings on talent risk, succession depth, and culture metrics","Approving every hire","Setting individual salaries","Running engagement surveys personally"],a:0,e:"Boards oversee, not operate: talent risk, CEO succession, culture, and human-capital disclosures belong on the board agenda with the CHRO presenting."},
{id:"q257",m:"m1",t:"k",s:"Leonard-Barton's concept of 'core rigidities' warns that:",o:["Companies need stricter rules","All change is dangerous","The capabilities that made a firm successful can become blinders that block adaptation","Culture does not matter"],a:2,e:"Core rigidities: deep strengths (values, skills, systems) harden into resistance. HR must help the firm unlearn, not just learn."},
{id:"q258",m:"m1",t:"k",s:"Christensen's theory of disruptive innovation suggests incumbents are most vulnerable when they:",o:["Invest too little in R and D","Ignore low-end or new-market entrants while overshooting mainstream customers' needs","Hire too aggressively","Expand internationally"],a:1,e:"Disruptors start 'worse' by incumbent metrics, then improve. HR's defense: protect exploratory talent in separate units with different metrics, not the core's scorecard."},
{id:"q259",m:"m1",t:"k",s:"Senge's 'fifth discipline,' which integrates the other four, is:",o:["Personal mastery","Shared vision","Team learning","Systems thinking"],a:3,e:"Systems thinking sees interrelationships over time, integrating personal mastery, mental models, shared vision, and team learning into a learning organization."},
{id:"q260",m:"m1",t:"k",s:"Social capital in organizations refers to:",o:["Value embedded in relationships, networks, and trust among people","The company's cash reserves","Social media followers","Charitable donations"],a:0,e:"Social capital is who trusts whom and who connects silos. HR builds it through onboarding, cross-functional teams, and collaboration norms."},
{id:"q261",m:"m1",t:"k",s:"Transaction cost economics (Williamson) suggests outsourcing an HR function when:",o:["It is strategically critical","Employees request it","The function uses generic skills, uncertainty is manageable, and market contracting costs less than internal provision","Competitors do it"],a:2,e:"TCE weighs asset specificity, uncertainty, and frequency. Generic, low-uncertainty work (payroll) outsources well; firm-specific, strategic work stays inside."},
{id:"q262",m:"m1",t:"k",s:"Atkinson's 'flexible firm' model divides the workforce into:",o:["Exempt and nonexempt","Core employees (functionally flexible) and peripheral workers (numerically flexible)","Managers and individual contributors","Full-time and part-time only"],a:1,e:"Core: multi-skilled, secure, developed for adaptability. Periphery: temps, contractors, part-timers absorbing demand swings. Strategy determines the mix."},
{id:"q263",m:"m1",t:"k",s:"An HR chargeback model, in which business units pay for HR services used, primarily:",o:["Eliminates the need for HR","Is illegal","Guarantees HR funding","Creates cost transparency and demand discipline, but can discourage use of needed services"],a:3,e:"Chargebacks make HR costs visible and curb frivolous demand, but units may skip valuable services to save budget. Design rates and guardrails carefully."},
{id:"q264",m:"m1",t:"sj",s:"The CEO demands a 20 percent across-the-board cut to the HR budget. What is the BEST response?",o:["Protect strategic capabilities and cut transactional work through automation, self-service, and outsourcing","Apply the cut evenly to all HR functions","Cut all training and development first","Refuse to cut anything"],a:0,e:"Peanut-butter cuts starve strategy and bloat alike. Segment the budget: protect workforce planning and talent, and fund cuts by shifting transactional work to cheaper channels."},
{id:"q265",m:"m1",t:"sj",s:"The company is entering its first foreign market (Ansoff market development). What should HR do FIRST?",o:["Post all jobs on the home-country careers site","Hire a country manager immediately","Assess the new market's labor laws, talent availability, cultural norms, and compensation benchmarks","Translate the employee handbook"],a:2,e:"Market entry fails on local realities: employment law, talent supply, and cultural expectations. Diagnose the landscape before hiring or transplanting home-country practices."},
{id:"q266",m:"m1",t:"sj",s:"The board asks the CHRO to brief them on human capital risk ahead of the annual filing. What is the BEST preparation?",o:["Share anecdotal success stories","Prepare data on turnover, succession depth, critical-role vacancies, engagement trends, and workforce-related risks tied to strategy","Present the HR budget","Decline; HR data is confidential"],a:1,e:"Boards need decision-grade risk data linked to strategy and disclosures, not stories. Frame talent metrics as enterprise risks with mitigation plans."},
{id:"q267",m:"m1",t:"sj",s:"Two divisions compete for HR investment: a high-growth 'star' and a declining unit slated for harvest. How should HR allocate?",o:["Split HR resources evenly","Invest only in the declining unit to save it","Let division heads fight it out","Concentrate talent investment on the star while right-sizing HR support for the declining unit"],a:3,e:"Portfolio logic applies to talent: fund growth where returns are highest and manage decline deliberately. Even splits subsidize losers and starve winners."},
{id:"q268",m:"m1",t:"sj",s:"A founder-led company at 150 employees is drowning in chaos: every decision still routes through the founder. What should HR advise?",o:["Professionalize decision rights, management layers, and HR systems while deliberately preserving the culture's strengths","Hire more assistants for the founder","Tell the founder to step down","Add more policies immediately"],a:0,e:"This is Greiner's crisis of leadership: creativity-phase management cannot scale. Build structure and delegation without crushing the entrepreneurial culture."},
{id:"q269",m:"m1",t:"sj",s:"During an acquisition, three critical engineers are being courted by competitors. What is the BEST retention design?",o:["Across-the-board raises for everyone","Promise promotions to all three","Targeted retention agreements tying meaningful payouts to transition milestones, not just staying","Do nothing and hope loyalty holds"],a:2,e:"Retention money must buy the transition: milestone-based stay agreements for truly critical talent. Blanket raises overpay the non-critical and under-protect the essential."},
{id:"q270",m:"m1",t:"sj",s:"HR is drafting the 100-day post-merger plan. Which priority belongs at the top?",o:["Redesigning the logo","Selecting leaders, securing critical talent, stabilizing payroll and benefits, and communicating honestly","Harmonizing every policy on day one","Planning the holiday party"],a:1,e:"The first 100 days decide the deal: leadership clarity, talent retention, operational continuity (pay and benefits), and credible communication. Policy harmonization can follow."},
{id:"q271",m:"m1",t:"sj",s:"In a divestiture, the transition services agreement (TSA) covers HR systems for 12 months. What is HR's biggest risk?",o:["The TSA lasting too long","Employee morale","The buyer's logo","Missing the disentanglement deadline: payroll, benefits, and HRIS must stand alone before the TSA expires"],a:3,e:"TSAs expire. HR must build standalone payroll, benefits, HRIS, and policies on a hard timeline, or the divested unit faces operational collapse at cutoff."},
{id:"q272",m:"m1",t:"sj",s:"A joint venture's two parent companies impose conflicting HR policies on the JV's employees. What should the JV HR leader do FIRST?",o:["Establish a JV-specific HR governance charter defining which policies apply and who decides","Follow the larger parent's policies","Let each employee choose","Escalate every dispute to both CEOs"],a:0,e:"JVs need their own HR governance: a charter clarifying policy authority prevents employees from being whipsawed between parents and gives HR a decision framework."},
{id:"q273",m:"m1",t:"sj",s:"A private equity owner acquires the company and demands a rapid turnaround. What is HR's most valuable contribution?",o:["Cutting headcount as fast as possible","Organizing team-building events","Aligning incentives to the value-creation plan, upgrading critical talent quickly, and installing performance accountability","Freezing all hiring indefinitely"],a:2,e:"PE turnarounds run on talent velocity: the right leaders, incentives tied to the thesis, and rigorous performance management. Indiscriminate cuts destroy the value being created."},
{id:"q274",m:"m1",t:"sj",s:"A planned reduction in force shows statistically significant adverse impact on employees over 40. What must HR do?",o:["Proceed; the analysis is just informational","Pause and re-examine selection criteria and decision documentation for job-relatedness and consistency","Hide the analysis from legal","Offer severance only to those affected"],a:1,e:"Adverse impact in a RIF invites ADEA and Title VII scrutiny. HR must validate criteria as job-related and consistent, adjust where needed, and document everything before proceeding."},
{id:"q275",m:"m1",t:"sj",s:"The company offers a voluntary separation program to 200 employees, many over 40. What is legally critical in the waiver design?",o:["A one-day signing deadline","Verbal agreements only","No written disclosure of who is eligible","OWBPA-compliant terms: adequate consideration period, 7-day revocation rights, and written advice to consult counsel"],a:3,e:"Group terminations trigger OWBPA: 45-day consideration, 7-day revocation, written specifics, and advice to consult an attorney. A defective waiver voids the release."},
{id:"q276",m:"m1",t:"sj",s:"After a layoff, remaining employees are anxious, overworked, and disengaged ('survivor syndrome'). What is the BEST response?",o:["Communicate honestly about the future, address workload realistically, involve survivors in rebuilding, and visibly support those who left","Pretend nothing happened","Promise no more layoffs ever","Immediately launch a fun committee"],a:0,e:"Survivors need honesty about why, fairness in how, and agency in what comes next. Empty promises or forced fun deepen cynicism; credible rebuilding restores trust."},
{id:"q277",m:"m1",t:"sj",s:"Talent acquisition is overwhelmed by volatile hiring spikes. The CHRO is evaluating recruitment process outsourcing (RPO). What should drive the decision?",o:["Whether competitors use RPO","The RPO vendor's sales pitch","Demand volatility, internal capability gaps, cost at scale, and the strategic importance of hiring control","Headcount reduction targets"],a:2,e:"RPO fits spiky, high-volume hiring where scale economics beat fixed internal cost. Stable, strategic hiring usually stays in-house. Decide on economics and capability, not fashion."},
{id:"q278",m:"m1",t:"sj",s:"Finance proposes offshoring customer service purely on wage arbitrage. What HR risk must be quantified FIRST?",o:["Time zones","Attrition, quality, knowledge-transfer costs, and brand impact that can erase the wage savings","Office furniture costs","The vendor's logo"],a:1,e:"Offshoring math fails when high attrition, retraining, and quality erosion are ignored. HR must model total cost, not just wages."},
{id:"q279",m:"m1",t:"sj",s:"A spin-off must build HR from scratch in six months. What is the FIRST priority?",o:["Designing a new employer brand","Writing a mission statement","Planning the launch party","Continuity of payroll, benefits, and HRIS so employees are paid and covered on day one"],a:3,e:"Day-one continuity is non-negotiable: pay people accurately, keep benefits seamless, stand up core systems. Brand and strategy follow operational survival."},
{id:"q280",m:"m1",t:"sj",s:"The company is preparing for an IPO in 18 months. Which HR gap is most urgent to close?",o:["Equity compensation plans, human capital disclosures, internal controls, and compliant policies that withstand public-company scrutiny","The holiday calendar","Office decor","The softball team"],a:0,e:"IPOs expose HR: equity plan design, SEC human capital disclosure, SOX-adjacent controls, and airtight compliance. Fix these early; auditors and underwriters will probe them."},
{id:"q281",m:"m1",t:"sj",s:"Business leaders routinely bypass the HRBPs and escalate directly to the CHRO. What should the CHRO do?",o:["Accept it as a compliment","Fire the HRBPs","Re-contract the HRBP role with executives: clarify decision rights, build HRBP business acumen, and redirect routine matters back","Ban all escalations"],a:2,e:"Bypass signals a broken operating model, not flattery. Reset role clarity with leaders, upskill HRBPs, and enforce the model or the three-legged stool collapses."},
{id:"q282",m:"m1",t:"sj",s:"HR faces a 15 percent budget cut but must keep strategic impact. What is the BEST approach?",o:["Cut every program equally","Protect workforce planning, talent, and analytics; fund the cut by automating transactions and expanding self-service","Eliminate all HR technology","Stop all hiring"],a:1,e:"Cut by value tier, not by percentage: strategic capabilities are the last to go, transactional work the first to be automated, self-served, or outsourced."},
{id:"q283",m:"m1",t:"sj",s:"The CEO wants to copy a famous tech company's HR practices wholesale. What is the BEST counsel?",o:["Implement them immediately","Refuse to change anything","Copy a different company instead","Apply best-fit thinking: adapt practices to this company's strategy, workforce, and context rather than importing them intact"],a:3,e:"Practices that drive performance in one context can fail in another. Translate the principles behind the practices, then fit them to this strategy and culture."},
{id:"q284",m:"m1",t:"sj",s:"An AI-driven transformation will obsolete 30 percent of current tasks within three years. What is HR's most strategic move?",o:["Build a skills taxonomy, forecast future skill needs, and launch targeted reskilling academies tied to the transformation roadmap","Wait until roles disappear","Lay off 30 percent now","Ban AI tools"],a:0,e:"Workforce shaping beats reactive layoffs: map skills, forecast gaps, and build targeted academies. Reskilling at scale is cheaper and less destructive than churn."},
{id:"q285",m:"m1",t:"sj",s:"An activist investor demands deep cost cuts including HR. What is HR's BEST contribution to the board discussion?",o:["Agree to all cuts","Hide the HR budget","Quantify human capital risks of the cuts: critical-talent flight, capability gaps, and the cost of rebuilding, so the board decides with eyes open","Threaten to resign"],a:2,e:"HR's board value is risk quantification: translate cuts into talent flight probabilities, capability losses, and rebuild costs. Informed trade-offs beat blind slashing."},
{id:"q286",m:"m1",t:"sj",s:"The CEO resigns suddenly with no successor named. What should HR do in the first 48 hours?",o:["Begin an external search immediately","Activate the emergency succession protocol: interim leader, board communication plan, and stabilization of key stakeholders","Say nothing until the board decides","Promote the longest-tenured executive"],a:1,e:"Sudden departures need protocol, not improvisation: interim leadership, coordinated communication, and stakeholder calm. The permanent search follows stabilization."},
{id:"q287",m:"m1",t:"sj",s:"The strategy is sound but execution keeps stalling. Which HR lever BEST closes the execution gap?",o:["More strategy offsites","A new mission statement","Longer planning cycles","Cascading scorecards, regular business reviews, and incentives tied to strategic milestones"],a:3,e:"Execution fails on accountability, not ideas: clear cascading goals, cadenced reviews, and incentives aligned to milestones turn strategy into behavior."},
{id:"q288",m:"m1",t:"sj",s:"The business needs scarce machine-learning talent within six months for a critical launch. What is the BEST workforce-shaping recommendation?",o:["Borrow and buy: contract specialists for immediate needs while hiring selectively, since building takes longer than the deadline allows","Build: train existing staff from scratch","Wait for the labor market to cool","Outsource the entire product"],a:0,e:"Match the lever to the timeline: six months is too short to build ML talent but enough to borrow (contract) and buy (hire). Blend levers to the constraint."},
{id:"q289",m:"m1",t:"sj",s:"A senior leader asks HR to 'adjust' engagement survey results before the board presentation. What is the BEST response?",o:["Make the small adjustment requested","Adjust only the worst scores","Refuse: data integrity is non-negotiable, and manipulated data destroys trust and leads to wrong decisions","Delay the presentation indefinitely"],a:2,e:"Falsifying people data is an ethical breach with practical costs: the board would govern on fiction. HR's credibility depends on being the honest broker of workforce truth."},
{id:"q290",m:"m2",t:"k",s:"Active candidates differ from passive candidates in that passive candidates:",o:["Are unemployed","Are employed and not job hunting, requiring proactive outreach and stronger value propositions","Apply in greater numbers","Accept lower pay"],a:1,e:"Passive candidates are not looking, so they must be sourced and sold on the opportunity. They expand the pool but demand more recruiter effort per hire."},
{id:"q291",m:"m2",t:"k",s:"The main diversity risk of heavy reliance on employee referrals is:",o:["Referrals are always unqualified","Referrals cost too much","Referred hires quit faster","Homophily: people refer others like themselves, replicating the current workforce's demographics"],a:3,e:"Network homophily means referral-heavy pipelines mirror existing demographics. Balance referrals with diverse sourcing and structured selection."},
{id:"q292",m:"m2",t:"k",s:"In Boolean talent searching, the operator OR is used to:",o:["Broaden results by including any of the terms","Narrow results","Exclude terms","Search exact phrases only"],a:0,e:"OR broadens (Java OR Python); AND narrows; NOT excludes; quotes demand exact phrases. Parentheses control order of operations."},
{id:"q293",m:"m2",t:"k",s:"Offer acceptance rate is calculated as:",o:["Offers extended divided by applicants","Hires divided by interviews","Offers accepted divided by offers extended","Applications divided by openings"],a:2,e:"Acceptance rate equals accepted divided by extended. A falling rate signals compensation, process speed, or employer-brand problems worth diagnosing."},
{id:"q294",m:"m2",t:"k",s:"Source effectiveness should be judged primarily by:",o:["Volume of applicants per source","The quality and retention of hires each source produces relative to its cost","How fast the source delivers resumes","Recruiter preference"],a:1,e:"Volume vanity metrics mislead. Effective sourcing is measured by hire quality, retention, and cost per quality hire by channel."},
{id:"q295",m:"m2",t:"k",s:"Bauer's '4 Cs' of onboarding are:",o:["Coffee, cake, chats, and cards","Cost, control, compliance, and contracts","Call, confirm, coach, and celebrate","Compliance, clarification, culture, and connection"],a:3,e:"Bauer's framework: compliance (rules), clarification (role), culture (norms), connection (relationships). Most onboarding stops at compliance; the other three drive retention."},
{id:"q296",m:"m2",t:"k",s:"Preboarding refers to:",o:["Engaging accepted candidates between offer acceptance and start date to prevent dropout","Interviewing before posting","Firing before hiring","Onboarding interns"],a:0,e:"The offer-to-start gap is when candidates ghost or get countered. Preboarding (check-ins, team intros, early paperwork) protects the hire."},
{id:"q297",m:"m2",t:"k",s:"Time to productivity (ramp-up time) measures:",o:["How fast recruiters fill roles","Interview scheduling speed","How long before a new hire reaches full expected performance","Offer letter turnaround"],a:2,e:"Time to productivity captures onboarding effectiveness in business terms. Shortening it through better onboarding directly increases the return on hiring."},
{id:"q298",m:"m2",t:"k",s:"Competency modeling differs from traditional job analysis in that competency models:",o:["Describe current tasks in detail","Identify the behaviors and capabilities needed for future success, often across roles","Are only for executives","Ignore business strategy"],a:1,e:"Job analysis documents what the job is today; competency models define what superior performance requires tomorrow, aligned to strategy."},
{id:"q299",m:"m2",t:"k",s:"KSAOs stand for:",o:["Key salary and operations","Korean standards for hiring","Key success and outcomes","Knowledge, skills, abilities, and other characteristics"],a:3,e:"KSAOs are the worker requirements derived from job analysis: knowledge (facts), skills (proficiencies), abilities (enduring traits), and other characteristics (licenses, etc.)."},
{id:"q300",m:"m2",t:"k",s:"Identifying a job's 'essential functions' matters most for:",o:["ADA reasonable-accommodation analysis: accommodations must enable performance of essential, not marginal, functions","Writing catchy job ads","Setting salaries","Planning parties"],a:0,e:"Essential functions are the fundamental duties of the role. Under the ADA, employers must accommodate to enable these, and can require them of everyone in the role."},
{id:"q301",m:"m2",t:"k",s:"The Position Analysis Questionnaire (PAQ) is:",o:["A personality test","An engagement survey","A standardized, worker-oriented job analysis instrument scoring jobs on elements like information input and mental processes","A pay survey"],a:2,e:"The PAQ analyzes jobs via 194 worker-oriented elements, enabling cross-job comparisons useful for selection and compensation."},
{id:"q302",m:"m2",t:"k",s:"Functional Job Analysis (FJA) rates every job on its complexity relative to:",o:["Pay grades","Data, people, and things","Office locations","Shift schedules"],a:1,e:"FJA's data-people-things scales describe what workers do with information, interpersonal demands, and objects, feeding job descriptions and selection criteria."},
{id:"q303",m:"m2",t:"k",s:"The DACUM method of job analysis relies on:",o:["Software algorithms","Government databases","Employee selfies","Panels of expert workers defining the tasks of an occupation"],a:3,e:"DACUM (Developing A Curriculum) uses facilitated expert-worker panels to map duties and tasks quickly, often for training design and competency work."},
{id:"q304",m:"m2",t:"k",s:"Cognitive ability tests present a classic selection dilemma because they:",o:["Show the highest validity for job performance but also the largest subgroup score differences, requiring validation and care","Have no validity","Are illegal","Cannot be administered online"],a:0,e:"General mental ability is the single best predictor of performance across jobs, but it produces adverse impact. Use requires rigorous validation and often combination with other predictors."},
{id:"q305",m:"m2",t:"k",s:"Among Big Five personality traits, the strongest consistent predictor of job performance is:",o:["Extraversion","Openness","Conscientiousness","Agreeableness"],a:2,e:"Conscientiousness (dependability, achievement striving) predicts performance across occupations. Extraversion predicts specifically in sales and management roles."},
{id:"q306",m:"m2",t:"k",s:"Situational judgment tests (SJTs) as selection tools are valued because they:",o:["Are free","Present realistic job scenarios with good validity and typically lower adverse impact than cognitive tests","Guarantee perfect hires","Replace interviews entirely"],a:1,e:"SJTs simulate the judgment demands of the role, showing solid criterion validity with smaller subgroup differences, making them a strong complement to other tools."},
{id:"q307",m:"m2",t:"k",s:"Assessment centers achieve high predictive validity through:",o:["A single interview","Handwriting analysis","Astrology","Multiple exercises evaluated by multiple trained assessors"],a:3,e:"Assessment centers combine simulations (in-basket, role plays, group exercises) with multiple assessors, yielding strong validity for managerial selection at high cost."},
{id:"q308",m:"m2",t:"k",s:"Biodata (biographical data) instruments predict performance on the principle that:",o:["The past predicts the future: verifiable life-history patterns correlate with job behavior","Horoscopes matter","GPA is everything","First impressions count"],a:0,e:"Biodata items (verifiable history, not attitudes) predict via behavioral consistency. They require empirical keying and periodic revalidation."},
{id:"q309",m:"m2",t:"k",s:"A key legal risk in reference checking for former employers is:",o:["Giving any reference at all","Checking references too thoroughly","Negligent referral: failing to disclose known dangerous behavior when a former employee poses foreseeable risk","Calling too many references"],a:2,e:"While defamation fears make employers say little, withholding known risks (e.g., violent behavior) can create negligent-referral liability when harm was foreseeable."},
{id:"q310",m:"m2",t:"k",s:"The Employee Polygraph Protection Act (EPPA) generally:",o:["Requires polygraphs for all hires","Prohibits most private employers from using lie detectors for pre-employment screening, with narrow exemptions","Applies only to government","Encourages random testing"],a:1,e:"EPPA bans private-sector pre-employment polygraphs except for security services, drug manufacturers, and narrow ongoing-investigation exemptions."},
{id:"q311",m:"m2",t:"k",s:"New York City Local Law 144 requires employers using automated employment decision tools to:",o:["Ban all AI in hiring","Disclose the algorithm's source code","Hire only by hand","Conduct annual independent bias audits and notify candidates that an AEDT will be used"],a:3,e:"Local Law 144 mandates bias audits of AEDTs by independent auditors and advance notice to NYC candidates and employees, with results published. A model for emerging AI hiring regulation."},
{id:"q312",m:"m2",t:"k",s:"'Ban-the-box' laws primarily require employers to:",o:["Delay criminal-history inquiries until later in the hiring process","Never conduct background checks","Hire only ex-offenders","Ban all application forms"],a:0,e:"Ban-the-box removes the conviction checkbox from initial applications so candidates are judged on qualifications first; checks may still occur later, often with individualized assessment."},
{id:"q313",m:"m2",t:"k",s:"Salary history bans are intended to:",o:["Prevent all pay negotiation","Reduce hiring","Break the cycle of past pay discrimination carrying forward into new offers","Hide market data"],a:2,e:"Basing offers on prior pay perpetuates historical gaps. Many states and cities now bar asking; employers should price the role, not the person's history."},
{id:"q314",m:"m2",t:"k",s:"Under the DOL's 'primary beneficiary' test, an unpaid internship is lawful when:",o:["The intern does productive work","The experience primarily benefits the intern educationally across seven factors, not the employer","The company is a nonprofit","The intern agrees verbally"],a:1,e:"The seven-factor test asks who benefits most: tied to education, training comparable to school, no displacement of employees, no promise of a job. Employers who benefit most must pay."},
{id:"q315",m:"m2",t:"k",s:"California's ABC test classifies a worker as an independent contractor only if:",o:["They sign a contractor agreement","They invoice monthly","They work remotely","(A) Free from control, (B) work is outside the usual business, and (C) they are independently established in that trade"],a:3,e:"All three prongs must be met; failing any one means employee status. Prong B is the hardest for companies whose contractors do core work."},
{id:"q316",m:"m2",t:"k",s:"The DOL's 2024 independent-contractor rule applies which standard?",o:["The economic-reality test: totality of six factors assessing whether the worker is truly in business for themselves","The ABC test nationally","Whoever the employer designates","A single control factor"],a:0,e:"The 2024 rule returned to the multifactor economic-reality test (control, opportunity for profit or loss, permanence, nature of control, integration, skill and initiative). No single factor decides."},
{id:"q317",m:"m2",t:"k",s:"The STAR method in behavioral interviewing asks candidates to describe:",o:["Their star sign","Salary, title, and references","Situation, Task, Action, and Result of a past experience","Strengths only"],a:2,e:"STAR structures behavioral answers: the Situation and Task, the candidate's specific Actions, and the Result. Interviewers probe for the 'A' to assess real behavior."},
{id:"q318",m:"m2",t:"k",s:"Behavioral interview questions differ from situational questions in that behavioral questions:",o:["Ask hypotheticals","Ask about actual past behavior, which generally predicts better than hypothetical responses","Are illegal","Take less time"],a:1,e:"Behavioral ('tell me about a time') taps real experience; situational ('what would you do if') taps intentions. Past behavior is the stronger predictor."},
{id:"q319",m:"m2",t:"k",s:"Panel interviews reduce individual bias but risk:",o:["Nothing; they are perfect","Lower validity always","Legal violations","Groupthink, dominant voices, and intimidating candidates, plus scheduling burden"],a:3,e:"Panels diversify perspectives but need structure: independent scoring before discussion, a designated facilitator, and awareness of conformity pressure."},
{id:"q320",m:"m2",t:"k",s:"Workforce demand forecasting methods include all EXCEPT:",o:["Random selection","Trend analysis","Ratio analysis","Regression modeling"],a:0,e:"Demand forecasting uses trend analysis (historical patterns), ratio analysis (e.g., sales per employee), regression, and managerial judgment. Random selection is not a method."},
{id:"q321",m:"m2",t:"k",s:"Internal labor supply is commonly forecast using:",o:["Stock prices","Weather data","Skills inventories and replacement charts","Competitor press releases"],a:2,e:"Skills inventories catalog current capabilities; replacement charts map backup candidates for key roles. Together they reveal the promotable supply."},
{id:"q322",m:"m2",t:"k",s:"Workforce gap analysis compares:",o:["Two competitors","Forecasted labor demand against projected internal supply to identify shortages or surpluses","Salaries across departments","This year to last year only"],a:1,e:"Gap equals demand minus supply by role, skill, and time horizon. Resulting shortages drive build, buy, or borrow strategies; surpluses drive redeployment or reductions."},
{id:"q323",m:"m2",t:"k",s:"Mitchell's job embeddedness theory says people stay because of:",o:["Golden handcuffs only","Fear of change","High unemployment","Links (connections), fit (compatibility), and sacrifice (what they'd give up), on and off the job"],a:3,e:"Embeddedness covers links to people, fit with role and community, and sacrifice of leaving (benefits, relationships, community roots). Off-the-job embeddedness predicts retention strongly."},
{id:"q324",m:"m2",t:"k",s:"The unfolding model of turnover (Lee and Mitchell) emphasizes that quits often follow:",o:["Shocks: jarring events that trigger pre-existing scripts or deliberation, even among satisfied employees","Years of growing dissatisfaction only","Pay cuts only","Bad weather"],a:0,e:"Most turnover starts with a shock (a recruiter call, a denied promotion, a life event) activating a script, not slow-burn dissatisfaction. Retention must address shocks, not just satisfaction."},
{id:"q325",m:"m2",t:"k",s:"Cost of vacancy is best estimated as:",o:["The job ad price","Zero until filled","Lost productivity and revenue per day the role sits open, plus overtime and delay costs","Recruiter salary"],a:2,e:"Vacancy cost equals the daily value of the unfilled role plus coverage costs. It justifies recruiting investment and prioritizes critical openings."},
{id:"q326",m:"m2",t:"k",s:"Offer letters should include at-will language because:",o:["It is legally required everywhere","Without it, promises in the letter can be read as an implied contract limiting at-will termination","Candidates prefer it","It speeds hiring"],a:1,e:"Courts have found implied contracts in offer letters promising 'long-term opportunity' or listing termination causes. Clear at-will disclaimers preserve flexibility."},
{id:"q327",m:"m2",t:"k",s:"Under federal recordkeeping rules, employers must generally preserve hiring records (applications, resumes) for:",o:["30 days","Ten years","Forever","One year from the hiring decision"],a:3,e:"Title VII and the ADA require one-year retention of hiring records from the decision date; use them to defend selection decisions and analyze adverse impact."},
{id:"q328",m:"m2",t:"sj",s:"A hiring manager insists on hiring a candidate who 'just feels right' despite weak structured-interview scores. What should HR do?",o:["Hold the line: require the decision against pre-defined, job-related criteria and documented scorecards","Approve the hire to keep the manager happy","Let the manager decide alone","Restart the search"],a:0,e:"Unstructured 'feel' hiring is low-validity and high-bias. HR's role is enforcing the validated process: decisions on criteria and evidence, not chemistry."},
{id:"q329",m:"m2",t:"sj",s:"A vendor pitches an AI video-interview tool that scores candidate 'enthusiasm.' What is HR's BEST first step?",o:["Buy it immediately for efficiency","Roll it out to all roles at once","Demand validity evidence, adverse-impact data, and bias-audit compliance before any pilot","Let IT decide"],a:2,e:"Facial-analysis hiring tools face validity doubts and laws like NYC Local Law 144 and the Illinois AI Video Interview Act. Evidence and legal review precede pilots."},
{id:"q330",m:"m2",t:"sj",s:"A social media screen of a finalist reveals she is pregnant. What must HR do?",o:["Reject her quietly","Exclude the information from the decision entirely and document the job-related basis for whoever is selected","Ask about her maternity plans","Delay the hire until after delivery"],a:1,e:"Pregnancy knowledge triggers PDA protection. The decision must rest on documented job-related criteria; the protected information must play no role."},
{id:"q331",m:"m2",t:"sj",s:"A reference alleges the candidate was fired for theft. What is the BEST next step?",o:["Reject immediately","Sue the reference","Ignore all references","Corroborate the claim, give the candidate a chance to respond, and weigh it against the full record"],a:3,e:"Single-source allegations need verification and candidate response before action. Fair process plus documentation protects against negligent-hiring and defamation risks alike."},
{id:"q332",m:"m2",t:"sj",s:"A candidate discloses a disability and asks about accommodations before receiving an offer. How should HR respond?",o:["Discuss accommodations for the hiring process, but defer any disability-related medical inquiries until after a conditional offer","Withdraw them from consideration","Require a full medical exam now","Ask for their diagnosis"],a:0,e:"The ADA permits accommodation discussions during hiring but bars disability-related inquiries and medical exams until after a conditional offer. Sequence matters."},
{id:"q333",m:"m2",t:"sj",s:"A 'contractor' has worked full-time on core projects for two years under daily supervision. What should HR do?",o:["Renew the contract","Ignore it; the contract says contractor","Audit the classification under the DOL economic-reality test and convert or genuinely restructure the relationship","Cut their hours slightly"],a:2,e:"Long-term, supervised, core-work contractors are misclassification risks carrying back-pay, tax, and benefits liability. Labels do not control; reality does."},
{id:"q334",m:"m2",t:"sj",s:"A strong internal candidate loses to an external hire because the manager wants 'fresh blood.' What should HR examine?",o:["Nothing; managers decide","Whether the decision followed consistent criteria or reflected bias against internal mobility, and what it signals to the workforce","The external hire's resume only","Office seating"],a:1,e:"Reflexive external preference demoralizes talent and wastes development investment. HR should test the decision against criteria and protect internal-mobility credibility."},
{id:"q335",m:"m2",t:"sj",s:"A former top performer ('boomerang') wants to return after two years away. What is the BEST approach?",o:["Rehire automatically at a higher level","Refuse all rehires on principle","Rehire without interviews","Run them through a fresh, fair assessment like any candidate while valuing their known track record"],a:3,e:"Boomerangs are known quantities but not exempt from process: assess current fit and skills fairly, check why they left and why they return, and avoid nostalgia hiring."},
{id:"q336",m:"m2",t:"sj",s:"A finalist has a competing offer 10 percent above your range. What is the BEST response?",o:["Sell total value: growth, role scope, benefits, and culture, and stretch selectively only for truly differentiated talent","Match it immediately","Withdraw the offer","Bad-mouth the competitor"],a:0,e:"Reflexive matching starts bidding wars and creates inequity. Compete on total value and be selective about exceptions, documenting the business case."},
{id:"q337",m:"m2",t:"sj",s:"A key employee resigns and the manager wants to make a counteroffer. What should HR advise?",o:["Always counter to retain talent","Counter with a promotion","Counters usually fail: most acceptors leave within a year since root causes remain; address underlying issues or exit gracefully","Threaten legal action"],a:2,e:"Research consistently shows counteroffer acceptors depart soon after because the underlying drivers are unchanged. Fix causes for the team; wish the individual well."},
{id:"q338",m:"m2",t:"sj",s:"A promising new hire is failing at 60 days despite strong credentials. What should HR diagnose FIRST?",o:["Their intelligence","The onboarding: role clarity, resources, manager support, and early feedback","Their personality","The economy"],a:1,e:"Credentialed hires rarely fail on ability at 60 days; they fail on clarity, support, and feedback. Audit the onboarding system before blaming the person."},
{id:"q339",m:"m2",t:"sj",s:"Referrals produce 70 percent of hires but the pipeline is demographically homogeneous. What is the BEST fix?",o:["Ban referrals","Accept the homogeneity","Lower hiring standards","Cap referral influence, invest in diverse sourcing channels, and keep structured selection for all"],a:3,e:"Keep referrals' quality advantages while diluting their homophily: diversify sourcing, maintain structured evaluation, and track pipeline demographics."},
{id:"q340",m:"m2",t:"sj",s:"A manager wants to skip the background check to onboard a candidate faster. What should HR do?",o:["Refuse: skipping checks for expediency creates negligent-hiring exposure and inconsistent process","Agree; speed matters most","Skip it just this once","Do the check after a year"],a:0,e:"Background checks are risk controls, not bureaucracy. Skipping them for speed invites negligent-hiring liability and undermines process integrity."},
{id:"q341",m:"m2",t:"sj",s:"Campus recruiting yields few hires despite heavy investment. What is the BEST strategic shift?",o:["Visit more campuses","Abandon early-career hiring","Build a feeder system: internships, co-ops, and faculty partnerships that convert, rather than career-fair volume","Only hire Ivy League"],a:2,e:"Career fairs produce resumes; internships produce hires. Shift spend from event volume to conversion engines: structured internships and school partnerships."},
{id:"q342",m:"m2",t:"sj",s:"A seasonal demand spike is coming. How should HR decide between overtime and temporary hires?",o:["Always use overtime","Compare the overtime premium against temp fully-loaded cost, quality, and training time for the specific roles","Always hire temps","Ask employees to volunteer"],a:1,e:"The math is role-specific: overtime premium versus temp wages plus agency markup, training, and error rates. Model both for the actual work."},
{id:"q343",m:"m2",t:"sj",s:"The company needs data scientists it cannot hire fast enough. Build (reskill) or buy (hire)?",o:["Always buy experienced talent","Only build","Wait for layoffs elsewhere","Analyze time-to-productivity: reskill adjacent talent for sustainable supply while buying selectively for immediate critical needs"],a:3,e:"Build versus buy is a timeline and economics question: reskilling creates loyal supply but takes time; buying fills now at premium. Blend both deliberately."},
{id:"q344",m:"m2",t:"sj",s:"An interview panel is deadlocked between two finalists, with the loudest voice dominating. What should HR do?",o:["Return the panel to independent scores against pre-defined criteria and facilitate a structured, evidence-based discussion","Let the loudest voice decide","Flip a coin","Restart the search"],a:0,e:"Deadlocks need process, not volume: independent pre-scoring prevents anchoring, and criteria-anchored facilitation keeps the decision on evidence."},
{id:"q345",m:"m2",t:"sj",s:"In a salary-history-ban jurisdiction, a candidate volunteers their prior pay. What should the recruiter do?",o:["Record it and use it to set the offer","Ask for proof","Thank them, do not record or rely on it, and price the offer to the role's range","End the interview"],a:2,e:"Volunteered history is still history: ban laws target employer reliance. Keep it out of the file and anchor the offer to the role's market range."},
{id:"q346",m:"m2",t:"sj",s:"A background check surfaces a seven-year-old nonviolent conviction unrelated to the role. What is the BEST process?",o:["Automatic rejection","Conduct an individualized assessment: nature and gravity of the offense, time elapsed, and its relation to the job, per EEOC guidance","Ignore all convictions","Ask the hiring manager's gut"],a:1,e:"EEOC guidance rejects blanket bans: assess the Green factors (nature, time, job-relatedness) and give the candidate a chance to respond before deciding."},
{id:"q347",m:"m2",t:"sj",s:"A VP wants to skip posting a role to hand it to a favored internal candidate. What should HR do?",o:["Allow it; VPs decide","Post it but rig the outcome","Complain to the CEO","Enforce the posting policy consistently: exceptions invite favoritism claims and erode trust in internal mobility"],a:3,e:"Selective posting destroys internal-mobility credibility and invites discrimination claims. Consistent process protects both fairness and the company."},
{id:"q348",m:"m2",t:"sj",s:"Remote new hires report feeling disconnected in their first month. What is the BEST onboarding fix?",o:["Engineer connection deliberately: assigned buddy, team rituals, scheduled 1:1s, and early meaningful work","More compliance modules","Longer hours","Fewer meetings"],a:0,e:"Remote onboarding starves the 'connection' C. Design belonging intentionally: buddies, rituals, and real work early beat passive content."},
{id:"q349",m:"m2",t:"sj",s:"First-year attrition among sales hires is 40 percent. What should HR diagnose FIRST?",o:["The salespeople's work ethic","The office location","The funnel: selection criteria validity, realistic previews, onboarding quality, and whether compensation matches the pitch","The CRM software"],a:2,e:"Early attrition is a system output: mis-set expectations, weak selection, poor ramp support, or comp mismatch. Diagnose the funnel before blaming the hires."},
{id:"q350",m:"m2",t:"sj",s:"A temp agency worker is supervised daily, given company equipment, and held to the same schedule as employees. What is the risk?",o:["None; the agency is the employer","Co-employment or misclassification exposure: the company may be deemed a joint employer with wage, benefit, and liability obligations","The temp will quit","The agency will sue"],a:1,e:"Control determines employment, not contracts. Direct supervision, equipment, and scheduling point to joint employment with real liability."},
{id:"q351",m:"m2",t:"sj",s:"During a hiring freeze, a manager requests an exception for a 'critical' backfill. What is the BEST triage?",o:["Approve all exceptions","Deny all exceptions","Let finance decide alone","Assess business criticality and revenue impact, consider borrow or redistribute options first, and document the decision"],a:3,e:"Freeze exceptions need a disciplined screen: true criticality, alternatives (borrow, redistribute, automate), and documentation. Rubber-stamping voids the freeze."},
{id:"q352",m:"m2",t:"sj",s:"A nearly identical role opens six months after a strong finalist ('silver medalist') was passed over. What is the BEST move?",o:["Re-engage the silver medalist directly with a streamlined process","Make them reapply from scratch","Ignore past candidates","Post only externally"],a:0,e:"Silver medalists are pre-vetted talent: fast re-engagement cuts time-to-fill and honors their effort. Keep a warm bench, not a cold database."},
{id:"q353",m:"m2",t:"sj",s:"Candidates are ghosting mid-process at high rates. What is the most likely fix?",o:["More job ads","Lower the salary range","Shorten the process, communicate on a clear cadence, and give candidates a human contact","Add more interview rounds"],a:2,e:"Ghosting is a process symptom: slow, silent pipelines lose candidates to faster employers. Speed, transparency, and human touch restore completion rates."}
);
</script>
<script>
"use strict";
/* ---- 1000Q EXPANSION batch 2 ---- */
QUESTIONS.push(
{id:"q354",m:"m3",t:"k",s:"According to Maslow's hierarchy of needs applied to the workplace, which needs generally become active motivators only after lower-level needs are reasonably satisfied?",o:["Esteem and self-actualization needs","Physiological and safety needs","All five levels simultaneously","Only financial needs"],a:0,e:"Maslow: lower-order needs (physiological, safety) dominate until satisfied; then higher-order needs (belonging, esteem, self-actualization) become the active motivators."},
{id:"q355",m:"m3",t:"k",s:"Adams' equity theory predicts that employees are most motivated when:",o:["They perceive their ratio of inputs to outcomes as fair compared to others","Their inputs clearly exceed their outcomes","They avoid comparing themselves to coworkers","Their pay is the highest on the team"],a:0,e:"Equity theory: people compare their input/outcome ratio to referent others; perceived inequity (under- or over-reward) creates tension they act to resolve."},
{id:"q356",m:"m3",t:"k",s:"McClelland's acquired needs theory identifies three learned motivators that drive behavior at work. They are:",o:["Physiological, safety, and social needs","Hygiene factors, motivators, and satisfiers","Achievement, affiliation, and power","Autonomy, mastery, and purpose"],a:2,e:"McClelland: need for achievement (excel, measurable goals), affiliation (relationships, approval), and power (influence, impact) vary by individual and shape what motivates each person."},
{id:"q357",m:"m3",t:"k",s:"Alderfer's ERG theory differs from Maslow's hierarchy in an important way. ERG proposes that:",o:["Only existence needs matter at work","Needs must be satisfied in a fixed sequence","Lower needs disappear permanently once satisfied","Existence, relatedness, and growth needs can operate simultaneously, and frustration can cause regression to lower needs"],a:3,e:"ERG collapses Maslow's five levels into three (existence, relatedness, growth), allows multiple needs at once, and adds frustration-regression: blocked growth needs intensify relatedness and existence desires."},
{id:"q358",m:"m3",t:"k",s:"Self-determination theory (Deci and Ryan) holds that intrinsic motivation flourishes when three basic psychological needs are met:",o:["Autonomy, competence, and relatedness","Pay, benefits, and job security","Recognition, promotion, and bonuses","Structure, supervision, and rules"],a:0,e:"SDT: autonomy (choice and control), competence (mastery), and relatedness (connection) fuel intrinsic motivation; controlling rewards and micromanagement undermine them."},
{id:"q359",m:"m3",t:"k",s:"The Job Characteristics Model (Hackman and Oldham) names five core job dimensions that drive motivation. Which of the following is NOT one of them?",o:["Autonomy","Task significance","Pay level","Skill variety"],a:2,e:"The five are skill variety, task identity, task significance, autonomy, and feedback. They produce experienced meaningfulness, responsibility, and knowledge of results; pay sits outside the model."},
{id:"q360",m:"m3",t:"sj",s:"A data-entry role has 60 percent annual turnover. Exit comments call the work mindless and invisible. Applying the Job Characteristics Model, the BEST redesign is to:",o:["Raise pay by 5 percent and add a pizza Friday","Automate the role entirely","Combine fragmented tasks so each person owns a whole case, share client outcome feedback, and allow schedule choice","Rotate everyone through the role monthly"],a:2,e:"JCM levers: task identity (owning a whole case), feedback (client outcomes), autonomy (schedule choice). Pay bumps and rotation do not fix a motivation-poor job design."},
{id:"q361",m:"m3",t:"k",s:"Meyer and Allen's three-component model of organizational commitment includes:",o:["Engagement, satisfaction, and loyalty","Continuance, normative, and calculative commitment","Job involvement, embeddedness, and morale","Affective, continuance, and normative commitment"],a:3,e:"Affective (want to stay: emotional attachment), continuance (need to stay: cost of leaving), normative (ought to stay: obligation). Only affective commitment reliably predicts engagement and performance."},
{id:"q362",m:"m3",t:"sj",s:"A company retains people mainly through unvested stock and strict non-competes, yet engagement scores keep falling. The core risk is:",o:["High continuance commitment with low affective commitment: people stay but disengage, and leave the moment the handcuffs loosen","Too much affective commitment","Excessive normative commitment","Low turnover costs"],a:0,e:"Golden handcuffs buy continuance commitment (need to stay), not affective commitment (want to stay). The result is a disengaged, captive workforce that exits in waves when constraints lift."},
{id:"q363",m:"m3",t:"k",s:"Gallup's Q12 survey is best described as:",o:["A 360-degree feedback tool for executives","A customer satisfaction index","A personality assessment for hiring","Twelve items measuring manager-employee relationship factors most linked to engagement and performance"],a:3,e:"Q12 measures the elements great managing delivers: clarity, resources, opportunity to do best work, recognition, development, voice. It is a manager-effectiveness diagnostic, not a personality test."},
{id:"q364",m:"m3",t:"sj",s:"A team's Q12 scores are strong except for 'I have a best friend at work.' The manager asks HR what to do. The BEST advice is to:",o:["Assign everyone a mandatory work friend","Reorganize the team into pairs","Create low-pressure collaboration and social connection opportunities, without forcing friendships","Ignore it, since friendship cannot be managed"],a:2,e:"The 'best friend' item proxies for trusted connection at work. Managers can enable it through collaborative work, shared wins, and social rituals; forced pairing backfires."},
{id:"q365",m:"m3",t:"k",s:"Organizational justice research identifies three types of fairness. Interactional justice refers to:",o:["Fair distribution of pay and rewards","Fair processes for decision-making","Being treated with dignity and respect, with honest explanations","Equal headcount across departments"],a:3,e:"Distributive (fair outcomes), procedural (fair processes), interactional (respectful treatment and candid explanations). Interactional justice most strongly shapes reactions to bad news."},
{id:"q366",m:"m3",t:"sj",s:"After a round of layoffs, remaining employees describe the process as cold and secretive. To rebuild trust, HR should FIRST:",o:["Ensure transparent, respectful communication about the rationale, criteria, and support provided","Promise no future layoffs","Launch a new recognition program","Increase salaries for survivors"],a:0,e:"Survivor trust hinges on procedural justice (fair, consistent criteria) and interactional justice (honest, respectful explanation). Money and perks cannot substitute for perceived fairness."},
{id:"q367",m:"m3",t:"k",s:"The service-profit chain (Heskett and colleagues) proposes that:",o:["Profit drives employee satisfaction","Cost-cutting is the fastest path to loyalty","Employee satisfaction drives service value, which drives customer satisfaction, loyalty, and profit","Marketing matters more than operations"],a:2,e:"The chain: internal service quality to employees leads to satisfaction, which drives external service value, customer satisfaction and loyalty, then revenue growth and profit."},
{id:"q368",m:"m3",t:"sj",s:"The CFO questions the budget for engagement surveys and action planning. The STRONGEST business-case argument HR can make is to:",o:["Compare survey vendors","Cite national benchmark scores","Link the company's own engagement data to customer metrics, turnover costs, and productivity in a service-profit analysis","Threaten higher turnover"],a:2,e:"Executives fund what connects to money. Showing your own data linking engagement to retention costs, customer outcomes, and productivity (service-profit logic) beats benchmarks and warnings."},
{id:"q369",m:"m3",t:"k",s:"Employee Net Promoter Score (eNPS) is calculated as:",o:["Average rating across all survey items","Total promoters divided by total respondents","The percentage of promoters (9-10) minus the percentage of detractors (0-6) on the recommend-as-a-workplace question","Promoters plus passives minus detractors, divided by tenure"],a:2,e:"eNPS = % promoters (9-10) minus % detractors (0-6); passives (7-8) count in the base but not the score. It is a loyalty snapshot, not a full engagement measure."},
{id:"q370",m:"m3",t:"sj",s:"eNPS plunged the quarter after a return-to-office mandate. Before reacting, HR should:",o:["Blame the survey vendor","Average the score with last year's","Reverse the mandate immediately","Segment the data by role, tenure, and commute distance, and run focus groups to isolate the mandate's effect from other factors"],a:3,e:"A single score never diagnoses itself. Segment to find who dropped and why, then use qualitative data to separate the mandate's impact from confounding factors before acting."},
{id:"q371",m:"m3",t:"k",s:"An employee value proposition (EVP) is best defined as:",o:["The total package of rewards, opportunities, and culture offered in exchange for an employee's talent and effort","The benefits enrollment guide","A competitor's salary survey","The company's marketing slogan"],a:0,e:"The EVP is the deal: compensation, benefits, career growth, work environment, and purpose. A distinctive, truthful EVP attracts and retains; a generic or false one does neither."},
