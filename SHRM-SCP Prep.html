<script>
"use strict";
/* ============ STATE ============ */
const LSKEY='shrmScpPrepV1';
let S;
function loadState(){try{S=JSON.parse(localStorage.getItem(LSKEY))||null}catch(e){S=null}
if(!S)S={tasks:{},quizzes:[],cards:{},days:{},target:null};}
function save(){try{localStorage.setItem(LSKEY,JSON.stringify(S))}catch(e){}}
function todayStr(d){d=d||new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function touchDay(){const t=todayStr();if(!S.days[t]){S.days[t]=true;save();}}
function getStreak(){const days=Object.keys(S.days).sort();if(!days.length)return 0;let s=0;const d=new Date();
if(!S.days[todayStr(d)])d.setDate(d.getDate()-1);
while(S.days[todayStr(d)]){s++;d.setDate(d.getDate()-1);}return s;}
function getTarget(){if(!S.target){const d=new Date();d.setDate(d.getDate()+105);S.target=todayStr(d);save();}return S.target;}
function daysToExam(){const t=new Date(getTarget()+'T12:00:00');return Math.max(0,Math.ceil((t-new Date())/864e5));}
</script>

<script>
"use strict";
/* ============ PRACTICE QUESTIONS (t: sj=situational judgment, k=knowledge) ============ */
const QUESTIONS=[
/* ---- m1: Business Acumen & Strategic HR ---- */
{id:"q1",m:"m1",t:"sj",s:"A jewelry company's new CEO announces a cost-leadership strategy: win on price through operational efficiency. As the HR leader, which initiative BEST aligns HR with this strategy?",o:["Launch an employer-branding campaign positioning the company as a luxury workplace","Standardize job roles, tighten spans of control, and link incentives to productivity metrics","Add premium benefits like on-site concierge services to attract top talent","Create highly customized career paths for every employee"],a:1,e:"Cost leadership wins on efficiency. HR aligns by standardizing work, controlling labor costs, and tying rewards to productivity — not by adding premium perks."},
{id:"q2",m:"m1",t:"k",s:"In a SWOT analysis used for HR strategic planning, high turnover among skilled craftspeople would be classified as a:",o:["Strength","Weakness","Opportunity","Threat"],a:1,e:"SWOT: internal factors are Strengths/Weaknesses; external are Opportunities/Threats. Turnover of current staff is internal → Weakness."},
{id:"q3",m:"m1",t:"k",s:"Dave Ulrich's HR model describes four roles. Which role involves HR acting as a credible activist who shapes business strategy?",o:["Administrative expert","Employee champion","Strategic partner","Functional expert"],a:2,e:"The strategic partner role has HR contributing to business strategy formulation and aligning HR strategy with it — the credible-activist stance."},
{id:"q4",m:"m1",t:"sj",s:"The CFO asks HR to justify a proposed leadership development program. What is the MOST persuasive framing?",o:["'Our competitors all have one, so we need one too'","'It will improve engagement scores by an estimated 10%'","'It addresses our bench-strength gap for 3 critical roles and reduces external-hire costs of ~$75K per role'","'Employees have been asking for more training'"],a:2,e:"Business acumen means translating HR into financial/operational terms: risk covered (bench strength) and cost avoided. Executives fund business cases, not popularity."},
{id:"q5",m:"m1",t:"k",s:"A PESTLE analysis examining proposed changes to overtime regulations is focused on which factor?",o:["Political","Economic","Social","Technological"],a:0,e:"PESTLE: Political covers government policy, regulation, and legislation — including labor law changes."},
{id:"q6",m:"m1",t:"sj",s:"HR data shows the company's time-to-fill has risen 40% while revenue per employee is flat. The CEO wants answers at the board meeting tomorrow. What should HR do FIRST?",o:["Blame the tight labor market in the presentation","Pull the underlying data: which roles, stages, and sources are driving the increase","Announce a new signing bonus program","Hire an RPO vendor immediately"],a:1,e:"Evidence-based HR: diagnose before prescribing. Segment the data (by role, funnel stage, source) so the story and the fix are grounded in facts."},
{id:"q7",m:"m1",t:"k",s:"A company pursuing a differentiation strategy competes primarily on:",o:["The lowest prices in the market","Unique products, quality, or customer experience","Operating in the narrowest possible niche","Minimizing headcount"],a:1,e:"Porter's differentiation = winning through uniqueness/quality/brand rather than price. HR supports it via talent quality, innovation, and service culture."},
{id:"q8",m:"m1",t:"sj",s:"Two business units want conflicting things: Sales wants aggressive hiring bonuses; Finance wants a hiring freeze. As HR business partner, what is the BEST first step?",o:["Side with Finance since cost control always wins","Gather data on revenue impact of open sales roles vs. cost of bonuses, then facilitate a decision","Approve the bonuses to keep Sales happy","Escalate to the CEO without analysis"],a:1,e:"The strategic-partner role is integrative: bring data on both sides' business impact and facilitate a decision tied to company goals — not pick a side on politics."},
{id:"q9",m:"m1",t:"k",s:"Which of the following is an EXTERNAL factor in HR environmental scanning?",o:["Current employee skill gaps","Aging workforce demographics in the labor market","The company's compensation philosophy","Manager effectiveness scores"],a:1,e:"Environmental scanning looks outward: labor-market demographics, regulation, economic trends, competitor moves. Internal factors are the other three."},
/* ---- m2: Workforce Planning & Talent Acquisition ---- */
{id:"q10",m:"m2",t:"k",s:"Which selection method consistently shows the HIGHEST predictive validity for job performance?",o:["Unstructured interviews","Reference checks","Structured interviews and assessment centers","Years of experience"],a:2,e:"Research consistently finds structured interviews, work samples, and assessment centers most predictive. Unstructured interviews and years of experience are weak predictors."},
{id:"q11",m:"m2",t:"k",s:"The 4/5ths (80%) rule is used to assess:",o:["Pay equity between genders","Adverse impact in selection procedures","Whether a layoff triggers WARN","Overtime exemption status"],a:1,e:"Under the Uniform Guidelines (1978), a selection rate for a protected group below 80% of the highest group's rate signals adverse impact requiring validation."},
{id:"q12",m:"m2",t:"sj",s:"A hiring manager insists on hiring a candidate who 'just feels right' despite the structured interview panel ranking another candidate higher. What should HR do?",o:["Let the manager decide — hiring managers own the decision","Document the panel scores and coach the manager on structured process, validity, and bias risk","Report the manager to the EEOC","Restart the search"],a:1,e:"HR protects process integrity: structured scores exist to reduce bias and legal risk. Coach the manager, document, and hold the standard — that's the employee-champion + risk-manager role."},
{id:"q13",m:"m2",t:"k",s:"Reliability in employee selection refers to:",o:["Whether the test measures what it claims to measure","The consistency of measurement over time and across raters","Whether candidates like the test","Legal defensibility"],a:1,e:"Reliability = consistency. Validity = accuracy (measures what it claims). A test must be reliable to be valid, but reliability alone doesn't make it valid."},
{id:"q14",m:"m2",t:"k",s:"Which workforce forecasting technique uses historical internal movement patterns between job levels to predict future staffing?",o:["Delphi technique","Regression analysis","Markov (transitional matrix) analysis","Nominal group technique"],a:2,e:"Markov analysis applies historical transition probabilities (promotions, transfers, exits) to forecast internal supply. Delphi and nominal group are qualitative expert methods."},
{id:"q15",m:"m2",t:"sj",s:"A plant needs 20 assemblers in 60 days. The local labor market is tight. What is the BEST workforce strategy?",o:["Post the jobs and hope for applicants","Build a blended plan: temp-to-perm staffing, referral bonuses, community-college pipeline, and overtime coverage","Lower the hiring standards","Delay production"],a:1,e:"Tight markets require multi-channel sourcing plus contingent coverage. A blended plan addresses both immediate capacity and pipeline — hoping is not a strategy."},
{id:"q16",m:"m2",t:"k",s:"A realistic job preview (RJP) is primarily designed to:",o:["Sell candidates on the company's perks","Reduce early turnover by setting accurate expectations","Speed up the hiring process","Test technical skills"],a:1,e:"RJPs show the good AND the difficult parts of the job. Candidates who self-select out save the company early-turnover costs."},
{id:"q17",m:"m2",t:"sj",s:"An executive wants to skip reference checks for a senior hire 'to move fast.' The role handles company funds. What is the BEST response?",o:["Agree — speed matters for senior roles","Insist on checks plus a background screen, citing negligent-hiring risk for a fiduciary role","Do the checks secretly without telling the executive","Hire first, check later"],a:1,e:"Negligent hiring liability makes due diligence non-negotiable for roles with access to funds, vulnerable populations, or safety duties. HR must hold the line on risk."},
{id:"q18",m:"m2",t:"k",s:"Onboarding differs from orientation primarily in that onboarding:",o:["Happens on day one","Is a longer-term integration process focused on productivity and engagement","Only covers benefits enrollment","Is legally required"],a:1,e:"Orientation = day-one logistics. Onboarding = weeks-to-months process of integrating, clarifying expectations, and building connection — it predicts retention."},
/* ---- m3: Employee Engagement & Retention ---- */
{id:"q19",m:"m3",t:"k",s:"According to Herzberg's two-factor theory, which of the following is a MOTIVATOR (not a hygiene factor)?",o:["Company policy","Salary","Recognition and achievement","Working conditions"],a:2,e:"Herzberg: motivators (achievement, recognition, the work itself, growth) drive satisfaction; hygiene factors (pay, policy, conditions, supervision) only prevent dissatisfaction."},
{id:"q20",m:"m3",t:"k",s:"Turnover rate is calculated as:",o:["Total hires ÷ average headcount","Number of separations ÷ average headcount × 100","Open positions ÷ total positions","Voluntary quits ÷ involuntary terms"],a:1,e:"Turnover rate = separations during the period ÷ average headcount × 100. Track voluntary vs involuntary separately for diagnosis."},
{id:"q21",m:"m3",t:"sj",s:"Exit interviews show top performers are leaving for 'better growth opportunities.' Engagement scores are flat. What should HR do FIRST?",o:["Increase pay across the board","Conduct stay interviews with current top performers to learn what would keep them","Launch an engagement survey","Offer retention bonuses"],a:1,e:"Stay interviews with the people you want to keep give forward-looking, actionable data. Don't prescribe (raises, bonuses) before diagnosing what 'growth' means to them."},
{id:"q22",m:"m3",t:"k",s:"Vroom's expectancy theory says motivation is highest when:",o:["Rewards are equal for everyone","Employees believe effort → performance → valued rewards (expectancy × instrumentality × valence)","Jobs are simplified","Managers set all the goals"],a:1,e:"Expectancy theory: Motivation = Expectancy × Instrumentality × Valence. If any factor is zero, motivation collapses — all three links must hold."},
{id:"q23",m:"m3",t:"k",s:"Dysfunctional turnover refers to:",o:["Layoffs during restructuring","The departure of high performers the company wanted to keep","Firing poor performers","Seasonal staffing changes"],a:1,e:"Functional turnover = losing low performers (can be healthy). Dysfunctional = losing valued talent you wanted to retain — the costly kind."},
{id:"q24",m:"m3",t:"sj",s:"A manager with the highest engagement scores in the company is leaving. Her team is devastated. What is HR's BEST immediate move?",o:["Tell the team to get over it","Work with leadership on a transition plan, identify flight risks on the team, and conduct stay interviews","Immediately promote someone from the team","Offer the manager more money to stay"],a:1,e:"High-engagement teams often follow their leader out the door. HR's job: stabilize, assess flight risk, and retain the team — not just react to the departure."},
{id:"q25",m:"m3",t:"k",s:"Which is the STRONGEST driver of employee engagement across most research?",o:["Free snacks","The quality of the direct manager relationship","Company holiday parties","Job title"],a:1,e:"Decades of research (Gallup et al.) converge: the direct manager accounts for the majority of variance in engagement. Everything else is secondary."},
{id:"q26",m:"m3",t:"sj",s:"An engagement survey shows 'I have opportunities to learn and grow' as the lowest score, especially among employees with 2–3 years tenure. What is the BEST targeted response?",o:["A company-wide pizza party","Build clear career paths, internal mobility practices, and development plans for the 2–3 year cohort","Send everyone to a conference","Ignore it — scores fluctuate"],a:1,e:"Target the diagnosed gap in the affected cohort: career paths + internal mobility + development planning address 'growth' directly. Generic perks don't."},
];
</script>
<script>
"use strict";
/* ---- m4: Learning & Development ---- */
QUESTIONS.push(
{id:"q27",m:"m4",t:"k",s:"In Kirkpatrick's model, measuring whether training changed on-the-job behavior is which level?",o:["Level 1 – Reaction","Level 2 – Learning","Level 3 – Behavior","Level 4 – Results"],a:2,e:"Kirkpatrick: L1 Reaction (did they like it), L2 Learning (did knowledge increase), L3 Behavior (did behavior change on the job), L4 Results (business impact). Phillips added L5 ROI."},
{id:"q28",m:"m4",t:"k",s:"The ADDIE model is a framework for:",o:["Performance appraisals","Instructional design: Analysis, Design, Development, Implementation, Evaluation","Conflict resolution","Succession planning"],a:1,e:"ADDIE = Analysis, Design, Development, Implementation, Evaluation — the classic systematic training design model."},
{id:"q29",m:"m4",t:"sj",s:"A safety training program gets great smile sheets (Level 1) but incidents don't drop. What is the BEST next step?",o:["Run the same training again","Evaluate Levels 2 and 3: test whether learning occurred and whether behavior changed on the floor","Cancel the program","Blame the supervisors"],a:1,e:"High reaction scores with no behavior change means the transfer failed. Diagnose L2 (learning) and L3 (behavior/application barriers) before redesigning."},
{id:"q30",m:"m4",t:"k",s:"The 70-20-10 model of learning holds that roughly 70% of development comes from:",o:["Formal classroom training","On-the-job experiences and challenging assignments","Mentoring and coaching","E-learning modules"],a:1,e:"70-20-10: ~70% from on-the-job experience, ~20% from relationships/feedback, ~10% from formal training. Development plans should weight accordingly."},
{id:"q31",m:"m4",t:"k",s:"A needs assessment conducted at the organizational level primarily examines:",o:["Individual skill gaps","Whether training aligns with strategy and where the organization needs capability","Specific task requirements","Trainer qualifications"],a:1,e:"Three levels: organizational (strategic alignment, where capability is needed), task (what the job requires), individual (who needs what)."},
{id:"q32",m:"m4",t:"sj",s:"A manager asks HR to 'send my whole team to communication training' after one conflict. What should HR do FIRST?",o:["Book the training","Conduct a needs assessment to determine whether training is the right solution","Refuse — managers shouldn't request training","Send only the two people involved"],a:1,e:"Training is a solution in search of a problem until a needs assessment confirms a skill gap. The conflict may be structural, not skill-based."},
{id:"q33",m:"m4",t:"k",s:"Coaching differs from mentoring in that coaching is typically:",o:["Long-term and career-focused","Short-term, performance-focused, and often done by the direct manager","Only for executives","Unstructured"],a:1,e:"Coaching = shorter-term, performance/goal-focused, often by the manager (GROW model). Mentoring = longer-term, career-development, usually outside the chain."},
{id:"q34",m:"m4",t:"sj",s:"To prove a leadership program's financial value to the CFO, which evaluation approach is MOST appropriate?",o:["Participant satisfaction scores","Phillips ROI methodology (Level 5) — isolating program effects and converting to money","Counting training hours delivered","Manager testimonials"],a:1,e:"Phillips Level 5 isolates the program's effect, converts improvements to monetary value, and compares to costs — the language CFOs trust."},
/* ---- m5: Total Rewards ---- */
{id:"q35",m:"m5",t:"k",s:"Compa-ratio is calculated as:",o:["Maximum ÷ minimum of the pay range","Actual pay ÷ pay-range midpoint","Market rate ÷ actual pay","Bonus ÷ base pay"],a:1,e:"Compa-ratio = employee's pay ÷ midpoint of the range. Below 1.0 = paid under midpoint; above 1.0 = above midpoint. It diagnoses pay positioning."},
{id:"q36",m:"m5",t:"k",s:"A company that sets pay above market rates to attract top talent is using which pay-level strategy?",o:["Lag the market","Match the market","Lead the market","Broadbanding"],a:2,e:"Lead/lag/match: lead = pay above market (attract top talent, higher cost); lag = below (cost control); match = at market."},
{id:"q37",m:"m5",t:"sj",s:"Analysis shows women in the same roles are clustered in the lower quartiles of pay ranges. What should HR do FIRST?",o:["Give everyone an immediate raise","Conduct a privileged pay-equity audit to identify unexplained gaps and remediate","Wait for someone to complain","Blame prior salary history"],a:1,e:"A privileged pay-equity audit (often under attorney direction) identifies unexplained gaps by gender/race after controlling for legitimate factors — then remediate. Acting without analysis risks missteps."},
{id:"q38",m:"m5",t:"k",s:"Which job evaluation method assigns points to compensable factors (skill, effort, responsibility, working conditions)?",o:["Ranking","Classification","Point-factor method","Market pricing"],a:2,e:"Point-factor: break jobs into compensable factors, weight them, assign points, total the points → job worth. Most analytical of the methods."},
{id:"q39",m:"m5",t:"k",s:"A defined-benefit retirement plan differs from a defined-contribution (401(k)) plan in that:",o:["The employer bears the investment risk and promises a formula-based payout","Employees choose all investments","There is no employer involvement","Benefits depend solely on market returns"],a:0,e:"Defined benefit (pension): employer funds and guarantees a formula benefit, bearing investment risk. Defined contribution (401(k)): benefit depends on contributions + market returns; risk is the employee's."},
{id:"q40",m:"m5",t:"k",s:"Section 125 cafeteria plans allow employees to:",o:["Choose their manager","Pay for benefits with pre-tax dollars","Retire early","Avoid all payroll taxes including Social Security"],a:1,e:"Cafeteria/flexible-benefit plans let employees choose among benefits and pay premiums pre-tax (reducing income tax; Social Security/Medicare still apply to some)."},
{id:"q41",m:"m5",t:"sj",s:"A star performer threatens to quit unless matched to an outside offer 20% above range maximum. What is the BEST HR guidance?",o:["Match it immediately — stars are irreplaceable","Analyze internal equity impact, market data, and alternatives (retention bonus, promotion, development) before deciding","Let them quit","Match it secretly"],a:1,e:"Above-range matches create compression and equity problems. HR should weigh market data, internal equity, and creative alternatives — not reflexively break the structure."},
{id:"q42",m:"m5",t:"k",s:"Broadbanding in compensation means:",o:["Paying everyone the same","Collapsing many narrow grades into fewer, wider pay bands","Basing pay only on seniority","Eliminating bonuses"],a:1,e:"Broadbanding consolidates grades into wide bands, supporting flatter, flexible organizations and lateral career growth."},
{id:"q43",m:"m5",t:"k",s:"ERISA primarily governs:",o:["Workplace safety standards","Private-sector employee benefit plans — reporting, fiduciary duties, and participant rights","Minimum wage","Union elections"],a:1,e:"ERISA sets standards for private retirement and health plans: fiduciary responsibility, reporting/disclosure, vesting, and participant protections."},
/* ---- m6: Employee & Labor Relations ---- */
{id:"q44",m:"m6",t:"k",s:"The correct order of progressive discipline is typically:",o:["Termination → suspension → written warning → verbal warning","Verbal warning → written warning → suspension → termination","Written warning → verbal warning → termination","Suspension → verbal warning → termination"],a:1,e:"Progressive discipline escalates: verbal counseling → written warning → suspension (or final warning) → termination, with documentation at each step."},
{id:"q45",m:"m6",t:"k",s:"NLRA Section 7 protects employees' rights to:",o:["A minimum wage","Engage in concerted activity, including union organizing — union and non-union alike","Unlimited break time","Choose their shifts"],a:1,e:"Section 7 covers concerted activity for mutual aid and protection — it applies in non-union workplaces too, including discussions of wages and conditions."},
{id:"q46",m:"m6",t:"sj",s:"A supervisor learns employees are discussing unionization and wants to hold a meeting telling them the plant will close if they unionize. What must HR do?",o:["Allow it — supervisors can share opinions","Stop it — threats of closure are an 8(a)(1) unfair labor practice; coach on lawful TIPS/FORE rules","Do nothing","Fire the organizers"],a:1,e:"Threats (the 'T' in TIPS: no Threats, Interrogation, Promises, Surveillance) violate 8(a)(1). Lawful employer speech covers Facts, Opinions, Rules, Experience (FORE)."},
{id:"q47",m:"m6",t:"k",s:"To petition the NLRB for a union election, organizers need authorization cards from at least:",o:["10% of employees","30% of employees in the bargaining unit","50% + 1","100%"],a:1,e:"30% showing of interest triggers an NLRB election petition; the union must then win 50%+1 of votes cast to be certified."},
{id:"q48",m:"m6",t:"k",s:"Which is a MANDATORY subject of collective bargaining?",o:["The company's advertising strategy","Wages, hours, and other terms and conditions of employment","Choice of company logo","Executive succession plans"],a:1,e:"Mandatory subjects = wages, hours, and terms/conditions of employment — the employer must bargain in good faith over these. Permissive subjects are optional."},
{id:"q49",m:"m6",t:"sj",s:"An employee files a grievance claiming unjust termination under the collective bargaining agreement. The grievance procedure is exhausted without resolution. What is the typical FINAL step?",o:["The employee sues in federal court","Binding arbitration by a neutral arbitrator","HR decides unilaterally","The union strikes"],a:1,e:"Most CBAs end the grievance procedure with binding arbitration — a neutral arbitrator's decision is final. That's the bargained alternative to strikes/lockouts."},
{id:"q50",m:"m6",t:"k",s:"Weingarten rights give union employees the right to:",o:["Strike at any time","Union representation during investigatory interviews they reasonably believe may lead to discipline","Refuse all overtime","Record all meetings"],a:1,e:"Weingarten (1975): union employees may request a steward's presence at investigatory interviews where discipline could result. The employee must request it."},
{id:"q51",m:"m6",t:"sj",s:"During a workplace investigation into harassment, the accused demands to know who complained. What is the BEST practice?",o:["Name the complainant — the accused has a right to know","Protect confidentiality to the extent possible while conducting a thorough, impartial investigation","Refuse to investigate without naming names","Delay the investigation"],a:1,e:"Promise confidentiality 'to the extent possible' — not absolute — since a fair investigation may require limited disclosure. Never condition the investigation on waiving it."},
{id:"q52",m:"m6",t:"k",s:"Employment-at-will means either party may end employment at any time, EXCEPT as limited by:",o:["Nothing — it is absolute","Statutes, contracts, collective bargaining agreements, and public-policy / implied-contract exceptions","Only federal law","Only written contracts"],a:1,e:"At-will is the default in 49 states (not Montana), but it's constrained by anti-discrimination statutes, contracts/CBAs, and common-law exceptions (public policy, implied contract, good faith)."},
);
</script>
<script>
"use strict";
/* ---- m7: US Employment Law ---- */
QUESTIONS.push(
{id:"q53",m:"m7",t:"k",s:"Title VII of the Civil Rights Act of 1964 applies to employers with:",o:["1 or more employees","15 or more employees","50 or more employees","100 or more employees"],a:1,e:"Title VII (race, color, religion, sex, national origin) covers employers with 15+ employees. ADEA uses 20+; FMLA/WARN use 50/100."},
{id:"q54",m:"m7",t:"k",s:"The Americans with Disabilities Act requires reasonable accommodation unless it causes:",o:["Any cost at all","Undue hardship — significant difficulty or expense","Manager inconvenience","Schedule changes"],a:1,e:"ADA: accommodate qualified individuals with disabilities unless it causes undue hardship (significant difficulty/expense relative to the operation). Interactive process required."},
{id:"q55",m:"m7",t:"k",s:"Disparate treatment differs from disparate impact in that disparate treatment requires:",o:["A statistical showing only","Proof of discriminatory intent","A policy that is neutral on its face","No comparator"],a:1,e:"Disparate treatment = intentional discrimination (McDonnell Douglas burden-shifting). Disparate impact = neutral policy with discriminatory effect (Griggs; business necessity defense)."},
{id:"q56",m:"m7",t:"sj",s:"A hiring manager rejects a qualified applicant because 'our customers prefer younger staff.' What is this?",o:["A valid BFOQ","Lawful customer preference","Disparate treatment based on age — unlawful under the ADEA","Acceptable if the customers are important"],a:2,e:"Customer preference is never a BFOQ (BFOQs are extremely narrow: authenticity, privacy, safety). Age discrimination against 40+ workers violates the ADEA."},
{id:"q57",m:"m7",t:"k",s:"FMLA provides eligible employees up to 12 weeks of unpaid leave when the employer has:",o:["15+ employees","50+ employees within 75 miles","100+ employees","Any size, if the employee requests it"],a:1,e:"FMLA: 50+ employees (within 75 miles), employee needs 12 months tenure + 1,250 hours. Job restoration and benefits continuation required."},
{id:"q58",m:"m7",t:"k",s:"Under the FLSA, which is REQUIRED for a non-exempt employee?",o:["A written contract","Overtime at 1.5× the regular rate for hours over 40/week","Paid lunch breaks","Severance pay"],a:1,e:"FLSA core: federal minimum wage + overtime at 1.5× for non-exempt hours over 40/week. Breaks, severance, and contracts are not FLSA mandates."},
{id:"q59",m:"m7",t:"sj",s:"An employee tells HR her supervisor demanded sexual favors for a promotion. What must HR do FIRST?",o:["Ask if she is sure","Immediately begin a prompt, thorough, impartial investigation and protect against retaliation","Transfer her to another department","Wait for a written complaint"],a:1,e:"Quid pro quo harassment: HR must act immediately — investigate promptly and impartially, stop the behavior, prevent retaliation. Never require a written complaint first."},
{id:"q60",m:"m7",t:"k",s:"The WARN Act generally requires 60 days' notice for plant closings/mass layoffs by employers with:",o:["15+ employees","50+ employees","100+ full-time employees","500+ employees"],a:2,e:"WARN: 100+ full-time employees; 60 days' notice for plant closings or mass layoffs (thresholds: 50+ at a site, or 500 total)."},
{id:"q61",m:"m7",t:"k",s:"COBRA continuation coverage applies to group health plans of employers with:",o:["2+ employees","20+ employees","50+ employees","100+ employees"],a:1,e:"COBRA: 20+ employees; qualified beneficiaries may continue coverage (typically 18 months, up to 36 for certain events), paying the full premium + 2%."},
{id:"q62",m:"m7",t:"sj",s:"A manager wants to ask a candidate about childcare arrangements 'to gauge availability.' What should HR advise?",o:["It's fine if asked of all candidates","Do not ask — it risks Title VII (sex/caregiver) and PDA issues; ask about availability for the job's requirements instead","Only ask women","Ask after the offer"],a:1,e:"Childcare questions invite sex-stereotyping claims. Ask job-related availability questions of everyone ('this role requires X schedule — can you meet it?') instead."},
/* ---- m8: Risk Management, Safety & Security ---- */
{id:"q63",m:"m8",t:"k",s:"OSHA's 'general duty clause' requires employers to:",o:["Provide free lunches","Furnish a workplace free from recognized hazards","Hire a safety manager","Report all injuries to the media"],a:1,e:"OSH Act Section 5(a)(1): employers must keep the workplace free of recognized hazards likely to cause death or serious harm — even without a specific standard."},
{id:"q64",m:"m8",t:"k",s:"Workers' compensation is generally the 'exclusive remedy' for workplace injuries, meaning:",o:["Employees cannot also sue the employer in tort for the same injury","Employers never pay anything","Only managers are covered","It covers commuting accidents"],a:0,e:"The grand bargain: employees get no-fault benefits without proving negligence, and employers are shielded from tort suits for covered injuries (with narrow exceptions)."},
{id:"q65",m:"m8",t:"sj",s:"A delivery driver with a DUI history is hired without a driving-record check and later injures a pedestrian on route. The company's GREATEST liability exposure is:",o:["The driver's personal insurance","Negligent hiring — failure to conduct a reasonable background check for a safety-sensitive role","OSHA fines","The pedestrian's fault"],a:1,e:"Negligent hiring: employers must exercise reasonable care in screening, especially for safety-sensitive roles. Skipping a driving check for a driver is textbook exposure."},
{id:"q66",m:"m8",t:"k",s:"Which is the BEST first step in a workplace violence prevention program?",o:["Install metal detectors","A written policy, threat-reporting procedure, and training on warning signs","Armed guards","Banning all visitors"],a:1,e:"Prevention starts with policy + reporting channels + training to recognize warning signs. Physical measures supplement, not replace, the program."},
{id:"q67",m:"m8",t:"sj",s:"IT flags that a departing employee downloaded large amounts of HR data. What should HR do FIRST?",o:["Confront the employee publicly","Coordinate with IT/legal: preserve evidence, revoke access, and follow the incident-response plan","Ignore it — they're leaving anyway","Delete their email"],a:1,e:"Data incidents need coordinated response: preserve forensic evidence, cut access, involve legal before confrontation. HR partners with IT/security — never freelances."},
{id:"q68",m:"m8",t:"k",s:"An employer's ability to monitor employee emails on company systems generally rests on:",o:["No legal basis — it's always illegal","A clearly communicated policy with no expectation of privacy, subject to state-law limits","The manager's discretion","Union approval only"],a:1,e:"Monitoring is generally lawful on company systems with a clear, acknowledged policy eliminating expectation of privacy — but state laws (e.g., notice requirements) vary."},
{id:"q69",m:"m8",t:"k",s:"E-discovery in litigation may require HR to:",o:["Delete old emails","Implement a litigation hold preserving relevant records","Refuse to produce documents","Shred performance files"],a:1,e:"Once litigation is reasonably anticipated, HR must issue a litigation hold suspending routine destruction of relevant records — spoliation brings sanctions."},
{id:"q70",m:"m8",t:"sj",s:"After a minor warehouse injury, the supervisor wants to avoid an OSHA recordable by sending the worker home without treatment. What should HR do?",o:["Agree — fewer recordables look better","Ensure proper medical evaluation and accurate OSHA 300 logging; never suppress reporting","Let the supervisor decide","Wait a week to see"],a:1,e:"Suppressing recordables is unlawful and hides hazards. Accurate OSHA 300 logs are legal obligations — and the data drives prevention."},
/* ---- m9: HR Technology, Analytics & Metrics ---- */
{id:"q71",m:"m9",t:"k",s:"Human capital ROI is best described as:",o:["Total payroll cost","Revenue minus operating expenses, divided by total compensation cost","Number of employees ÷ revenue","Training hours per employee"],a:1,e:"HC ROI = (Revenue − Operating Expenses) ÷ Total Compensation. It frames workforce cost against value created — the metric executives respect."},
{id:"q72",m:"m9",t:"k",s:"Cost per hire is calculated as:",o:["Total recruiting costs ÷ number of hires","Total payroll ÷ headcount","Agency fees only","Advertising spend ÷ applicants"],a:0,e:"Cost per hire = all recruiting costs (internal + external: advertising, agency, recruiter time, onboarding) ÷ hires. Include internal costs or it misleads."},
{id:"q73",m:"m9",t:"sj",s:"The CEO says 'our engagement survey scores went up, so productivity must be up.' Engagement rose 5 points; revenue per employee is flat. What is HR's BEST response?",o:["Agree — engagement drives everything","Show the data honestly: engagement improved but hasn't translated to productivity yet; investigate the disconnect","Stop measuring engagement","Change the survey"],a:1,e:"Evidence-based HR means reporting what the data actually says — including inconvenient disconnects — then diagnosing. Credibility beats comfort."},
{id:"q74",m:"m9",t:"k",s:"Which metric BEST measures recruiting efficiency (speed)?",o:["Cost per hire","Time to fill — days from requisition approval to offer acceptance","Turnover rate","Offer acceptance rate"],a:1,e:"Time to fill = speed (requisition to acceptance). Cost per hire = efficiency of spend. Quality of hire = effectiveness. Don't confuse them."},
{id:"q75",m:"m9",t:"k",s:"When selecting an HRIS, the MOST important first step is:",o:["Picking the vendor with the best demo","Documenting business requirements and must-have functionality","Negotiating price","Asking IT to decide"],a:1,e:"Requirements first: map processes, must-haves, integrations, and compliance needs — then evaluate vendors against them. Demo-led buying causes misfits."},
{id:"q76",m:"m9",t:"sj",s:"HR wants to use AI screening to speed hiring. What is the CRITICAL compliance step before launch?",o:["None — AI is exempt from employment law","Validate for adverse impact (4/5ths rule) and ensure human oversight of decisions","Announce it on social media","Use it only for senior roles"],a:1,e:"AI selection tools are selection procedures under the Uniform Guidelines: validate for adverse impact, monitor ongoing, keep human oversight. EEOC guidance is explicit here."},
{id:"q77",m:"m9",t:"k",s:"A balanced scorecard evaluates organizational performance across four perspectives:",o:["Financial, customer, internal process, learning & growth","Sales, marketing, HR, IT","Short-term, long-term, domestic, global","Cost, quality, speed, morale"],a:0,e:"Kaplan & Norton's balanced scorecard: Financial, Customer, Internal Business Processes, Learning & Growth — HR metrics should map to these."},
{id:"q78",m:"m9",t:"sj",s:"Two departments report wildly different turnover rates, but one includes internal transfers as 'separations.' What should HR do?",o:["Publish both as-is","Standardize metric definitions and data sources before reporting or acting","Use the lower number","Exclude that department"],a:1,e:"Metrics are meaningless without consistent definitions. Standardize what counts (transfers ≠ separations) before the numbers drive decisions."},
);
</script>
<script>
"use strict";
/* ---- m10: Organizational Effectiveness & Development ---- */
QUESTIONS.push(
{id:"q79",m:"m10",t:"k",s:"Lewin's three-stage change model is:",o:["Plan–Do–Check–Act","Unfreeze – Change (move) – Refreeze","Forming–Storming–Norming–Performing","Initiate–Plan–Execute–Close"],a:1,e:"Lewin: unfreeze (create urgency, loosen old ways), change/move (implement), refreeze (anchor new behaviors in culture). Kotter's 8 steps expand on this."},
{id:"q80",m:"m10",t:"k",s:"In Kotter's 8-step change model, the FIRST step is:",o:["Generate short-term wins","Create a sense of urgency","Form a guiding coalition","Anchor changes in culture"],a:1,e:"Kotter step 1: establish urgency. Without it, guiding coalitions never form and change efforts stall — a classic exam trap (don't start with the vision)."},
{id:"q81",m:"m10",t:"sj",s:"A merger is announced. Rumors are rampant and key talent is nervous. As HR lead, what is the BEST immediate action?",o:["Wait for details before communicating","Communicate honestly and frequently — what is known, unknown, and when updates come — and equip managers to answer questions","Promise no layoffs","Announce new org charts immediately"],a:1,e:"In uncertainty, frequent honest communication (including 'we don't know yet, here's when we'll update') beats silence. Equip managers — they're the trusted channel."},
{id:"q82",m:"m10",t:"k",s:"The 9-box grid plots employees on which two dimensions?",o:["Tenure vs salary","Performance vs potential","Engagement vs satisfaction","Age vs experience"],a:1,e:"9-box: current performance (x-axis) × future potential (y-axis). It drives succession, development, and talent-review conversations."},
{id:"q83",m:"m10",t:"k",s:"In the Thomas-Kilmann conflict model, 'collaborating' is:",o:["High assertiveness + high cooperativeness — win/win problem solving","Avoiding the issue","Giving in to the other party","Splitting the difference"],a:0,e:"Thomas-Kilmann: collaborating (assertive + cooperative) seeks win/win. Best for complex, high-stakes issues; overkill for trivial ones (use avoiding/compromising there)."},
{id:"q84",m:"m10",t:"sj",s:"Two high-performing departments constantly clash over shared resources. What is the BEST structural fix HR can recommend?",o:["Tell them to get along","Clarify decision rights, shared goals, and escalation paths — then facilitate joint problem-solving","Reorganize immediately","Fire one department head"],a:1,e:"Recurring intergroup conflict is usually structural (unclear ownership, competing incentives). Fix decision rights and shared goals before coaching individuals."},
{id:"q85",m:"m10",t:"k",s:"Management by Objectives (MBO) is characterized by:",o:["Managers setting all goals unilaterally","Jointly set, measurable goals cascaded from organizational objectives","Ranking employees against each other","Annual ratings with no discussion"],a:1,e:"MBO (Drucker): manager + employee jointly set SMART goals aligned to org objectives; progress reviewed periodically. Participation drives commitment."},
{id:"q86",m:"m10",t:"k",s:"Calibration sessions in performance management are designed to:",o:["Train managers on software","Align ratings across managers to reduce bias and inconsistency","Eliminate ratings entirely","Speed up review writing"],a:1,e:"Calibration brings managers together to compare and justify ratings against common standards — fighting leniency, central tendency, and inconsistency."},
{id:"q87",m:"m10",t:"sj",s:"A new HRIS-driven reorg will eliminate several layers. Middle managers are resisting. Which change tactic is MOST effective?",o:["Announce it as a done deal","Involve affected managers early in design, address WIIFM concerns, and provide transition support","Threaten termination","Delay indefinitely"],a:1,e:"ADKAR/Kotter: involvement + addressing 'what's in it for me' + support beats mandates. Resistance is data — engage it early."},
/* ---- m11: Global Workforce, DEI & CSR ---- */
{id:"q88",m:"m11",t:"k",s:"The balance-sheet approach to expatriate compensation aims to:",o:["Pay expats the local market rate only","Keep the expat whole — maintaining home-country purchasing power plus incentives","Minimize all costs","Pay in cryptocurrency"],a:1,e:"Balance sheet: home-country base + cost-of-living, housing, hardship differentials + incentives so the expat is 'kept whole' versus staying home."},
{id:"q89",m:"m11",t:"k",s:"A third-country national (TCN) is:",o:["An employee working in their home country","An expatriate who is a citizen of neither the home nor host country","A remote worker","A contractor"],a:1,e:"TCN = citizen of a third country working in the host country (e.g., a Brazilian working for a US firm in Germany). Distinct from parent-country and host-country nationals."},
{id:"q90",m:"m11",t:"k",s:"Hofstede's 'power distance' dimension describes:",o:["Geographic distance between offices","The extent to which less powerful members accept unequal power distribution","Internet bandwidth","Pay gaps"],a:1,e:"Power distance: high-PD cultures accept hierarchy and defer to authority; low-PD cultures expect participation. It shapes feedback, decision-making, and leadership style."},
{id:"q91",m:"m11",t:"sj",s:"A US manager's direct feedback style is offending team members in a high-context, high-power-distance culture. What should HR coach?",o:["Tell the team to adapt to US style","Coach the manager to adapt delivery — indirect feedback, private settings, respect for hierarchy — while keeping standards clear","Remove the manager","Ignore cultural differences"],a:1,e:"Global mindset: adapt style to cultural context without lowering standards. Private, face-saving feedback works in high-PD/high-context cultures."},
{id:"q92",m:"m11",t:"k",s:"Equity differs from equality in DEI work because equity means:",o:["Treating everyone identically","Providing resources based on need to achieve fair outcomes","Hiring quotas","Ignoring differences"],a:1,e:"Equality = same treatment. Equity = fair treatment accounting for different needs/circumstances. Inclusion = feeling of belonging; diversity = representation."},
{id:"q93",m:"m11",t:"k",s:"The 'triple bottom line' measures organizational success across:",o:["Revenue, profit, growth","People, planet, profit (social, environmental, financial)","HR, finance, operations","Short, medium, long term"],a:1,e:"Triple bottom line: social (people), environmental (planet), financial (profit) — the foundation of CSR/ESG thinking."},
{id:"q94",m:"m11",t:"sj",s:"Leadership wants a DEI dashboard. Which metrics BEST show progress?",o:["Number of diversity posters","Representation at each level, promotion/attrition rates by group, inclusion survey scores, pay equity results","Training hours completed","Social media likes"],a:1,e:"Measure outcomes, not activity: pipeline representation, differential promotion/attrition, belonging scores, and pay equity — the metrics that reveal real inclusion."},
{id:"q95",m:"m11",t:"k",s:"Which factor MOST predicts expatriate assignment success?",o:["Technical skills","Spouse/partner and family adjustment","Language fluency","Salary level"],a:1,e:"Research is consistent: family/spouse maladjustment is the top cause of early returns. Selection and support must include the family."},
/* ---- m12: Leadership, Ethics & Professional Practice ---- */
{id:"q96",m:"m12",t:"k",s:"Hersey-Blanchard situational leadership says the leader should:",o:["Always be democratic","Match directing/coaching/supporting/delegating style to the follower's competence and commitment","Use one style consistently","Avoid delegating"],a:1,e:"Situational leadership: diagnose development level (competence × commitment) and flex style — directing (S1) → coaching (S2) → supporting (S3) → delegating (S4)."},
{id:"q97",m:"m12",t:"k",s:"The SHRM Code of Ethics is built on core principles including:",o:["Profit maximization","Professional responsibility, ethical leadership, fairness and justice, and stewardship","Loyalty to the CEO only","Avoiding all terminations"],a:1,e:"SHRM Code: professional responsibility, ethical leadership, fairness & justice, conflicts of interest, use of information, etc. — HR as ethical steward."},
{id:"q98",m:"m12",t:"sj",s:"The CEO asks HR to backdate a termination to avoid paying a bonus. What should HR do?",o:["Comply — the CEO outranks HR","Refuse, explain the legal/ethical exposure, and propose lawful alternatives","Do it quietly","Resign on the spot"],a:1,e:"Ethical practice: refuse to facilitate wrongdoing, name the exposure plainly (wage claims, retaliation risk), and offer a lawful path. Courage is the competency being tested."},
{id:"q99",m:"m12",t:"k",s:"Which leadership style is MOST effective in a crisis requiring fast, coordinated action?",o:["Laissez-faire","Authoritative/directive — clear direction with confidence","Consensus-seeking","Avoidant"],a:1,e:"Crises call for directive leadership: clear decisions, communicated confidently. Participative styles fit stable, complex problems — not emergencies."},
{id:"q100",m:"m12",t:"sj",s:"HR discovers a payroll error that overpaid dozens of employees for months. What is the BEST first step?",o:["Quietly fix it going forward and say nothing","Quantify the scope, consult legal on recovery rules (state laws vary), then communicate transparently with a correction plan","Deduct it all from next paychecks immediately","Blame payroll"],a:1,e:"Diagnose scope first, check wage-deduction laws (many states restrict recovery), then transparent communication with a fair correction plan. Surprise deductions destroy trust and may be illegal."},
{id:"q101",m:"m12",t:"k",s:"Evidence-based management in HR means:",o:["Doing what competitors do","Making decisions using the best available scientific evidence, organizational data, and professional judgment","Following gut instinct","Avoiding all metrics"],a:1,e:"Evidence-based HR: integrate research evidence + internal data + stakeholder values + professional expertise. 'Best practice' copying without evidence is the trap."},
{id:"q102",m:"m12",t:"sj",s:"A high-performing manager is beloved by the team but has two substantiated bullying complaints. Leadership wants to promote him anyway. What is HR's BEST move?",o:["Support the promotion — performance is what counts","Present the pattern, legal/reputational risk, and cultural cost; recommend against promotion until behavior is addressed","Stay silent","Promote him with a warning"],a:1,e:"HR's ethical duty: surface the pattern and its risks (liability, culture, retention) plainly. Promoting known bullies signals that behavior is acceptable."},
{id:"q103",m:"m12",t:"k",s:"A mentor relationship is MOST valuable for:",o:["Day-to-day task instruction","Long-term career development, perspective, and navigating organizational politics","Disciplinary action","Technical certification"],a:1,e:"Mentoring = longer-term development relationship focused on career growth, wisdom, and navigation — distinct from coaching's performance focus."},
{id:"q104",m:"m12",t:"sj",s:"During due diligence for an acquisition, HR's MOST critical contribution is:",o:["Planning the celebration party","Assessing culture fit, talent risks, benefits/compensation liabilities, and labor obligations","Ordering new business cards","Announcing the deal to staff"],a:1,e:"HR due diligence: culture compatibility, key-talent retention risk, comp/benefit plan liabilities, union contracts, pending litigation — the people risks that sink deals."},
);
</script>
<script>
"use strict";
/* ============ FLASHCARDS ============ */
const FLASHCARDS=[
/* m1 */{id:"f1",m:"m1",front:"Porter's three generic strategies",back:"Cost leadership (win on price/efficiency), Differentiation (win on uniqueness/quality), Focus (win in a narrow segment). HR aligns differently to each."},
{id:"f2",m:"m1",front:"SWOT: internal vs external",back:"Internal: Strengths, Weaknesses. External: Opportunities, Threats. Turnover of current staff = internal Weakness."},
{id:"f3",m:"m1",front:"Ulrich's four HR roles",back:"Strategic partner, Change agent, Administrative expert, Employee champion. (Later evolved: credible activist, etc.)"},
{id:"f4",m:"m1",front:"PESTLE factors",back:"Political, Economic, Social, Technological, Legal, Environmental — external scanning for HR planning."},
/* m2 */{id:"f5",m:"m2",front:"4/5ths (80%) rule",back:"If a protected group's selection rate is < 80% of the highest group's rate → adverse impact. From the Uniform Guidelines (1978)."},
{id:"f6",m:"m2",front:"Reliability vs validity",back:"Reliability = consistency of measurement. Validity = measures what it claims. Must be reliable to be valid."},
{id:"f7",m:"m2",front:"Highest-validity selection methods",back:"Structured interviews, work samples, assessment centers, cognitive ability tests. Weakest: unstructured interviews, years of experience."},
{id:"f8",m:"m2",front:"Markov analysis",back:"Workforce forecasting using historical transition probabilities (promotions, transfers, exits) between job levels."},
/* m3 */{id:"f9",m:"m3",front:"Herzberg: motivators vs hygiene",back:"Motivators (satisfaction): achievement, recognition, work itself, growth. Hygiene (dissatisfaction prevention): pay, policy, conditions, supervision."},
{id:"f10",m:"m3",front:"Turnover rate formula",back:"Separations ÷ average headcount × 100. Split voluntary vs involuntary; functional (good leavers) vs dysfunctional (regretted leavers)."},
{id:"f11",m:"m3",front:"Vroom expectancy theory",back:"Motivation = Expectancy × Instrumentality × Valence. Belief that effort→performance→valued reward. Any zero kills motivation."},
{id:"f12",m:"m3",front:"Strongest engagement driver",back:"The direct manager relationship — accounts for most variance in engagement scores (Gallup)."},
/* m4 */{id:"f13",m:"m4",front:"Kirkpatrick's 4 levels",back:"L1 Reaction, L2 Learning, L3 Behavior, L4 Results. Phillips added L5 ROI (money value vs cost)."},
{id:"f14",m:"m4",front:"ADDIE",back:"Analysis, Design, Development, Implementation, Evaluation — systematic instructional design model."},
{id:"f15",m:"m4",front:"70-20-10 model",back:"~70% learning from on-the-job experience, ~20% from relationships/feedback, ~10% from formal training."},
{id:"f16",m:"m4",front:"Coaching vs mentoring",back:"Coaching: short-term, performance-focused (GROW model), often the manager. Mentoring: long-term, career-focused."},
/* m5 */{id:"f17",m:"m5",front:"Compa-ratio",back:"Actual pay ÷ range midpoint. <1.0 = below midpoint; >1.0 = above. Diagnoses pay positioning."},
{id:"f18",m:"m5",front:"Lead / lag / match pay strategy",back:"Lead = above market (attract talent, higher cost). Lag = below market. Match = at market."},
{id:"f19",m:"m5",front:"Point-factor job evaluation",back:"Assign points to compensable factors (skill, effort, responsibility, conditions) → total points = job worth."},
{id:"f20",m:"m5",front:"ERISA",back:"Governs private-sector benefit plans: fiduciary duties, reporting/disclosure, vesting, participant rights."},
/* m6 */{id:"f21",m:"m6",front:"Progressive discipline order",back:"Verbal counseling → written warning → suspension/final warning → termination. Document each step."},
{id:"f22",m:"m6",front:"NLRA Section 7",back:"Protects concerted activity (organizing, discussing wages/conditions) — union AND non-union workplaces."},
{id:"f23",m:"m6",front:"TIPS vs FORE (union campaigns)",back:"Unlawful TIPS: Threats, Interrogation, Promises, Surveillance. Lawful FORE: Facts, Opinions, Rules, Experience."},
{id:"f24",m:"m6",front:"Weingarten rights",back:"Union employees may request steward presence at investigatory interviews that could lead to discipline. Must be requested."},
/* m7 */{id:"f25",m:"m7",front:"Title VII / ADA / ADEA thresholds",back:"Title VII & ADA: 15+ employees. ADEA (40+): 20+. FMLA: 50+. WARN: 100+. COBRA: 20+."},
{id:"f26",m:"m7",front:"Disparate treatment vs impact",back:"Treatment = intentional (McDonnell Douglas burden-shifting). Impact = neutral policy, discriminatory effect (Griggs; business-necessity defense)."},
{id:"f27",m:"m7",front:"Quid pro quo vs hostile work environment",back:"Quid pro quo: favors for job benefits. Hostile: severe/pervasive conduct altering conditions. Both = unlawful harassment."},
{id:"f28",m:"m7",front:"FMLA eligibility",back:"50+ employees (75-mi radius); 12 months tenure + 1,250 hours. Up to 12 weeks unpaid, job restoration."},
/* m8 */{id:"f29",m:"m8",front:"OSHA general duty clause",back:"Section 5(a)(1): employers must furnish workplaces free from recognized hazards — even without a specific standard."},
{id:"f30",m:"m8",front:"Workers' comp exclusive remedy",back:"No-fault benefits for employees; employers shielded from tort suits for covered injuries. The 'grand bargain.'"},
{id:"f31",m:"m8",front:"Negligent hiring",back:"Liability for failing to reasonably screen — especially safety-sensitive roles (drivers, caregivers, fiduciaries)."},
{id:"f32",m:"m8",front:"Litigation hold",back:"When litigation is anticipated: suspend routine destruction and preserve relevant records. Spoliation = sanctions."},
/* m9 */{id:"f33",m:"m9",front:"Human capital ROI",back:"(Revenue − Operating Expenses) ÷ Total Compensation. Frames workforce cost vs value created."},
{id:"f34",m:"m9",front:"Cost per hire vs time to fill",back:"Cost per hire = total recruiting costs ÷ hires (spend efficiency). Time to fill = requisition to acceptance (speed)."},
{id:"f35",m:"m9",front:"Balanced scorecard perspectives",back:"Financial, Customer, Internal process, Learning & growth (Kaplan & Norton). Map HR metrics to all four."},
{id:"f36",m:"m9",front:"AI hiring tools: key compliance step",back:"Validate for adverse impact (4/5ths rule), monitor ongoing, keep human oversight. AI tools are selection procedures under the Uniform Guidelines."},
/* m10 */{id:"f37",m:"m10",front:"Lewin's change model",back:"Unfreeze → Change (move) → Refreeze. Create urgency, implement, anchor in culture."},
{id:"f38",m:"m10",front:"Kotter step 1",back:"Create a sense of urgency. Without it, coalitions never form and change stalls."},
{id:"f39",m:"m10",front:"9-box grid",back:"Performance (x-axis) × Potential (y-axis). Drives succession, development, talent reviews."},
{id:"f40",m:"m10",front:"Thomas-Kilmann: collaborating",back:"High assertiveness + high cooperativeness = win/win problem solving. Best for complex, high-stakes issues."},
/* m11 */{id:"f41",m:"m11",front:"Balance-sheet approach (expat pay)",back:"Keep the expat whole: home base + COLA + housing + hardship + incentives vs staying home."},
{id:"f42",m:"m11",front:"Hofstede: power distance",back:"Acceptance of unequal power. High-PD: defer to hierarchy. Low-PD: expect participation."},
{id:"f43",m:"m11",front:"Diversity vs inclusion vs equity",back:"Diversity = representation. Inclusion = belonging. Equity = fair outcomes via needs-based resources."},
{id:"f44",m:"m11",front:"Triple bottom line",back:"People, planet, profit — social, environmental, financial performance. Basis of CSR/ESG."},
/* m12 */{id:"f45",m:"m12",front:"Hersey-Blanchard S1–S4",back:"Match style to development level: S1 Directing → S2 Coaching → S3 Supporting → S4 Delegating."},
{id:"f46",m:"m12",front:"SHRM Code of Ethics pillars",back:"Professional responsibility, ethical leadership, fairness & justice, conflicts of interest, use of information."},
{id:"f47",m:"m12",front:"Evidence-based HR",back:"Decisions from research evidence + org data + stakeholder values + professional judgment. Not best-practice copying."},
{id:"f48",m:"m12",front:"HR's role in M&A due diligence",back:"Culture fit, key-talent flight risk, comp/benefit liabilities, union contracts, pending employment litigation."},
/* ---- EXPANSION: 21 more per module (f49-f300) ---- */
{id:"f49",m:"m1",front:"VRIO framework",back:"Valuable, Rare, costly to Imitate, Organized to exploit: all four are needed for sustained competitive advantage (Barney)."},
{id:"f50",m:"m1",front:"Ansoff matrix",back:"Market penetration | market development | product development | diversification. Risk rises as you move away from current markets and products."},
{id:"f51",m:"m1",front:"Greiner's growth model",back:"Growth through creativity, direction, delegation, coordination, collaboration; each phase ends in a crisis (leadership, autonomy, control, red tape)."},
{id:"f52",m:"m1",front:"McKinsey 7-S model",back:"Strategy, Structure, Systems, Shared values, Style, Staff, Skills. All seven are interdependent; change one and the rest shift."},
{id:"f53",m:"m1",front:"BCG growth-share matrix",back:"Stars | Cash cows | Question marks | Dogs. Plots market growth vs relative market share to guide investment."},
{id:"f54",m:"m1",front:"Stakeholder theory vs shareholder primacy",back:"Freeman: create value for ALL stakeholders. Friedman: the firm's duty is maximizing shareholder returns."},
{id:"f55",m:"m1",front:"HR scorecard",back:"Links HR deliverables and HR metrics specifically to strategic business outcomes, showing HR's causal chain to results (Huselid/Becker)."},
{id:"f56",m:"m1",front:"Balanced scorecard: four perspectives",back:"Financial | Customer | Internal process | Learning and growth. Translates strategy into measurable objectives."},
{id:"f57",m:"m1",front:"Business case components",back:"Problem definition | options considered | costs and benefits | ROI | risks | recommendation. HR wins budgets with these."},
{id:"f58",m:"m1",front:"Mission vs vision vs values",back:"Mission = purpose today. Vision = future aspiration. Values = guiding principles for behavior."},
{id:"f59",m:"m1",front:"Line of sight (HR metrics)",back:"A clear causal linkage from HR activity to workforce outcomes to business results. Without it, HR metrics are trivia."},
{id:"f60",m:"m1",front:"Outsourcing vs shared services vs CoE vs HRBP",back:"Outsource transactional work | shared services centralize transactions | centers of excellence hold deep expertise | HRBPs embed with the business."},
{id:"f61",m:"m1",front:"SEC human capital disclosure (Reg S-K, 2020)",back:"Public companies must describe human capital resources and the objectives/measures management focuses on (e.g., turnover, development)."},
{id:"f62",m:"m1",front:"Evidence-based HR",back:"Decisions grounded in data, research evidence, and critical evaluation, not fads, gut feel, or benchmarking alone."},
{id:"f63",m:"m1",front:"TOWS matrix",back:"Flips SWOT into strategy: match Strengths/Weaknesses with Opportunities/Threats (SO, WO, ST, WT strategies)."},
{id:"f64",m:"m1",front:"AMO framework",back:"Performance = Ability x Motivation x Opportunity. HR levers map to each: selection/training, rewards/engagement, job design/voice."},
{id:"f65",m:"m1",front:"Lepak and Snell HR architecture",back:"Employment modes based on value + uniqueness: core employees | traditional jobs | alliance partners | contract workers."},
{id:"f66",m:"m1",front:"Double-loop learning (Argyris)",back:"Questioning the underlying assumptions and policies, not just fixing the error (single-loop). Drives real organizational learning."},
{id:"f67",m:"m1",front:"Organizational ambidexterity",back:"Exploiting the current business efficiently while exploring new opportunities. HR must staff and reward both."},
{id:"f68",m:"m1",front:"Agency theory",back:"Principals vs agents: align incentives (pay for performance, equity) to reduce agency costs like moral hazard and adverse selection."},
{id:"f69",m:"m1",front:"Exam trap: efficiency vs effectiveness",back:"Efficiency = doing things right (cost, speed). Effectiveness = doing the right things (impact on goals). HR must deliver both."},
{id:"f70",m:"m2",front:"Delphi technique",back:"Structured anonymous expert rounds with controlled feedback, repeated until consensus. Used in qualitative workforce forecasting."},
{id:"f71",m:"m2",front:"Nominal group technique",back:"Silent idea generation | round-robin sharing | discussion | ranking vote. Prevents dominant voices from hijacking planning."},
{id:"f72",m:"m2",front:"Bauer's 4 Cs of onboarding",back:"Compliance | Clarification | Culture | Connection. Higher levels = more mature onboarding = better retention."},
{id:"f73",m:"m2",front:"PAQ vs FJA vs DACUM",back:"PAQ: standardized questionnaire. FJA: analyzes worker functions (data/people/things). DACUM: expert panel lists tasks."},
{id:"f74",m:"m2",front:"Critical incident technique (Flanagan)",back:"Collecting concrete examples of effective and ineffective job behaviors. Feeds BARS ratings and structured interview questions."},
{id:"f75",m:"m2",front:"Structured vs unstructured interviews",back:"Structured: same questions, scoring guides, far higher validity and less bias. Unstructured: conversational, low validity, legal risk."},
{id:"f76",m:"m2",front:"Situational judgment test (SJT)",back:"Presents realistic job scenarios with response options. Moderate-to-high validity with typically low adverse impact."},
{id:"f77",m:"m2",front:"Assessment center",back:"Multiple job simulations evaluated by multiple trained assessors. Among the highest-validity methods, but expensive."},
{id:"f78",m:"m2",front:"Biodata",back:"Biographical/life-history data used to predict performance. Valid, but items must be job-related to avoid adverse impact."},
{id:"f79",m:"m2",front:"Ban-the-box",back:"State/local laws restricting criminal-history questions until later in the hiring process. Check local rules before applying."},
{id:"f80",m:"m2",front:"Salary history bans",back:"Many states bar asking about prior pay, aiming to break the cycle of historic pay gaps carrying forward."},
{id:"f81",m:"m2",front:"NYC Local Law 144 (AI hiring)",back:"Requires bias audits for automated employment decision tools (AEDTs) plus candidate notice. Other states are following."},
{id:"f82",m:"m2",front:"FCRA adverse action steps",back:"Pre-adverse notice (report + rights summary + waiting period), THEN final adverse action notice. Skipping steps creates liability."},
{id:"f83",m:"m2",front:"Negligent hiring",back:"Employers owe a duty of reasonable care in screening, especially for safety-sensitive roles. Skipping checks = exposure."},
{id:"f84",m:"m2",front:"Realistic job preview (RJP)",back:"An honest look at the role, warts and all. Calibrates expectations and reduces early turnover."},
{id:"f85",m:"m2",front:"Job embeddedness",back:"Links + fit + sacrifice: the web of connections keeping people in place. Predicts retention beyond satisfaction."},
{id:"f86",m:"m2",front:"Unfolding model of turnover (Lee and Mitchell)",back:"Turnover follows paths: shocks, scripts, image violations, and job search. Not everyone leaves the same way."},
{id:"f87",m:"m2",front:"Referral homophily trap",back:"Referrals replicate the current workforce's demographics. Monitor referral pipelines for adverse impact."},
{id:"f88",m:"m2",front:"ABC test vs economic reality test",back:"ABC (control, outside usual business, independent trade) is stricter than the DOL's multifactor economic-reality test for contractors."},
{id:"f89",m:"m2",front:"Replacement vs succession planning",back:"Replacement = short-term backup coverage if someone leaves tomorrow. Succession = long-term development of future leaders."},
{id:"f90",m:"m2",front:"Exam trap: selection ratio",back:"Hires divided by applicants. Lower ratio = more selective = higher payoff (utility) from valid selection tools."},
{id:"f91",m:"m3",front:"Maslow's hierarchy of needs",back:"Physiological | safety | belonging | esteem | self-actualization. Lower needs dominate until reasonably satisfied."},
{id:"f92",m:"m3",front:"McClelland's needs theory",back:"Achievement | affiliation | power. High achievers want challenging goals and fast feedback; high power types seek influence."},
{id:"f93",m:"m3",front:"Adams' equity theory",back:"Motivation comes from perceived fairness of input/outcome ratios versus referent others. Inequity (either direction) creates tension."},
{id:"f94",m:"m3",front:"Psychological safety (Edmondson)",back:"A shared belief that the team is safe for interpersonal risk-taking: speaking up, asking questions, admitting mistakes."},
{id:"f95",m:"m3",front:"Job Characteristics Model (Hackman and Oldham)",back:"Skill variety | task identity | task significance | autonomy | feedback. Drive meaningfulness, responsibility, and knowledge of results."},
{id:"f96",m:"m3",front:"Self-determination theory",back:"Autonomy | competence | relatedness fuel intrinsic motivation. Controlling rewards can crowd it out."},
{id:"f97",m:"m3",front:"Meyer and Allen: three commitments",back:"Affective (want to stay) | continuance (need to stay) | normative (ought to stay). Affective predicts the best outcomes."},
{id:"f98",m:"m3",front:"Organizational justice: four types",back:"Distributive (outcomes) | procedural (process) | interpersonal (respect) | informational (explanations). All four shape engagement."},
{id:"f99",m:"m3",front:"Dysfunctional vs functional turnover",back:"Dysfunctional = losing high performers you wanted to keep. Functional = losing low performers. Only one is a crisis."},
{id:"f100",m:"m3",front:"Regretted attrition",back:"Turnover of employees the company wanted to retain. The retention metric that matters most to leaders."},
{id:"f101",m:"m3",front:"Stay interview core questions",back:"What keeps you here? | What would make you leave? | What can I do more or less of? Ask BEFORE people are halfway out."},
{id:"f102",m:"m3",front:"eNPS formula",back:"Percent promoters (9-10) minus percent detractors (0-6) on 'how likely to recommend as a place to work.'"},
{id:"f103",m:"m3",front:"Gallup Q12",back:"Twelve items measuring manager-employee factors most linked to engagement and performance. A manager diagnostic, not a personality test."},
{id:"f104",m:"m3",front:"Honeymoon-hangover effect",back:"Engagement peaks at hire, then dips after 6-12 months as reality sets in. Onboarding and early wins flatten the dip."},
{id:"f105",m:"m3",front:"Survivor syndrome",back:"Guilt, anxiety, and distrust among remaining staff after layoffs. Needs honest communication and visible fairness."},
{id:"f106",m:"m3",front:"Burnout drivers (Maslach)",back:"Workload | control | reward | community | fairness | values mismatch. Fix the job and the manager, not just the person."},
{id:"f107",m:"m3",front:"Job crafting",back:"Employees proactively reshaping their tasks, relationships, and perceptions of work. HR enables it through autonomy."},
{id:"f108",m:"m3",front:"EVP (employee value proposition)",back:"The total deal: pay, benefits, career growth, culture, purpose, flexibility. What makes people choose and stay."},
{id:"f109",m:"m3",front:"Counteroffer trap",back:"Most employees who accept counteroffers leave within a year. Counteroffers treat the symptom; fix the root cause instead."},
{id:"f110",m:"m3",front:"RTO mandates and retention",back:"Autonomy over where and when work happens is a top retention lever. Mandates without a clear rationale backfire."},
{id:"f111",m:"m3",front:"Exam trap: satisfaction vs engagement",back:"Satisfaction = contentment, can be passive. Engagement = commitment plus discretionary effort toward goals."},
{id:"f112",m:"m4",front:"Bloom's taxonomy (revised)",back:"Remember | Understand | Apply | Analyze | Evaluate | Create. Design learning objectives up the ladder, not just recall."},
{id:"f113",m:"m4",front:"Gagne's nine events of instruction",back:"Gain attention | inform objectives | recall prior learning | present content | guide learning | elicit performance | feedback | assess | enhance retention and transfer."},
{id:"f114",m:"m4",front:"Kolb's experiential learning cycle",back:"Concrete experience | reflective observation | abstract conceptualization | active experimentation. Learning loops through all four."},
{id:"f115",m:"m4",front:"Knowles' andragogy",back:"Adults need the why | bring experience as a resource | are self-directed | learn to solve real problems."},
{id:"f116",m:"m4",front:"Cognitive load theory",back:"Working memory is limited. Chunk content, cut extraneous load, and avoid redundant text plus narration."},
{id:"f117",m:"m4",front:"Forgetting curve and spacing effect",back:"Memory decays fast (Ebbinghaus); spaced retrieval practice beats massed cramming for durable retention."},
{id:"f118",m:"m4",front:"Deliberate practice (Ericsson)",back:"Focused, feedback-rich repetition at the edge of current ability. The engine of expertise, not just hours logged."},
{id:"f119",m:"m4",front:"GROW coaching model",back:"Goal | Reality | Options | Will. A simple framework for structuring coaching conversations."},
{id:"f120",m:"m4",front:"BARS",back:"Behaviorally Anchored Rating Scales: critical incidents anchor each performance level. More valid than trait-based scales."},
{id:"f121",m:"m4",front:"MBO (Drucker)",back:"Management by Objectives: cascade measurable goals, review results. Fails when goals are vague or disconnected from strategy."},
{id:"f122",m:"m4",front:"360 feedback: best use",back:"Multi-rater input ideal for development. Risky for pay or promotion decisions due to rater bias and gaming."},
{id:"f123",m:"m4",front:"EPSS",back:"Electronic Performance Support System: just-in-time job aids embedded in the workflow. Performance support, not training."},
{id:"f124",m:"m4",front:"Needs assessment: three levels",back:"Organizational analysis | task/KSA analysis | individual (person) analysis. Skipping levels causes training for non-training problems."},
{id:"f125",m:"m4",front:"Phillips ROI (level 5)",back:"Converts Kirkpatrick level 4 business results into monetary value and compares against program cost."},
{id:"f126",m:"m4",front:"Transfer climate",back:"Manager support | opportunity to practice | accountability for applying skills. The top driver of training transfer."},
{id:"f127",m:"m4",front:"Microlearning: best fit",back:"Bite-sized, just-in-time modules for procedures and refreshers. Poor fit for deep judgment or complex skill-building."},
{id:"f128",m:"m4",front:"VARK model",back:"Visual | Auditory | Reading/writing | Kinesthetic preferences. Design implication: blend modalities."},
{id:"f129",m:"m4",front:"Learning agility",back:"Learning quickly from experience and applying it to new situations. Among the strongest predictors of leadership potential."},
{id:"f130",m:"m4",front:"Stretch assignments",back:"Challenging tasks at the edge of ability: the '70' in 70-20-10. Growth comes from real responsibility, not courses."},
{id:"f131",m:"m4",front:"Communities of practice",back:"Peer groups sharing craft knowledge over time. Social learning infrastructure that survives turnover."},
{id:"f132",m:"m4",front:"Exam trap: smile sheets",back:"Kirkpatrick level 1 measures reaction only. High satisfaction scores do not prove anyone learned anything."},
{id:"f133",m:"m5",front:"Pay compression",back:"New-hire pay approaches or exceeds experienced employees' pay in similar roles. Market-driven; fix with equity adjustments before tenured staff quit."},
{id:"f134",m:"m5",front:"DB vs DC retirement plans",back:"Defined benefit: employer promises a formula-based pension and bears investment risk. Defined contribution (401k): contributions go into individual accounts; the employee bears the risk."},
{id:"f135",m:"m5",front:"Sec. 125 cafeteria plan",back:"Lets employees pay for benefits (health premiums, FSAs) with pre-tax dollars. Lowers taxable income for employees and FICA costs for employers."},
{id:"f136",m:"m5",front:"Broadbanding",back:"Collapsing many narrow pay grades into a few wide bands. Supports lateral moves and flat structures; weakens precise market pricing."},
{id:"f137",m:"m5",front:"50th percentile (salary surveys)",back:"The median: half of reported salaries above, half below. Anchor pay strategy to percentiles (25th/50th/75th), not averages, which skew high."},
{id:"f138",m:"m5",front:"Living wage vs minimum wage",back:"Living wage = calculated cost of basic needs in a location (MIT calculator). Minimum wage = the legal floor. Living wage is typically higher."},
{id:"f139",m:"m5",front:"Pay transparency laws",back:"Many states (including NY) require salary ranges in job postings. Reduces information gaps that sustain pay disparities."},
{id:"f140",m:"m5",front:"Range penetration formula",back:"(Employee pay - range minimum) / (range maximum - range minimum). Shows position within the grade; over 100% means above range."},
{id:"f141",m:"m5",front:"Red-circle rate",back:"Pay above the range maximum, usually frozen until the range catches up. Protects incumbents after a regrade or acquisition."},
{id:"f142",m:"m5",front:"Gainsharing vs profit-sharing",back:"Gainsharing: payouts tied to specific productivity or cost gains the group controls. Profit-sharing: tied to overall company profit; weaker line of sight."},
{id:"f143",m:"m5",front:"Team vs individual incentives",back:"Individual plans reward personal output but can kill collaboration. Team plans support shared goals; add individual modifiers to limit free-riding."},
{id:"f144",m:"m5",front:"2026: FLSA overtime salary threshold",back:"DOL rescinded the 2024 rule (May 2026). Restored: $684/week ($35,568/yr) threshold and $107,432 HCE level. Automatic increases are gone."},
{id:"f145",m:"m5",front:"2026: FTC noncompete ban",back:"Dead. Vacated in court, appeals dropped Sept 2025, removed from the CFR Feb 2026. Noncompete enforceability is governed by state law."},
{id:"f146",m:"m5",front:"Pay equity audit",back:"Statistical analysis of pay by gender/race controlling for legitimate factors (role, tenure, performance). Unexplained gaps = legal and retention risk."},
{id:"f147",m:"m5",front:"Total rewards statement",back:"Quantified summary of base pay + incentives + benefits + time off + retirement. Corrects employees' systematic undervaluation of their total comp."},
{id:"f148",m:"m5",front:"Stay (retention) bonus",back:"Lump sum for remaining through a date or event, e.g., a merger close. Buys continuity of critical talent during uncertainty."},
{id:"f149",m:"m5",front:"Cliff vs graded vesting",back:"Cliff: 100% vests after a set period. Graded: vests in increments over time. Longer vesting = stronger retention hook."},
{id:"f150",m:"m5",front:"Exam trap: compa-ratio vs range penetration",back:"Compa-ratio = pay / range MIDPOINT (market position). Range penetration = (pay - min) / (max - min) (position within grade). Different denominators."},
{id:"f151",m:"m5",front:"Spot bonus",back:"Immediate small cash award for exceptional effort. Works best when timely, specific, and tied to company values."},
{id:"f152",m:"m5",front:"Market pricing (job evaluation)",back:"Setting pay by benchmarking each job against external market data. The most common method; needs good survey job matches."},
{id:"f153",m:"m5",front:"Ranking vs classification (job evaluation)",back:"Ranking: order whole jobs by worth (simple, subjective). Classification: slot jobs into predefined grades, e.g., the federal GS scale."},
{id:"f154",m:"m6",front:"Seven tests of just cause",back:"Daugherty: foreknowledge of the rule; reasonable rule; fair investigation; fair hearing; proof; equal treatment; penalty fits the offense. Arbitrators apply them."},
{id:"f155",m:"m6",front:"Lockout vs strike",back:"Lockout: employer-initiated stoppage to pressure the union. Strike: employee-initiated. Both are economic weapons with different legal rules."},
{id:"f156",m:"m6",front:"Right-to-work laws",back:"Employees cannot be required to join a union or pay dues as a condition of employment. The union must still represent everyone in the unit."},
{id:"f157",m:"m6",front:"NLRB election order",back:"Petition with 30% showing of interest > investigation/hearing > secret-ballot election > certification on 50%+1 of votes cast."},
{id:"f158",m:"m6",front:"Mandatory vs permissive bargaining subjects",back:"Mandatory: wages, hours, working conditions (must bargain). Permissive: e.g., internal union affairs (may bargain). Illegal: e.g., closed shop."},
{id:"f159",m:"m6",front:"Typical grievance steps",back:"1) Informal supervisor discussion; 2) written grievance to management; 3) higher management/HR review; 4) arbitration. Time limits are strict."},
{id:"f160",m:"m6",front:"Past practice trap",back:"'Just this once' exceptions can become binding past practice. Settle within the contract or document non-precedent terms explicitly with the union."},
{id:"f161",m:"m6",front:"2026: NLRB joint-employer rule",back:"Feb 2026 final rule withdrew the 2023 rule. Restored the 2020 standard: the company must possess AND exercise substantial direct and immediate control."},
{id:"f162",m:"m6",front:"Picketing protections",back:"Peaceful picketing for a lawful purpose is protected concerted activity. Violence, threats, or blocking entrances lose protection."},
{id:"f163",m:"m6",front:"Section 8(a) ULPs",back:"Employer unfair labor practices: interfere with Sec 7 rights; dominate a union; discriminate over union activity; retaliate for NLRB charges; refuse to bargain in good faith."},
{id:"f164",m:"m6",front:"Surface bargaining",back:"Going through the motions with no intent to reach agreement. A refusal to bargain in good faith; an 8(a)(5) violation."},
{id:"f165",m:"m6",front:"Union shop vs agency shop",back:"Union shop: must join the union after hire. Agency shop: must pay fees but not join. Both are barred in right-to-work states."},
{id:"f166",m:"m6",front:"Supervisor's first duty on a grievance",back:"Listen fully, check the contract, investigate the facts, respond within time limits. Most grievances are won or lost at step one."},
{id:"f167",m:"m6",front:"Labor arbitration",back:"Final grievance step; the arbitrator's decision is binding. Arbitrators apply just-cause standards, not management preference."},
{id:"f168",m:"m6",front:"Economic vs ULP strike",back:"Economic strike: over contract terms; replacements may be permanent. ULP strike: protesting employer violations; strikers entitled to reinstatement."},
{id:"f169",m:"m6",front:"Bargaining unit determination",back:"NLRB decides the appropriate unit by community of interest: similar duties, skills, supervision, conditions, and interchange."},
{id:"f170",m:"m6",front:"Dues checkoff",back:"Employer payroll deduction of union dues under employee authorization. A mandatory bargaining subject, negotiated in the CBA."},
{id:"f171",m:"m6",front:"Management rights clause",back:"CBA provision reserving decisions like directing the workforce to management. Scope is negotiated; silence usually favors a bargaining obligation."},
{id:"f172",m:"m6",front:"Concerted activity without a union",back:"Sec 7 protects even non-union employees acting together, e.g., group complaints about pay or safety. No union presence required."},
{id:"f173",m:"m6",front:"Exam trap: 30% vs 50%+1",back:"30% showing of interest triggers the NLRB election petition. 50%+1 of votes CAST (not of the unit) wins certification."},
{id:"f174",m:"m6",front:"Good-faith bargaining",back:"Meet at reasonable times, bargain with sincere intent, reduce agreements to writing. Does NOT require making concessions."},
{id:"f175",m:"m7",front:"Retaliation: three elements",back:"Protected activity + materially adverse action + causal connection. The underlying discrimination claim does not need to succeed."},
{id:"f176",m:"m7",front:"EEOC charge: HR's first moves",back:"Litigation hold, notify legal, prepare a factual position statement. Retaliation after a charge multiplies liability."},
{id:"f177",m:"m7",front:"Faragher/Ellerth defense",back:"Employer avoids liability for supervisor harassment (no tangible job action) if it exercised reasonable care and the employee unreasonably failed to use complaint channels."},
