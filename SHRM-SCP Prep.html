{id:"q856",m:"m9",t:"sj",s:"A turnover analysis shows employees with 40 years of tenure in a 10-year-old company. What is the FIRST step?",o:["Publish the finding","Blame the analyst","Present it to the board","Audit data quality: trace the bad values to their source, fix the entry or integration flaw, then re-run the analysis"],a:3,e:"Impossible values signal source or mapping errors. Never analyze through bad data; fix the pipeline first or every conclusion is suspect."},
{id:"q857",m:"m9",t:"sj",s:"Finance budgets by position but the HRIS tracks only jobs, so headcount and budget never reconcile. What should HR implement?",o:["Keep tracking jobs only","Position management: budget-controlled positions linking headcount, budget, and incumbents","Ignore finance","A spreadsheet workaround"],a:1,e:"Position management creates a position for each budgeted slot; hiring fills positions. Job management tracks people without the budget linkage. Finance reconciliation needs positions."},
{id:"q858",m:"m9",t:"k",s:"Effective dating in an HRIS provides:",o:["Future-dated, current, and historical records for each HR transaction, preserving a full audit trail","A dating service for coworkers","Only today's records","Automatic deletion of old records"],a:0,e:"Effective dating keeps every version of a record (past, present, future) with its effective date, enabling retroactive corrections and point-in-time reporting without destroying history."},
{id:"q859",m:"m9",t:"k",s:"'Deepfake candidates' in remote hiring refers to:",o:["A new hire onboarding game","AI-generated fake candidates or interview stand-ins used to fraudulently obtain remote jobs","A video filter for fun","A training simulation"],a:2,e:"Employers report deepfake candidates in remote hiring pipelines, sometimes tied to illicit income schemes. Controls include identity verification, live-interview checks, and device/work verification."},
{id:"q860",m:"m9",t:"sj",s:"During a remote final interview, the candidate's video glitches oddly, answers seem read, and they refuse to turn on their camera for a live check. What is the BEST response?",o:["Accuse them of fraud on the call","Hire them anyway","Ignore the signs","Follow the verification protocol: require live identity verification through approved channels, document concerns factually, and do not proceed until identity is confirmed"],a:3,e:"Handle suspicion through process, not accusation: identity verification, documented observations, and escalation. Accusations without proof create legal risk; ignoring red flags creates fraud risk."},
{id:"q861",m:"m9",t:"k",s:"Ethical employee listening programs should:",o:["Be transparent with employees about what is collected, why, and how it is used, and respect consent and privacy boundaries","Use secret monitoring","Collect everything possible","Share raw comments with managers"],a:0,e:"Always-on listening (email metadata, collaboration signals) demands transparency, purpose limitation, and aggregation. Covert sentiment surveillance destroys trust and can violate works-council or privacy rules."},
{id:"q862",m:"m9",t:"k",s:"Regarding works councils and people analytics in the EU:",o:["Works councils have no role in HR tech","Only US unions matter","In many EU countries, works councils have co-determination or consultation rights over employee-monitoring and people-analytics tools","Works councils approve salaries"],a:2,e:"German and other EU works-council regimes can block or condition monitoring and analytics tools. Engage councils early in the design phase, not after purchase."},
{id:"q863",m:"m9",t:"sj",s:"The German works council objects to a planned engagement-analytics rollout, citing co-determination rights. The US team wants to launch anyway. What is the BEST path?",o:["Launch in Germany regardless","Exclude Germany permanently without discussion","Launch quietly and hope no one notices","Pause the German rollout, consult the works council early, complete a data protection impact assessment, and adapt the design to lawful, agreed terms"],a:3,e:"Co-determination is a legal right, not a suggestion. Early consultation plus a DPIA typically yields an approved, adjusted design. Proceeding unilaterally invites injunctions and works-council litigation."},
{id:"q864",m:"m9",t:"k",s:"The ethical use of flight-risk predictions requires:",o:["Publishing the risk scores to all managers","Sharing scores with the employees' peers","Using predictions punitively against flagged employees","Using predictions to offer support and retention actions confidentially, never as a basis for adverse decisions"],a:3,e:"Predictive retention tools should trigger supportive interventions (stay conversations, development), handled confidentially. Using them to deny promotions or target layoffs is discriminatory and unethical."},
{id:"q865",m:"m9",t:"k",s:"The Texas Responsible AI Governance Act (TRAIGA) is BEST described as:",o:["A federal AI ban","A New York City ordinance","An Illinois notice rule","Effective January 1, 2026, focusing liability on intentional AI discrimination"],a:3,e:"Texas TRAIGA targets intentional discrimination through AI systems, a narrower intent-based standard than Illinois' effects-based approach. Its disclosure rules exclude employment."},
{id:"q866",m:"m9",t:"k",s:"Colorado's rewritten AI law (SB 26-189, signed May 2026) is BEST described as:",o:["Identical to the EU AI Act","A ban on hiring algorithms","Effective immediately with no rulemaking","Disclosure-centered: advance notice, disclosure of the tool's role after adverse decisions, human-review rights, and record retention, expected effective January 1, 2027"],a:3,e:"Colorado repealed its original 2024 AI Act and replaced it with a narrower disclosure-focused law. Employers should track the rulemaking before the expected 2027 effective date."},
{id:"q867",m:"m9",t:"sj",s:"The company hires in NYC, Illinois, California, Texas, and Germany. What is the BEST compliance strategy for its AI screening tool?",o:["Follow only federal law","Ignore state laws as too complex","Comply with the strictest applicable requirements as the baseline (audits, notices, human review, recordkeeping) while mapping jurisdiction-specific extras","Use a different tool per state with no central governance"],a:2,e:"A highest-common-denominator baseline (bias audits, candidate notices, meaningful human review, multi-year records) plus a jurisdiction map is more defensible and operable than fragmented ad hoc compliance."},
{id:"q868",m:"m9",t:"k",s:"Maryland law on facial recognition in hiring provides that:",o:["Maryland bans all video interviews","Maryland requires employers to pay interviewees","Maryland has no AI hiring laws","Employers may not create a facial template from an interview without the applicant's signed waiver"],a:3,e:"Maryland Labor and Employment 3-717 (2020) bars employers from using facial recognition to create a facial template during an interview without the applicant's signed waiver."},
{id:"q869",m:"m9",t:"k",s:"Under California's FEHA automated-decision regulations, when a vendor's screening tool discriminates, the employer:",o:["Is automatically immune","Can blame the vendor entirely","Must only stop using the tool","Remains liable because a vendor acting on the employer's behalf is treated as its agent"],a:3,e:"The regulations attribute the vendor's discriminatory acts to the employer-principal. 'The vendor did it' is not a defense, which is why vendor diligence and contracts matter."}
);
</script>
<script>
"use strict";
/* ---- 1000Q EXPANSION batch 6 ---- */
QUESTIONS.push(
{id:"q870",m:"m10",t:"sj",s:"A transformation is stalling because it is driven by a single HR sponsor with no executive coalition. What is the BEST next move?",o:["Push harder with more communications from HR","Build a guiding coalition of credible leaders with position power, expertise, and leadership","Hire an external consultant to own the change","Wait for resistance to fade on its own"],a:1,e:"Kotter's second step: no single person, however competent, can drive major change. A powerful guiding coalition with credibility is essential."},
{id:"q871",m:"m10",t:"k",s:"In the ADKAR model, the letters stand for:",o:["Assess, Design, Know, Act, Review","Authority, Direction, Knowledge, Action, Results","Align, Develop, Keep, Apply, Retain","Awareness, Desire, Knowledge, Ability, Reinforcement"],a:3,e:"ADKAR (Prosci) tracks individual change: Awareness of the need, Desire to participate, Knowledge of how, Ability to implement, Reinforcement to sustain."},
{id:"q872",m:"m10",t:"k",s:"Bridges' transition model describes the psychological process of change in three phases:",o:["Ending, neutral zone, new beginning","Plan, execute, close","Unfreeze, change, refreeze","Denial, anger, acceptance"],a:0,e:"Bridges separates change (the external event) from transition (the internal psychological process): endings, the neutral zone, then new beginnings."},
{id:"q873",m:"m10",t:"sj",s:"A large firm acquires an innovative startup precisely for its agile culture and product talent. Which integration approach BEST preserves the deal's value?",o:["Full absorption into corporate systems immediately","Symbiosis: merge everything gradually","Preservation: protect the startup's autonomy and culture while providing scale","Deculturation: replace startup leadership at once"],a:2,e:"Haspeslagh and Jemison: when the acquired capability depends on its distinct culture, preservation beats absorption. Absorbing destroys what you bought."},
{id:"q874",m:"m10",t:"k",s:"In McKinsey's 7S model, which element sits at the center, shaping the other six?",o:["Strategy","Structure","Shared values","Systems"],a:2,e:"Shared values sit at the center of McKinsey's 7S model: strategy, structure, systems, style, staff, and skills must align around core values."},
{id:"q875",m:"m10",t:"k",s:"Galbraith's Star Model says organization design must align five elements:",o:["Strategy, structure, processes, rewards, people","Mission, vision, values, goals, tactics","Plan, do, check, act, repeat","Hire, train, pay, retain, exit"],a:0,e:"Galbraith's Star Model: strategy, structure, processes, rewards, and people. Changing structure alone fails when rewards and processes still drive the old behavior."},
{id:"q876",m:"m10",t:"sj",s:"A pilot group loves a new collaboration tool, but most employees are waiting to see results. Per Rogers' diffusion curve, what is the BEST next move?",o:["Mandate adoption for everyone tomorrow","Offer cash to every user","Abandon the tool","Recruit respected early adopters as champions and make their wins visible"],a:3,e:"Rogers' diffusion curve: the early majority follows credible peers, not mandates. Visible wins from early adopters pull the majority across."},
{id:"q877",m:"m10",t:"k",s:"Using Weisbord's six-box model, an OD consultant finds employees unclear about the organization's mission. Which box is the problem?",o:["Rewards","Purpose","Helpful mechanisms","Relationships"],a:1,e:"Weisbord's six boxes: purposes, structure, relationships, rewards, leadership, helpful mechanisms. Mission clarity lives in the purposes box."},
{id:"q878",m:"m10",t:"k",s:"In the Burke-Litwin model, which factor is a transformational (deep change) driver rather than transactional?",o:["Organizational culture","Work unit climate","Task and individual skills","Management practices"],a:0,e:"Burke-Litwin: transformational factors (mission, leadership, culture) drive fundamental change; transactional factors (climate, systems, practices) drive incremental change."},
{id:"q879",m:"m10",t:"sj",s:"A tech division faces constant market shifts. Which change approach fits BEST?",o:["Episodic: freeze, change, refreeze every three years","One big-bang reorg","Continuous: build ongoing sensing and small adaptive changes into routines","No planned change at all"],a:2,e:"Weick and Quinn: in turbulent environments, continuous change through ongoing adaptation outperforms episodic freeze-change-refreeze cycles."},
{id:"q880",m:"m10",t:"k",s:"Appreciative Inquiry's 4-D cycle is:",o:["Define, measure, analyze, improve","Discovery, dream, design, destiny","Data, debate, decide, deliver","Diagnose, direct, do, document"],a:1,e:"Appreciative Inquiry builds change from strengths: discover what works, dream the ideal, design the path, and destiny (live it)."},
{id:"q881",m:"m10",t:"k",s:"Double-loop learning (Argyris) differs from single-loop learning because it:",o:["Is twice as fast","Requires two trainers","Only applies to executives","Questions the underlying assumptions and governing values, not just corrects errors"],a:3,e:"Argyris: single-loop learning fixes errors within existing assumptions; double-loop learning questions whether the assumptions themselves are wrong."},
{id:"q882",m:"m10",t:"sj",s:"An executive team never discusses a failed product launch; the topic is undiscussable. What is the BEST intervention?",o:["Pretend it never happened","Fire the product lead","Commission a competitor analysis","Use a structured exercise (e.g., the left-hand column) to surface the undiscussable safely"],a:3,e:"Argyris's defensive routines protect people from embarrassment but block learning. Structured reflection makes the undiscussable discussable."},
{id:"q883",m:"m10",t:"k",s:"In Nonaka's SECI model of knowledge creation, tacit knowledge becomes explicit through:",o:["Socialization","Externalization","Combination","Internalization"],a:1,e:"Nonaka's SECI: socialization (tacit to tacit), externalization (tacit to explicit, e.g., documenting expertise), combination, internalization."},
{id:"q884",m:"m10",t:"k",s:"Wenger's communities of practice are defined by three elements:",o:["Domain, community, practice","Budget, headcount, location","Plan, budget, schedule","Hire, train, retain"],a:0,e:"Wenger: communities of practice share a domain of interest, a community of relationships, and a shared practice. They are voluntary and cross boundaries."},
{id:"q885",m:"m10",t:"sj",s:"After an engagement survey, what is the BEST OD use of the results?",o:["HR drafts action plans centrally","Publish scores with no follow-up","Feed the data back to teams for joint diagnosis and action planning","Survey again in a month"],a:2,e:"Mann's survey feedback: data has power only when fed back to those who own it, so teams diagnose and act together. Central plans miss local context."},
{id:"q886",m:"m10",t:"k",s:"Schein's process consultation means the consultant:",o:["Redesigns the org chart","Helps the client perceive, understand, and act on process events themselves","Takes over the project","Writes the strategy"],a:1,e:"Schein's process consultation builds client capability: the consultant facilitates the client's own diagnosis and action rather than prescribing solutions."},
{id:"q887",m:"m10",t:"k",s:"At the base of Lencioni's five dysfunctions of a team pyramid is:",o:["Absence of trust","Fear of conflict","Lack of commitment","Inattention to results"],a:0,e:"Lencioni's pyramid: absence of trust enables fear of conflict, which blocks commitment, accountability, and results. Trust is the foundation."},
{id:"q888",m:"m10",t:"sj",s:"A new cross-functional team is polite but avoids debating ideas, and decisions are weak. What is the BEST intervention?",o:["Add more members","Remove the quiet members","Establish norms that mine for healthy conflict and make dissent safe","Meet less often"],a:2,e:"The team is stuck at fear of conflict. Productive ideological conflict, with norms that protect people while challenging ideas, unlocks commitment."},
{id:"q889",m:"m10",t:"k",s:"In the GRPI model of team effectiveness, which element comes first?",o:["Interpersonal relationships","Processes and procedures","Roles","Goals"],a:3,e:"GRPI: Goals first, then Roles, Processes, and Interpersonal relationships. Teams that skip goal clarity fight about everything downstream."},
{id:"q890",m:"m10",t:"k",s:"Katzenbach and Smith distinguish a real team from a working group by:",o:["Mutual accountability for a common purpose","Size","Having a leader","Meeting weekly"],a:0,e:"Katzenbach and Smith: a real team holds itself mutually accountable for shared purpose and goals; a working group coordinates individual accountabilities."},
{id:"q891",m:"m10",t:"sj",s:"Two executives both believe they are the decider on a reorg, and decisions stall. Using RAPID, what is the BEST fix?",o:["Let them alternate decisions","Escalate every decision to the CEO","Vote on each decision","Clarify a single D (decider); others give input or agree per their roles"],a:3,e:"RAPID fails with two Ds. One decider with clear input and agree roles unblocks decisions; the ambiguity is a design flaw, not a people problem."},
{id:"q892",m:"m10",t:"k",s:"Under the Vroom-Yetton-Jago decision model, an autocratic (AI) style fits BEST when:",o:["Team acceptance is critical and time is ample","The leader has the information, acceptance matters little, and speed matters","The problem is unstructured","The team must develop"],a:1,e:"Vroom-Yetton-Jago: match style to situation. Autocratic fits when the leader has the facts, commitment is not critical, and time is short."},
{id:"q893",m:"m10",t:"k",s:"A premortem (Klein) asks the team to:",o:["Predict stock prices","Review past successes","Imagine the project has failed and generate plausible reasons why","Assign blame early"],a:2,e:"Klein's premortem uses prospective hindsight: imagining failure legitimizes doubt and surfaces risks that optimism and groupthink suppress."},
{id:"q894",m:"m10",t:"sj",s:"An executive team shows groupthink: self-censorship, illusion of unanimity, pressure on dissenters. What is the BEST remedy?",o:["Replace the team","Demand faster consensus","Assign a devil's advocate and create anonymous channels for dissent","Hold meetings offsite"],a:2,e:"Janis's groupthink antidotes: legitimize dissent structurally through a devil's advocate, anonymous input, and outside experts."},
{id:"q895",m:"m10",t:"k",s:"The Abilene paradox describes a team that:",o:["Fights constantly","Agrees to an action that no member actually wants","Never meets","Has no leader"],a:1,e:"Harvey's Abilene paradox: mismanaged agreement, where everyone goes along with a decision nobody privately supports."},
{id:"q896",m:"m10",t:"k",s:"In the 4 Disciplines of Execution, lead measures differ from lag measures because lead measures:",o:["Are reported annually","Cannot be measured","Only track revenue","Are influenceable and predictive of the goal"],a:3,e:"4DX: lag measures track the goal itself; lead measures track the high-leverage behaviors that drive it and can be influenced week to week."},
{id:"q897",m:"m10",t:"sj",s:"An OKR rollout is failing: objectives are vague and key results read like task lists. What is the BEST fix?",o:["Rewrite key results as measurable outcomes, not activities, and coach teams on the distinction","Abandon OKRs","Add more objectives","Grade OKRs for bonuses"],a:0,e:"OKRs fail when key results are tasks ('launch campaign') instead of outcomes ('generate 500 qualified leads'). Outcome-based KRs enable accountability."},
{id:"q898",m:"m10",t:"k",s:"The first phase of design thinking, applied to HR programs, is:",o:["Ideate","Empathize","Prototype","Test"],a:1,e:"Design thinking starts with empathy: deeply understanding employees' needs before defining problems, ideating, prototyping, and testing."},
{id:"q899",m:"m10",t:"sj",s:"Journey mapping shows new hires decide whether to stay based on their first week, especially the manager one-on-one. What is the BEST redesign?",o:["More paperwork on day one","Longer orientation videos","Redesign onboarding around that moment: equip managers for a great first-week one-on-one","Fewer check-ins"],a:2,e:"Moments that matter: invest disproportionately where experience shapes attitudes. A strong first-week manager conversation beats more orientation content."},
{id:"q900",m:"m10",t:"k",s:"Organizational network analysis (ONA) is MOST useful in change efforts for:",o:["Identifying informal influencers, brokers, and bottlenecks","Calculating payroll","Designing logos","Writing policies"],a:0,e:"Organizational network analysis maps real influence flows, revealing hidden champions and bottlenecks that org charts miss."},
{id:"q901",m:"m10",t:"sj",s:"A change readiness assessment shows one division is ready and another is deeply skeptical after a failed rollout last year. What is the BEST sequencing?",o:["Launch everywhere at once for fairness","Start with the skeptics to convert them","Delay indefinitely","Start where readiness is high, build visible wins, then expand with lessons learned"],a:3,e:"Sequence for momentum: early wins in ready areas create proof and pull. Forcing change on burned skeptics first repeats the last failure."},
{id:"q902",m:"m10",t:"k",s:"Chin and Benne's normative-reeducative change strategy assumes people change when:",o:["Given more data","Ordered by authority","Paid bonuses","Their values, norms, and relationships shift"],a:3,e:"Chin and Benne's three strategies: empirical-rational (facts and self-interest), normative-reeducative (values, norms, relationships), power-coercive (authority)."},
{id:"q903",m:"m10",t:"sj",s:"After layoffs, remaining employees show survivor syndrome: anxiety, guilt, and disengagement. What is the BEST response?",o:["Acknowledge the loss, explain the rationale honestly, and visibly invest in those who remain","Tell them to be grateful they have jobs","Avoid discussing the layoffs","Increase workloads immediately"],a:0,e:"Survivors judge fairness on procedural and interactional justice. Honest rationale plus visible investment rebuilds the psychological contract."},
{id:"q904",m:"m10",t:"sj",s:"After a promised promotion track is quietly shelved during a reorg, a high performer disengages. What is the BEST response?",o:["Tell them informal promises do not count","Acknowledge the perceived breach, explain honestly, and renegotiate a credible path","Ignore the disengagement","Offer a title change with no real change"],a:1,e:"Rousseau's psychological contract: perceived broken promises erode trust fast. Acknowledge, explain, and explicitly renegotiate."},
{id:"q905",m:"m10",t:"sj",s:"This is the third reorganization in two years and cynicism is high ('flavor of the month'). What is the BEST first step?",o:["Launch the reorg with more fanfare","Rebrand the reorg","Audit the change portfolio: pause or kill lower-priority initiatives to protect capacity","Blame prior leadership"],a:2,e:"Change saturation guarantees failure. A portfolio audit that visibly kills competing demands restores credibility and capacity."},
{id:"q906",m:"m10",t:"sj",s:"Enrollment in the high-deductible health plan is low despite repeated communications. What is the BEST nudge?",o:["Make it the default with easy opt-out, plus a decision aid at enrollment","Mandate the plan","Send more emails","Cut the other plans"],a:0,e:"Nudges (Thaler and Sunstein) steer through choice architecture, defaults and timely prompts, while preserving freedom of choice."},
{id:"q907",m:"m10",t:"k",s:"The COM-B model says behavior change requires:",o:["Cash, offices, meetings, bonuses","Capability, opportunity, and motivation","Charisma, optimism, modesty, boldness","Control, order, measurement, bureaucracy"],a:1,e:"Michie's COM-B: people act when they have the Capability, the Opportunity, and the Motivation. Diagnose which leg is missing before intervening."},
{id:"q908",m:"m10",t:"k",s:"Self-determination theory (Deci and Ryan) holds that intrinsic motivation depends on:",o:["Pay, promotion, praise","Competition, ranking, rewards","Autonomy, competence, and relatedness","Fear, uncertainty, doubt"],a:2,e:"Deci and Ryan's self-determination theory: autonomy, competence, and relatedness fuel intrinsic motivation; controlling rewards can crowd it out."},
{id:"q909",m:"m10",t:"k",s:"The job demands-resources model predicts burnout when:",o:["Pay is low","Hours are short","Teams are small","Job demands chronically exceed job resources"],a:3,e:"Bakker and Demerouti's job demands-resources model: strain results from high demands plus low resources; resources like autonomy and support buffer demands."},
{id:"q910",m:"m10",t:"sj",s:"Launching 360-degree feedback, managers fear it will become a weapon. What is the BEST design?",o:["Tie it to bonuses immediately","Let anyone rate anyone publicly","Start developmental-only: rater anonymity thresholds, no pay linkage in year one, coaching on interpretation","Skip 360s entirely"],a:2,e:"Trust first: developmental-only 360s with anonymity minimums build honest feedback habits. Linking to pay too early invites gaming and fear."},
{id:"q911",m:"m10",t:"k",s:"Charan's leadership pipeline emphasizes that each passage (e.g., managing self to managing others) requires:",o:["A bigger office","More direct reports only","An MBA","New skills, new time horizons, and new values, including letting go of old behaviors"],a:3,e:"Charan's leadership pipeline: each passage demands new skills, time applications, and work values. Derailment often comes from clinging to prior-passage habits."},
{id:"q912",m:"m10",t:"sj",s:"A new plant manager inherits a turnaround situation (Watkins' STARS). What is the BEST first-90-days approach?",o:["Rapid diagnosis, early wins, and building the team while learning fast","Make no changes for a year","Copy the last manager's playbook","Focus only on cost cutting"],a:0,e:"Watkins' STARS: turnarounds demand fast learning, decisive early wins, and team upgrades. Sustaining-success tactics fail here."},
{id:"q913",m:"m10",t:"k",s:"The Competing Values Framework (Cameron and Quinn, OCAI) describes four culture types:",o:["Tall, flat, matrix, network","Clan, adhocracy, market, hierarchy","Open, closed, random, synchronous","Founder, growth, maturity, decline"],a:1,e:"Cameron and Quinn's Competing Values Framework maps culture on flexibility vs stability and internal vs external focus: clan, adhocracy, market, hierarchy."},
{id:"q914",m:"m11",t:"sj",s:"An expat's partner cannot obtain a work permit in the host country and is miserable. Assignment success is at risk. What is the BEST intervention?",o:["Tell the expat to focus on work","Extend the assignment to give it time","Provide dual-career support: remote-work options, local networking, education or volunteering pathways","Replace the expat immediately"],a:2,e:"Spouse and partner maladjustment is the top cause of expatriate failure. Dual-career and partner support programs directly address the leading risk."},
{id:"q915",m:"m11",t:"k",s:"Beyond technical competence, the strongest predictor of expatriate success is:",o:["Cultural adaptability, resilience, and family willingness","Seniority","Language fluency alone","Prior travel experience"],a:0,e:"Research: adaptability, open-mindedness, and family support predict assignment success far better than technical skill or seniority."},
{id:"q916",m:"m11",t:"k",s:"Which cross-cultural training method is MOST effective for preparing expats?",o:["Lectures on customs","Reading guidebooks","Watching documentaries","Experiential methods: simulations, role plays, and field exercises"],a:3,e:"Experiential training builds behavioral flexibility; didactic methods build awareness but transfer less to real interactions."},
{id:"q917",m:"m11",t:"k",s:"Cultural intelligence (CQ) comprises four capabilities:",o:["IQ, EQ, SQ, PQ","Metacognitive, cognitive, motivational, and behavioral","Listening, speaking, reading, writing","Planning, organizing, leading, controlling"],a:1,e:"Earley and Ang's CQ: metacognitive (strategy), cognitive (knowledge), motivational (drive), and behavioral (action) cultural capabilities."},
{id:"q918",m:"m11",t:"sj",s:"A star expat returns home and quits within eight months, citing a diminished role. What is the BEST prevention?",o:["Longer assignments","Higher expat pay","Repatriation planning: a role with real scope, debriefing, and knowledge-capture before return","Non-compete agreements"],a:2,e:"Repatriate turnover is driven by unclear roles and lost status. Planning the return role and capturing global knowledge prevents the revolving door."},
{id:"q919",m:"m11",t:"k",s:"Reverse culture shock refers to:",o:["The unexpected difficulty of readjusting to the home country after an assignment","Fear of flying home","Homesickness abroad","Culture shock in the host country"],a:0,e:"Returnees expect home to feel familiar, so re-entry disorientation hits harder than the original culture shock. Debriefing and support ease it."},
{id:"q920",m:"m11",t:"k",s:"A parent-country national (PCN) is:",o:["A local hire in the host country","An employee from headquarters' country working in a foreign subsidiary","A third-country hire","A remote contractor"],a:1,e:"PCNs come from HQ country; HCNs are host-country locals; TCNs are from neither. The staffing mix balances control, cost, and local insight."},
{id:"q921",m:"m11",t:"sj",s:"Expat costs are unsustainable. What is the BEST localization approach?",o:["Replace all expats immediately","Cut expat benefits","Hire only contractors","Phase the transition: develop HCN successors with structured knowledge transfer from outgoing expats"],a:3,e:"Localization succeeds through planned succession and knowledge transfer, not abrupt replacement, which destroys capability and relationships."},
{id:"q922",m:"m11",t:"k",s:"A commuter assignment differs from a traditional expatriate assignment in that the employee:",o:["Travels regularly to the host country while family remains home, with no relocation","Relocates permanently","Works only virtually","Stays less than a week"],a:0,e:"Commuter assignments suit nearby locations: regular travel without family relocation. They reduce cost but create travel fatigue and tax complexity."},
{id:"q923",m:"m11",t:"k",s:"Under tax equalization, the employer:",o:["Pays no tax","Lets the employee pay all taxes","Keeps the employee tax-neutral: the employee pays a hypothetical home-country tax and the company settles actual liabilities","Exempts the employee from filing"],a:2,e:"Tax equalization: the expat pays hypothetical tax (as if never assigned); the company pays actual home and host taxes. Tax protection only reimburses if taxes are higher."},
{id:"q924",m:"m11",t:"k",s:"Hypothetical tax in expatriate compensation is:",o:["An illegal deduction","The estimated home-country tax withheld from the expat to keep them tax-neutral","A host-country penalty","A bonus"],a:1,e:"Hypo tax withholds what the employee would have paid at home, funding the equalization system so assignments create neither windfalls nor penalties."},
{id:"q925",m:"m11",t:"sj",s:"Employees resist assignments to a difficult location despite the premium. What is the BEST response?",o:["Increase the premium until someone accepts","Force the assignment","Cancel the business plan","Review the full package: hardship differential, R and R leave, security, housing, and family support, using benchmarked data"],a:3,e:"Hardship acceptance depends on the total experience: differentials, rest and recuperation, security, and family provisions matter more than cash alone."},
{id:"q926",m:"m11",t:"k",s:"Split payroll for expatriates means:",o:["Pay is delivered partly in home-country and partly in host-country currency and accounts","Two employers share one worker","Pay is split between two employees","Payroll is run twice a month"],a:0,e:"Split payroll meets obligations in both countries: home-country currency for ongoing commitments, host currency for living costs, aiding tax and social security compliance."},
{id:"q927",m:"m11",t:"k",s:"A shadow payroll is used to:",o:["Hide compensation","Pay under the table","Report host-country tax and social obligations for an expat paid from home-country payroll, without actual host payment","Avoid all taxes"],a:2,e:"Shadow payrolls create host-country reporting and withholding compliance for expats on home payroll, without duplicating actual pay."},
{id:"q928",m:"m11",t:"k",s:"Social security totalization agreements:",o:["Eliminate all social taxes","Prevent dual social security taxation for workers on cross-border assignments","Set global benefit levels","Apply only to executives"],a:1,e:"Totalization agreements (the US has 30+) let expats pay into one country's system, avoiding double social security tax during assignments."},
{id:"q929",m:"m11",t:"sj",s:"The company needs talent in a country where it has no entity, quickly. What is the BEST approach?",o:["Use a vetted employer of record (EOR) while assessing misclassification and permanent-establishment risk","Hire them as contractors regardless of duties","Open an entity overnight","Put them on tourist visas"],a:0,e:"EORs enable fast, compliant hiring without an entity, but HR must still assess contractor misclassification and permanent-establishment exposure."},
{id:"q930",m:"m11",t:"sj",s:"The company posts engineers to Germany for eight months on home-country pay that undercuts local rates. What is the risk?",o:["No risk; home terms govern","Only a tax issue","Minor paperwork fine","Violation of the Posted Workers Directive: core host-country terms including pay apply"],a:3,e:"The EU Posted Workers Directive requires core host-country employment terms, including pay. The 2018 revision strengthened equal pay for equal work at the same place."},
{id:"q931",m:"m11",t:"k",s:"The EU Working Time Directive sets:",o:["No limits","A 48-hour maximum average workweek and minimum paid annual leave of four weeks","A 40-hour week with no exceptions","Unlimited overtime"],a:1,e:"The directive caps average weekly hours at 48 (opt-outs possible) and mandates at least four weeks' paid leave, far above US statutory minimums."},
{id:"q932",m:"m11",t:"sj",s:"A German works council blocks a planned engagement survey over data concerns. What is the BEST path forward?",o:["Run it anyway","Drop surveys in Germany","Establish a lawful basis, anonymize and aggregate data, complete a data protection impact assessment, and co-design with the council","Survey only managers"],a:2,e:"German co-determination gives works councils real power over employee data. Lawful basis, anonymization, DPIAs, and co-design are the compliant route."},
{id:"q933",m:"m11",t:"k",s:"German codetermination means:",o:["Employees elect representatives to supervisory boards of large companies","Unions set all wages","No terminations allowed","Government runs HR"],a:0,e:"Under the Codetermination Act, employees elect up to half the supervisory board in large German companies, embedding labor voice in governance."},
{id:"q934",m:"m11",t:"k",s:"A European Works Council must be established when a multinational has:",o:["Any EU employee","100 employees in one country","Only unionized staff","At least 1,000 employees in the EU/EEA with 150+ in each of two or more countries"],a:3,e:"EWCs give employees information and consultation rights on transnational issues for large multinationals operating across EU/EEA states."},
{id:"q935",m:"m11",t:"sj",s:"The company acquires a UK service contractor and plans to cut transferred staff pay by 10 percent. What is the problem?",o:["None; the new employer sets terms","TUPE: transferred employees keep their terms and transfer-connected changes and dismissals are restricted","Only notice is required","It is fine after 30 days"],a:1,e:"The UK's TUPE regulations: on business transfers, employment terms carry over and transfer-connected dismissals or detrimental changes are restricted."},
{id:"q936",m:"m11",t:"sj",s:"A restructuring will cut 80 roles in France. Leadership wants to announce tomorrow. What must HR do?",o:["Announce as planned","Offer severance to speed it up","Pause: EU collective redundancy rules require informing and consulting employee representatives before decisions are final","Exclude France from the plan"],a:2,e:"EU collective redundancy directives require prior information and consultation aimed at avoiding or mitigating layoffs. Announcing first invites legal reversal."},
{id:"q937",m:"m11",t:"k",s:"Thirteenth-month pay in many countries is:",o:["A customary or legally required extra month's salary, often paid at year-end","A bonus for executives only","Overtime pay","Illegal"],a:0,e:"In much of Latin America, Europe, and Asia, a 13th (sometimes 14th) month is law, contract, or custom. Global comp planning must include it."},
{id:"q938",m:"m11",t:"k",s:"The US doctrine of at-will employment is:",o:["Universal worldwide","An outlier: most countries require notice, cause, or severance for termination","Required by the ILO","Banned in all states"],a:1,e:"At-will is a US exception. Most jurisdictions require just cause, notice periods, or statutory severance, making US-style quick terminations unlawful abroad."},
{id:"q939",m:"m11",t:"sj",s:"A key hire in California signed a non-compete, which California largely voids. What is the BEST protection?",o:["Sue anyway","Enforce it strictly","Do nothing","Rely on trade-secret protections, confidentiality agreements, and non-solicitation of customers and employees where lawful"],a:3,e:"California voids most non-competes. Protection comes from trade-secret law, strong confidentiality, and targeted non-solicitation clauses."},
{id:"q940",m:"m11",t:"k",s:"Best practice for a global employee handbook is:",o:["One identical handbook worldwide","No handbook at all","Core global standards plus country addenda addressing local law","Only local handbooks"],a:2,e:"Core-plus-addenda: global principles and standards with local supplements for legal and cultural requirements. One-size-fits-all violates local law."},
{id:"q941",m:"m11",t:"sj",s:"An employee wants to work remotely from another country for six months. What is HR's FIRST concern?",o:["Tax nexus and permanent-establishment risk, plus immigration and employment-law exposure","Laptop shipping costs","Time zones only","Office space"],a:0,e:"Cross-border remote work can create corporate tax presence, payroll obligations, and immigration violations. Assess nexus before approving duration and location."},
{id:"q942",m:"m11",t:"k",s:"Data residency requirements mean HR must:",o:["Delete all data","Store or process certain employee data within the country where it was collected","Share data freely","Avoid cloud systems"],a:1,e:"Countries such as Russia, China, and Vietnam require local storage of personal data. Global HRIS design must route and store data accordingly."},
{id:"q943",m:"m11",t:"sj",s:"A UK manager engages long-term contractors who work like employees. Under IR35, what is the BEST action?",o:["Keep them as contractors","Reclassify everyone as temporary","Assess employment status properly; if inside IR35, run them through payroll with PAYE","Ignore the rules"],a:2,e:"IR35: medium and large UK engagers must assess whether contractors are disguised employees, with PAYE liability for getting it wrong."},
{id:"q944",m:"m11",t:"sj",s:"A US manager's blunt negative feedback devastated a team member from a culture favoring indirect feedback. What is the BEST coaching?",o:["Tell the employee to toughen up","Stop giving feedback","Have HR deliver all feedback","Adapt the style: deliver criticism privately, frame with context, and separate the message from the person"],a:3,e:"Meyer's evaluating scale: direct negative feedback works in some cultures and wounds in others. Adapt delivery without diluting the message."},
{id:"q945",m:"m11",t:"k",s:"Meyer distinguishes task-based trust from relationship-based trust. Relationship-based trust is built through:",o:["Shared meals, personal connection, and time together","Contracts","Credentials","Performance metrics"],a:0,e:"In relationship-based cultures (much of Asia, the Middle East, Latin America), trust precedes business and grows through personal connection."},
{id:"q946",m:"m11",t:"k",s:"In principles-first persuasion cultures, effective arguments:",o:["Start with stories","Begin with concepts and theory, then move to application","Use only data","Avoid structure"],a:1,e:"Meyer's persuading scale: principles-first cultures (France, Germany) expect theory before practice; applications-first cultures (US) want cases and actions first."},
{id:"q947",m:"m11",t:"k",s:"Trompenaars' universalism vs particularism dimension describes:",o:["Language differences","Time orientation","Whether rules apply equally to all or bend for relationships and circumstances","Wealth gaps"],a:2,e:"Universalist cultures (US, Germany) prioritize consistent rules; particularist cultures (China, Venezuela) prioritize relationships and context in decisions."},
{id:"q948",m:"m11",t:"k",s:"The GLOBE study (House) extended Hofstede by:",o:["Measuring nine cultural dimensions of leadership across 60+ societies, including how cultures differ on charismatic and team-oriented leadership","Studying only Europe","Focusing on pay","Ignoring leadership"],a:0,e:"GLOBE surveyed 17,000 managers in 62 societies on nine dimensions, showing that effective leadership behaviors vary significantly by culture."},
{id:"q949",m:"m11",t:"k",s:"Polychronic (Hall) time cultures:",o:["Are always late","Value punctuality above all","Follow strict schedules","Handle multiple things at once and prioritize relationships over rigid schedules"],a:3,e:"Hall: monochronic cultures (Germany, US) schedule linearly and prize punctuality; polychronic cultures (Latin America, Middle East) flex time around relationships."},
{id:"q950",m:"m11",t:"sj",s:"A decision stalls in the Japanese office because stakeholders were not consulted before the meeting. What is the BEST approach?",o:["Force a vote","Practice nemawashi: build consensus through informal pre-consultation before formal decisions","Cancel the project","Escalate to HQ"],a:1,e:"Nemawashi (root-binding): Japanese decisions are pre-wired through informal stakeholder consultation. Meetings ratify consensus; they do not create it."},
{id:"q951",m:"m11",t:"k",s:"Guanxi in Chinese business refers to:",o:["A tax","A visa type","Networks of reciprocal relationships and obligation that facilitate trust and business","A labor law"],a:2,e:"Guanxi: deep reciprocal relationship networks. Business in China runs through trusted connections built over time, not just contracts."},
{id:"q952",m:"m11",t:"sj",s:"A public 'employee of the month' award embarrassed a high performer from a modesty-valuing culture. What is the BEST fix?",o:["Offer private, sincere recognition and let employees choose how they are recognized","Make awards bigger","Stop all recognition","Recognize only Western staff"],a:0,e:"Recognition norms vary: public praise motivates in some cultures and shames in others. Choice-based, culturally aware recognition works globally."},
{id:"q953",m:"m11",t:"k",s:"In seniority-oriented cultures (e.g., Japan, Korea), promotion primarily reflects:",o:["Individual heroics","Tenure, loyalty, and group harmony","Test scores","Negotiation skill"],a:1,e:"Seniority systems reward tenure and loyalty over individual performance. Merit-based fast-tracking can disrupt harmony and face."},
{id:"q954",m:"m11",t:"sj",s:"A local agent requests a small 'facilitation payment' to speed permits. What is the BEST response?",o:["Pay it; it is customary","Pay it but do not record it","Ask the agent to lower it","Refuse, document, report through compliance channels, and review third-party due diligence"],a:3,e:"Facilitation payments are illegal under the UK Bribery Act and risky under the FCPA. Refuse, document, report, and reassess the intermediary."},
{id:"q955",m:"m11",t:"k",s:"The UK Bribery Act is broader than the FCPA because it:",o:["Applies only in the UK","Covers only government officials","Covers bribery of private persons too, with an 'adequate procedures' defense for companies","Has no penalties"],a:2,e:"The UK Bribery Act criminalizes private-to-private bribery and corporate failure to prevent bribery, mitigated only by adequate compliance procedures."},
{id:"q956",m:"m11",t:"sj",s:"After Students for Fair Admissions (2023), legal challenges target corporate DEI programs. What is the BEST posture?",o:["Have counsel review programs: keep lawful practices (outreach, structured hiring), document business rationale, and avoid quotas or race-based preferences","End all DEI efforts","Ignore the ruling; it only affects colleges","Hide DEI programs"],a:0,e:"SFFA ended race-conscious admissions and chilled corporate DEI. Lawful programs rest on broad outreach, structured fair processes, and documented business reasons, not preferences."},
{id:"q957",m:"m12",t:"k",s:"The PLUS ethical decision-making model asks whether a decision aligns with:",o:["Profit, loss, utility, sales","Policies, Legal requirements, Universal values, and Self (would I be proud of this)","Peers, leaders, unions, shareholders","Past, present, future"],a:1,e:"The Ethics and Compliance Initiative's PLUS filter: Policies, Legal, Universal values, Self. It catches decisions that are technically legal but ethically wrong."},
{id:"q958",m:"m12",t:"sj",s:"You must choose between loyalty to a mentor who asks you to stay silent about misconduct and telling the truth to the board. This is Kidder's:",o:["Ethical fading","Moral disengagement","A compliance issue only","Truth vs loyalty: a right-versus-right dilemma"],a:3,e:"Kidder: the hardest dilemmas are right vs right (truth vs loyalty, individual vs community, short vs long term, justice vs mercy), not right vs wrong."},
{id:"q959",m:"m12",t:"k",s:"Ethical fading occurs when:",o:["The ethical dimensions of a decision fade from view, often through euphemisms like 'rightsizing'","Ethics training ends","Laws change","Employees quit"],a:0,e:"Tenbrunsel and Messick: language like 'aggressive accounting' hides the ethical stakes. Naming the ethics explicitly reverses the fade."},
{id:"q960",m:"m12",t:"k",s:"Bandura's moral disengagement includes all EXCEPT:",o:["Diffusion of responsibility","Dehumanizing victims","Seeking independent ethical counsel","Euphemistic labeling"],a:2,e:"Moral disengagement mechanisms (diffusion of responsibility, euphemisms, victim-blaming) let people act unethically while preserving self-image."},
{id:"q961",m:"m12",t:"sj",s:"A hiring manager keeps advancing referrals from their network, all demographically similar. What is the BEST intervention?",o:["Ban referrals","Let the manager decide","Report the manager","Require structured interviews and diverse slates so the process, not just intent, is fair"],a:3,e:"Bounded ethicality: good people make biased choices unconsciously. Structural fixes (structured interviews, slates) beat intent-based fixes."},
{id:"q962",m:"m12",t:"k",s:"Brown and Trevino's ethical leadership requires being both a moral person and a moral manager. A moral manager:",o:["Is privately virtuous","Explicitly communicates ethics, rewards ethical conduct, and disciplines violations","Avoids all conflict","Maximizes profit"],a:1,e:"Moral person (character) plus moral manager (actively leading ethics through communication, reinforcement, and accountability). One without the other fails."},
{id:"q963",m:"m12",t:"sj",s:"The CEO is ethical, but middle managers pressure teams to hit targets 'by any means.' What is the BEST fix?",o:["Align incentives and hold middle managers accountable for how results are achieved, not just results","More CEO speeches","Fire a scapegoat","Ignore it; tone at the top is enough"],a:0,e:"The 'mood in the middle' determines culture. Ethics must be embedded in incentives and middle-management accountability, not just executive messaging."},
{id:"q964",m:"m12",t:"k",s:"Paine's distinction: integrity-based (values) ethics programs differ from compliance-based programs in that they:",o:["Cost less","Need no training","Aspire to ethical ideals and self-governance, not just rule-following and punishment avoidance","Apply only to executives"],a:2,e:"Paine: compliance programs prevent violations; integrity programs cultivate ethical aspiration and empowered judgment. Best practice blends both."},
{id:"q965",m:"m12",t:"sj",s:"Aggressive sales targets are driving mis-selling, but revenue is up. The tempting answer is to keep the targets. What is the BEST action?",o:["Keep targets; revenue matters most","Redesign incentives: balance growth with conduct metrics and remove targets that reward misconduct","Hide the misconduct","Blame the salespeople only"],a:1,e:"Wells Fargo's lesson: incentives that reward only volume manufacture misconduct. Ethical leadership redesigns the system, not just punishes individuals."},
{id:"q966",m:"m12",t:"k",s:"Goodhart's law warns HR that:",o:["All metrics are useless","Laws always change","Surveys are biased","When a measure becomes a target, it ceases to be a good measure"],a:3,e:"Gaming follows targets: recruiters optimize time-to-fill by lowering quality. Balance metrics and audit for perverse effects."},
{id:"q967",m:"m12",t:"sj",s:"An executive's misconduct inflated results that triggered their bonus. What is the BEST action?",o:["Enforce the clawback policy and disclose as required; Dodd-Frank Section 954 mandates recovery of erroneously awarded pay","Let them keep it; it is in the past","Negotiate quietly","Blame the board"],a:0,e:"Dodd-Frank 954 requires listed companies to recover incentive pay based on misstated financials. Clawbacks align pay with real performance."},
{id:"q968",m:"m12",t:"k",s:"New York City Local Law 144 requires employers using automated employment decision tools to:",o:["Ban AI entirely","Disclose nothing","Conduct annual independent bias audits and notify candidates","Use only vendor defaults"],a:2,e:"Local Law 144 (2023): bias audits for AEDTs used in hiring and promotion in NYC, with public results and candidate notice. A model for spreading regulation."},
{id:"q969",m:"m12",t:"sj",s:"An AI screening tool speeds hiring but shows adverse impact against older applicants. The tempting answer is to keep it for efficiency. What is the BEST action?",o:["Keep it; efficiency wins","Validate the tool, audit for bias, add human oversight, and document the job-relatedness of its criteria","Use it only for junior roles","Hide the audit results"],a:1,e:"Efficiency never justifies discrimination. Validate, audit, keep humans in the loop, and ensure criteria are job-related and consistent with business necessity."},
{id:"q970",m:"m12",t:"k",s:"Colorado's 2024 AI Act imposes duties on deployers of AI used in consequential decisions (including employment) to:",o:["Ban all AI","Pay a tax","Self-certify once","Exercise reasonable care against algorithmic discrimination, with impact assessments and disclosures"],a:3,e:"Colorado's law creates a duty of reasonable care: impact assessments, bias mitigation, and notices when AI drives hiring and other consequential decisions."},
{id:"q971",m:"m12",t:"sj",s:"Leadership wants keystroke monitoring for remote staff. What is the BEST HR counsel?",o:["Install it secretly","Monitor only top performers","Require notice where laws demand it, limit to legitimate purposes, and weigh proportionality and trust costs","Track everything; data is neutral"],a:2,e:"Several states (Connecticut, New York) require monitoring notice. Beyond law, covert surveillance destroys trust; proportionality and transparency are the ethical floor."},
{id:"q972",m:"m12",t:"k",s:"Illinois' Biometric Information Privacy Act (BIPA) is notable because it:",o:["Requires written consent before collecting biometrics and allows private lawsuits without proof of harm","Bans all technology","Applies only to police","Has no penalties"],a:0,e:"BIPA: written release before collecting fingerprints, face geometry, or voiceprints, with a private right of action. HR tech (time clocks, AI interviews) must comply."},
{id:"q973",m:"m12",t:"sj",s:"A hiring manager wants to screen candidates' social media. What is the BEST policy?",o:["Screen everyone informally","Screen late-stage, consistently, for job-related reasons only, with documentation, avoiding protected-class information","Screen only diverse candidates","Use fake accounts to friend candidates"],a:1,e:"Social media screens risk bias and privacy invasion. Late-stage, consistent, job-related, documented screening with firewalls for protected information is the defensible approach."},
{id:"q974",m:"m12",t:"k",s:"The Employee Polygraph Protection Act generally:",o:["Requires polygraphs","Allows random testing","Applies only to executives","Prohibits most private employers from using lie detectors, with narrow exemptions"],a:3,e:"EPPA bans private-sector polygraph and similar tests for hiring and most investigations, with limited exemptions (security, ongoing investigations of loss)."},
{id:"q975",m:"m12",t:"sj",s:"A wellness program penalizes employees who skip biometric screenings with higher premiums. What is the BEST fix?",o:["Make participation truly voluntary with reasonable alternatives; penalties risk ADA and GINA violations","Increase the penalty","Apply it only to smokers","Hide the penalty in fine print"],a:0,e:"EEOC rules: wellness incentives must be voluntary with reasonable alternatives for those unable to participate. Coercive programs invite ADA and GINA claims."},
{id:"q976",m:"m12",t:"k",s:"The Pregnant Workers Fairness Act (2023) requires covered employers to:",o:["Provide paid maternity leave","Guarantee promotions","Provide reasonable accommodations for known limitations related to pregnancy, childbirth, or related conditions","Hire pregnant applicants preferentially"],a:2,e:"PWFA (effective 2023): reasonable accommodations for pregnancy-related limitations, absent undue hardship, mirroring the ADA framework."},
{id:"q977",m:"m12",t:"sj",s:"A nursing employee requests break time and a private space to pump. What is the BEST response?",o:["Deny it; she can wait","Provide reasonable break time and a private non-bathroom space, as the PUMP Act requires","Offer the restroom","Dock her pay punitively"],a:1,e:"The PUMP Act (2022) extends break-time and private-space protections to nursing employees; retaliation for asserting these rights is prohibited."},
{id:"q978",m:"m12",t:"k",s:"CROWN Acts (adopted in many states) prohibit discrimination based on:",o:["Hair texture and protective hairstyles associated with race","Clothing brands","Tattoos","Political views"],a:0,e:"CROWN (Creating a Respectful and Open World for Natural Hair): bans race-based hair discrimination in employment, addressing a long-standing bias."},
{id:"q979",m:"m12",t:"sj",s:"A manager wants to exclude a transgender employee from a client-facing role 'for the client's comfort.' What is the BEST response?",o:["Accommodate the client","Transfer the employee quietly","Ask the employee to hide their identity","Refuse: Bostock holds Title VII covers sexual orientation and transgender status; client preference is not a defense"],a:3,e:"Bostock v. Clayton County (2020): Title VII's 'because of sex' includes sexual orientation and transgender status. Customer preference never justifies discrimination."},
{id:"q980",m:"m12",t:"k",s:"The NLRB's McLaren Macomb (2023) decision holds that:",o:["Severance is illegal","Unions are banned","Overbroad non-disparagement and confidentiality clauses in severance agreements violate the NLRA","Employers must offer severance"],a:2,e:"McLaren Macomb: severance terms that broadly restrict employees' Section 7 rights (non-disparagement, confidentiality) are unlawful. Narrowly tailor them."},
{id:"q981",m:"m12",t:"sj",s:"Drafting severance for a reduction in force, what is the BEST approach to release language?",o:["The broadest release possible","Lawful, specific, and knowing: comply with OWBPA for over-40 workers, avoid overbroad restrictions, ensure consideration","Verbal agreements only","No release needed"],a:1,e:"OWBPA requires knowing and voluntary waivers for workers 40 and older: written, specific, consideration, revocation periods. Overbroad terms risk invalidation."},
{id:"q982",m:"m12",t:"k",s:"The Ending Forced Arbitration of Sexual Assault and Sexual Harassment Act (2022) provides that:",o:["All arbitration is banned","Employers choose the forum","State laws are preempted entirely","Survivors may void pre-dispute arbitration agreements for sexual assault and harassment claims"],a:3,e:"The 2022 Act lets survivors invalidate pre-dispute mandatory arbitration for sexual assault and harassment claims, preserving their choice of forum."},
{id:"q983",m:"m12",t:"sj",s:"Settling a harassment claim, the company wants a blanket NDA. What is the BEST approach?",o:["Respect the survivor's choice with narrowly tailored confidentiality; the Speak Out Act limits pre-dispute NDAs","Impose silence unilaterally","Refuse any settlement","Publicize the details"],a:0,e:"The Speak Out Act (2022) voids pre-dispute NDAs for assault and harassment. Post-dispute confidentiality must be the survivor's informed choice, narrowly drawn."},
{id:"q984",m:"m12",t:"k",s:"Upjohn warnings in internal investigations tell employee witnesses that:",o:["They must confess","They can stay silent","Counsel represents the company, not them, and the company controls privilege","They are fired"],a:2,e:"Upjohn warnings prevent misunderstandings: company counsel represents the organization, privilege belongs to the company, and the company may disclose."},
{id:"q985",m:"m12",t:"sj",s:"A witness demands absolute confidentiality before speaking. What is the BEST response?",o:["Promise total secrecy","Explain you will protect confidentiality to the extent possible but cannot promise absolute secrecy, and will guard against retaliation","Refuse to interview them","Share their name with the accused immediately"],a:1,e:"HR cannot promise absolute confidentiality; investigations require some disclosure. Promise protection from retaliation and limited need-to-know sharing instead."},
{id:"q986",m:"m12",t:"k",s:"Once litigation is reasonably anticipated, HR's duty is to:",o:["Issue a litigation hold: preserve relevant documents and suspend routine destruction","Delete old files quickly","Hide evidence","Ignore it until sued"],a:0,e:"The duty to preserve attaches at reasonable anticipation of litigation. Spoliation (destroying relevant evidence) brings sanctions and adverse inferences."},
{id:"q987",m:"m12",t:"sj",s:"A former employer asks about an ex-employee terminated for misconduct. What is the BEST response?",o:["Give a glowing review to avoid trouble","Share unproven rumors","Refuse all references","Provide truthful, documented, job-related information; qualified privilege protects good-faith references"],a:3,e:"Truthful, documented references enjoy qualified privilege. Never lie or embellish; 'name, rank, serial number' policies are safe but can backfire."},
{id:"q988",m:"m12",t:"k",s:"Negligent referral liability arises when an employer:",o:["Gives any reference","Checks references","Fails to disclose known, foreseeable danger posed by a former employee (e.g., violent history)","Hires slowly"],a:2,e:"Withholding known risks (violence, misconduct) when recommending someone can create liability if the danger was foreseeable and undisclosed."},
{id:"q989",m:"m12",t:"sj",s:"The company must rescind a signed offer; the candidate already resigned their job. What is the BEST action?",o:["Rescind with no explanation","Honor the commitment if possible; if truly impossible, explain honestly and offer transition support, recognizing promissory estoppel risk","Blame the candidate","Rescind by text"],a:1,e:"Promissory estoppel: candidates who reasonably rely on offers to their detriment may recover. Honor offers or mitigate the harm transparently."},
{id:"q990",m:"m12",t:"sj",s:"Recruiters routinely ghost finalists. What is the BEST standard?",o:["Close the loop with every finalist promptly and respectfully; it is an ethical and employer-brand obligation","Ghosting is efficient","Only notify hires","Let candidates figure it out"],a:0,e:"Candidate experience is an ethical practice: timely, respectful closure costs little and protects the employer brand and talent pipeline."},
{id:"q991",m:"m12",t:"sj",s:"A key employee resigns and the manager wants to counteroffer. What is the BEST counsel?",o:["Always counter; retention is everything","Never counter","Match any offer blindly","Diagnose why they are leaving first; counteroffers rarely fix root causes and most acceptors leave within a year"],a:3,e:"Counteroffers treat symptoms: data shows most employees who accept leave within a year. Address the underlying drivers or let them go well."},
{id:"q992",m:"m12",t:"k",s:"Employee referral programs risk homogeneity because of:",o:["Nepotism laws","Bonus costs","Homophily: people's networks mirror their own demographics","Union rules"],a:2,e:"Homophily means referrals replicate the current workforce's demographics. Structured outreach and diverse slates counterbalance referral hiring."},
{id:"q993",m:"m12",t:"sj",s:"A high-potential employee asks directly if they are on the succession slate. What is the BEST response?",o:["Lie to avoid pressure","Have an honest development conversation: affirm their potential, share growth areas, without rigid labels or promises","Show them the 9-box","Deny the slate exists"],a:1,e:"Transparency builds engagement: affirm potential and co-own development without promising promotions the business cannot guarantee."},
{id:"q994",m:"m12",t:"sj",s:"A manager wants a PIP designed to fail to justify a termination. What is the BEST response?",o:["Refuse: PIPs must offer genuine support, clear standards, and a real chance to succeed; a sham PIP is unethical and legally risky","Help draft the sham PIP","Skip the PIP and fire","Transfer the employee"],a:0,e:"Set-up-to-fail PIPs are dishonest and create pretext evidence. Genuine improvement plans or honest decisions are the only defensible paths."},
{id:"q995",m:"m12",t:"k",s:"The FTC's 2024 non-compete ban:",o:["Took full effect nationwide","Was upheld by all courts","Applies only to executives","Was blocked by courts, leaving state laws (many restricting non-competes) to govern"],a:3,e:"Courts enjoined the FTC's 2024 non-compete rule. State law controls: California, Oklahoma, Minnesota and others broadly restrict or ban them."},
{id:"q996",m:"m12",t:"sj",s:"Leadership wants a blanket return-to-office mandate. What is the BEST HR counsel?",o:["Mandate five days for all","Let everyone decide alone","Differentiate by role, pilot hybrid models, and measure collaboration and outcomes rather than attendance","Announce it by email Friday"],a:2,e:"Blanket mandates ignore role differences and evidence. Role-based flexibility, pilots, and outcome measurement produce better results and retention."},
{id:"q997",m:"m12",t:"k",s:"Right-to-disconnect principles hold that:",o:["Employees must answer 24/7","Employees should be free from routine after-hours work contact, with boundaries set by policy","Email is banned","Managers cannot work late"],a:1,e:"Several countries (France, Portugal, Australia) codify disconnection rights. Policies on after-hours contact protect recovery and prevent burnout."},
{id:"q998",m:"m12",t:"sj",s:"Unlimited PTO is offered but usage is low and burnout is rising. What is the BEST fix?",o:["Set minimum vacation expectations, have leaders model time off, and track usage","Remove PTO entirely","Shame low users","Keep the policy but discourage use"],a:0,e:"Unlimited PTO without norms suppresses usage through guilt and ambiguity. Minimums, leadership modeling, and tracking make the benefit real."},
{id:"q999",m:"m12",t:"k",s:"Predictive scheduling (fair workweek) laws typically require:",o:["No schedules","On-call only staffing","Unlimited hours","Advance notice of schedules, predictability pay for late changes, and good-faith hour estimates"],a:3,e:"Fair workweek laws (NYC, San Francisco, Seattle, others) target unstable hourly scheduling: advance notice, premium pay for changes, and access to hours."},
{id:"q1000",m:"m12",t:"sj",s:"A payroll audit reveals systematic underpayment of overtime. The tempting answer is to fix it quietly going forward. What is the BEST action?",o:["Fix quietly going forward","Blame payroll staff","Self-audit fully, remediate back pay with interest where required, fix controls, and consult counsel on disclosure","Wait for a complaint"],a:2,e:"Wage theft demands full remediation: back pay, corrected controls, and legal guidance on disclosure. Quiet prospective fixes leave liability compounding."},
);
</script>
<script>
"use strict";
