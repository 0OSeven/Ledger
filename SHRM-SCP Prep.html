{id:"g-m1-01",m:"m1",h:"Porter's Generic Strategies and HR Implications",b:"<p>Porter argued firms win through one of three generic strategies: <b>cost leadership</b> (lowest cost in the industry), <b>differentiation</b> (unique products or services commanding a premium), or <b>focus</b> (serving a narrow segment through either cost or differentiation). Firms with no clear strategy are 'stuck in the middle' and underperform.</p><ul><li><b>Cost leadership HR:</b> efficiency, tight staffing levels, standardized jobs, controlled labor costs, pay positioned at or below market.</li><li><b>Differentiation HR:</b> talent depth, creativity, innovation rewards, selective hiring, investment in development and employer brand.</li><li><b>Focus HR:</b> deep niche expertise, tailored selection criteria, retention of scarce specialists.</li><li><b>Exam trap:</b> HR practices must <b>fit</b> the strategy. Cutting training at a differentiation firm, or over-engineering selection at a cost leader, destroys strategic alignment.</li></ul>"},
{id:"g-m1-02",m:"m1",h:"SWOT and PESTLE as HR Planning Tools",b:"<p><b>SWOT</b> scans the <b>internal</b> environment (Strengths, Weaknesses) and the <b>external</b> environment (Opportunities, Threats). <b>PESTLE</b> structures the external scan: Political, Economic, Social, Technological, Legal, Environmental factors. HR uses both during strategic planning to anticipate workforce implications before they become crises.</p><ul><li><b>Worked mini-example:</b> a manufacturer planning a new plant runs PESTLE and spots a <b>Legal</b> shift (new state pay-transparency law) and a <b>Social</b> shift (shrinking skilled trades pipeline). SWOT reveals a <b>Weakness</b> (aging technician workforce) and a <b>Strength</b> (strong apprenticeship partnerships). HR's plan: accelerate apprentice hiring, audit job postings for transparency compliance, and build a succession pipeline for retirements.</li><li><b>Exam trap:</b> SWOT's internal/external split is the classic test point. A labor shortage is a <b>Threat</b> (external), not a weakness.</li></ul>"},
{id:"g-m1-03",m:"m1",h:"Ulrich's HR Model: The Four Roles",b:"<p>Dave Ulrich's model says HR creates value through four roles on two axes: strategic vs operational focus, and people vs process focus. SHRM-SCP scenarios constantly test whether HR is acting in the right role.</p><ul><li><b>Strategic partner:</b> aligns HR strategy with business strategy; speaks the language of finance and operations.</li><li><b>Change agent:</b> builds capacity for change, manages transitions, shapes culture.</li><li><b>Administrative expert:</b> delivers efficient, high-quality HR processes and shared services.</li><li><b>Employee champion:</b> advocates for employees, ensures their voices and concerns are heard.</li><li><b>Exam trap:</b> the model is a <b>balance</b>, not a ladder. A question praising a strategic HRBP who ignores broken payroll processes is testing whether you notice the neglected administrative-expert role. Later versions added 'HR leader' and 'credible activist,' but the original four roles are what the exam tests.</li></ul>"},
{id:"g-m1-04",m:"m1",h:"Mission, Vision, Values, HR Scorecard, Business Cases",b:"<p><b>Mission</b> is why the organization exists today; <b>vision</b> is the future it aspires to; <b>values</b> are the behavioral principles guiding how work gets done. HR embeds all three in hiring criteria, onboarding, performance standards, and recognition.</p><ul><li><b>HR scorecard:</b> maps HR activities to HR deliverables to strategic outcomes, giving a <b>line of sight</b> from HR metrics to business results. It answers 'how does HR create value,' not just 'what does HR do.'</li><li><b>Building a business case:</b> state the business problem in the leader's terms, quantify the cost of inaction (turnover cost, vacancy cost), propose the HR solution with expected ROI, and define how success will be measured.</li><li><b>Exam trap:</b> when a scenario asks HR to win over a skeptical executive, the correct move is diagnosing <b>their</b> business problem first, not lecturing about HR's importance.</li></ul>"},
{id:"g-m2-01",m:"m2",h:"Workforce Forecasting: Quantitative vs Qualitative",b:"<p><b>Quantitative methods</b> use numbers and historical data. <b>Trend analysis</b> projects past staffing patterns forward. <b>Regression analysis</b> links headcount to a business driver (for example, sales volume predicts customer-service staffing). <b>Markov analysis</b> uses transition probabilities: the historical rate at which employees in each job stay, get promoted, or leave, to forecast internal supply.</p><ul><li><b>Qualitative methods</b> use expert judgment. The <b>Delphi technique</b> collects anonymous forecasts from experts through rounds of questionnaires, with feedback between rounds until consensus emerges. The <b>nominal group technique</b> has experts generate ideas silently, then discuss and rank them, preventing dominant voices from skewing results.</li><li><b>Exam trap:</b> use quantitative methods when you have good data and stable conditions; use qualitative methods for new ventures, volatile markets, or long horizons. Markov analysis specifically forecasts <b>internal supply</b>, not demand.</li></ul>"},
{id:"g-m2-02",m:"m2",h:"Selection Validity: What Predicts Performance",b:"<p><b>Validity</b> is whether a selection tool measures what it claims and predicts job performance. <b>Criterion-related validity</b> correlates test scores with job performance. <b>Content validity</b> means the test samples actual job content (a typing test for a data-entry role). <b>Construct validity</b> means the test measures the intended psychological trait (conscientiousness, cognitive ability).</p><ul><li><b>What works best:</b> structured interviews, work samples, cognitive ability tests, and assessment centers show the strongest validity. <b>Unstructured interviews</b>, gut feel, and reference checks predict poorly and invite bias.</li><li><b>Exam trap:</b> a scenario with a manager hiring on 'culture fit vibes' is testing whether you push for structured, validated tools. Validity is about the <b>inference</b> drawn from a test, not the test itself: a valid typing test used to select managers has no validity for that purpose.</li></ul>"},
{id:"g-m2-03",m:"m2",h:"Reliability vs Validity and the 4/5ths Rule",b:"<p><b>Reliability</b> is consistency: the same tool gives the same result across time, raters, and items. <b>Validity</b> is accuracy: it measures the right thing and predicts performance. A tool can be reliable but invalid (a broken scale gives the same wrong weight every time); it cannot be valid without being reliable.</p><ul><li><b>Adverse impact and the 4/5ths rule:</b> a selection rate for any protected group below 80% of the highest group's rate signals adverse impact. <b>Worked example:</b> 50 white applicants, 40 hired (80% rate); 50 Black applicants, 25 hired (50% rate). 50 / 80 = 62.5%, below 80%, so adverse impact is indicated and the employer must validate the procedure as job-related and consistent with business necessity.</li><li><b>Exam trap:</b> the 4/5ths rule is a <b>rule of thumb for enforcement agencies</b>, not proof of discrimination, and passing it does not guarantee legality.</li></ul>"},
{id:"g-m2-04",m:"m2",h:"Onboarding vs Orientation: Bauer's 4 Cs",b:"<p><b>Orientation</b> is administrative and short: paperwork, policies, benefits enrollment. <b>Onboarding</b> is strategic and long: integrating the new hire into the role, team, and culture over the first 90 days to a year. Research consistently shows the first 90 days strongly predict retention and time to productivity.</p><ul><li><b>Bauer's 4 Cs</b> of onboarding: <b>Compliance</b> (rules and policies), <b>Clarification</b> (role expectations and success criteria), <b>Culture</b> (norms, values, unwritten rules), and <b>Connection</b> (relationships, networks, belonging). Programs reaching all four levels outperform paperwork-only onboarding.</li><li><b>Exam trap:</b> when new-hire turnover spikes, the fix is rarely 'better orientation.' Look for missing clarification (unclear expectations) and connection (isolation), plus realistic job previews during hiring so expectations match reality.</li></ul>"},
{id:"g-m2-05",m:"m2",h:"Job Analysis Methods in Brief",b:"<p>Job analysis is the foundation of job descriptions, selection criteria, and compensation. Key methods:</p><ul><li><b>O*NET:</b> the federal Occupational Information Network database of standardized occupational profiles (tasks, skills, abilities, work context). A fast, validated starting point for job analysis.</li><li><b>Critical incident technique:</b> collects specific examples of effective and ineffective job behaviors. Feeds behaviorally anchored rating scales and structured interview questions.</li><li><b>PAQ (Position Analysis Questionnaire):</b> a standardized, quantitative questionnaire scoring jobs on work behaviors and characteristics, useful for comparing dissimilar jobs.</li><li><b>Functional Job Analysis (FJA)</b> and <b>DACUM</b> (expert worker panels) are additional structured approaches.</li><li><b>Exam trap:</b> job analysis describes the <b>job</b>, not the person in it. Analyze vacant or typical positions, and update analysis before building selection tools or defending them in a discrimination claim.</li></ul>"},
{id:"g-m3-01",m:"m3",h:"Key Drivers of Employee Engagement",b:"<p>Engagement is emotional commitment plus discretionary effort toward organizational goals. It differs from <b>satisfaction</b>, which is passive contentment: satisfied employees may still do the minimum. The strongest, most consistent drivers:</p><ul><li><b>Manager quality:</b> the single biggest driver. Clarity of expectations, fairness, recognition, and genuine care from the direct supervisor outweigh most programs.</li><li><b>Meaningful work:</b> employees see how their work matters to customers, colleagues, or a larger purpose.</li><li><b>Growth and development:</b> career paths, learning opportunities, and regular feedback about progress.</li><li><b>Trust in leadership:</b> honest communication, consistent values, and follow-through on survey results and promises.</li><li><b>Exam trap:</b> engagement is <b>local</b>. Company-wide perks rarely move the needle; team-level action by managers does. When engagement drops in one department, investigate the manager before redesigning corporate programs.</li></ul>"},
{id:"g-m3-02",m:"m3",h:"Stay Interviews vs Exit Interviews",b:"<p><b>Stay interviews</b> are proactive conversations with current, valued employees about what keeps them and what might make them leave. <b>Exit interviews</b> collect reasons from departing employees. Both have value, but stay interviews prevent turnover while exit interviews only explain it.</p><ul><li><b>Use stay interviews when:</b> retention of key talent is the goal. Sample questions: 'What do you look forward to at work?', 'What are you learning here?', 'If you could change one thing about your role, what would it be?', 'What would tempt you to leave?'</li><li><b>Use exit interviews when:</b> diagnosing systemic patterns across many departures. Aggregate the data; individual exits are anecdotes.</li><li><b>Exam trap:</b> exit data is <b>biased</b>: departing employees sanitize answers, and you never hear from the people who stayed. A scenario asking how to reduce regretted turnover should point to stay interviews and manager action, not better exit surveys.</li></ul>"},
{id:"g-m3-03",m:"m3",h:"Turnover Types and the Turnover Rate Formula",b:"<p>Not all turnover is equal, and HR must classify it before acting:</p><ul><li><b>Voluntary</b> (employee chooses to leave) vs <b>involuntary</b> (termination, layoff).</li><li><b>Functional</b> (low performers leave; the organization benefits) vs <b>dysfunctional</b> (high performers leave; the organization is harmed).</li><li><b>Regretted</b> (the organization wishes the person had stayed) vs <b>unregretted</b>.</li><li><b>Turnover rate formula:</b> (number of separations during the period / average headcount during the period) x 100. <b>Worked example:</b> 15 separations in a year with an average headcount of 150 gives (15 / 150) x 100 = <b>10%</b> annual turnover.</li><li><b>Exam trap:</b> calculate dysfunctional or regretted turnover separately; a 10% rate driven by low-performer exits is healthy, while 10% concentrated among top performers is a crisis. Always segment by performance, tenure, and department before diagnosing.</li></ul>"},
{id:"g-m3-04",m:"m3",h:"Motivation Theories: What Each Predicts for HR",b:"<p>Four theories dominate exam questions, each with a distinct HR implication:</p><ul><li><b>Maslow's hierarchy:</b> needs progress from physiological to safety, belonging, esteem, and self-actualization. Predicts that unmet lower needs (pay, security) block higher motivation; HR must secure basics before purpose-driven programs work.</li><li><b>Herzberg's two-factor theory:</b> <b>hygiene factors</b> (pay, policies, supervision, conditions) prevent dissatisfaction but do not motivate; <b>motivators</b> (achievement, recognition, the work itself, growth) create satisfaction. Predicts that fixing complaints will not, by itself, engage anyone.</li><li><b>McClelland's acquired needs:</b> achievement, affiliation, and power drive people differently. Predicts matching roles to motives: high-need-achievers thrive on challenging goals with feedback.</li><li><b>Vroom's expectancy theory:</b> motivation = expectancy x instrumentality x valence. Predicts that effort collapses if employees doubt effort leads to performance, performance leads to rewards, or the rewards matter to them.</li></ul>"},
{id:"g-m4-01",m:"m4",h:"ADDIE and Three Levels of Needs Assessment",b:"<p><b>ADDIE</b> is the classic instructional design model: <b>Analysis</b> (what is needed and why), <b>Design</b> (objectives, content outline, methods), <b>Development</b> (build materials and pilots), <b>Implementation</b> (deliver the training), <b>Evaluation</b> (measure results and revise). It is iterative, not strictly linear.</p><ul><li><b>Needs assessment has three levels:</b> <b>organizational analysis</b> (does training align with strategy, and does the climate support it?), <b>task analysis</b> (what knowledge, skills, and abilities does the job require?), and <b>individual analysis</b> (who needs training, and do they have the ability and motivation to learn?).</li><li><b>Exam trap:</b> most training failures trace to skipped analysis. A scenario where training did not change behavior usually tests whether you diagnose the <b>real</b> cause first: it may be incentives, supervision, or hiring, not a knowledge gap. Never prescribe training before a needs assessment.</li></ul>"},
{id:"g-m4-02",m:"m4",h:"Kirkpatrick's Four Levels plus Phillips ROI",b:"<p><b>Kirkpatrick's model</b> evaluates training at four levels, each harder to measure but more valuable than the last:</p><ul><li><b>Level 1, Reaction:</b> did participants like it? Measured by smile sheets. Weak evidence of value.</li><li><b>Level 2, Learning:</b> did knowledge or skills increase? Measured by tests, simulations, demonstrations.</li><li><b>Level 3, Behavior:</b> are they applying it on the job? Measured by observation, 360 feedback, performance data weeks later.</li><li><b>Level 4, Results:</b> did business outcomes improve? Measured by productivity, quality, sales, turnover, safety incidents.</li><li><b>Phillips adds Level 5, ROI:</b> (net program benefits / program costs) x 100. <b>Example:</b> a $50,000 program yielding $200,000 in benefits has an ROI of 300%.</li><li><b>Exam trap:</b> high Level 1 scores with no Level 3 change means the transfer climate failed, not the training design. Isolate training's effects before claiming ROI.</li></ul>"},
{id:"g-m4-03",m:"m4",h:"The 70-20-10 Model and Adult Learning Principles",b:"<p>The <b>70-20-10 model</b> holds that roughly 70% of learning comes from on-the-job experience, 20% from relationships and feedback, and 10% from formal training. It is a <b>guideline for development investment</b>, not a precise scientific ratio, and it argues against over-relying on classroom events.</p><ul><li><b>Knowles' adult learning principles (andragogy):</b> adults need to know <b>why</b> they are learning, learn best through <b>experience</b> (including mistakes), want <b>self-direction</b>, learn when the content is <b>relevant</b> to real problems, and are driven more by <b>internal</b> motivation than external pressure.</li><li><b>Exam trap:</b> a scenario with disengaged trainees usually tests these principles: lecture-heavy, irrelevant, mandatory training violates all of them. The fix is problem-centered, experiential design with learner choice, not longer lectures.</li></ul>"},
{id:"g-m4-04",m:"m4",h:"Coaching vs Mentoring and the GROW Model",b:"<p><b>Coaching</b> is short-term, performance-focused, and agenda-driven: a coach helps an employee improve specific skills or solve current challenges, often using powerful questions rather than advice. <b>Mentoring</b> is longer-term and development-focused: a more experienced person guides career growth, shares wisdom, and opens networks. Coaching is about performance now; mentoring is about the career ahead.</p><ul><li><b>The GROW model</b> structures coaching conversations: <b>Goal</b> (what do you want?), <b>Reality</b> (where are you now?), <b>Options</b> (what could you do?), <b>Way forward</b> (what will you do, and by when?).</li><li><b>Exam trap:</b> managers who jump to advice-giving are not coaching. The exam rewards questions over telling, employee-owned action plans over manager-dictated ones, and matching the tool to the need: a struggling new supervisor needs coaching; a high-potential preparing for leadership needs mentoring.</li></ul>"},
{id:"g-m4-05",m:"m4",h:"Training Transfer: Why It Fails and How Managers Fix It",b:"<p><b>Training transfer</b> is applying learned skills on the job. Research consistently shows most training fails here: people return enthusiastic and revert within weeks. The dominant causes are a weak <b>transfer climate</b>, not weak training design.</p><ul><li><b>Why it fails:</b> no opportunity to practice, supervisors who do not reinforce or who model the old behavior, peer pressure to revert, and no accountability for applying new skills.</li><li><b>How managers fix it:</b> set expectations <b>before</b> training (what to learn and why it matters), debrief <b>after</b> (what will you apply this week?), provide practice opportunities, recognize early attempts, and hold people accountable in performance reviews.</li><li><b>Exam trap:</b> when a scenario shows good training with no behavior change, the answer is almost never 'more training' or 'better trainers.' It is manager reinforcement, opportunity to perform, and accountability. Transfer is a <b>management</b> problem first.</li></ul>"},
{id:"g-m5-01",m:"m5",h:"Lead, Lag, and Match Pay Strategies",b:"<p><b>Lead</b> the market (pay above competitors) to attract and retain scarce talent; <b>lag</b> (pay below market) to control labor costs at the risk of higher turnover; <b>match</b> (pay at market) to stay competitive without overspending. The choice is a business strategy decision, not just an HR preference, and it should align with how the company competes.</p><ul><li><b>Lead fits:</b> high-growth firms, tight labor markets, and roles where talent directly drives revenue such as critical tech, sales, and executive positions.</li><li><b>Lag fits:</b> cost-leadership strategies, mission-driven nonprofits that trade pay for purpose, or employers pairing below-market base pay with strong non-cash rewards.</li><li><b>Match fits:</b> most established employers seeking a sustainable balance of cost and competitiveness.</li><li>Strategies can be mixed by segment: lead on mission-critical roles while matching or lagging on others.</li><li><b>Exam trap:</b> lagging saves money short-term but fuels dysfunctional turnover; leading without a clear business case wastes margin and inflates internal equity problems.</li></ul>"},
{id:"g-m5-02",m:"m5",h:"Compa-Ratio, Pay Ranges, Quartiles, Broadbanding",b:"<p>A <b>pay range</b> has a minimum, midpoint (usually market rate), and maximum. <b>Compa-ratio</b> = employee pay divided by the range midpoint. It shows where someone sits relative to market: below 1.00 means below midpoint, above 1.00 means above. <b>Example:</b> an employee earning $60,000 in a range with a $65,000 midpoint has a compa-ratio of 0.92, meaning they are paid 8 percent below the market midpoint for the grade.</p><ul><li><b>Quartiles:</b> Q1 (minimum to 25th percentile) is typical for new or developing employees; Q2 to midpoint for solid performers; Q3 to Q4 for seasoned experts. Movement through quartiles should track performance and tenure, not just time served.</li><li><b>Broadbanding</b> collapses many narrow grades into a few wide bands, supporting flatter organizations, lateral growth, and managerial discretion. The trade-off is weaker internal equity control.</li><li><b>Exam traps:</b> a compa-ratio far below 1.00 paired with strong performance signals flight risk; a compa-ratio above 1.20 may signal the person should be promoted or the range is stale.</li></ul>"},
{id:"g-m5-03",m:"m5",h:"Job Evaluation Methods",b:"<p>Job evaluation establishes <b>internal equity</b>: the relative worth of jobs inside the organization, before market pricing sets external competitiveness. Four classic methods appear on the exam.</p><ul><li><b>Ranking:</b> simplest; whole jobs are ordered from most to least valuable by paired comparison. Fast and cheap but subjective, and it says nothing about how much more valuable one job is than another.</li><li><b>Classification:</b> jobs are slotted into predefined grades using written grade descriptions (the federal GS system is the famous example). Simple to administer but rigid when jobs do not fit the descriptions.</li><li><b>Point-factor:</b> the most quantitative and legally defensible. Jobs are scored on compensable factors such as skill, effort, responsibility, and working conditions, with weighted points summed into a total that determines the grade.</li><li><b>Market pricing:</b> jobs are valued by matching them to external salary survey data rather than internal comparison. Best for market-driven roles but vulnerable to survey quality.</li><li><b>Exam trap:</b> point-factor is the answer when the question asks for the most objective or defensible method.</li></ul>"},
{id:"g-m5-04",m:"m5",h:"Benefits: Cafeteria Plans, DB vs DC, ERISA",b:"<p>A <b>cafeteria plan</b> (Section 125) lets employees choose among benefits and pay their share with pre-tax dollars, lowering both employee and employer payroll taxes. Premium-only plans are the simplest form.</p><ul><li><b>Defined benefit (DB):</b> the employer promises a formula-based pension (for example, years of service times final salary). The employer bears the investment risk and must fund the obligation.</li><li><b>Defined contribution (DC):</b> the employer and employee contribute to individual accounts such as a 401(k). The employee bears the investment risk; the payout depends on contributions plus market performance.</li><li><b>ERISA</b> (1974) governs private-sector retirement and welfare plans: it sets participation, vesting, funding, fiduciary, and reporting standards. Key duties include acting solely in participants best interests, diversifying investments, and following plan documents.</li><li><b>Exam traps:</b> ERISA does not cover government or church plans; vesting schedules (cliff vs graded) determine when employer contributions become the employees.</li></ul>"},
{id:"g-m5-05",m:"m5",h:"Pay Equity Audits and Pay Compression",b:"<p>A <b>pay equity audit</b> compares pay for substantially similar work, controlling for legitimate factors such as experience, performance, location, and tenure. Unexplained gaps by sex, race, or other protected characteristics must be remediated, usually with targeted adjustments, and the methodology should be documented under attorney privilege where possible.</p><ul><li>Run audits proactively, not just after a complaint. Fix the system too: tighten starting-pay discipline, since most gaps originate in inconsistent starting offers and negotiation.</li><li><b>Pay compression</b> occurs when new-hire market rates approach or exceed the pay of experienced incumbents in the same role. It is a top driver of tenured-employee turnover and resentment.</li><li>Compression fixes include equity adjustments for incumbents, wider ranges, and hiring managers held accountable to internal equity, not just to filling the req.</li><li><b>Exam trap:</b> the scenario answer is rarely to cut the new hires pay; it is to adjust the incumbents and fix the process that created the gap.</li></ul>"},
{id:"g-m5-06",m:"m5",h:"2026 Update: Overtime Rule and Noncompetes",b:"<p>In <b>May 2026</b>, the Department of Labor formally rescinded the 2024 overtime rule. The prior thresholds are back in force: the salary-basis threshold for exempt status is <b>$684 per week ($35,568 per year)</b>, and the highly compensated employee (HCE) total-compensation level is <b>$107,432</b>. The 2024 rules automatic increases are gone.</p><ul><li>Meeting the salary threshold alone never creates an exemption: the employee must still pass a <b>duties test</b> (executive, administrative, professional, computer, or outside sales).</li><li>HR action: re-audit classifications made under the short-lived 2024 thresholds and confirm state thresholds, since several states set higher minimums than federal law.</li><li>The <b>FTC noncompete ban is dead</b>: the 2024 rule was vacated in court and abandoned, so noncompete enforceability is governed by <b>state law</b>. Many states restrict or ban noncompetes, especially for lower-wage workers.</li><li>HR action: review existing noncompete agreements against the law of each state where employees work; consider narrower tools such as non-solicitation and confidentiality agreements.</li></ul>"},
{id:"g-m6-01",m:"m6",h:"Progressive Discipline and the Seven Tests of Just Cause",b:"<p><b>Progressive discipline</b> applies increasingly serious consequences: verbal warning, written warning, final written warning or suspension, then termination. Each step must be documented, tied to a known rule, and applied consistently. Skipping steps is allowed for serious misconduct, but the file must show why.</p><ul><li>Arbitrators judge union discipline cases against <b>just cause</b>, measured by Daugherty seven tests: (1) the employee knew the rule and the consequences; (2) the rule is reasonable and related to business operations; (3) the employer investigated before acting; (4) the investigation was fair and objective; (5) there was substantial proof of the violation; (6) rules were applied equally without discrimination; (7) the penalty fits the offense and the employees record.</li><li>Failure on any test can overturn the discipline. Test 7 is why long-service employees with clean records often get reduced penalties.</li><li><b>Exam trap:</b> inconsistent discipline across employees doing the same thing fails test 6 and looks like discrimination.</li></ul>"},
{id:"g-m6-02",m:"m6",h:"NLRA Section 7, Section 8(a), TIPS and FORE",b:"<p><b>Section 7</b> gives employees the right to organize, bargain collectively, and engage in concerted activity for mutual aid or protection. These rights apply in non-union workplaces too: two or more employees discussing wages or working conditions are engaged in protected concerted activity.</p><ul><li><b>Section 8(a)</b> unfair labor practices by employers: (1) interfering with, restraining, or coercing Section 7 rights; (2) dominating or supporting a union; (3) discriminating in hiring or tenure to encourage or discourage union membership; (4) retaliating for filing charges or testifying; (5) refusing to bargain in good faith.</li><li>During a campaign, managers must avoid <b>TIPS</b>: Threats, Interrogation, Promises, Surveillance. They may use <b>FORE</b>: Facts, Opinions, Rules, Experience.</li><li><b>Exam traps:</b> asking employees how they will vote is interrogation; promising improvements if the union loses is an unlawful promise; sharing factual experience with unions is permitted.</li></ul>"},
{id:"g-m6-03",m:"m6",h:"Union Organizing: Cards, Elections, Bargaining Units",b:"<p>Organizing typically starts with <b>authorization cards</b> signed by employees. When at least <b>30 percent</b> of the proposed unit signs, the union can petition the NLRB for an election. The Board investigates, determines the appropriate <b>bargaining unit</b> (a group sharing a community of interest in wages, hours, and working conditions), and directs a secret-ballot election.</p><ul><li>The union wins with a majority of <b>votes cast</b> (50 percent plus one), not a majority of the unit. Low turnout can therefore decide the outcome.</li><li>After a win, the NLRB certifies the union as exclusive bargaining representative, triggering the duty to bargain in good faith. Election bars generally prevent a new election for 12 months.</li><li>Supervisors and managers are excluded from the Act coverage, which is why the supervisor definition is heavily litigated.</li><li><b>Exam trap:</b> card-check recognition is voluntary for the employer; the NLRB election is the Board-run path.</li></ul>"},
{id:"g-m6-04",m:"m6",h:"Bargaining Subjects and Grievance Arbitration",b:"<p><b>Mandatory subjects</b> (wages, hours, and other terms and conditions of employment) must be bargained in good faith, and the employer may not make unilateral changes while bargaining. <b>Permissive subjects</b> (for example, internal union affairs or the price of products) may be bargained but neither side can insist to impasse. <b>Illegal subjects</b> (for example, a closed shop or hot-cargo clause) cannot be bargained at all.</p><ul><li>Good-faith bargaining means meeting, exchanging proposals, and genuinely trying to reach agreement. It does not require making concessions or reaching a contract.</li><li><b>Grievance arbitration</b> is the final step of most contract grievance procedures. The arbitrator interprets the contract, applies the just-cause standard to discipline cases, and issues a binding award that courts rarely overturn.</li><li><b>Exam trap:</b> past practice can become an implied contract term; one-off exceptions granted loosely can bind the employer in future grievances.</li></ul>"},
{id:"g-m6-05",m:"m6",h:"2026 Update: Joint-Employer Rule Withdrawn",b:"<p>In <b>February 2026</b>, the NLRB withdrew its 2023 joint-employer rule and restored the <b>2020 standard</b>: a company is a joint employer only if it <b>possesses and exercises substantial direct and immediate control</b> over workers essential terms and conditions of employment.</p><ul><li>The withdrawn 2023 rule had treated reserved or indirect control as enough, which would have swept many franchisors, staffing-agency clients, and contractors into joint-employer status.</li><li>Under the restored standard, merely reserving the right to control in a contract, without actually exercising direct and immediate control, generally does not create joint employment.</li><li>HR action: review staffing, franchise, and vendor relationships for who actually sets schedules, pay, discipline, and supervision. Joint-employer status brings bargaining duties and shared liability for unfair labor practices.</li><li><b>Exam trap:</b> control must be both substantial and direct and immediate; indirect influence through a contractor middleman is not enough under the current rule.</li></ul>"},
{id:"g-m7-01",m:"m7",h:"Title VII, ADA, and ADEA: Coverage and Doctrines",b:"<p><b>Title VII</b> (15 or more employees) bars employment discrimination based on race, color, religion, sex (including pregnancy, sexual orientation, and gender identity under Bostock), and national origin. It covers hiring, firing, pay, promotion, and all terms and conditions.</p><ul><li><b>ADA</b> (15 or more employees) protects qualified individuals with disabilities: employers must provide reasonable accommodation unless it causes undue hardship (significant difficulty or expense). The 2008 amendments broadened the definition of disability, so the fight is usually over accommodation, not coverage.</li><li><b>ADEA</b> (20 or more employees) protects workers age 40 and older. Unlike Title VII, disparate impact claims require showing the practice was not based on a reasonable factor other than age.</li><li><b>BFOQ</b> (bona fide occupational qualification) is a narrow defense allowing discrimination only when the characteristic is reasonably necessary to the job essence; it never applies to race and almost never to color.</li><li><b>Exam trap:</b> know the thresholds cold: 15 for Title VII and ADA, 20 for ADEA.</li></ul>"},
{id:"g-m7-02",m:"m7",h:"FMLA Leave and FLSA Exempt Status",b:"<p><b>FMLA</b> provides up to <b>12 weeks</b> of unpaid, job-protected leave per year for a serious health condition, birth or adoption, or caring for a covered family member (26 weeks for military caregiver leave). Coverage requires: employer with <b>50 or more employees</b> within 75 miles, employee with <b>12 months</b> of service and <b>1,250 hours</b> worked in the prior year.</p><ul><li><b>FLSA</b> requires overtime at 1.5 times the regular rate for non-exempt employees working over 40 hours per week, plus minimum wage and child-labor rules.</li><li><b>Exempt status</b> requires three tests: salary basis (at least <b>$684 per week / $35,568 per year</b> under the restored pre-2024 rule), salary paid without regard to hours or quality of work, and a <b>duties test</b> in one category: executive, administrative, professional, computer, or outside sales.</li><li><b>Exam trap:</b> job titles do not determine exempt status; actual duties do. Misclassification creates back-pay liability for up to three years if willful.</li></ul>"},
{id:"g-m7-03",m:"m7",h:"Disparate Treatment vs Impact; Quid Pro Quo vs Hostile Environment",b:"<p><b>Disparate treatment</b> is intentional discrimination against a person because of a protected characteristic. Plaintiffs typically use the McDonnell Douglas burden-shifting framework: prima facie case, employer legitimate reason, then pretext. <b>Disparate impact</b> involves a neutral policy that disproportionately harms a protected group; the four-fifths rule flags it, and the employer must prove business necessity and job-relatedness.</p><ul><li>Sexual harassment has two forms. <b>Quid pro quo</b> (this for that) ties a tangible job benefit or harm to submission to sexual conduct; only supervisors can commit it. <b>Hostile work environment</b> requires unwelcome conduct that is severe or pervasive enough to alter working conditions, judged from a reasonable-person standard.</li><li>The Faragher/Ellerth defense can shield employers from hostile-environment liability when no tangible action occurred if the employer exercised reasonable care and the employee unreasonably failed to use the complaint process.</li><li><b>Exam trap:</b> a single severe incident (such as assault) can create a hostile environment; pervasiveness is not always required.</li></ul>"},
{id:"g-m7-04",m:"m7",h:"WARN, COBRA, IRCA, GINA, PDA, EPA, USERRA: One-Line Purposes",b:"<p>Seven statutes, one purpose each, all exam favorites.</p><ul><li><b>WARN:</b> employers with 100 or more employees must give 60 days written notice of mass layoffs or plant closings.</li><li><b>COBRA:</b> employers with 20 or more employees must let departing employees continue group health coverage at their own cost after qualifying events.</li><li><b>IRCA / I-9:</b> every employer must verify each new hires identity and work authorization; no knowing hire of unauthorized workers.</li><li><b>GINA:</b> bars use of genetic information, including family medical history, in employment decisions.</li><li><b>PDA:</b> pregnancy, childbirth, and related conditions must be treated like any other temporary disability.</li><li><b>Equal Pay Act:</b> equal pay for substantially equal work regardless of sex, with only narrow defenses (seniority, merit, production, or a factor other than sex).</li><li><b>USERRA:</b> service members get reemployment rights and protection from discrimination based on military service.</li></ul>"},
{id:"g-m7-05",m:"m7",h:"Retaliation Elements and EEOC Charge Response",b:"<p><b>Retaliation</b> requires three elements: (1) protected activity (filing a charge, complaining internally, participating in an investigation), (2) a materially adverse action (anything that might dissuade a reasonable worker from complaining, per Burlington Northern), and (3) a causal connection between the two. Timing alone can suggest causation, so the weeks after a complaint are the highest-risk period for any adverse action.</p><ul><li>When an <b>EEOC charge</b> arrives: issue a <b>litigation hold</b> immediately to suspend routine deletion of relevant documents, notify employment counsel, preserve personnel files and communications, and prepare a factual position statement. Never retaliate against the charging party.</li><li>Investigate the underlying allegations promptly and independently of the charge process; fixing a real problem early is both right and strategically smart.</li><li><b>Exam trap:</b> retaliation claims succeed even when the underlying discrimination claim fails, because the protected activity is the complaint itself.</li></ul>"},
{id:"g-m7-06",m:"m7",h:"2026 Updates: PWFA, Harassment Guidance, EO 11246, Noncompetes",b:"<p>Four 2025-2026 legal developments to know for the exam.</p><ul><li><b>PWFA predictable accommodations:</b> under the Pregnant Workers Fairness Act final rule, certain accommodations are deemed predictable and reasonable with <b>no documentation</b> required: sit/stand options, water, bathroom breaks, and food/drink breaks.</li><li><b>EEOC harassment guidance rescinded (January 2026):</b> the EEOC withdrew its 2024 enforcement guidance on harassment. Bostock remains binding Supreme Court precedent, and employers should still maintain strong anti-harassment policies and complaint procedures.</li><li><b>EO 11246 implementing regulations rescinded (October 2025):</b> the DOL rescinded the regulations implementing the federal-contractor affirmative action Executive Order, fundamentally changing contractor AAP obligations. Verify current requirements before advising on contractor compliance.</li><li><b>Noncompetes governed by state law:</b> with the FTC ban vacated and abandoned, enforceability depends entirely on state law, which varies widely and increasingly restricts noncompetes.</li></ul>"},
{id:"g-m8-01",m:"m8",h:"OSHA General Duty and Workers Comp Exclusive Remedy",b:"<p>The <b>general duty clause</b> (OSH Act Section 5(a)(1)) requires every employer to furnish a workplace free from <b>recognized hazards</b> likely to cause death or serious physical harm, even when no specific OSHA standard covers the hazard. OSHA cites it for ergonomic, heat, and workplace-violence hazards where standards are thin.</p><ul><li><b>Workers compensation</b> is a no-fault bargain: employees get prompt medical and wage-loss benefits without proving employer negligence, and in exchange the employer gets the <b>exclusive remedy</b> doctrine, meaning injured workers generally cannot sue the employer in tort for the same injury.</li><li>Exceptions are narrow: intentional harm by the employer and, in a few states, dual-persona or dual-capacity situations.</li><li>HR implications: maintain required OSHA logs, post the annual summary, run a genuine return-to-work program, and coordinate comp, FMLA, and ADA leave so one injury does not create three separate violations.</li><li><b>Exam trap:</b> exclusive remedy protects the employer from the employee lawsuit, not from OSHA citations or third-party claims.</li></ul>"},
{id:"g-m8-02",m:"m8",h:"Negligent Hiring, Retention, and Supervision",b:"<p>Employers owe a <b>duty of reasonable care</b> to protect others from foreseeable harm by their employees. Liability attaches when the employer knew or should have known of the risk and failed to act.</p><ul><li><b>Negligent hiring:</b> failing to check backgrounds before placing someone in a position of trust or public contact. The required diligence scales with the roles risk: a delivery driver or home healthcare aide demands far more screening than a back-office analyst.</li><li><b>Negligent retention:</b> keeping an employee after learning of dangerous behavior, threats, or misconduct. Once HR knows, the clock starts.</li><li><b>Negligent supervision:</b> failing to oversee, train, or discipline employees whose roles create foreseeable risks.</li><li>Defenses include compliant background checks (FCRA two-step adverse action process), documented reference checks, and prompt action on complaints.</li><li><b>Exam trap:</b> ban-the-box and state background-check limits constrain how you screen, but they do not eliminate the duty of reasonable care. Balance both.</li></ul>"},
{id:"g-m8-03",m:"m8",h:"Workplace Violence Prevention and Emergency Action Plans",b:"<p>Workplace violence has four types: criminal intent (robbery), customer or client violence, worker-on-worker violence, and domestic violence spilling into the workplace. A prevention program needs a clear policy, multiple reporting channels, a trained threat-assessment team, and de-escalation training for frontline staff.</p><ul><li>Take every threat seriously, investigate promptly, and coordinate with security and law enforcement where warranted. Domestic-violence spillover deserves the same structured response as internal threats.</li><li>OSHA requires a written <b>Emergency Action Plan</b> covering: procedures for reporting emergencies, evacuation routes and procedures, procedures to account for all employees after evacuation, rescue and medical duties, alarm systems, and training for each employees role.</li><li>Plans must be practiced, not just written: drills covering all shifts expose the gaps that paper plans hide.</li><li><b>Exam trap:</b> the EAP must account for every employee after evacuation; a plan without a headcount procedure is incomplete.</li></ul>"},
{id:"g-m8-04",m:"m8",h:"HR Data Privacy, Monitoring, and E-Discovery",b:"<p><b>HIPAA</b> applies to health plans, providers, and clearinghouses, not to HR generally. But medical information HR does hold (accommodation requests, FMLA certifications, drug-test results) must be kept confidential, stored separately from personnel files, and shared only on a need-to-know basis under the ADA.</p><ul><li><b>Employee monitoring</b> on company systems is generally permitted with a clear written policy and notice, but state wiretap laws vary: some require all-party consent for recording. Keystroke logging, email review, and GPS on company vehicles should all be disclosed in advance.</li><li><b>E-discovery and litigation holds:</b> once litigation is reasonably anticipated (an EEOC charge, a demand letter), HR must suspend routine deletion of relevant records, including emails, texts, and HRIS data. Failure to preserve can trigger spoliation sanctions and adverse-inference instructions.</li><li><b>Exam trap:</b> the hold duty starts when litigation is anticipated, not when a lawsuit is filed.</li></ul>"},
{id:"g-m8-05",m:"m8",h:"OSHA Recordables vs First Aid and Safety Incentive Pitfalls",b:"<p>An injury is <b>OSHA recordable</b> if it results in death, days away from work, restricted work or transfer, medical treatment beyond first aid, loss of consciousness, or a diagnosis by a licensed professional. <b>First aid</b> (bandages, butterfly bandages, tetanus shots, non-prescription medication at non-prescription strength, observation) is not recordable no matter how many times it is applied.</p><ul><li>Recordkeeping applies to employers with more than 10 employees in most industries; the annual summary must be posted February through April.</li><li><b>Safety incentive pitfalls:</b> programs that reward low injury rates discourage reporting and can constitute retaliation under OSHA rules. Injured workers hide injuries, hazards go uncorrected, and the data becomes fiction.</li><li>Reward the right behaviors instead: hazard reporting, near-miss submissions, safety participation, and corrective-action completion.</li><li><b>Exam trap:</b> disciplining an employee for reporting an injury on time is retaliation; a policy requiring prompt reporting is fine only if it is not used punitively.</li></ul>"},
{id:"g-m9-01",m:"m9",h:"Core HR Metrics and Formulas",b:"<p><b>Turnover rate</b> = (separations during period / average headcount) x 100. Example: 24 separations with average headcount of 300 gives 24/300 x 100 = 8%. Always separate voluntary from involuntary, and regretted from non-regretted; only regretted voluntary turnover signals a retention problem. <b>Cost per hire</b> = total recruiting costs / number of hires. Example: $120,000 in recruiting costs / 40 hires = $3,000 per hire. Include sourcing, advertising, agency fees, and recruiter time. <b>Time to fill</b> = days from requisition approval to offer acceptance; <b>time to start</b> runs to the first day of work. Example: req approved Jan 1, offer accepted Feb 10 = 40 days time to fill. <b>Revenue per FTE</b> = total revenue / full-time-equivalent headcount. Example: $50M / 250 FTEs = $200,000 per FTE. It is a productivity measure, so track trends and benchmark rather than reading one number alone. <b>Absenteeism rate</b> = (unplanned absence days / total scheduled workdays) x 100. Example: 45 / 5,000 x 100 = 0.9%. Exclude approved leave such as PTO and FMLA.</p><ul><li><b>Exam trap:</b> match the metric to the decision. Activity metrics (training hours, hires made) describe effort; outcome metrics (new-hire retention, revenue per FTE) describe impact. Questions often ask which metric proves a program actually worked.</li></ul>"},
{id:"g-m9-02",m:"m9",h:"Human Capital ROI and Financial Framing",b:"<p><b>Human capital ROI (HCROI)</b> = (revenue - (total operating expenses - human capital costs)) / human capital costs. It shows the return per dollar invested in people. <b>Program ROI</b> = (net program benefits - program costs) / program costs x 100. Example: a retention program costs $80,000 and avoids $400,000 in turnover costs, so ($400,000 - $80,000) / $80,000 x 100 = 400% ROI. <b>Turnover cost</b> per departure is commonly estimated at 50 to 200 percent of the role's annual salary, covering separation, vacancy coverage, recruiting, onboarding, and ramp-up productivity loss. Example: losing a $70,000 specialist at 100 percent cost = $70,000, so a $15,000 retention package that prevents it pays for itself several times over. <b>Utility analysis</b> (Brogden-Cronbach-Gleser) quantifies the dollar payoff of a valid selection system: higher validity, higher applicant volume, and lower selection ratios all increase the payoff.</p><ul><li><b>Exam trap:</b> finance speaks in dollars and risk. Frame HR proposals as expected value: cost of the intervention versus expected cost of failure (lawsuit exposure, turnover, brand damage). Prevention only persuades when it is quantified.</li></ul>"},
{id:"g-m9-03",m:"m9",h:"HRIS Selection and Implementation",b:"<p>Start with <b>requirements gathering</b>: document must-have versus nice-to-have capabilities, current workflow pain points, and compliance needs (payroll tax, I-9, EEO-1, state reporting) before talking to vendors. Score vendors on a weighted matrix and run scripted demos on your real scenarios, not vendor slideware. <b>Data integrity</b> is the foundation: define one system of record, standardize codes and naming, clean data before migration, and build validation rules and access controls. Bad data migrated into a new system just produces faster bad reports. Common <b>implementation pitfalls</b>: skipping change management and training, customizing the system to match broken processes instead of adopting best practices, underestimating data cleanup, weak executive sponsorship, and going live without parallel payroll testing.</p><ul><li><b>Exam trap:</b> when a question describes a failed implementation, the root cause is almost always people and process, not technology. The BEST answer involves requirements, governance, training, or phased rollout, not buying more software.</li></ul>"},
{id:"g-m9-04",m:"m9",h:"Evidence-Based HR and Data Storytelling",b:"<p><b>Evidence-based HR</b> means deciding from the best available evidence: scientific research, organizational data, professional expertise, and stakeholder values, not gut feel or vendor hype. <b>Correlation</b> shows two variables moving together; <b>causation</b> requires ruling out other explanations through experiments, controls, or longitudinal designs. Example: engagement correlates with performance, but good management may drive both, so mandating engagement activities company-wide on correlational data alone is risky. The safe sequence is correlate, then pilot with a control group, then scale what the pilot proves. <b>Data storytelling</b> turns analysis into decisions: context, then insight, then implication, then a recommended action, visualized clearly. Always set <b>operational definitions</b> (exactly what counts as time to fill in your company) so metrics stay comparable over time.</p><ul><li><b>Exam trap:</b> answer choices that jump from a correlation to a company-wide mandate are usually wrong. The BEST answer is the pilot, the controlled test, or the search for the third variable.</li></ul>"},
{id:"g-m9-05",m:"m9",h:"AI in Hiring: Validation and Oversight",b:"<p>AI hiring tools (resume screeners, video-interview analyzers, game-based assessments) must be <b>validated</b> like any selection procedure: criterion-related, content, or construct validity evidence, plus ongoing monitoring for <b>adverse impact</b> under the four-fifths rule. Validate on your own applicant population, not the vendor's marketing sample. Keep <b>human oversight</b>: AI should inform, not replace, human judgment, especially for final decisions; document the human review step. <b>NYC Local Law 144</b> requires employers using automated employment decision tools in New York City to conduct an independent bias audit, publish a summary, and give candidates notice with the option to request human review. Illinois restricts AI analysis of video interviews (consent and data-handling rules), and several states now require disclosure when AI is used in hiring. The exam trend is clear: AI tools carry the same legal duties as paper tests.</p><ul><li><b>Exam trap:</b> the vendor said it is bias-free is never a defense. The employer owns validation and adverse-impact liability for every tool it uses.</li></ul>"},
{id:"g-m10-01",m:"m10",h:"Change Models: Lewin, Kotter, ADKAR",b:"<p><b>Lewin's three-step model</b>: unfreeze (create urgency, surface why the status quo must change), change or transition (implement with support and communication), refreeze (anchor new behaviors in culture, systems, and rewards). <b>Kotter's 8 steps</b>: 1. create urgency, 2. build a guiding coalition, 3. form a strategic vision, 4. enlist volunteers by communicating the vision, 5. enable action by removing barriers, 6. generate short-term wins, 7. sustain acceleration, 8. institute change by anchoring it in culture. Step 1 is the most skipped and the most fatal to skip. <b>ADKAR</b> (Prosci) tracks change at the individual level: Awareness, Desire, Knowledge, Ability, Reinforcement. Diagnose which element is missing for a person or group and intervene there; training cannot fix a Desire problem.</p><ul><li><b>Exam trap:</b> questions describing resistance usually ask for the FIRST step. The answer is almost always urgency or coalition-building (Kotter steps 1-2), not the new software or the training schedule.</li></ul>"},
{id:"g-m10-02",m:"m10",h:"Performance Management Methods and Rating Errors",b:"<p><b>MBO (management by objectives)</b>: manager and employee jointly set measurable goals; appraisal judges goal achievement. Strength: alignment and clarity. Weakness: can ignore behaviors and encourage gaming. <b>BARS (behaviorally anchored rating scales)</b>: scales anchored with concrete behavioral examples of each performance level, built from critical incidents. Strength: reduces subjectivity. Weakness: expensive to develop. <b>360-degree feedback</b>: input from supervisor, peers, direct reports, and self. Best for development; risky for pay decisions because raters inflate when ratings affect compensation. <b>Calibration sessions</b>: managers meet to compare ratings against common standards, reducing inconsistency across teams. <b>Rating errors</b>: halo (one trait colors everything), horn (the reverse), leniency (everyone high), strictness (everyone low), central tendency (everyone in the middle), recency (only recent events count), and similarity bias (favoring people like the rater).</p><ul><li><b>Exam trap:</b> when ratings cluster with no differentiation, the fix is rater training plus calibration with evidence requirements, not forced distribution alone.</li></ul>"},
{id:"g-m10-03",m:"m10",h:"The 9-Box Grid for Succession",b:"<p>The <b>9-box grid</b> plots employees on performance (x-axis: low, medium, high) against potential (y-axis: low, medium, high), creating nine categories that drive talent decisions. <b>Stars</b> (high performance, high potential): accelerate with stretch assignments and retention focus. <b>High potentials</b> (medium performance, high potential): develop; they often need the right role or manager. <b>Key players</b> (high performance, medium potential): reward and retain in place; not everyone must be promotable. <b>Rough diamonds</b> (low performance, high potential): diagnose fit and coach. <b>Deadwood</b> (low performance, low potential): manage out. Judge potential by learning agility, aspiration, engagement, and ability, not just current output. Use calibration sessions to place people consistently, and never let the grid become a label employees can see.</p><ul><li><b>Exam trap:</b> succession depth means ready-now, ready-in-1-to-2-years, and ready-in-3-to-5-years candidates per critical role. Single-successor plans are fragile and score poorly.</li></ul>"},
{id:"g-m10-04",m:"m10",h:"Thomas-Kilmann Conflict Modes",b:"<p>The <b>Thomas-Kilmann model</b> maps conflict handling on assertiveness versus cooperativeness. <b>Competing</b> (high assertiveness, low cooperation): best for emergencies or unpopular but necessary decisions. <b>Collaborating</b> (high assertiveness, high cooperation): best when the issue matters and a win-win is possible, but slow. <b>Compromising</b> (mid on both): fast, partial satisfaction; good under time pressure. <b>Avoiding</b> (low on both): right for trivial issues or cooling off, wrong for festering problems. <b>Accommodating</b> (low assertiveness, high cooperation): right when the relationship matters more than the issue. No mode is always best; match the mode to the situation. <b>Structural causes</b> of conflict include unclear roles, scarce resources, incompatible goals, interdependence, status differences, and poor communication. Fix the structure (clarify roles, align incentives) rather than coaching personalities when conflict is chronic.</p><ul><li><b>Exam trap:</b> if the same two departments clash repeatedly, the BEST answer addresses the structural cause (shared goals, clarified handoffs), not another team-building event.</li></ul>"},
{id:"g-m10-05",m:"m10",h:"Tuckman Team Development Stages",b:"<p><b>Tuckman's stages</b>: <b>forming</b> (polite, dependent, unclear roles; the leader provides direction), <b>storming</b> (conflict over roles and approaches; the leader coaches through it, not around it), <b>norming</b> (cohesion, agreed norms, shared leadership emerges; the leader facilitates), <b>performing</b> (high trust, autonomy, results; the leader delegates), plus <b>adjourning</b> (disbanding; recognize contributions and capture lessons). Leaders often misdiagnose storming as failure and intervene too heavily or give up; it is a normal developmental stage. Match leadership style to the stage: directing in forming, coaching in storming, supporting in norming, delegating in performing. New members and new goals can recycle a team back to storming.</p><ul><li><b>Exam trap:</b> a question describing early team friction asks what the leader should do. The answer is normalize it and coach through role clarity, not replace members or add controls.</li></ul>"},
{id:"g-m11-01",m:"m11",h:"Expatriate Types and the Balance-Sheet Approach",b:"<p><b>Home-country nationals</b> are citizens of the country where the company is headquartered. <b>Host-country nationals</b> are citizens of the country where the subsidiary operates. <b>Third-country nationals (TCNs)</b> are citizens of neither, hired for global expertise or cost reasons. <b>Expatriates</b> are employees assigned outside their home country; <b>inpatriates</b> are brought from a foreign subsidiary into headquarters. The <b>balance-sheet approach</b> to expatriate pay keeps the employee whole relative to home-country spending power: base salary plus allowances for cost-of-living differences, housing, education, hardship, and tax equalization, so the assignee neither gains nor loses financially versus staying home. It is the most common and the most expensive method. Alternatives include the host-based (local-plus) approach and negotiated lump sums. The top reasons assignments fail are family adjustment problems and unclear expectations, not technical skill gaps.</p><ul><li><b>Exam trap:</b> when an assignment struggles, the BEST answer usually involves family support, cultural training, or clearer success metrics, not replacing the expatriate.</li></ul>"},
{id:"g-m11-02",m:"m11",h:"Hofstede Dimensions and High/Low Context Cultures",b:"<p><b>Hofstede's dimensions</b>: <b>power distance</b> (acceptance of unequal power; high in Malaysia and Mexico, low in Denmark and Israel), <b>individualism vs collectivism</b> (personal achievement vs group harmony; the US is individualist, Japan collectivist), <b>masculinity vs femininity</b> (competitiveness vs cooperation and quality of life), <b>uncertainty avoidance</b> (comfort with ambiguity; high in Greece and Japan, low in the US and Singapore), <b>long-term vs short-term orientation</b> (thrift and perseverance vs tradition and quick results), and <b>indulgence vs restraint</b>. HR applications: feedback directness, incentive design (individual vs team), decision-making (consensus vs top-down), and change-management pace all shift by culture. <b>Hall's high-context cultures</b> (Japan, Arab countries, Latin America) communicate implicitly through situation and nonverbals; <b>low-context cultures</b> (the US, Germany, Scandinavia) rely on explicit words. Blunt feedback that is normal in low-context cultures can humiliate in high-context ones.</p><ul><li><b>Exam trap:</b> never rank cultures as better or worse. The BEST answer adapts the practice (feedback style, meeting norms) to the local dimension.</li></ul>"},
{id:"g-m11-03",m:"m11",h:"DEI: Definitions, Measurement, and ERGs",b:"<p><b>Diversity</b> is representation: who is in the room. Measure it with workforce demographics, hiring-funnel conversion by group, and promotion rates. <b>Equity</b> is fairness of access and outcomes: measure with pay-equity analyses, promotion velocity by group, and access to development. <b>Inclusion</b> is the experience of being valued and able to contribute: measure with inclusion survey items (my opinions count), participation in decisions, and retention by group. <b>Belonging</b> is the felt sense of acceptance: measure with engagement and sentiment items. Diversity without inclusion drives turnover, so measure all four, not just headcount. <b>ERGs (employee resource groups)</b> work when they have executive sponsors, written charters tied to business goals (talent pipeline, market insight, onboarding), open ally membership, and real influence, not just social programming. Where law restricts rigid targets, focus on process goals and good-faith efforts rather than quotas.</p><ul><li><b>Exam trap:</b> a DEI program with strong diversity numbers but poor retention has an inclusion problem. The BEST answer measures experience and fixes culture, not more recruiting.</li></ul>"},
{id:"g-m11-04",m:"m11",h:"CSR, ESG, and the Triple Bottom Line",b:"<p>The <b>triple bottom line</b> (Elkington): <b>people, planet, profit</b>, meaning organizations should measure social and environmental results alongside financial ones. <b>CSR (corporate social responsibility)</b> is the company's voluntary contribution to society: philanthropy, volunteering, ethical sourcing, and community investment. <b>ESG</b> (environmental, social, governance) is the investor-facing framework rating how the company manages environmental impact, social practices (including labor and DEI), and governance (board independence, ethics, transparency). HR owns much of the S: labor practices, human rights in the supply chain, DEI, employee well-being, and ethical culture. ESG disclosures increasingly require auditable HR data on turnover, pay equity, safety, and training. <b>Greenwashing</b>, claiming more than the evidence supports, creates legal and reputational risk.</p><ul><li><b>Exam trap:</b> when a question ties HR to ESG, the answer usually involves measurable workforce practices (safety rates, pay equity, ethics training) reported with the same rigor as financials.</li></ul>"},
{id:"g-m11-05",m:"m11",h:"Standardization vs Localization in Global HR",b:"<p><b>Standardization</b> means consistent global HR policies and systems; <b>localization</b> means adapting to local law, culture, and markets. The exam answer is almost always <b>glocalization</b>: global principles, local expression. Standardize where consistency and efficiency win: values and code of conduct, core HRIS, leadership competencies, and global mobility principles. Localize where law and culture demand it: employment contracts, termination rules, benefits, working time, data privacy (GDPR limits on collecting demographic data), and DEI language and priorities. Works councils (EU) and codetermination (Germany) require consultation before workforce changes; ignoring them creates legal exposure. When headquarters and subsidiaries clash, the BEST answer respects local law first, then adapts the practice, then explains the global principle.</p><ul><li><b>Exam trap:</b> rolling out the US policy worldwide unchanged is nearly always wrong. The BEST answer checks local law and adapts.</li></ul>"},
{id:"g-m12-01",m:"m12",h:"Situational Leadership (Hersey-Blanchard)",b:"<p><b>Situational leadership (Hersey and Blanchard)</b> matches style to follower <b>readiness</b> (ability plus willingness) for a specific task. <b>R1</b> (unable and unwilling or insecure): <b>S1 directing</b>, high direction and low support; tell them what, how, and when. <b>R2</b> (unable but willing): <b>S2 coaching</b>, high direction and high support; explain, encourage, check. <b>R3</b> (able but unwilling or insecure): <b>S3 supporting</b>, low direction and high support; share decisions, build confidence. <b>R4</b> (able and willing): <b>S4 delegating</b>, low direction and low support; hand over responsibility. Readiness is task-specific: a star analyst can be R1 on a brand-new system. The classic exam error is over-supervising R4s (micromanagement kills motivation) or under-directing R1s (abandonment). Reassess readiness as tasks change.</p><ul><li><b>Exam trap:</b> match the style to the readiness level described, not the person's seniority. A senior employee new to a task is R1 or R2 for that task.</li></ul>"},
{id:"g-m12-02",m:"m12",h:"SHRM Code of Ethics and Ethical Dilemmas",b:"<p>The <b>SHRM Code of Ethics</b> commits HR professionals to: professional responsibility, professional development, ethical leadership, fairness and justice, conflicts of interest (disclose and avoid), and use of information (confidentiality, accuracy, lawful use). HR is the organization's <b>ethical steward</b>: model the standards, protect confidentiality, and refuse to facilitate wrongdoing. For dilemmas, use structured tests. The <b>front-page test</b>: how would this look published tomorrow? The <b>PLUS model</b> (Ethics and Compliance Initiative): is it consistent with <b>P</b>olicies, <b>L</b>egal requirements, <b>U</b>niversal values, and <b>S</b>elf-definition (who you aspire to be)? Kidder's framework adds: recognize right-versus-right conflicts (truth vs loyalty, individual vs community, short-term vs long-term, justice vs mercy), then resolve by principle, not convenience.</p><ul><li><b>Exam trap:</b> technically legal is the floor, not the ceiling. The BEST answer applies the higher ethical standard and discloses the conflict.</li></ul>"},
{id:"g-m12-03",m:"m12",h:"HR Courage",b:"<p><b>HR courage</b> is the competency behind every hard call: telling the CEO the plan is unlawful, blocking a biased hire, refusing to backdate a termination, or escalating a star performer's harassment. It has three parts: <b>moral clarity</b> (knowing the law, policy, and ethical standard), <b>voice</b> (delivering the unwelcome truth directly, with evidence, to the right person), and <b>follow-through</b> (documenting, escalating through proper channels, and refusing to be worn down). Courage is not recklessness: frame the business risk (lawsuit exposure, turnover, brand damage), propose a lawful alternative, and keep the tone professional. Document contemporaneously. If leadership insists on an unlawful course, escalate to legal or the board per policy; never falsify records or look the other way.</p><ul><li><b>Exam trap:</b> the tempting wrong answer protects the business or the boss short-term. The BEST answer holds the standard, documents, and escalates.</li></ul>"},
{id:"g-m12-04",m:"m12",h:"Exam-Day Checklist",b:"<p><b>Pacing</b>: about 134 questions in roughly 3.5 hours, so about 90 seconds per question. Answer in order, flag and move on rather than stalling, and bank time for flagged items at the end. <b>Situational-judgment strategy</b>: read the last line first to catch BEST, FIRST, MOST, or LEAST. Eliminate answers that are illegal, unethical, or skip steps (firing before investigating, company-wide mandates from one anecdote). Among legal options, prefer the one that gathers facts first, follows process, communicates honestly, and protects people. FIRST usually means immediate containment or fact-gathering; BEST usually means the systemic fix. <b>Final review priorities</b>: employment-law thresholds, FLSA/FMLA/ADA core rules, the four-fifths rule, Kotter and Lewin, situational leadership levels, SHRM Code principles, and metric formulas. Sleep, arrive early, and trust preparation; second-guessing flagged answers rarely helps unless you misread the question.</p><ul><li><b>Exam trap:</b> changing answers on review. Only change a flagged answer if you can point to the specific word you misread.</li></ul>"}
];
</script>
<script>
"use strict";
/* ---- STUDY GUIDES tab ---- */
let GUIDE_MOD=null;
function guideModName(id){const m=MODULES.find(x=>x.id===id);return m?m.title:id;}
function renderGuides(){
if(!GUIDE_MOD)GUIDE_MOD=MODULES[currentWeek()-1].id;
const chips=MODULES.map(m=>`<button class="btn sm${m.id===GUIDE_MOD?"":" ghost"}" data-gm="${m.id}">${m.week}. ${esc(m.title.split(" (")[0])}</button>`).join("");
const secs=GUIDES.filter(g=>g.m===GUIDE_MOD);
const body=secs.map(g=>`<div class="card"><h3>${esc(g.h)}</h3><div class="gbody">${g.b}</div></div>`).join("");
$("#tab-guides").innerHTML=`<div class="card"><h3>📖 Study Guides</h3><div class="small muted">Built-in readings for every topic in your plan — no outside links needed.</div></div>
<div class="card"><div class="row" style="flex-wrap:wrap;gap:6px">${chips}</div></div>${body}
<div class="row" style="margin-top:10px"><button class="btn ghost grow" data-gq="${GUIDE_MOD}">Quiz this module</button></div>`;
document.querySelectorAll("[data-gm]").forEach(b=>b.addEventListener("click",()=>{GUIDE_MOD=b.dataset.gm;renderGuides();window.scrollTo(0,0);}));
const q=document.querySelector("[data-gq]");if(q)q.addEventListener("click",()=>startQuiz(q.dataset.gq,10));
}
