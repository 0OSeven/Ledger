{id:"f178",m:"m7",front:"Constructive discharge",back:"Conditions so intolerable a reasonable person would resign; legally treated as a termination. Triggers wrongful-termination analysis."},
{id:"f179",m:"m7",front:"After-acquired evidence",back:"Misconduct discovered after termination can limit remedies like back pay, but it does not excuse a discriminatory firing."},
{id:"f180",m:"m7",front:"Equal Pay Act rule",back:"Equal pay for substantially equal work (skill, effort, responsibility, conditions) regardless of sex. Four narrow defenses: seniority, merit, production, other-than-sex factors."},
{id:"f181",m:"m7",front:"Pregnancy Discrimination Act",back:"Pregnancy, childbirth, and related conditions must be treated like any other temporary disability for benefits, leave, and accommodations."},
{id:"f182",m:"m7",front:"GINA",back:"Bars use of genetic information, including family medical history, in employment decisions. Keep health inquiries out of forms and interviews."},
{id:"f183",m:"m7",front:"IRCA / Form I-9",back:"Complete I-9 for every hire, citizens included. No knowing hire of unauthorized workers; no document abuse or citizenship discrimination."},
{id:"f184",m:"m7",front:"2026: PWFA accommodations",back:"Predictable assessments: sit/stand, water, bathroom, and food/drink breaks with no documentation required. (Abortion-accommodation portion was struck May 2025.)"},
{id:"f185",m:"m7",front:"2026: EO 11246",back:"Implementing regulations rescinded effective Oct 26, 2025. Federal contractors no longer maintain EO 11246 AAPs; Section 503/VEVRAA rules were revised."},
{id:"f186",m:"m7",front:"USERRA",back:"Reemployment rights and anti-discrimination protections for service members returning from duty, plus continued health and retirement benefit rights."},
{id:"f187",m:"m7",front:"WARN Act triggers",back:"60 days' notice of mass layoffs or plant closings: 100+ employees, 50+ affected at a single site. Check stricter state mini-WARN laws."},
{id:"f188",m:"m7",front:"COBRA basics",back:"Continued group health coverage after qualifying events (termination, hours cut). Employers with 20+; employee pays up to 102% of premium; generally 18 months."},
{id:"f189",m:"m7",front:"FLSA exempt duties tests",back:"Executive, administrative, professional, computer, outside sales: salary basis + $684/week (2026) + duties test. Job titles do not decide."},
{id:"f190",m:"m7",front:"OWBPA waiver requirements",back:"Valid ADEA waivers must be knowing and voluntary: plain writing, no waiver of future claims, extra consideration, 21 days to consider (45 for group), 7-day revocation."},
{id:"f191",m:"m7",front:"BFOQ",back:"Bona fide occupational qualification: discrimination is lawful only when the trait is essential to the job. Never for race or color; rarely for age."},
{id:"f192",m:"m7",front:"EEO-1 report",back:"Employers with 100+ employees (50+ for covered federal contractors) report workforce demographics by job category, race/ethnicity, and sex annually."},
{id:"f193",m:"m7",front:"Lilly Ledbetter Fair Pay Act",back:"Each discriminatory paycheck restarts the 180/300-day EEOC filing clock. Pay discrimination is a continuing violation."},
{id:"f194",m:"m7",front:"Exam trap: ADA vs FMLA vs PWFA",back:"ADA: reasonable accommodation, undue-hardship defense. FMLA: 12 weeks unpaid leave with eligibility gates. PWFA: accommodations for pregnancy-related limitations."},
{id:"f195",m:"m7",front:"Cat's paw liability (Staub)",back:"Employer liable when a biased supervisor's input causes an unbiased decision-maker to act adversely. Investigate independently before deciding."},
{id:"f196",m:"m8",front:"OSHA recordable vs first aid",back:"Recordable: medical treatment beyond first aid, restricted work, days away, loss of consciousness. Bandages and similar first-aid items are not recordable."},
{id:"f197",m:"m8",front:"Emergency Action Plan contents",back:"OSHA requires: evacuation procedures and routes, alarm systems, headcount procedures, critical-operations shutdown, rescue and medical duties."},
{id:"f198",m:"m8",front:"Return-to-work (light duty)",back:"Structured transitional work cuts comp costs and disability duration while supporting recovery. Must be genuine, never punitive."},
{id:"f199",m:"m8",front:"Root-cause analysis",back:"Look past the immediate trigger to systemic causes: training, design, supervision, incentives. Ask 'why' repeatedly. Blame fixes nothing."},
{id:"f200",m:"m8",front:"Near-miss investigation",back:"Investigate near-misses like real incidents with the same root-cause process. 'No harm, no foul' guarantees the next one causes harm."},
{id:"f201",m:"m8",front:"Workplace violence prevention",back:"Written policy + reporting channels + threat assessment team + training. Plan security for high-risk terminations; never handle them alone."},
{id:"f202",m:"m8",front:"Negligent retention / supervision",back:"Liability for keeping or poorly supervising an employee you knew, or should have known, was dangerous. Act on complaints fast."},
{id:"f203",m:"m8",front:"Defensible drug testing",back:"Base testing on policy plus job-relatedness: safety-sensitive roles, DOT mandates, reasonable suspicion, post-accident. State laws vary widely."},
{id:"f204",m:"m8",front:"Business continuity vs disaster recovery",back:"Business continuity keeps critical operations running during disruption (HR owns the people side). Disaster recovery restores IT systems."},
{id:"f205",m:"m8",front:"Safety incentive pitfalls",back:"OSHA: incentives tied to low injury rates suppress reporting and can be retaliatory. Reward participation, hazard reporting, and corrections instead."},
{id:"f206",m:"m8",front:"E-discovery duty",back:"Preserve electronically stored information once litigation is reasonably anticipated. Spoliation brings sanctions and adverse inferences."},
{id:"f207",m:"m8",front:"Employee monitoring limits",back:"Generally lawful on company systems with notice and a legitimate purpose. ECPA bars intercepting personal communications; state consent laws vary."},
{id:"f208",m:"m8",front:"Bullying vs harassment",back:"Bullying is not per se unlawful federally; most employers ban it by policy. Harassment is unlawful when based on a protected class and severe or pervasive."},
{id:"f209",m:"m8",front:"HR data breach response",back:"Contain, assess what PII was exposed, notify per state breach laws, offer credit monitoring, document everything. HR data is a prime target."},
{id:"f210",m:"m8",front:"OSHA inspection priorities",back:"1) Imminent danger; 2) fatalities/catastrophes; 3) complaints and referrals; 4) targeted programs; 5) planned inspections."},
{id:"f211",m:"m8",front:"Exclusive remedy exceptions",back:"Workers' comp is usually the only remedy, but exceptions exist: intentional harm by the employer, dual persona, or an uninsured employer."},
{id:"f212",m:"m8",front:"Safety committee",back:"Joint labor-management group that reviews incidents, inspects the workplace, and recommends fixes. Required in some states; best practice everywhere."},
{id:"f213",m:"m8",front:"Workers' comp fraud indicators",back:"Monday-morning injuries, no witnesses, conflicting accounts, refusal of light duty, late reporting. Investigate; never accuse without evidence."},
{id:"f214",m:"m8",front:"Crisis communication rule",back:"Confirm what is true, correct falsehoods, share a timeline for updates. Silence cedes the narrative to rumor."},
{id:"f215",m:"m8",front:"Exam trap: recordable triggers",back:"Days away, restricted work, job transfer, treatment beyond first aid, loss of consciousness, diagnosed occupational illness. A doctor visit alone is not enough."},
{id:"f216",m:"m8",front:"HIPAA in HR",back:"HIPAA covers group health plans, not general employment records. Keep ADA/FMLA medical info in separate confidential files; do not share with managers."},
{id:"f217",m:"m9",front:"Revenue per FTE",back:"Total revenue / full-time-equivalent headcount. Workforce productivity in the language of the business; track trends and benchmark."},
{id:"f218",m:"m9",front:"Quality of hire: best measure",back:"Composite of new-hire performance ratings + ramp time + first-year retention. Single metrics mislead."},
{id:"f219",m:"m9",front:"Correlation vs causation (HR analytics)",back:"Correlation shows a relationship; causation requires ruling out other explanations. Interventions need causal evidence, not just linked data."},
{id:"f220",m:"m9",front:"Predictive analytics (flight-risk models): key risk",back:"Models encode historical bias and can drive discriminatory or self-fulfilling actions. Validate, audit for adverse impact, support not replace human decisions."},
{id:"f221",m:"m9",front:"Selection ratio",back:"Hires / applicants. Lower ratios mean more selective hiring and higher payoff (utility) from valid selection tools."},
{id:"f222",m:"m9",front:"Leading vs lagging HR indicators",back:"Leading (engagement pulse, training completion) predict future outcomes. Lagging (turnover, profit) report what already happened. Manage with leading, judge with lagging."},
{id:"f223",m:"m9",front:"Benchmarking HR metrics: right use",back:"Compare similar orgs and use gaps to prompt investigation, not automatic action. Context (strategy, labor markets) decides whether a gap matters."},
{id:"f224",m:"m9",front:"Turnover cost estimate (rule of thumb)",back:"50-200% of the role's annual salary depending on complexity: separation + vacancy + recruiting + onboarding + ramp-up productivity loss."},
{id:"f225",m:"m9",front:"Exam trap: training hours up 30% proves...?",back:"Nothing about impact. Activity metrics do not prove capability or business results changed. Push past vanity metrics to outcome measures."},
{id:"f226",m:"m9",front:"Data storytelling in HR",back:"Context, insight, implication, recommended action, visualized clearly. Analysis without a decision attached is shelfware."},
{id:"f227",m:"m9",front:"HRIS selection: first step",back:"Requirements gathering with stakeholders and end users before vendor demos. Define what HR must do, then find the system that fits."},
{id:"f228",m:"m9",front:"Leading survey questions: impact",back:"They produce biased, invalid data and destroy credibility. Use neutral wording, balanced scales, and anonymity protections."},
{id:"f229",m:"m9",front:"HR shared-services SLA typically measures",back:"Response and resolution times, first-contact resolution, accuracy, and customer satisfaction for HR transactions."},
{id:"f230",m:"m9",front:"Absenteeism rate formula",back:"(Total days absent / total scheduled workdays) x 100. Track by team and trend; spikes signal engagement or workload problems."},
{id:"f231",m:"m9",front:"Scenario: data links manager 1:1s to retention. Best next step?",back:"Pilot the practice and measure impact against control groups, then scale what works. Do not mandate company-wide on correlational data."},
{id:"f232",m:"m9",front:"People analytics ethics: core rule",back:"Collect minimally, use only for legitimate stated purposes, protect confidentiality. Purpose limitation and transparency with employees."},
{id:"f233",m:"m9",front:"Time to fill vs time to hire",back:"Time to fill: req opened to offer accepted (recruiting efficiency). Time to hire: candidate applies to offer accepted (candidate experience + process speed)."},
{id:"f234",m:"m9",front:"HR expense ratio",back:"Total HR costs / total operating expenses (or per FTE). Measures HR efficiency; falling ratio with stable service quality signals leverage."},
{id:"f235",m:"m9",front:"Pulse surveys vs annual census",back:"Pulses: short, frequent, fast action on emerging issues. Annual: deep, comprehensive baseline. Use both, not one instead of the other."},
{id:"f236",m:"m9",front:"Exam trap: activity vs impact metrics",back:"Activity (hours trained, hires made) shows effort. Impact (behavior change, retention, revenue) shows value. Executives fund impact."},
{id:"f237",m:"m9",front:"Selection utility: what raises it",back:"Higher validity + more applicants per hire (low selection ratio) + longer tenure + higher job value. Quantifies the dollar payoff of better hiring."},
{id:"f238",m:"m10",front:"Force field analysis (Lewin)",back:"Map driving forces for change against restraining forces. Change happens by strengthening drivers and, more powerfully, weakening restrainers."},
{id:"f239",m:"m10",front:"Tuckman team stages (order)",back:"Forming, storming, norming, performing, adjourning. Storming is a normal developmental stage, not a failure."},
{id:"f240",m:"m10",front:"SBI feedback model",back:"Situation, Behavior, Impact. Describe the situation, the observable behavior, and its impact. Specific and non-judgmental."},
{id:"f241",m:"m10",front:"Halo effect (appraisal)",back:"One positive trait inflates the entire evaluation. Horn effect is the reverse. Counter with structured criteria and evidence requirements."},
{id:"f242",m:"m10",front:"Central tendency in ratings: best fix",back:"Rater training on errors (leniency, central tendency), calibration sessions, and evidence-based differentiation. Not forced distribution alone."},
{id:"f243",m:"m10",front:"Scenario: reorg rumor spiraling after a leak. Best move?",back:"Accelerate honest communication: confirm what is true, correct falsehoods, share the timeline for details. Do not wait for perfect information."},
{id:"f244",m:"m10",front:"Succession depth is measured by",back:"Ready-now + ready-in-1-to-2-years + ready-in-3-to-5-years candidates per critical role. Single-successor plans are fragile."},
{id:"f245",m:"m10",front:"Job enrichment vs enlargement",back:"Enlargement: more tasks at the same level (horizontal). Enrichment: deeper responsibility and autonomy (vertical). Enrichment motivates."},
{id:"f246",m:"m10",front:"Matrix structure: defining feature",back:"Dual reporting relationships, e.g., functional manager plus product or project manager. Flexible but creates role conflict; needs clear governance."},
{id:"f247",m:"m10",front:"Empowerment requires all EXCEPT",back:"Authority + information + resources + accountability within clear guardrails. Abandoning oversight is abdication, not empowerment."},
{id:"f248",m:"m10",front:"ADKAR change model",back:"Awareness, Desire, Knowledge, Ability, Reinforcement. Individual-level change: people must move through each stage to adopt the change."},
{id:"f249",m:"m10",front:"Kotter step 8",back:"Anchor the change in culture: connect new behaviors to success, develop successors who embody the change. Without it, change decays."},
{id:"f250",m:"m10",front:"Bridges transition model",back:"Endings (let go), neutral zone (confusion, creativity), new beginnings. People grieve the old before embracing the new; support each phase."},
{id:"f251",m:"m10",front:"Structural vs interpersonal conflict",back:"Structural: unclear roles, competing goals, scarce resources. Fix design first. Interpersonal: styles and relationships. Diagnose before intervening."},
{id:"f252",m:"m10",front:"MBO (management by objectives)",back:"Manager and employee jointly set specific, measurable goals; performance judged against them. Works when goals are clear and reviewed regularly."},
{id:"f253",m:"m10",front:"360 feedback: best use",back:"Development, not pay or promotion decisions. Rater anonymity and coaching support make it safe; tying it to rewards games the ratings."},
{id:"f254",m:"m10",front:"Recency effect (appraisal)",back:"Overweighting recent events and forgetting earlier performance. Counter with ongoing documentation and full review-period evidence."},
{id:"f255",m:"m10",front:"Scenario: merging divisions with clashing cultures. HR's first move?",back:"Culture due diligence: assess both cultures, identify non-negotiables and risks, design an integration plan with leadership. Most mergers fail on culture."},
{id:"f256",m:"m10",front:"Exam trap: team storming means...?",back:"Normal development, not dysfunction. Leaders who punish storming stall the team at forming; facilitate through it toward norming."},
{id:"f257",m:"m10",front:"Burke-Litwin model: key insight",back:"Transformational factors (mission, leadership, culture) drive deep change; transactional factors (systems, structure, tasks) drive incremental change. Match the lever to the ambition."},
{id:"f258",m:"m10",front:"Premortem: purpose",back:"Before launch, imagine the project failed and list why. Surfaces risks and blind spots that optimism suppresses, while they are still fixable."},
{id:"f259",m:"m11",front:"Glocalization (global HR)",back:"Global principles with local expression: adapt language, legal framing, and priorities to each region while keeping core standards consistent."},
{id:"f260",m:"m11",front:"High vs low context cultures (Hall)",back:"High context: meaning carried by situation and nonverbals, indirect (Japan, Arab countries). Low context: explicit words (US, Germany). Mismatch causes offense."},
{id:"f261",m:"m11",front:"Hofstede: individualism vs collectivism",back:"Individualist cultures reward personal achievement and individual incentives. Collectivist cultures value group harmony, consensus, and team rewards."},
{id:"f262",m:"m11",front:"Uncertainty avoidance (Hofstede)",back:"Comfort with ambiguity. High-UA cultures prefer rules, structure, and predictability; low-UA cultures tolerate change and experimentation."},
{id:"f263",m:"m11",front:"Third-country national (TCN)",back:"An expat whose home country differs from both the HQ country and the assignment country. Common in regional hub roles."},
{id:"f264",m:"m11",front:"Inpatriate",back:"An employee brought from a foreign subsidiary INTO the headquarters country. Builds global mindset at HQ; reverse of an expatriate."},
{id:"f265",m:"m11",front:"ERGs are most effective when",back:"They have executive sponsors, clear charters tied to business goals, and real influence, not just social programming."},
{id:"f266",m:"m11",front:"Standardization vs localization tension",back:"Standardize where consistency and efficiency win (values, core systems); localize where law and culture demand it. The central global-HR tradeoff."},
{id:"f267",m:"m11",front:"Expat assignment failure: top cause",back:"Family and spouse adjustment problems, not job skills. Select for family adaptability and support the whole household."},
{id:"f268",m:"m11",front:"Tax equalization (expat pay)",back:"The employer keeps the expat whole on taxes: they pay a hypothetical home-country tax and the company settles the actual host-country bill. Removes tax as an assignment barrier."},
{id:"f269",m:"m11",front:"DEI dashboard typically tracks",back:"Representation by level and function, hiring and promotion rates, pay equity, inclusion survey scores, and retention by demographic group."},
{id:"f270",m:"m11",front:"Scenario: US-designed DEI flops in Europe ('American import'). Best fix?",back:"Localize language, legal framing, and priorities to each region while keeping global principles. Forcing compliance deepens resistance."},
{id:"f271",m:"m11",front:"Global pay equity: data privacy limits",back:"Some countries restrict collecting demographic data. Use lawful proxies and role-based analysis, and document the methodology and its limits."},
{id:"f272",m:"m11",front:"Culture shock stages",back:"Honeymoon, crisis (frustration), recovery (adjustment), adaptation. Support peaks during crisis; most failures happen there."},
{id:"f273",m:"m11",front:"Employer of record (EOR)",back:"A third party that legally employs workers in a country where the company has no entity, handling payroll, taxes, and compliance. Fast market entry, less control."},
{id:"f274",m:"m11",front:"Belonging vs inclusion",back:"Inclusion is what the organization does to welcome people. Belonging is what the employee feels as a result. Measure the feeling, not just the programs."},
{id:"f275",m:"m11",front:"Cross-cultural feedback adaptation",back:"Direct feedback norms (US, Netherlands) offend in high-context cultures. Adapt directness, setting, and framing while keeping the message honest."},
{id:"f276",m:"m11",front:"Works councils / codetermination",back:"In much of Europe (esp. Germany), employees have legally mandated consultation or board representation rights. Major workforce changes require their involvement."},
{id:"f277",m:"m11",front:"Totalization agreements",back:"Bilateral treaties that prevent double social-security taxation for cross-border workers and determine which country's system covers them."},
{id:"f278",m:"m11",front:"Scenario: selecting expats. Best predictor of success?",back:"Spouse and family adaptability plus cultural agility and prior cross-cultural success, over technical skill alone."},
{id:"f279",m:"m11",front:"Repatriation: key risk",back:"Reverse culture shock and attrition: returning expats often quit within a year if their global experience goes unused. Plan the re-entry role early."},
{id:"f280",m:"m12",front:"Transformational vs transactional leadership",back:"Transformational: vision, inspiration, intellectual stimulation, individualized consideration. Transactional: contingent rewards and management by exception."},
{id:"f281",m:"m12",front:"Servant leadership (Greenleaf)",back:"Leading by prioritizing followers' growth and well-being. Measured by whether people grow healthier, wiser, and more autonomous."},
{id:"f282",m:"m12",front:"Goleman emotional intelligence components",back:"Self-awareness, self-regulation, motivation, empathy, social skills. Self-awareness is the foundation of the rest."},
{id:"f283",m:"m12",front:"Authentic leadership centers on",back:"Self-awareness, relational transparency, balanced (unbiased) processing, and an internalized moral compass. Followers detect fakery fast."},
{id:"f284",m:"m12",front:"Front-page ethics test",back:"How would this look published on the front page tomorrow? If you would be ashamed to see it reported, do not do it."},
{id:"f285",m:"m12",front:"PLUS ethical decision model",back:"Policies: does it violate policy? Legal: is it lawful? Universal: does it align with values? Self: would I be proud of it?"},
{id:"f286",m:"m12",front:"SOX whistleblower protections cover",back:"Employees of publicly traded companies who report reasonably believed securities fraud or misleading financials. Anti-retaliation protection."},
{id:"f287",m:"m12",front:"Conflict of interest: required action",back:"Disclose it and manage it per policy. Conflicts are not always prohibited, but concealment is the violation."},
{id:"f288",m:"m12",front:"Scenario: board asks HR to investigate the CEO. Best structure?",back:"Independent outside investigators reporting to the board or a board committee, with HR supporting. HR cannot credibly investigate its own ultimate boss."},
{id:"f289",m:"m12",front:"SHRM recertification requirement",back:"60 PDCs every 3 years across the BASK domains, or retake the exam. Plan PDCs from day one."},
{id:"f290",m:"m12",front:"Courage as an HR competency",back:"Delivering unwelcome truths and holding the line on ethics, law, and standards under pressure. The competency behind every hard call."},
{id:"f291",m:"m12",front:"Professional skepticism (HR)",back:"Question assumptions, verify facts, resist pressure to reach convenient conclusions, especially in investigations. Disciplined objectivity."},
{id:"f292",m:"m12",front:"Scenario: colleague shares investigation details at a party. You?",back:"Address it with the colleague directly and escalate if material. Confidentiality breaches destroy HR credibility; silence makes you complicit."},
{id:"f293",m:"m12",front:"Exam trap: 'but it is legal' means...?",back:"Legal is the floor, not the ceiling. Ethics often demands more than the law requires; 'technically legal' still fails the front-page test."},
{id:"f294",m:"m12",front:"Ethical fading / moral disengagement",back:"When the ethical dimension of a decision fades from view, e.g., reframed as purely business or legal. Name the ethics explicitly to counter it."},
{id:"f295",m:"m12",front:"Scenario: star harasser downplayed by sales leadership. HR's move?",back:"Escalate with the pattern data: repeat behavior multiplies liability. Protecting revenue by tolerating harassment ends in headlines."},
{id:"f296",m:"m12",front:"Upjohn warning (investigations)",back:"Tell employee interviewees the company's lawyer represents the company, not them, and the company controls privilege. Prevents false expectations."},
{id:"f297",m:"m12",front:"HR data stewardship duty",back:"Collect minimally, protect confidentiality, use employee data only for legitimate purposes. An ethical duty beyond mere legal compliance."},
{id:"f298",m:"m12",front:"Kidder: right vs right dilemmas",back:"Hardest ethical choices pit two rights against each other: truth vs loyalty, individual vs community, short-term vs long-term, justice vs mercy."},
{id:"f299",m:"m12",front:"Scenario: your past hiring decision shows adverse impact. You?",back:"Disclose to leadership, fix the process prospectively, remediate where appropriate. Owning the error builds the ethical culture; cover-ups compound liability."},
{id:"f300",m:"m12",front:"Goodhart's law (metrics)",back:"When a measure becomes a target, it ceases to be a good measure. People game the metric instead of improving the outcome it proxied."}

];
</script>
<script>
"use strict";
/* ============ APP ============ */
loadState();
if(!S.planStart){S.planStart=todayStr();save();}
const $=s=>document.querySelector(s);
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;");}
function taskId(m,i){return m+"-t"+i;}
function currentWeek(){const a=new Date(S.planStart+"T12:00:00");const diff=(new Date()-a)/864e5;return Math.min(12,Math.max(1,Math.floor(diff/7)+1));}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function moduleAcc(m){let c=0,t=0;S.quizzes.forEach(q=>{(q.byMod&&q.byMod[m]||[]).forEach(r=>{t++;if(r)c++;});});return t?c/t:null;}
function avgScore(){let c=0,t=0;S.quizzes.forEach(q=>{c+=q.correct;t+=q.total;});return t?c/t:null;}

/* ---- tabs ---- */
document.querySelectorAll("#tabbar button").forEach(b=>b.addEventListener("click",()=>{
document.querySelectorAll("#tabbar button").forEach(x=>x.classList.remove("on"));b.classList.add("on");
document.querySelectorAll("section.tab").forEach(s=>s.classList.remove("active"));
$("#tab-"+b.dataset.t).classList.add("active");
({today:renderToday,plan:renderPlan,guides:renderGuides,practice:renderPractice,cards:renderCards,progress:renderProgress})[b.dataset.t]();
window.scrollTo(0,0);}));
function refreshHead(){$("#cd-days").textContent=daysToExam();$("#cd-streak").textContent=getStreak();const a=avgScore();$("#cd-score").textContent=a==null?"–":Math.round(a*100)+"%";}

/* ---- TODAY ---- */
function renderToday(){touchDay();const w=currentWeek(),mod=MODULES[w-1];
let tasksHtml=mod.tasks.map((t,i)=>{const id=taskId(mod.id,i),done=!!S.tasks[id];
return `<div class="task${done?" done":""}" data-task="${id}"><div class="box">${done?"✓":""}</div><div class="tt">${esc(t)}</div></div>`;}).join("");
const doneCount=mod.tasks.filter((_,i)=>S.tasks[taskId(mod.id,i)]).length;
$("#tab-today").innerHTML=`
<div class="card"><h3>Week ${w} of 12 — ${esc(mod.title)}</h3>
<div class="small muted">${esc(mod.desc)}</div>
<div class="prog"><i style="width:${Math.round(doneCount/mod.tasks.length*100)}%"></i></div>
<div class="small muted">${doneCount}/${mod.tasks.length} tasks done</div></div>
<div class="small muted" style="margin:4px 2px">Today's tasks — tap to check off</div>
${tasksHtml}
<div class="card"><h3>Quick actions</h3>
<div class="row"><button class="btn grow" id="q-quick">10-question quiz</button></div>
<div class="row" style="margin-top:10px"><button class="btn ghost grow" id="q-cards">Review flashcards</button></div></div>`;
document.querySelectorAll("#tab-today .task").forEach(el=>el.addEventListener("click",()=>{const id=el.dataset.task;S.tasks[id]=!S.tasks[id];touchDay();save();renderToday();refreshHead();}));
$("#q-quick").addEventListener("click",()=>startQuiz("weak",10));
$("#q-cards").addEventListener("click",()=>{document.querySelector('[data-t="cards"]').click();});}

/* ---- PLAN ---- */
function renderPlan(){const cw=currentWeek();
$("#tab-plan").innerHTML=MODULES.map(mod=>{
const done=mod.tasks.filter((_,i)=>S.tasks[taskId(mod.id,i)]).length;
const pct=Math.round(done/mod.tasks.length*100);
const tasks=mod.tasks.map((t,i)=>{const id=taskId(mod.id,i),d=!!S.tasks[id];
return `<div class="task${d?" done":""}" data-task="${id}"><div class="box">${d?"✓":""}</div><div class="tt">${esc(t)}</div></div>`;}).join("");
return `<div class="weekhead${pct===100?" done":""}" data-w="${mod.id}"><div class="wk">${pct===100?"✓":mod.week}</div>
<div><h3>Week ${mod.week}: ${esc(mod.title)}</h3><div class="small muted">${esc(mod.desc)}</div></div><div class="pct">${pct}%</div></div>
<div class="weekbody${mod.week===cw?" open":""}" id="wb-${mod.id}">${tasks}
<div class="row" style="margin-top:6px"><button class="btn sm ghost" data-quiz="${mod.id}">Quiz this week</button>
<button class="btn sm ghost" data-deck="${mod.id}">Flashcards</button>
<button class="btn sm ghost" data-guide="${mod.id}">Study guide</button></div></div>`;}).join("")+
`<div class="card"><h3>Plan settings</h3><label class="flabel">Plan start date</label>
<input type="date" id="plan-start" value="${S.planStart}">
<label class="flabel">Target exam date</label><input type="date" id="tgt-date" value="${getTarget()}">
<button class="btn block" id="save-dates">Save dates</button></div>`;
document.querySelectorAll(".weekhead").forEach(h=>h.addEventListener("click",e=>{if(e.target.closest("[data-quiz],[data-deck]"))return;$("#wb-"+h.dataset.w).classList.toggle("open");}));
document.querySelectorAll("#tab-plan .task").forEach(el=>el.addEventListener("click",()=>{const id=el.dataset.task;S.tasks[id]=!S.tasks[id];touchDay();save();renderPlan();refreshHead();}));
document.querySelectorAll("[data-quiz]").forEach(b=>b.addEventListener("click",()=>startQuiz(b.dataset.quiz,10)));
document.querySelectorAll("[data-guide]").forEach(b=>b.addEventListener("click",()=>openGuide(b.dataset.guide)));
document.querySelectorAll("[data-deck]").forEach(b=>b.addEventListener("click",()=>{startDeck(b.dataset.deck);document.querySelector('[data-t="cards"]').click();}));
$("#save-dates").addEventListener("click",()=>{S.planStart=$("#plan-start").value||S.planStart;S.target=$("#tgt-date").value||S.target;save();refreshHead();renderPlan();});}

/* ---- PRACTICE ---- */
let QZ=null;
function quizPool(scope){
if(scope==="mixed")return QUESTIONS.slice();
if(scope==="weak"){const scored=MODULES.map(m=>({id:m.id,acc:moduleAcc(m.id)})).filter(x=>x.acc!==null).sort((a,b)=>a.acc-b.acc);
const ids=scored.length?scored.slice(0,3).map(x=>x.id):MODULES.map(m=>m.id);
return QUESTIONS.filter(q=>ids.includes(q.m));}
return QUESTIONS.filter(q=>q.m===scope);}
function renderPractice(){
const opts=MODULES.map(m=>`<option value="${m.id}">Week ${m.week}: ${esc(m.title)}</option>`).join("");
$("#tab-practice").innerHTML=`<div class="card"><h3>Start a quiz</h3>
<label class="flabel">Scope</label><select id="qz-scope"><option value="weak">Weak areas (recommended)</option><option value="mixed">Mixed review — all topics</option>${opts}</select>
<label class="flabel">Questions</label><select id="qz-n"><option value="10">10</option><option value="20">20</option><option value="30">30</option></select>
<button class="btn block" id="qz-go">Start quiz</button></div>
<div class="card"><h3>Recent quizzes</h3><div id="qz-hist">${
S.quizzes.slice(-5).reverse().map(q=>`<div class="kv"><span>${esc(q.label)} · ${q.date}</span><b>${Math.round(q.correct/q.total*100)}%</b></div>`).join("")||'<div class="muted small">No quizzes yet.</div>'}</div></div>`;
$("#qz-go").addEventListener("click",()=>startQuiz($("#qz-scope").value,parseInt($("#qz-n").value,10)));}
function startQuiz(scope,n){const pool=shuffle(quizPool(scope));if(!pool.length)return;
QZ={list:pool.slice(0,Math.min(n,pool.length)),i:0,correct:0,byMod:{},scope,
label:scope==="weak"?"Weak areas":scope==="mixed"?"Mixed review":MODULES.find(m=>m.id===scope).title};
document.querySelector('[data-t="practice"]').click();renderQ();}
function renderQ(){const q=QZ.list[QZ.i],mod=MODULES.find(m=>m.id===q.m);
$("#tab-practice").innerHTML=`<div class="quiztop"><span class="pill ${q.t==="sj"?"sj":"kn"}">${q.t==="sj"?"Situational":"Knowledge"}</span>
<span class="small muted">Question ${QZ.i+1} of ${QZ.list.length} · ${esc(mod.title)}</span></div>
<div class="prog"><i style="width:${Math.round(QZ.i/QZ.list.length*100)}%"></i></div>
<div class="qstem">${esc(q.s)}</div><div id="qz-opts">${q.o.map((o,i)=>`<button class="opt" data-i="${i}"><b>${"ABCD"[i]}.</b> ${esc(o)}</button>`).join("")}</div><div id="qz-exp"></div>`;
document.querySelectorAll("#qz-opts .opt").forEach(b=>b.addEventListener("click",()=>answerQ(parseInt(b.dataset.i,10))));}
function answerQ(pick){const q=QZ.list[QZ.i],ok=pick===q.a;
(QZ.byMod[q.m]=QZ.byMod[q.m]||[]).push(ok);if(ok)QZ.correct++;
document.querySelectorAll("#qz-opts .opt").forEach((b,i)=>{b.disabled=true;if(i===q.a)b.classList.add("correct");else if(i===pick)b.classList.add("wrong");else b.classList.add("dim");});
$("#qz-exp").innerHTML=`<div class="explain"><b>${ok?"Correct.":"Not quite — correct answer: "+"ABCD"[q.a]+"."}</b><br>${esc(q.e)}</div>
<button class="btn block" id="qz-next">${QZ.i+1<QZ.list.length?"Next question":"See results"}</button>`;
$("#qz-next").addEventListener("click",()=>{QZ.i++;QZ.i<QZ.list.length?renderQ():finishQuiz();});window.scrollTo(0,0);}
function finishQuiz(){touchDay();S.quizzes.push({date:todayStr(),label:QZ.label,correct:QZ.correct,total:QZ.list.length,byMod:QZ.byMod});save();refreshHead();
const pct=Math.round(QZ.correct/QZ.list.length*100);
const weak=Object.keys(QZ.byMod).map(m=>({m,acc:QZ.byMod[m].filter(Boolean).length/QZ.byMod[m].length})).filter(x=>x.acc<0.7);
$("#tab-practice").innerHTML=`<div class="card" style="text-align:center"><h3>${pct>=80?"🔥 Excellent":pct>=70?"💪 Solid":"📚 Keep going"}</h3>
<div style="font-size:44px;font-weight:800;margin:8px 0">${pct}%</div>
<div class="muted">${QZ.correct} of ${QZ.list.length} correct · ${esc(QZ.label)}</div>
${weak.length?`<div class="small" style="margin-top:10px">Review: ${weak.map(w=>esc(MODULES.find(m=>m.id===w.m).title)).join(", ")}</div>`:""}</div>
<button class="btn block" id="qz-again">Retake weak areas</button>
<button class="btn ghost block" id="qz-done">Back to practice</button>`;
$("#qz-again").addEventListener("click",()=>startQuiz("weak",10));
$("#qz-done").addEventListener("click",renderPractice);}

/* ---- FLASHCARDS ---- */
let DK=null;
function renderCards(){
const opts=MODULES.map(m=>`<option value="${m.id}">Week ${m.week}: ${esc(m.title)}</option>`).join("");
const learning=FLASHCARDS.filter(f=>S.cards[f.id]==="learn").length;
$("#tab-cards").innerHTML=`<div class="card"><h3>Flashcards</h3>
<div class="small muted" style="margin-bottom:8px">${learning} marked still learning</div>
<label class="flabel">Deck</label><select id="dk-scope"><option value="all">All cards (${FLASHCARDS.length})</option><option value="learning">Still learning (${learning})</option>${opts}</select>
<button class="btn block" id="dk-go">Start deck</button></div>`;
$("#dk-go").addEventListener("click",()=>startDeck($("#dk-scope").value));}
function startDeck(scope){let pool=scope==="all"?FLASHCARDS.slice():scope==="learning"?FLASHCARDS.filter(f=>S.cards[f.id]==="learn"):FLASHCARDS.filter(f=>f.m===scope);
if(!pool.length){$("#tab-cards").innerHTML=`<div class="card"><h3>Nothing here yet</h3><div class="muted small">Mark cards as "still learning" while reviewing and they'll show up in that deck.</div><button class="btn ghost block" id="dk-back">Back</button></div>`;$("#dk-back").addEventListener("click",renderCards);return;}
DK={list:shuffle(pool),i:0};renderCard();}
function renderCard(){const f=DK.list[DK.i],mod=MODULES.find(m=>m.id===f.m);
$("#tab-cards").innerHTML=`<div class="small muted">Card ${DK.i+1} of ${DK.list.length} · ${esc(mod.title)}</div>
<div class="fcardwrap"><div class="fcard" id="fc"><div class="fface">${esc(f.front)}</div><div class="fface back">${esc(f.back)}</div></div></div>
<div class="small muted" style="text-align:center">Tap the card to flip</div>
<div class="fctl"><button class="btn ghost" id="fc-learn">Still learning</button><button class="btn green" id="fc-know">Got it ✓</button></div>`;
$("#fc").addEventListener("click",()=>$("#fc").classList.toggle("flipped"));
const rate=v=>{S.cards[f.id]=v==="know"?"know":"learn";touchDay();save();DK.i++;DK.i<DK.list.length?renderCard():deckDone();};
$("#fc-learn").addEventListener("click",()=>rate("learn"));
$("#fc-know").addEventListener("click",()=>rate("know"));}
function deckDone(){refreshHead();$("#tab-cards").innerHTML=`<div class="card" style="text-align:center"><h3>🎉 Deck complete</h3><div class="muted">Nice work. Spaced repetition beats cramming — come back tomorrow.</div></div><button class="btn block" id="dk-back2">Back to decks</button>`;$("#dk-back2").addEventListener("click",renderCards);}

/* ---- PROGRESS ---- */
function renderProgress(){const totalTasks=MODULES.reduce((n,m)=>n+m.tasks.length,0);
const doneTasks=Object.keys(S.tasks).filter(k=>S.tasks[k]).length;
const a=avgScore(),cardsKnown=FLASHCARDS.filter(f=>S.cards[f.id]==="know").length;
const bars=MODULES.map(m=>{const acc=moduleAcc(m.id);const pct=acc==null?0:Math.round(acc*100);
return `<div class="bar-row"><div class="bl">Wk ${m.week} ${esc(m.title.split(":")[0])}</div><div class="bt"><i style="width:${pct}%"></i></div><div class="bv">${acc==null?"–":pct+"%"}</div></div>`;}).join("");
$("#tab-progress").innerHTML=`<div class="stat-grid">
<div class="stat"><div class="n">${Math.round(doneTasks/totalTasks*100)}%</div><div class="l">study plan done</div></div>
<div class="stat"><div class="n">${S.quizzes.length}</div><div class="l">quizzes taken</div></div>
<div class="stat"><div class="n">${a==null?"–":Math.round(a*100)+"%"}</div><div class="l">avg quiz score</div></div>
<div class="stat"><div class="n">${cardsKnown}/${FLASHCARDS.length}</div><div class="l">cards mastered</div></div></div>
<div class="card"><h3>Accuracy by week</h3>${bars}<div class="small muted" style="margin-top:8px">Aim for 70%+ in every week before exam day.</div></div>
<div class="card"><h3>Target exam date</h3><input type="date" id="pg-tgt" value="${getTarget()}">
<button class="btn block" id="pg-save">Save</button></div>
<div class="card"><h3>Danger zone</h3><button class="btn ghost block" id="pg-reset">Reset all progress</button></div>`;
$("#pg-save").addEventListener("click",()=>{S.target=$("#pg-tgt").value||S.target;save();refreshHead();});
$("#pg-reset").addEventListener("click",()=>{if(confirm("Reset all SHRM prep progress?")){localStorage.removeItem(LSKEY);loadState();S.planStart=todayStr();save();refreshHead();renderProgress();}});}

/* ---- init ---- */
refreshHead();renderToday();
</script>

<script>
"use strict";
/* ---- EXPANSION BATCH 1: m1-m3 (q105-q140) ---- */
QUESTIONS.push(
/* m1 additional */
{id:"q105",m:"m1",t:"k",s:"An HR scorecard differs from a balanced scorecard in that the HR scorecard:",o:["Replaces the balanced scorecard","Links HR deliverables and metrics specifically to strategic business outcomes","Only tracks headcount","Is used solely for payroll"],a:1,e:"The HR scorecard maps HR activities → HR deliverables → strategic outcomes, showing HR's causal chain to business results."},
{id:"q106",m:"m1",t:"sj",s:"The company is shifting from startup to scale-up. HR still runs everything through the founder. What is the BEST structural move?",o:["Keep the founder approving every hire","Build HR service delivery: self-service, shared services/CoE, and HRBPs aligned to business units","Hire more generalists with no structure","Outsource all of HR immediately"],a:1,e:"Scale requires service-delivery structure: tiered model (self-service → shared services → centers of excellence → embedded HRBPs). Founder-bottleneck HR doesn't scale."},
{id:"q107",m:"m1",t:"k",s:"Mission, vision, and values differ in that:",o:["They are interchangeable terms","Mission = purpose today; vision = future aspiration; values = guiding principles","Only vision matters","Values are legally binding"],a:1,e:"Mission: why we exist now. Vision: where we're headed. Values: how we behave getting there. HR embeds all three in culture and talent practices."},
{id:"q108",m:"m1",t:"sj",s:"A business unit leader says 'HR is just overhead.' What is the MOST effective response?",o:["Argue about HR's importance","Ask what business problems they're facing, then show how HR initiatives moved those metrics elsewhere","Send them HR articles","Complain to the CEO"],a:1,e:"Convert skeptics with their own pain points: diagnose their business problem, then connect HR levers to outcomes they care about. Consultative, not defensive."},
{id:"q109",m:"m1",t:"k",s:"Which HR activity is the BEST example of outsourcing a non-core transactional function?",o:["Executive succession planning","Payroll processing and benefits administration","Culture transformation","Workforce strategy"],a:1,e:"Transactional, rules-based work (payroll, benefits admin) outsources well. Strategic work (succession, culture, workforce planning) stays in-house."},
{id:"q110",m:"m1",t:"sj",s:"Two divisions are merging with clashing cultures: one hierarchical, one flat and fast. HR's BEST first move?",o:["Impose one culture immediately","Assess both cultures, identify non-negotiables and risks, and design an integration plan with leadership","Ignore culture — focus on systems","Let them fight it out"],a:1,e:"Culture due diligence first: map both cultures, surface incompatibilities, and design integration deliberately. Most mergers fail on culture, not spreadsheets."},
{id:"q111",m:"m1",t:"k",s:"Human capital planning at the enterprise level is primarily concerned with:",o:["Daily scheduling","Ensuring the right talent capabilities exist to execute business strategy","Planning office parties","Writing job descriptions"],a:1,e:"Human capital planning = aligning talent supply, capabilities, and deployment with multi-year business strategy. It's strategic, not administrative."},
{id:"q112",m:"m1",t:"k",s:"A 'line of sight' between HR metrics and business outcomes means:",o:["HR reports to the CEO","HR can show how its measures connect to financial/operational results","Employees can see the HR office","Metrics are published"],a:1,e:"Line of sight: clear causal linkage from HR activity → workforce outcomes → business results. Without it, HR metrics are trivia."},
/* m2 additional */
{id:"q113",m:"m2",t:"k",s:"Under the FCRA, before taking adverse action based on a background check, the employer must:",o:["Do nothing — it's the vendor's job","Provide a pre-adverse-action notice with the report and a summary of rights, then wait before final action","Tell the candidate verbally","Get police approval"],a:1,e:"FCRA two-step: pre-adverse-action notice (report + rights summary + reasonable waiting period) THEN final adverse-action notice. Skipping steps creates liability."},
{id:"q114",m:"m2",t:"k",s:"A job analysis using the critical-incident technique focuses on:",o:["What the job pays","Specific examples of effective and ineffective job behaviors","The building layout","Employee opinions of management"],a:1,e:"Critical incidents = concrete behavioral examples of success/failure on the job. They feed BARS ratings and structured interview questions."},
{id:"q115",m:"m2",t:"sj",s:"A req has been open 90 days with few qualified applicants. The hiring manager wants to lower the degree requirement. What should HR do FIRST?",o:["Refuse — requirements are fixed","Analyze the funnel: sourcing channels, requirement validity, compensation competitiveness, and hiring-manager responsiveness","Lower it immediately","Close the req"],a:1,e:"Diagnose the funnel before changing standards: is it sourcing, an inflated requirement, below-market pay, or manager delay? Fix the actual constraint."},
{id:"q116",m:"m2",t:"k",s:"Skills-based hiring emphasizes:",o:["Pedigree and degrees","Demonstrated competencies over credentials","Internal candidates only","The lowest salary"],a:1,e:"Skills-based hiring evaluates what candidates can do (assessments, work samples) rather than proxies like degrees — widening pipelines and improving validity."},
{id:"q117",m:"m2",t:"k",s:"Replacement planning differs from succession planning in that replacement planning:",o:["Is long-term and developmental","Identifies short-term backups for critical roles without development focus","Only applies to CEOs","Is illegal"],a:1,e:"Replacement = short-term contingency (who covers if X leaves tomorrow). Succession = long-term development of future leaders. Both matter; don't confuse them."},
{id:"q118",m:"m2",t:"sj",s:"Internal mobility is low and external hiring is expensive. What is the BEST systemic fix?",o:["Ban external hiring","Build an internal talent marketplace: visible openings, skills profiles, and manager incentives to develop and release talent","Hope managers share people","Cut training budgets"],a:1,e:"Talent hoarding kills mobility. A marketplace with transparent postings, skills data, and incentives for talent-sharing managers fixes the system, not just symptoms."},
{id:"q119",m:"m2",t:"k",s:"O*NET is primarily used in HR for:",o:["Payroll processing","Standardized occupational data: tasks, skills, abilities, and work context for job analysis","Union elections","Benefits enrollment"],a:1,e:"O*NET (Occupational Information Network) provides validated occupational profiles — a starting point for job descriptions, selection criteria, and comp benchmarking."},
{id:"q120",m:"m2",t:"k",s:"The 'utility' of a selection procedure refers to:",o:["How much candidates enjoy it","Its overall value considering validity, applicant volume, and cost — i.e., payoff of better hires","Its length","Its legality"],a:1,e:"Utility analysis (e.g., Brogden-Cronbach-Gleser) quantifies the dollar payoff of a valid selection system: validity × volume × tenure value, minus cost."},
/* m3 additional */
{id:"q121",m:"m3",t:"k",s:"Psychological safety in teams is best defined as:",o:["Job security guarantees","A shared belief that the team is safe for interpersonal risk-taking (speaking up, admitting mistakes)","Avoiding all conflict","Low performance standards"],a:1,e:"Psychological safety (Edmondson): people can raise ideas, questions, and mistakes without fear of punishment — the top predictor of team learning and performance."},
{id:"q122",m:"m3",t:"k",s:"Employee satisfaction differs from employee engagement in that engagement:",o:["Is the same thing","Reflects emotional commitment and discretionary effort, not just contentment","Is measured only by pay","Cannot be measured"],a:1,e:"Satisfaction = contentment (can be passive). Engagement = commitment + discretionary effort toward goals. Satisfied employees may still do the minimum."},
{id:"q123",m:"m3",t:"sj",s:"A pulse survey shows burnout rising in one department with no change in workload. The manager is new. What is the BEST first step?",o:["Reduce everyone's hours","Assess manager behaviors (clarity, recognition, autonomy, fairness) — the likely driver — and coach","Hire more staff","Ignore it"],a:1,e:"Burnout without workload change points to the manager: lack of clarity, control, recognition, or fairness (Maslach's drivers). Diagnose the people factor first."},
{id:"q124",m:"m3",t:"k",s:"Job crafting refers to:",o:["Writing job descriptions","Employees proactively reshaping their tasks, relationships, and perceptions of their work","Eliminating jobs","Outsourcing"],a:1,e:"Job crafting: employees redesign aspects of their own jobs to increase meaning and fit — HR can enable it through autonomy and flexibility."},
{id:"q125",m:"m3",t:"sj",s:"Recognition program participation is low and cynicism is high ('it's fake'). What is the BEST redesign?",o:["Bigger cash awards","Shift to frequent, specific, peer-driven recognition tied to values — and train managers to do it well","Cancel recognition entirely","Annual awards only"],a:1,e:"Cynicism comes from generic, top-down, infrequent recognition. Frequent, specific, values-tied, peer-inclusive recognition rebuilds credibility."},
{id:"q126",m:"m3",t:"k",s:"The primary purpose of pulse surveys (vs annual engagement surveys) is:",o:["Replacing managers","Frequent, lightweight measurement enabling faster action on emerging issues","Cutting costs","Legal compliance"],a:1,e:"Pulses trade depth for speed: short, frequent check-ins that let HR spot trends and act quickly, supplementing the deep annual census."},
{id:"q127",m:"m3",t:"sj",s:"High performers report they love the work but feel 'invisible' to senior leadership. What is the BEST intervention?",o:["Pay raises for all","Create visibility mechanisms: skip-levels, project spotlights, leadership exposure for top talent","More surveys","Nothing — they said they love the work"],a:1,e:"Feeling invisible erodes retention even when the work is loved. Systematic visibility (not ad hoc) addresses the recognition gap at its source."},
{id:"q128",m:"m3",t:"k",s:"Which action-planning approach gets the BEST results from engagement survey data?",o:["HR acts on everything centrally","Managers own 1–2 actions with their teams, with visible follow-through and accountability","Publishing scores with no action","Re-surveying immediately"],a:1,e:"Survey credibility lives or dies on follow-through: managers pick 1–2 focus areas WITH their teams and report progress. Central HR can't action team-level issues."},
);
</script>
<script>
"use strict";
/* ---- EXPANSION BATCH 2: m4-m6 (q129-q164) ---- */
QUESTIONS.push(
/* m4 additional */
{id:"q129",m:"m4",t:"k",s:"The VARK model describes:",o:["A pay structure","Learning preferences: Visual, Auditory, Reading/writing, Kinesthetic","A leadership style","A hiring test"],a:1,e:"VARK = learning modality preferences. Design implication: blend modalities rather than teaching to one style."},
{id:"q130",m:"m4",t:"k",s:"Microlearning is MOST appropriate when:",o:["Teaching complex leadership judgment","Delivering just-in-time, bite-sized knowledge (procedures, product updates, compliance refreshers)","Replacing all training","Building deep technical expertise"],a:1,e:"Microlearning excels at short, focused, on-demand knowledge transfer. Complex judgment and deep skill-building need richer formats."},
{id:"q131",m:"m4",t:"sj",s:"Training transfer is weak: people learn in class but revert on the job. What is the BEST systemic fix?",o:["More classroom hours","Manager reinforcement, practice opportunities, and accountability for applying skills — transfer climate matters most","Harder tests","Longer manuals"],a:1,e:"Transfer research is clear: supervisor support, opportunity to practice, and accountability drive application far more than training design tweaks."},
{id:"q132",m:"m4",t:"k",s:"On-the-job training methods include all EXCEPT:",o:["Job rotation","Apprenticeship","Coaching","Lecture-only classroom sessions"],a:3,e:"OJT = learning while doing: rotation, apprenticeships, coaching, job instruction training. Lecture-only classroom is off-the-job."},
{id:"q133",m:"m4",t:"k",s:"Learning agility refers to:",o:["Typing speed","The ability to learn quickly from experience and apply it to new situations","Physical fitness","Software skills"],a:1,e:"Learning agility — learning from experience and adapting — is among the strongest predictors of leadership potential (used in 9-box 'potential' judgments)."},
{id:"q134",m:"m4",t:"sj",s:"Compliance training completion is 100% but violations continue. What is the BEST next step?",o:["More of the same training","Investigate root causes: is it knowledge, incentives, supervision, or culture? Then target the real driver","Fire violators","Longer training"],a:1,e:"100% completion with no behavior change means training wasn't the problem. Diagnose: incentives rewarding shortcuts? Supervisors looking away? Culture? Fix the cause."},
{id:"q135",m:"m4",t:"k",s:"Knowledge management in organizations primarily aims to:",o:["Delete old files","Capture, share, and apply institutional knowledge so it survives turnover","Monitor employees","Reduce training budgets"],a:1,e:"Knowledge management: systematically capture and share critical know-how (after-action reviews, expert directories, lessons-learned) to prevent knowledge walking out the door."},
{id:"q136",m:"m4",t:"k",s:"Management development differs from general training in that it:",o:["Is only classroom-based","Prepares employees for future leadership responsibilities over the long term","Is shorter","Requires no follow-up"],a:1,e:"Management development = long-term cultivation of leadership capability (rotations, mentoring, action learning) vs. training's shorter-term skill focus."},
/* m5 additional */
{id:"q137",m:"m5",t:"k",s:"Pay compression occurs when:",o:["Everyone is paid the same","New hires' pay approaches or exceeds experienced employees' pay in similar roles","Pay ranges are too wide","Bonuses are eliminated"],a:1,e:"Compression: market-driven new-hire rates collide with tenured employees' pay — a top driver of experienced-worker turnover. Fix via equity adjustments."},
{id:"q138",m:"m5",t:"k",s:"In salary surveys, the 50th percentile represents:",o:["The average of all salaries","The median — half of reported salaries fall above and half below","The maximum","The minimum"],a:1,e:"Percentiles: 50th = median. Comp analysts use percentiles (25th/50th/75th) to position pay strategy, not just averages which skew."},
{id:"q139",m:"m5",t:"sj",s:"Sales incentives reward individual results, but the new strategy needs team selling. What is the BEST redesign?",o:["Eliminate all incentives","Shift to team-based incentives with individual modifiers, aligned to collaborative behaviors","Keep individual plans","Pay everyone the same bonus"],a:1,e:"Incentives drive behavior: team strategy needs team measures. Blend team results with individual contribution modifiers to avoid free-riding."},
{id:"q140",m:"m5",t:"k",s:"Pay transparency laws (e.g., salary ranges in job postings) primarily aim to:",o:["Eliminate negotiations","Reduce pay gaps by exposing disparities and anchoring fair offers","Increase HR workload","Ban bonuses"],a:1,e:"Transparency requirements (now in many states including NY) expose ranges upfront, reducing information asymmetry that sustains pay gaps."},
{id:"q141",m:"m5",t:"k",s:"A 'living wage' differs from minimum wage in that it:",o:["Is set by federal law","Reflects the actual cost of basic needs in a location, typically above the legal minimum","Applies only to executives","Is the same everywhere"],a:1,e:"Living wage = calculated cost of basic needs for a locality (MIT Living Wage Calculator is the standard reference). Minimum wage = legal floor."},
{id:"q142",m:"m5",t:"sj",s:"Benefits utilization data shows the expensive wellness program has 8% participation. What should HR do FIRST?",o:["Cancel it immediately","Diagnose: awareness, access barriers, relevance, and timing — then redesign or reallocate","Double the budget","Mandate participation"],a:1,e:"Low utilization is a design/delivery problem until proven otherwise. Diagnose barriers (shift workers can't attend? nobody knows?) before killing or expanding."},
{id:"q143",m:"m5",t:"k",s:"Total rewards communication is critical because:",o:["It's legally required in all states","Employees systematically undervalue their total compensation without clear statements","It replaces pay raises","Unions demand it"],a:1,e:"Research: employees often perceive only base pay. Total-rewards statements (benefits, time off, retirement, perks quantified) correct the undervaluation."},
{id:"q144",m:"m5",t:"k",s:"Which benefit is typically the LARGEST cost to employers after wages?",o:["Free coffee","Health insurance","Gym memberships","Holiday parties"],a:1,e:"Health insurance is consistently the largest benefit cost — which is why benefits strategy, wellness ROI, and plan design are senior-HR topics."},
/* m6 additional */
{id:"q145",m:"m6",t:"k",s:"The 'seven tests of just cause' (Daugherty) are used to determine:",o:["Hiring validity","Whether discipline was fair and reasonable — arbitrators apply them in grievance cases","Pay equity","Training needs"],a:1,e:"Daugherty's seven tests (foreknowledge, reasonableness of rule, investigation, fair hearing, proof, equal treatment, proportionality) = the just-cause standard in arbitration."},
{id:"q146",m:"m6",t:"k",s:"A lockout is:",o:["A union tactic","An employer tactic: preventing employees from working during a labor dispute","Illegal in all cases","The same as a strike"],a:1,e:"Lockout = employer-initiated work stoppage to pressure the union. Strike = employee-initiated. Both are economic weapons; rules differ."},
{id:"q147",m:"m6",t:"sj",s:"A supervisor wants to settle a grievance by making an exception 'just this once' outside the contract. What should HR advise?",o:["Allow it — flexibility is good","Don't — past practice and precedent bind future cases; settle within the contract or document a non-precedent agreement explicitly","Let the supervisor decide alone","Ignore the grievance"],a:1,e:"'Just this once' exceptions become binding past practice in labor relations. Either stay within the CBA or explicitly document non-precedent terms with the union."},
{id:"q148",m:"m6",t:"k",s:"Right-to-work laws primarily mean:",o:["Everyone has a right to a job","Employees cannot be required to join a union or pay dues as a condition of employment","Unions are banned","Strikes are illegal"],a:1,e:"Right-to-work (27+ states): union security clauses requiring membership/dues are prohibited. Unions must still represent everyone in the unit."},
{id:"q149",m:"m6",t:"k",s:"The NLRB election process typically follows this order:",o:["Election → petition → campaign","Petition (30% showing) → investigation/hearing → election → certification","Certification → petition","Strike → election"],a:1,e:"Petition with 30% showing → NLRB investigates, determines unit, directs election → secret-ballot vote → certification on 50%+1 of votes cast."},
{id:"q150",m:"m6",t:"sj",s:"During a union campaign, a manager asks HR what they can legally say. What is the BEST guidance?",o:["Say nothing at all","TIPS/FORE: no threats, interrogation, promises, or surveillance; you may share facts, opinions, rules, and experience","Promise improvements if they vote no","Ask employees how they'll vote"],a:1,e:"TIPS is prohibited; FORE is permitted. Managers get the most in trouble improvising — give them the framework and approved talking points."},
{id:"q151",m:"m6",t:"k",s:"A supervisor's FIRST responsibility when receiving a grievance is to:",o:["Deny it","Listen fully, investigate the facts, and respond within contractual time limits","Call the CEO","Discipline the grievant"],a:1,e:"Most grievances are won or lost at step one: listen completely, gather facts, check the contract, and answer on time. Missed deadlines = automatic losses."},
{id:"q152",m:"m6",t:"k",s:"Picketing by a union is generally protected when it is:",o:["Violent","Peaceful and for a lawful purpose (e.g., publicizing a dispute)","Blocking entrances","Threatening customers"],a:1,e:"Peaceful picketing for lawful objectives is protected concerted activity. Violence, threats, or blocking ingress/egress lose protection."},
);
</script>
<script>
"use strict";
/* ---- EXPANSION BATCH 3: m7-m9 (q153-q188) ---- */
QUESTIONS.push(
/* m7 additional */
{id:"q153",m:"m7",t:"k",s:"The Equal Pay Act requires:",o:["Identical pay for all employees","Equal pay for substantially equal work regardless of sex, with limited defenses (seniority, merit, production, other-than-sex factors)","Pay based on negotiation skill","Annual raises for everyone"],a:1,e:"EPA (1963): equal pay for substantially equal work (skill, effort, responsibility, conditions) regardless of sex. The four affirmative defenses are narrow."},
{id:"q154",m:"m7",t:"k",s:"The Pregnancy Discrimination Act (PDA) provides that:",o:["Pregnant employees get unlimited leave","Pregnancy is treated like any other temporary disability for employment purposes","Only large employers comply","Fathers get no leave"],a:1,e:"PDA: pregnancy, childbirth, and related conditions must be treated the same as other temporary disabilities in benefits, leave, and accommodations."},
{id:"q155",m:"m7",t:"k",s:"GINA (Genetic Information Nondiscrimination Act) prohibits:",o:["All medical exams","Using genetic information (including family medical history) in employment decisions","Hiring smokers","Drug testing"],a:1,e:"GINA bars employment use of genetic info — including family medical history, which is why HR must warn against 'watercooler' health inquiries and keep forms clean."},
{id:"q156",m:"m7",t:"sj",s:"An employee files an EEOC charge. What is HR's MOST important immediate action?",o:["Fire the employee","Preserve all relevant documents (litigation hold), notify legal, and prepare a factual position statement","Ignore it","Offer a settlement immediately"],a:1,e:"EEOC charge = litigation hold + legal involvement + careful position statement. Retaliation after a charge is the fastest way to multiply liability."},
{id:"q157",m:"m7",t:"k",s:"Retaliation claims require:",o:["Proof the underlying discrimination claim succeeded","Protected activity + adverse action + causal connection","A union","Two witnesses"],a:1,e:"Retaliation = (1) protected activity (complaint, charge, participation), (2) materially adverse action, (3) causal link. The underlying claim need not succeed."},
{id:"q158",m:"m7",t:"k",s:"Constructive discharge occurs when:",o:["An employee is laid off","Working conditions become so intolerable a reasonable person would resign — treated as a termination","An employee quits for a better job","A contract expires"],a:1,e:"Constructive discharge = resignation deemed a firing because conditions were intolerable (severe harassment, demotion, pay cuts). Triggers wrongful-termination analysis."},
{id:"q159",m:"m7",t:"sj",s:"A manager learns an employee's misconduct only AFTER terminating them for a discriminatory reason. This 'after-acquired evidence':",o:["Excuses the discrimination","May limit back pay/remedies but does not excuse the discriminatory termination","Is inadmissible","Requires rehiring"],a:1,e:"After-acquired evidence (McKennon v. Nashville Banner): misconduct discovered post-termination can limit remedies, but the termination's motive is still judged unlawful."},
{id:"q160",m:"m7",t:"k",s:"IRCA (Immigration Reform and Control Act) requires employers to:",o:["Sponsor all workers","Complete Form I-9 verifying identity and work authorization for every hire","Hire only citizens","Check credit scores"],a:1,e:"IRCA: I-9 for every employee (citizens included), no knowing hire of unauthorized workers, no document abuse or citizenship discrimination."},
{id:"q161",m:"m7",t:"sj",s:"Two employees commit the same policy violation; the manager wants to fire the Black employee and warn the white employee. What must HR do?",o:["Support the manager's discretion","Stop it — inconsistent discipline by race is disparate treatment; enforce consistent standards","Document and allow it","Transfer one employee"],a:1,e:"Inconsistent discipline across protected classes is textbook disparate treatment. HR must enforce the standard consistently — this is exactly the moment HR earns its keep."},
{id:"q162",m:"m7",t:"k",s:"The Faragher/Ellerth defense allows an employer to avoid liability for supervisor harassment when:",o:["The victim never complained","The employer exercised reasonable care (policy, complaint process, training) and the employee unreasonably failed to use it","The harasser is a top performer","It happened off-site"],a:1,e:"Faragher/Ellerth affirmative defense (no tangible employment action): reasonable care by employer + employee's unreasonable failure to use preventive opportunities."},
/* m8 additional */
{id:"q163",m:"m8",t:"k",s:"A written Emergency Action Plan (OSHA) must include:",o:["Catering menus","Evacuation procedures, escape routes, accounting for employees, and alarm systems","Stock prices","Vendor lists"],a:1,e:"OSHA EAP requirements: reporting emergencies, evacuation procedures/routes, critical-operations shutdown, headcount procedures, rescue/medical duties, alarm systems."},
{id:"q164",m:"m8",t:"k",s:"Return-to-work (light duty) programs primarily benefit the employer by:",o:["Punishing injured workers","Reducing workers' comp costs and duration while supporting recovery","Avoiding OSHA logs","Eliminating claims"],a:1,e:"Structured RTW: controlled costs, shorter disability duration, retained talent, and better outcomes for the worker. It must be genuine, not punitive."},
{id:"q165",m:"m8",t:"sj",s:"An employee reports a supervisor for bullying (no protected class involved). What is HR's BEST response?",o:["Do nothing — bullying isn't illegal","Investigate under the company's respectful-workplace policy; bullying still creates liability and retention risk","Say it's a personality clash","Transfer the complainant"],a:1,e:"Workplace bullying isn't per se unlawful (no federal statute), but most employers prohibit it by policy — and unchecked bullying drives claims and turnover. Investigate per policy."},
{id:"q166",m:"m8",t:"k",s:"Root-cause analysis of a safety incident aims to:",o:["Assign blame","Identify underlying systemic causes (not just the immediate trigger) to prevent recurrence","Satisfy insurance","Close the case fast"],a:1,e:"Root cause > blame: ask 'why' repeatedly (5 Whys) past the proximate cause to system fixes — training, design, supervision, incentives."},
{id:"q167",m:"m8",t:"sj",s:"A disgruntled employee posts the company's client list on social media. What should HR do FIRST?",o:["Comment publicly","Coordinate with legal/IT: preserve evidence, assess trade-secret exposure, and follow the social media/confidentiality policy process","Delete their accounts","Do nothing"],a:1,e:"Potential trade-secret misappropriation: preserve evidence first, assess exposure with legal, then act under policy. Public confrontation destroys the case."},
{id:"q168",m:"m8",t:"k",s:"Drug testing of employees is MOST defensible when:",o:["Random for all office staff","Based on reasonable suspicion, post-accident, or for safety-sensitive/DOT-regulated roles under a clear written policy","Done secretly","Only for executives"],a:1,e:"Testing must rest on policy + job-relatedness: safety-sensitive roles, DOT mandates, reasonable suspicion, post-accident. State laws vary widely — check local rules."},
{id:"q169",m:"m8",t:"k",s:"Business continuity planning differs from disaster recovery in that business continuity:",o:["Only covers IT","Keeps critical business functions operating during disruption; DR focuses on restoring IT systems","Is optional","Only applies to hurricanes"],a:1,e:"BCP = continuity of critical operations (people, processes, facilities). DR = IT/systems restoration. HR owns the people side: succession, communications, payroll continuity."},
{id:"q170",m:"m8",t:"sj",s:"After a near-miss (forklift almost hits a worker), the supervisor says 'no harm, no foul.' What should HR insist on?",o:["Agree — nothing happened","Investigate the near-miss like an actual incident; near-misses predict future injuries","Discipline the worker","Ignore it"],a:1,e:"Near-miss investigation is a leading indicator program: same root-cause process as real incidents. 'No harm no foul' guarantees the next one causes harm."},
/* m9 additional */
{id:"q171",m:"m9",t:"k",s:"Predictive analytics in HR (e.g., flight-risk models) must be used carefully because:",o:["They're always wrong","Models can encode historical bias and create self-fulfilling or discriminatory actions if applied without validation","They're too expensive","Managers dislike them"],a:1,e:"Predictive models learn from past data — including past bias. Validate, audit for adverse impact, and use predictions to support (not replace) human decisions."},
{id:"q172",m:"m9",t:"k",s:"Correlation differs from causation in HR analytics because:",o:["They're identical","Correlation shows relationship; causation requires ruling out other explanations (experiments, controls)","Correlation is useless","Causation can't be studied"],a:1,e:"Engagement correlates with performance — but does engagement drive performance or vice versa (or does good management drive both)? Interventions need causal evidence."},
{id:"q173",m:"m9",t:"sj",s:"A dashboard shows training hours up 30% and the CLO claims victory. What should HR ask?",o:["Nothing — celebrate","What changed in capability, behavior, or business results? Activity metrics don't prove impact","For more budget","To publish it"],a:1,e:"Activity ≠ impact. Push past vanity metrics to outcome measures: behavior change, performance, business results. That's the analytics maturity leap."},
{id:"q174",m:"m9",t:"k",s:"Quality of hire is BEST measured by:",o:["Time to fill","New-hire performance ratings, ramp time, and first-year retention combined","Number of applicants","Cost per hire"],a:1,e:"Quality of hire = composite: performance + ramp speed + retention of new hires. Single metrics mislead; triangulate."},
{id:"q175",m:"m9",t:"k",s:"Revenue per FTE is useful because it:",o:["Replaces all other metrics","Links workforce size to business output — a productivity measure executives understand","Measures engagement","Calculates bonuses"],a:1,e:"Revenue/FTE = workforce productivity in the language of the business. Track trends and benchmark; pair with quality measures."},
{id:"q176",m:"m9",t:"sj",s:"An engagement survey has leading questions ('How much do you love our great culture?'). What is the impact?",o:["None — surveys are fine","Biased, invalid data that destroys credibility; redesign with neutral, behaviorally anchored items","Higher scores are good","More responses"],a:1,e:"Leading questions produce garbage data and cynicism. Valid surveys use neutral wording, balanced scales, and anonymity protections."},
{id:"q177",m:"m9",t:"k",s:"Benchmarking HR metrics against peers is MOST valuable when:",o:["Used to copy competitors blindly","Comparing similar organizations and using gaps to prompt investigation, not automatic action","Done annually regardless","Shared publicly"],a:1,e:"Benchmarks prompt questions ('why is our turnover 2× peer median?'), not answers. Context (strategy, labor markets) determines whether a gap matters."},
{id:"q178",m:"m9",t:"k",s:"Data storytelling in HR means:",o:["Making up narratives","Framing analytics with context, visuals, and a clear so-what that drives decisions","Hiding bad news","Long reports"],a:1,e:"Data storytelling: context → insight → implication → recommended action, visualized clearly. Analysis without a decision attached is shelfware."},
);
</script>
<script>
"use strict";
/* ---- EXPANSION BATCH 4: m10-m12 (q189-q224) ---- */
QUESTIONS.push(
/* m10 additional */
{id:"q189",m:"m10",t:"k",s:"Force field analysis (Lewin) in change management involves:",o:["Weather patterns","Identifying driving forces for change and restraining forces against it, then shifting the balance","Hiring freezes","Budget cuts"],a:1,e:"Force field: map drivers vs restrainers. Change happens by strengthening drivers AND (more powerfully) weakening restrainers."},
{id:"q190",m:"m10",t:"k",s:"Tuckman's stages of team development in order are:",o:["Performing, storming, norming, forming","Forming, storming, norming, performing, adjourning","Planning, doing, checking","Hire, train, retain"],a:1,e:"Forming → Storming → Norming → Performing (+ Adjourning). Leaders misdiagnose storming as failure; it's a normal developmental stage."},
{id:"q191",m:"m10",t:"k",s:"A matrix organizational structure is characterized by:",o:["No managers","Dual reporting relationships (e.g., functional and product/project)","Only remote workers","No hierarchy at all"],a:1,e:"Matrix = employees report to both functional and business-unit/project managers. Flexible but creates role conflict and power struggles — needs clear governance."},
{id:"q192",m:"m10",t:"k",s:"Job enrichment differs from job enlargement in that enrichment:",o:["Adds more tasks at the same level","Adds vertical depth: autonomy, responsibility, and decision-making (Hackman & Oldham job characteristics)","Cuts pay","Reduces hours"],a:1,e:"Enlargement = more tasks, same level (horizontal). Enrichment = deeper responsibility and autonomy (vertical) — the one that actually motivates."},
{id:"q193",m:"m10",t:"sj",s:"Performance ratings cluster at 'meets expectations' for 90% of staff, yet business results vary widely. What is the BEST fix?",o:["Force a bell curve immediately","Train managers on rating errors (central tendency, leniency), use calibration, and require evidence-based differentiation","Eliminate ratings","Give everyone exceeds"],a:1,e:"Central tendency + leniency errors produce mushy ratings. Fix with rater training, calibration sessions, and evidence requirements — not forced distribution alone."},
{id:"q194",m:"m10",t:"k",s:"The SBI feedback model stands for:",o:["Strategy, Behavior, Impact","Situation, Behavior, Impact","Salary, Bonus, Incentive","Stop, Begin, Improve"],a:1,e:"SBI: describe the Situation, the observable Behavior, and its Impact. Specific and non-judgmental — the foundation of effective feedback."},
{id:"q195",m:"m10",t:"k",s:"Halo effect in performance appraisal is:",o:["A lighting issue","Letting one positive trait color the entire evaluation","Rating everyone poorly","A type of bonus"],a:1,e:"Halo: one standout trait inflates all ratings. Horn effect is the reverse. Structured criteria and evidence requirements counter both."},
{id:"q196",m:"m10",t:"sj",s:"A reorg announcement leaked early and rumors are spiraling. What is HR's BEST immediate move?",o:["Deny the rumors","Accelerate honest communication: confirm what's true, correct falsehoods, share the timeline for details","Punish the leaker publicly","Say nothing until perfect information exists"],a:1,e:"Vacuum fills with rumor. Get ahead: confirm, correct, and commit to a communication timeline. Waiting for perfect information cedes the narrative."},
{id:"q197",m:"m10",t:"k",s:"Succession depth is measured by:",o:["CEO tenure","The number of ready-now and ready-future candidates for critical roles","Training hours","Headcount"],a:1,e:"Bench strength = ready-now + ready-in-1–2-years + ready-in-3–5-years per critical role. Single-successor plans are fragile."},
{id:"q198",m:"m10",t:"k",s:"Empowerment in organizations requires all EXCEPT:",o:["Clear boundaries and decision rights","Access to information and resources","Accountability for results","Abandoning all oversight"],a:3,e:"Empowerment = authority + information + resources + accountability within clear guardrails. Abdication (no oversight) isn't empowerment — it's neglect."},
/* m11 additional */
{id:"q199",m:"m11",t:"k",s:"Hofstede's individualism vs collectivism dimension affects HR in that:",o:["It determines pay rates","Collectivist cultures favor group harmony, consensus, and team rewards; individualist cultures favor personal achievement and individual incentives","It only matters in Asia","It's about office layout"],a:1,e:"Individualism (US) rewards personal achievement; collectivism (much of Asia, Latin America) values group harmony — shaping incentives, feedback, and decision processes."},
{id:"q200",m:"m11",t:"k",s:"High-context cultures (e.g., Japan, Arab countries) communicate with:",o:["Blunt directness","Implicit, nuanced messages relying on shared understanding and nonverbals","Only email","No meetings"],a:1,e:"Hall's high/low context: high-context = meaning in situation and nonverbals (indirect); low-context = explicit words (US, Germany). Mismatch causes offense."},
{id:"q201",m:"m11",t:"k",s:"Uncertainty avoidance (Hofstede) describes:",o:["Travel policies","Comfort with ambiguity and change — high-UA cultures prefer rules, structure, and predictability","Insurance coverage","Risk-free investments"],a:1,e:"High uncertainty avoidance (Japan, Greece): rules, precision, resistance to change. Low-UA (US, Singapore): comfort with ambiguity. Shapes change management globally."},
{id:"q202",m:"m11",t:"sj",s:"A global DEI initiative designed in the US is flopping in European offices ('American import'). What is the BEST adjustment?",o:["Force compliance","Localize: adapt language, legal framing, and priorities to each region while keeping global principles","Abandon DEI globally","Run it only in the US"],a:1,e:"Glocalization: global principles, local expression. DEI language, legal context (quotas vs affirmative action differ), and priorities legitimately vary by region."},
{id:"q203",m:"m11",t:"k",s:"Employee Resource Groups (ERGs) are MOST effective when they:",o:["Are purely social clubs","Have executive sponsors, clear charters tied to business goals, and real influence","Exclude allies","Meet secretly"],a:1,e:"Mature ERGs: executive sponsorship, business-aligned charters (talent, market insight), and influence — not just social programming."},
{id:"q204",m:"m11",t:"k",s:"An inpatriate is:",o:["An expat who never leaves","An employee brought FROM a foreign subsidiary INTO headquarters country","A remote worker","A retiree"],a:1,e:"Inpatriate = foreign-subsidiary talent assigned to HQ (reverse of expatriate). Builds global mindset at headquarters."},
{id:"q205",m:"m11",t:"sj",s:"Pay equity analysis shows gaps in some countries but local law restricts collecting demographic data. What should HR do?",o:["Skip those countries","Use lawful proxies and role-based analysis where demographics can't be collected; document methodology","Break local law","Assume no gaps exist"],a:1,e:"Global pay equity must navigate data-privacy regimes (GDPR etc.): use permitted methods, document approach, and be transparent about limitations."},
{id:"q206",m:"m11",t:"k",s:"Standardization vs localization in global HR means balancing:",o:["Nothing — pick one","Global consistency and efficiency against local legal, cultural, and market fit","Cost vs quality only","HQ vs subsidiary headcount"],a:1,e:"The central global-HR tension: standardize where consistency/efficiency win (values, core systems), localize where law and culture demand it."},
/* m12 additional */
{id:"q207",m:"m12",t:"k",s:"Transformational leadership differs from transactional leadership in that transformational leaders:",o:["Focus only on exchanges and rewards","Inspire change through vision, intellectual stimulation, and individualized consideration","Avoid all change","Manage by exception only"],a:1,e:"Transformational (Bass): idealized influence, inspirational motivation, intellectual stimulation, individualized consideration. Transactional = contingent reward + management by exception."},
{id:"q208",m:"m12",t:"k",s:"Goleman's emotional intelligence framework includes:",o:["IQ only","Self-awareness, self-regulation, motivation, empathy, social skills","Physical strength","Technical expertise"],a:1,e:"EI: self-awareness, self-regulation, motivation, empathy, social skills. Research links EI — especially self-awareness — to leadership effectiveness."},
{id:"q209",m:"m12",t:"k",s:"Servant leadership is best described as:",o:["Weak leadership","Leading by prioritizing followers' growth and well-being — the leader serves the team","Avoiding decisions","Only for nonprofits"],a:1,e:"Servant leadership (Greenleaf): the leader's first responsibility is serving followers' development — measured by whether people grow healthier, wiser, freer."},
