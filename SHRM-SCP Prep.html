{id:"q534",m:"m5",t:"k",s:"Geographic pay differentials are BEST set by:",o:["Labor-market pay data for the work location (or talent market), not just cost of living","Cost of living only","Employee preference","Headquarters location"],a:0,e:"Pay follows labor markets, not grocery prices: use market pricing for the location where you compete for talent. COL matters for employee experience, not comp strategy."},
{id:"q535",m:"m5",t:"sj",s:"Remote employees moved to low-cost areas but keep high-cost-area salaries. Finance wants cuts. What should HR recommend?",o:["Cut pay immediately","Ignore finance","Cut everyone equally","Grandfather current pay, apply location-based ranges to new hires and transfers, and communicate the philosophy before acting"],a:3,e:"Retroactive pay cuts destroy trust and may breach implied terms. Prospective location-based policy for new hires/transfers, grandfathering incumbents, is the defensible path."},
{id:"q536",m:"m5",t:"k",s:"A recoverable draw against commission means:",o:["Free money","Illegal","Advances the salesperson must repay from future commissions if earnings fall short","A salary"],a:2,e:"Recoverable draw = advance against future commissions, repayable on shortfall (or on termination, per agreement). Non-recoverable draws are guaranteed minimums."},
{id:"q537",m:"m5",t:"k",s:"Under the DOL's primary-beneficiary test, an unpaid intern is lawful when:",o:["The intern is the primary beneficiary: training resembles education, no displacement of paid staff, no entitlement to a job","The company is a nonprofit","The intern signs a waiver","They work under 20 hours"],a:0,e:"Seven-factor test: internship must primarily benefit the intern (educational, mentored, no displacement, no job promise). Waivers don't cure misclassification."},
{id:"q538",m:"m5",t:"k",s:"Worker misclassification (employee vs independent contractor) matters for total rewards because misclassified workers:",o:["Get better benefits","Prefer it","Are exempt from all laws","Lose overtime, benefits, workers' comp, and payroll-tax protections - creating back-pay, tax, and benefits liability"],a:3,e:"Misclassification strips overtime, benefits eligibility, and tax treatment - with liability for back wages, back taxes, penalties, and retroactive benefits."},
{id:"q539",m:"m5",t:"k",s:"Tuition reimbursement up to $5,250 per year is excludable from income under:",o:["No provision","Only for MBAs","IRC Section 127 (educational assistance), whether or not job-related","State law"],a:2,e:"Section 127: up to $5,250/year in employer educational assistance is tax-free to the employee, no job-relatedness required (unlike working-condition fringe treatment)."},
{id:"q540",m:"m5",t:"k",s:"De minimis fringe benefits (occasional coffee, holiday turkey) are:",o:["Fully taxable","Illegal","Only for executives","Excludable because accounting for them is unreasonable or administratively impracticable"],a:3,e:"De minimis fringes: occasional, low-value perks excludable as administratively impracticable to track. Cash and cash-equivalents (gift cards) are never de minimis."},
{id:"q541",m:"m5",t:"k",s:"A salary-history ban (in effect in many states and cities) means:",o:["Employees can't discuss pay","Pay transparency is banned","Negotiation is banned","Employers may not ask about or rely on prior salary in hiring - set offers on market data and candidate qualifications"],a:3,e:"Salary-history bans break the cycle of past discrimination compounding forward: price the job on market data and skills, not the candidate's pay past."},
{id:"q542",m:"m5",t:"sj",s:"A hiring manager wants to ask candidates their current salary 'to calibrate the offer.' What should HR do?",o:["Allow it - it's efficient","Allow it if the candidate volunteers","Only ask executives","Prohibit the question where banned, and everywhere train managers to price offers from the range and market data"],a:3,e:"Even where not yet banned, salary-history reliance perpetuates inequities and creates audit risk. Range-based offers are the defensible practice."},
{id:"q543",m:"m5",t:"k",s:"For an ADEA waiver in a severance agreement to be knowing and voluntary (OWBPA), it must:",o:["Be verbal","Be one page","Be in plain language, specifically reference ADEA rights, not waive future claims, offer consideration beyond what's owed, advise consulting counsel, and give 21 days to consider (45 for group programs) plus 7 days to revoke","Be signed immediately"],a:2,e:"OWBPA checklists make or break severance releases for workers 40+: specific ADEA reference, consideration, counsel advice, 21/45-day consideration periods, 7-day revocation."},
{id:"q544",m:"m5",t:"sj",s:"A RIF severance offers 2 weeks per year of service but requires signing the ADEA waiver on the spot. What is wrong?",o:["Nothing","The formula is wrong","No consideration period or revocation right - the waiver is invalid under OWBPA, jeopardizing the release","Severance is illegal"],a:2,e:"On-the-spot ADEA waivers fail OWBPA's 21/45-day and 7-day requirements. An invalid waiver means the company paid severance without buying peace."},
{id:"q545",m:"m5",t:"k",s:"Phantom stock differs from real equity in that:",o:["It's illegal","It pays cash bonuses tied to share value without granting actual ownership or shareholder rights","It's only for startups","It can't be taxed"],a:1,e:"Phantom stock/SARs: cash-settled awards mirroring share appreciation - ownership economics without dilution, voting rights, or cap-table complexity."},
{id:"q546",m:"m5",t:"k",s:"An employee assistance program (EAP) is:",o:["A bonus","Mandatory overtime","A retirement plan","An employer-paid confidential counseling and referral benefit - a low-cost, high-impact part of total rewards"],a:3,e:"EAPs: confidential short-term counseling, crisis support, and referrals - cheap per-employee per-month, valuable for well-being, and a utilization metric worth tracking."},
{id:"q547",m:"m5",t:"sj",s:"Benefits survey shows employees rank the 401(k) match highly but HR is considering cutting it to fund a flashier perk. What is the BEST advice?",o:["Protect the match: cutting a highly valued core benefit to fund a novelty destroys trust and rarely improves attraction or retention","Cut it - perks attract talent","Cut it quietly","Ask the CEO alone"],a:0,e:"Employees punish benefit takeaways far more than they reward additions (loss aversion). Fund new perks from new money, not by raiding valued core benefits."},
{id:"q548",m:"m6",t:"k",s:"Under Electromation (NLRA 8(a)(2)), an employer-created employee involvement committee is unlawful when:",o:["The employer dominates it and it functions as a labor organization dealing with working conditions","Employees discuss safety","It meets monthly","Managers attend"],a:0,e:"Electromation: employer-dominated groups that 'deal with' management over conditions of employment are unlawful company unions. HR-designed engagement committees need structural safeguards."},
{id:"q549",m:"m6",t:"sj",s:"HR wants to launch plant 'action teams' where elected workers meet with management to resolve grievances and set break policies. What is the risk?",o:["8(a)(2) risk: a bilateral body addressing grievances and terms of employment looks like an employer-dominated labor organization","None - engagement is good","Only a wage risk","Only if unionized"],a:0,e:"Teams that handle grievances and set conditions with management cross the Electromation line. Keep teams advisory, employee-led, and away from bilateral dealing over terms."},
{id:"q550",m:"m6",t:"k",s:"The Wright Line test applies to:",o:["Determining whether discipline was motivated by anti-union animus: General Counsel shows protected activity was a motivating factor, then the employer must prove it would have acted anyway","Overtime","Elections","Picketing"],a:0,e:"Wright Line burden-shifting: GC proves anti-union motive contributed; employer then must show the same discipline would have occurred absent protected activity."},
{id:"q551",m:"m6",t:"sj",s:"A union organizer with a spotless record is fired for a minor tardiness that others commit freely. What is the likely NLRB outcome?",o:["Lawful - tardiness is tardiness","Lawful if documented","8(a)(3) violation under Wright Line: disparate treatment of a known activist fails the employer's burden","Only a warning is required"],a:2,e:"Disparate enforcement against a known activist is textbook 8(a)(3). The employer can't meet Wright Line when comparators got passes for the same conduct."},
{id:"q552",m:"m6",t:"k",s:"Section 8(a)(3)'s 30-day proviso means union-shop agreements may require membership only after:",o:["1 day","30 days of employment","1 year","Never"],a:1,e:"Union security clauses can't require membership before 30 days on the job (7 days in construction under 8(f)) - protecting new hires' grace period."},
{id:"q553",m:"m6",t:"k",s:"Beck rights allow nonmember employees in a union shop to:",o:["Pay nothing","Skip all meetings","Object to paying the portion of dues spent on non-representational activities (politics, organizing)","Vote in union elections"],a:2,e:"Communications Workers v. Beck: nonmembers can object to fees beyond core representational costs (bargaining, grievances, arbitration) and pay only their fair share."},
{id:"q554",m:"m6",t:"k",s:"Janus v. AFSCME (2018) held that:",o:["Unions are illegal","Strikes are illegal","Mandatory agency fees for public-sector employees violate the First Amendment","Dues are tax-deductible"],a:2,e:"Janus ended public-sector agency fees: compelling nonmembers to subsidize union speech violates the First Amendment. Public unions now rely on voluntary membership."},
{id:"q555",m:"m6",t:"sj",s:"After Janus, a public employer's payroll still deducts agency fees from nonmembers. What must HR do?",o:["Continue - the contract requires it","Wait for the union","Stop the deductions immediately; continuing violates Janus and exposes the employer to liability","Ask employees"],a:2,e:"Janus is self-executing: post-decision agency-fee deductions from objecting public employees are unconstitutional. Contracts can't override it."},
{id:"q556",m:"m6",t:"k",s:"Dues checkoff (payroll deduction of union dues) requires:",o:["Nothing","Only a verbal okay","A court order","The employee's individual written authorization, and is a mandatory bargaining subject"],a:3,e:"Checkoff needs written individual authorization; once bargained, the employer must honor it. Revocation follows the authorization/CBA terms."},
{id:"q557",m:"m6",t:"k",s:"The duty of fair representation (Vaca v. Sipes) is breached when a union acts in a manner that is:",o:["Arbitrary, discriminatory, or in bad faith toward a bargaining-unit member","Merely negligent","Slow","Unpopular"],a:0,e:"DFR standard: arbitrary, discriminatory, or bad-faith conduct - mere negligence or a debatable judgment call in handling a grievance doesn't breach the duty."},
{id:"q558",m:"m6",t:"sj",s:"A steward declines to take a weak grievance to arbitration after a reasonable investigation. The grievant sues. Likely outcome?",o:["Union liable","Employer liable","No breach: unions have discretion to settle or drop grievances; reasonable investigation defeats a DFR claim","Automatic arbitration"],a:2,e:"Unions aren't required to arbitrate every grievance. A reasoned decision after investigation is protected discretion, not arbitrary conduct."},
{id:"q559",m:"m6",t:"k",s:"Fibreboard holds that an employer's decision to subcontract bargaining-unit work is:",o:["Always a management right","A mandatory bargaining subject when the subcontracting replaces unit employees doing the same work under similar conditions","Illegal","Optional"],a:1,e:"Fibreboard: subcontracting that substitutes other workers for unit employees on the same work is a mandatory subject - bargain the decision, not just effects."},
{id:"q560",m:"m6",t:"k",s:"First National Maintenance distinguishes Fibreboard by holding:",o:["All closings must be bargained","No duty to bargain the DECISION to partially close for legitimate economic reasons, but effects bargaining is still required","Effects bargaining is illegal","Unions decide closings"],a:1,e:"FNM: partial closings driven by economics (not labor costs) need only effects bargaining - severance, notice, transfer rights - not decision bargaining."},
{id:"q561",m:"m6",t:"sj",s:"The company will close one plant because the product line is unprofitable. The union demands bargaining over the closure decision. What is required?",o:["Bargain the decision to impasse","Ignore the union","Effects bargaining only (severance, benefits, transfer rights); no duty to bargain the economic closure decision itself","Let the union vote"],a:2,e:"Under First National Maintenance, economically motivated partial closings trigger effects bargaining, not decision bargaining. Document the economic rationale."},
{id:"q562",m:"m6",t:"k",s:"Under Burns, a successor employer that hires a majority of the predecessor's workforce:",o:["Must recognize and bargain with the incumbent union but is generally not bound by the predecessor's contract","Must adopt the predecessor's CBA","May ignore the union","Must fire everyone"],a:0,e:"Burns: substantial continuity + workforce majority = bargaining obligation with the incumbent union, but the successor sets its own initial terms (not bound by the old CBA)."},
{id:"q563",m:"m6",t:"k",s:"A 'perfectly clear' successor may be bound by the predecessor's CBA when it:",o:["Hires anyone","Misleads employees into believing terms will continue unchanged, then alters them without bargaining","Is larger","Changes the name"],a:1,e:"Perfectly-clear doctrine: if the successor invites reliance that existing terms will be honored, it forfeits the right to set initial terms unilaterally."},
{id:"q564",m:"m6",t:"k",s:"The alter-ego doctrine treats two nominally separate companies as one employer when there is:",o:["Common ownership/control plus an anti-union motive (disguised continuance to evade bargaining obligations)","Common customers","Different industries","Shared parking"],a:0,e:"Alter ego: same owners open a 'new' nonunion company to evade the CBA - common control + anti-union purpose = single employer bound by obligations."},
{id:"q565",m:"m6",t:"sj",s:"After unionization, the owner opens an identical nonunion shop across town with the same managers and equipment. What is HR witnessing?",o:["A likely alter-ego/successor violation if the motive is evading the union - document and get labor counsel immediately","Smart business","Normal expansion","Nothing actionable"],a:0,e:"Double-breasted operations to shed the union invite alter-ego findings. Any legitimate business rationale must be documented; anti-union motive is fatal."},
{id:"q566",m:"m6",t:"k",s:"Mackay Radio holds that in an ECONOMIC strike, an employer may:",o:["Fire all strikers","Do nothing","Permanently replace economic strikers","Close permanently"],a:2,e:"Mackay doctrine: economic strikers may be permanently replaced (though they retain Laidlaw reinstatement rights as vacancies occur). ULP strikers cannot be permanently replaced."},
{id:"q567",m:"m6",t:"k",s:"Laidlaw gives replaced economic strikers:",o:["Preferential reinstatement rights as positions become available","Nothing","Immediate reinstatement","Double pay"],a:0,e:"Laidlaw: economic strikers keep employee status and must be offered vacancies as they arise before outside hiring - maintain the preferential list."},
{id:"q568",m:"m6",t:"sj",s:"The strike was caused by the company's unlawful refusal to bargain. The company hired permanent replacements. What are the strikers' rights?",o:["Same as economic strikers","They lose their jobs","As ULP strikers, they are entitled to immediate reinstatement upon an unconditional offer to return - permanent replacements must yield","They must wait"],a:2,e:"ULP strikers get full reinstatement on unconditional return, displacing permanent replacements. Misclassifying the strike type is a costly error."},
{id:"q569",m:"m6",t:"k",s:"A sit-down strike (occupying the plant) is:",o:["Protected","Unprotected - seizure of employer property removes NLRA protection","Protected if peaceful","Always legal"],a:1,e:"Sit-down strikes seize property and are unprotected; participants may be lawfully discharged. Protected strikes withhold labor without seizing the premises."},
{id:"q570",m:"m6",t:"k",s:"Intermittent or partial strikes (repeated short stoppages) are:",o:["Protected","Encouraged","A management right","Generally unprotected under the Elk Lumber doctrine"],a:3,e:"Intermittent strike strategy - hit-and-run stoppages while retaining employment - is unprotected; the Board treats it as an attempt to dictate terms while working."},
{id:"q571",m:"m6",t:"k",s:"Healthcare institutions facing a strike are entitled to:",o:["No notice","30 days' notice","10 days' written notice to the institution and FMCS under Section 8(g)","A court order"],a:2,e:"8(g): unions must give 10 days' written notice before strikes/picketing at healthcare institutions - protecting patient care continuity. HR contingency plans hinge on this window."},
{id:"q572",m:"m6",t:"sj",s:"A hospital receives an 8(g) strike notice. What is HR's FIRST priority?",o:["Hire permanent replacements","Ignore it","Lock out staff","Activate the patient-care contingency plan: staffing, agency coverage, patient safety protocols"],a:3,e:"The 8(g) window exists for patient safety: contingency staffing and care continuity come first. Replacement strategy follows the clinical plan."},
{id:"q573",m:"m6",t:"k",s:"Under the Railway Labor Act (airlines/railroads), employees may NOT strike until:",o:["They vote","The NMB releases the parties after mediation, followed by a 30-day cooling-off period","The CEO approves","Contract expiration alone"],a:1,e:"RLA: bargaining → NMB mediation → possible arbitration offer → 30-day cooling off (Presidential Emergency Board for rail) → only then self-help. Status quo is preserved throughout."},
{id:"q574",m:"m6",t:"k",s:"The Steelworkers Trilogy established that:",o:["Courts strongly defer to labor arbitration: they don't second-guess the merits, and doubts about arbitrability are resolved in favor of arbitration","Courts decide grievances","Arbitration is illegal","Strikes are preferred"],a:0,e:"The Trilogy makes arbitration the centerpiece of contract administration: broad deference, pro-arbitration presumptions, and merits review essentially off-limits to courts."},
{id:"q575",m:"m6",t:"k",s:"An arbitrator's award may be vacated only when it:",o:["Fails to draw its essence from the CBA, exceeds authority, or violates explicit public policy (narrow Misco exception)","Seems wrong","Is long","Favors the union"],a:0,e:"Enterprise Wheel/Misco: awards stand unless they don't draw essence from the contract or violate well-defined public policy - courts don't reweigh evidence."},
{id:"q576",m:"m6",t:"sj",s:"An arbitrator reinstates an employee fired for a clear safety violation, and management wants to challenge the award in court. What should counsel advise?",o:["Courts won't overturn on the merits; challenge only if the award exceeds the contract's authority or violates explicit public policy","Sue - the decision is wrong","Refuse to comply","Fire the arbitrator"],a:0,e:"Merits disagreement isn't grounds to vacate. Unless the arbitrator dispensed 'own brand of justice' beyond the CBA, the award stands - pick arbitrators carefully instead."},
{id:"q577",m:"m6",t:"k",s:"A zipper clause in a CBA:",o:["Requires new uniforms","Waives the duty to bargain during the contract term over matters not addressed in the agreement","Extends the contract forever","Bans strikes"],a:1,e:"Zipper: both parties waive midterm bargaining on subjects neither included - locking in the deal and preventing continuous renegotiation during the term."},
{id:"q578",m:"m6",t:"k",s:"For a union to waive bargaining over a mandatory subject, the waiver must be:",o:["Implied","Clear and unmistakable","Verbal","Assumed"],a:1,e:"Waiver standard: only explicit, clear-and-unmistakable contract language waives bargaining rights. Silence or vague management-rights clauses don't suffice."},
{id:"q579",m:"m6",t:"k",s:"Katz (unilateral change doctrine) holds that during bargaining, an employer may not:",o:["Bargain hard","Make unilateral changes to mandatory subjects without bargaining to impasse","Hire","Advertise"],a:1,e:"NLRB v. Katz: unilateral changes during negotiations are per se refusals to bargain - the status quo holds until good-faith bargaining reaches impasse."},
{id:"q580",m:"m6",t:"sj",s:"Mid-bargaining, management announces a new attendance bonus without union discussion. What is the exposure?",o:["None - bonuses are gifts","Only a grievance","Only if the union objects","A Katz 8(a)(5) violation: unilateral change to a mandatory subject (wages) before impasse"],a:3,e:"Wages are mandatory subjects; granting new economic benefits mid-bargaining without impasse is a per se refusal to bargain - even 'generous' changes violate."},
{id:"q581",m:"m6",t:"k",s:"Boulwarism ('take-it-or-leave-it' bargaining) is:",o:["Good faith","Evidence of surface bargaining - presenting a final offer as non-negotiable from the start violates the duty to bargain in good faith","Required","Only for wages"],a:1,e:"Boulware's GE strategy - researched 'fair' offer presented as final with a publicity campaign - was found to be bad-faith surface bargaining."},
{id:"q582",m:"m6",t:"k",s:"Surface bargaining is established by:",o:["The totality of conduct: delay, regressive proposals, unilateral changes, and take-it-or-leave-it tactics showing no intent to reach agreement","One hard session","Low offers","Meeting weekly"],a:0,e:"No single act proves surface bargaining; the Board examines totality - stalling, regressing, bypassing the union, and refusing to budge reveal the intent."},
{id:"q583",m:"m6",t:"sj",s:"Bargaining has stalled for months: the company cancels sessions, regresses on settled items, and announces changes directly to employees. What should HR advise?",o:["Continue - hard bargaining is legal","This pattern evidences surface bargaining and direct dealing; reset to genuine good-faith bargaining before an 8(a)(5) charge lands","Bypass the union","Declare impasse"],a:1,e:"The totality here screams bad faith, and direct dealing with employees over the union's head is independently unlawful. Course-correct now."},
{id:"q584",m:"m6",t:"k",s:"After genuine impasse, an employer may implement:",o:["Anything","Only union demands","Nothing","Terms reasonably comprehended within its pre-impasse proposals"],a:3,e:"Impasse implementation is limited to what was on the table: changes must be reasonably comprehended in proposals made before impasse - no new terms."},
{id:"q585",m:"m6",t:"k",s:"Under Acme, a union is entitled to information that is:",o:["Anything it wants","Only public data","Whatever the employer volunteers","Relevant and necessary to bargaining or grievance handling - with wage/benefit data presumptively relevant"],a:3,e:"Acme duty: furnish relevant information for bargaining and policing the contract. Wage data for unit employees is presumptively relevant; other requests need demonstrated relevance."},
{id:"q586",m:"m6",t:"k",s:"When an employer claims inability to pay during bargaining (Truitt), the union:",o:["Must accept it","Is entitled to substantiating financial data - the claim opens the books","Gets nothing","May strike immediately"],a:1,e:"Truitt: pleading poverty entitles the union to verify it. Note the distinction - 'inability to pay' opens books; 'unwilling to pay' (competitiveness) generally doesn't."},
{id:"q587",m:"m6",t:"sj",s:"The union requests five years of financials after the company says the raise proposal is 'not competitive.' Must the company comply?",o:["Yes - always","Yes, partially","Only with a court order","No: claiming competitive disadvantage (unwillingness) rather than inability to pay does not trigger Truitt's open-books duty"],a:3,e:"'We can't afford it' opens the books; 'competitors pay less' doesn't. HR should keep bargaining rhetoric on the competitiveness track unless prepared to disclose."},
{id:"q588",m:"m6",t:"k",s:"Detroit Edison balances a union's information request against:",o:["Cost","The CEO's preference","Union size","Employee confidentiality interests (e.g., psychological test data) - requiring accommodation like anonymization rather than outright denial"],a:3,e:"Detroit Edison: legitimate confidentiality interests don't defeat the duty outright - accommodate through redaction, summaries, or protective procedures."},
{id:"q589",m:"m6",t:"k",s:"Republic Aviation protects employees' right to solicit for the union:",o:["Anywhere, anytime","On non-working time in non-working areas, absent special circumstances","Only off premises","Never"],a:1,e:"Republic Aviation: no-solicitation rules can't ban union talk on employees' own time (breaks, lunch) in non-work areas like break rooms - unless special circumstances (safety, production) justify."},
{id:"q590",m:"m6",t:"sj",s:"A supervisor disciplines two employees for discussing wages at lunch in the cafeteria. What is the exposure?",o:["8(a)(1) violation: wage discussion is core Section 7 activity, and non-working time in a non-work area is protected","None - lunch rules apply","Only if they're union members","Lawful under handbook policy"],a:0,e:"Wage discussion is the heart of protected concerted activity; lunch in the cafeteria is non-work time/area. Handbook rules can't override Section 7."},
{id:"q591",m:"m6",t:"k",s:"Under Lechmere, nonemployee union organizers:",o:["Have full access","May generally be excluded from employer property unless the union has no reasonable alternative means of communicating (remote/isolated sites)","May enter anytime","Can picket inside"],a:1,e:"Lechmere: property rights generally win for nonemployees; the exception is narrow (logging camps, remote resorts) where alternative communication is infeasible."},
{id:"q592",m:"m6",t:"k",s:"Town & Country (salting) holds that:",o:["Organizers can't be hired","Salting is illegal","Employers may screen for union sympathy","Paid union organizers who seek employment are statutory 'employees' protected by the NLRA"],a:3,e:"Salting: union organizers applying for jobs are employees under the Act. Refusing to hire or firing them for organizing violates 8(a)(3)."},
{id:"q593",m:"m6",t:"sj",s:"A job applicant with thin qualifications but known organizing history applies. The hiring manager wants to reject them 'to avoid trouble.' What should HR do?",o:["Support the rejection","Hire them to be safe","Ask about union plans","Apply the same hiring standards used for all applicants and document the legitimate reasons - rejecting over union activity invites an 8(a)(3) charge"],a:3,e:"Under Town & Country and Wright Line, the question is motive. Consistent, documented, legitimate hiring criteria are the defense; 'avoiding trouble' is the violation."},
{id:"q594",m:"m6",t:"k",s:"Gissel distinguishes unlawful threats from lawful predictions: a prediction of closure is lawful only if:",o:["The CEO believes it","It is in writing","Workers agree","It is based on objective facts conveying consequences beyond the employer's control"],a:3,e:"Gissel: 'unionization will force us to close' is a threat unless grounded in objective, demonstrable facts outside the employer's control. Most closure talk fails this test."},
{id:"q595",m:"m6",t:"k",s:"Exchange Parts prohibits employers from:",o:["Granting benefits during a union campaign to influence the vote - the timing implies a quid pro quo","Bargaining","Giving raises ever","Talking to employees"],a:0,e:"NLRB v. Exchange Parts: benefits granted during an organizing campaign are inherently coercive - employees reasonably infer they're conditioned on voting no."},
{id:"q596",m:"m6",t:"sj",s:"A week before the election, management announces an across-the-board raise 'we've been planning.' What is the risk?",o:["None - it was planned","Only a grievance","An Exchange Parts violation: campaign-timed benefits are presumed coercive regardless of prior planning","Lawful if documented"],a:2,e:"Timing is everything: even genuinely planned benefits become unlawful when announced mid-campaign. Withhold until after the election or clear it with counsel."},
{id:"q597",m:"m6",t:"k",s:"A Struksnes poll of employee union sentiment is lawful only when:",o:["Management is curious","Done verbally","Results are published","Conducted by secret ballot with assurances against reprisal, a legitimate purpose, and no prior coercion"],a:3,e:"Struksnes safeguards: secret ballot, stated legitimate purpose, anti-reprisal assurances, and a non-coercive context. Polls are high-risk - rarely worth it."},
{id:"q598",m:"m6",t:"k",s:"The contract-bar doctrine generally bars a representation election for:",o:["1 year","10 years","6 months","Up to 3 years of a valid CBA's term"],a:3,e:"Contract bar: a lawful CBA bars rival petitions for up to 3 years (the first 3 years of longer contracts), stabilizing bargaining relationships."},
{id:"q599",m:"m6",t:"k",s:"A decertification petition may be filed during the CBA's open period, which is:",o:["Anytime","60 to 90 days before the contract expires (for contracts of 3+ years, measured from the 3-year anniversary)","After expiration only","Never"],a:1,e:"Open period: 60-90 days before expiration. Miss it and the contract bar locks in another cycle - timing decertification efforts is precise work."},
{id:"q600",m:"m6",t:"k",s:"The Excelsior (voter) list requires the employer to provide the union:",o:["Nothing","Medical records","Names and contact information of eligible voters within 7 days of the election direction","Salaries"],a:2,e:"Excelsior/Underwood: within 7 days of the direction of election, the employer gives the regional director the voter list (names, addresses, contact info) for the union."},
{id:"q601",m:"m6",t:"k",s:"Section 8(b)(4) secondary boycotts prohibit unions from:",o:["Striking their own employer","Coercing neutral employers to stop doing business with the primary employer","Picketing","Bargaining"],a:1,e:"8(b)(4): pressure must stay on the primary employer. Dragging neutral secondary employers into the dispute through threats or coercion is unlawful."},
{id:"q602",m:"m6",t:"k",s:"The Moore Dry Dock standards govern:",o:["Ship safety","Overtime","Lawful common-situs picketing: picketing limited to times/locations of the primary employer's presence, with clear identification","Elections"],a:2,e:"Moore Dry Dock: at shared worksites, picket only when the primary is present, stay near its location, and make clear the dispute is with the primary - not the neutrals."},
{id:"q603",m:"m6",t:"sj",s:"Union pickets the general contractor's gate used exclusively by the nonunion subcontractor in dispute. Is this lawful?",o:["Yes - any gate works","No: under Moore Dry Dock and reserved-gate rules, picketing must target the primary's established gate; picketing neutral gates is an unlawful secondary boycott","Yes if peaceful","Only on weekends"],a:1,e:"Reserved-gate systems channel picketing to the primary. Picketing the neutral's gate coerces a secondary employer - a classic 8(b)(4) violation."},
{id:"q604",m:"m6",t:"k",s:"Section 8(e) hot-cargo clauses (agreements not to do business with another employer) are:",o:["Always lawful","Required","Generally unlawful, with narrow exceptions for the construction and garment industries","Encouraged"],a:2,e:"8(e): unions can't bargain for employers' promises to boycott others - the construction and apparel industry exceptions reflect those sectors' subcontracting realities."},
{id:"q605",m:"m6",t:"k",s:"Section 8(b)(7) recognitional picketing must end or convert to a petition within:",o:["7 days","30 days","1 year","90 days"],a:1,e:"8(b)(7): picketing for recognition/organization beyond 30 days without filing an election petition is an unfair labor practice - file or fold."},
{id:"q606",m:"m6",t:"k",s:"Superseniority for union stewards (Dairylea) is lawful when:",o:["Limited to layoff/recall protection tied to on-the-job steward duties, not a general seniority bonus","Never","It doubles their pay","Stewards request it"],a:0,e:"Dairylea: superseniority is lawful only as narrowly tied to performing grievance/steward functions on the job - blanket seniority preferences discriminate under 8(a)(3)."},
{id:"q607",m:"m6",t:"sj",s:"The union demands that stewards get top seniority for promotions and overtime. What should HR counter?",o:["Agree - it's standard","Agree partially","Ignore","Dairylea limits superseniority to layoff/recall for steward duties; extending it to promotions and overtime is unlawful discrimination"],a:3,e:"Superseniority beyond layoff/recall protection for representational duties becomes 8(a)(3) discrimination favoring union activists. Hold the Dairylea line."},
{id:"q608",m:"m6",t:"k",s:"M&G Polymers v. Tackett holds that retiree health benefits:",o:["Vest for life automatically","Can't be changed","Are guaranteed by ERISA","Do not vest by inference - ordinary contract interpretation applies; explicit language is required for lifetime vesting"],a:3,e:"Tackett ended the Yard-Man inference: retiree health vesting requires clear contract language. Ambiguous 'lifetime' references get ordinary interpretation, not a pro-vesting thumb on the scale."},
{id:"q609",m:"m6",t:"sj",s:"The CBA says retirees 'will continue to receive health benefits' with no duration stated. The company wants to modify the plan. What governs?",o:["Benefits vest forever","ERISA blocks changes","Under Tackett, no vesting is inferred - interpret the language as written; absent clear lifetime promise, modification through bargaining is permitted","Only retirees decide"],a:2,e:"Post-Tackett, silence doesn't vest. HR should still bargain the change (effects on current employees' expectations) and document the contract interpretation."},
{id:"q610",m:"m6",t:"k",s:"Washington Aluminum protects:",o:["Only union members","Vandalism","Nonunion employees' spontaneous walkout over cold working conditions as protected concerted activity","Individual gripes"],a:2,e:"Washington Aluminum: seven nonunion employees walking out over freezing conditions engaged in protected concerted activity - no union, no plan, still protected."},
{id:"q611",m:"m6",t:"sj",s:"Six nonunion warehouse workers walk off the shift together protesting broken heaters. The supervisor wants them fired for job abandonment. What should HR do?",o:["Stop the termination: concerted protest of working conditions is protected even without a union; fix the heaters and address it as a safety issue","Fire them - they abandoned their jobs","Suspend them","Write them up"],a:0,e:"Washington Aluminum controls: group action over terms and conditions is protected concerted activity. Firing them is an 8(a)(1)/(3) violation - and the heaters still need fixing."}
);
</script>
<script>
"use strict";
/* ---- 1000Q EXPANSION batch 4 ---- */
QUESTIONS.push(
{id:"q612",m:"m7",t:"k",s:"In Groff v. DeJoy (2023), the Supreme Court held that a religious accommodation causes undue hardship when it:",o:["Causes more than de minimis cost","Imposes substantial increased costs in relation to the conduct of the business","Draws any coworker complaint","Requires any schedule adjustment"],a:1,e:"Groff replaced the old more-than-de-minimis test: the employer must show the burden is substantial in the overall context of its business."},
{id:"q613",m:"m7",t:"sj",s:"An employee requests Sundays off for Sabbath observance. Coverage is difficult but the site has managed similar swaps before. What is the BEST first step?",o:["Deny it as an undue hardship","Ask the employee to change religions","Engage in dialogue and assess whether coverage truly imposes substantial increased costs before deciding","Reassign the employee to nights permanently"],a:2,e:"Under Groff, HR must evaluate actual substantial burden through the interactive process; coworker grumbling alone does not establish undue hardship."},
{id:"q614",m:"m7",t:"k",s:"A hostile work environment claim requires harassment that is:",o:["Reported to the CEO","Committed by a supervisor","Documented in writing","Severe or pervasive"],a:3,e:"Severe OR pervasive: a single extreme incident or a pattern of lesser conduct can each sustain a hostile work environment claim."},
{id:"q615",m:"m7",t:"sj",s:"An employee reports that a supervisor groped her at a work event, calling it a joke. What must HR do?",o:["Treat it as potentially severe harassment: investigate promptly and take corrective action","Dismiss it as a one-time joke","Wait for a second incident before acting","Transfer the complainant to another team"],a:0,e:"A single severe incident can create a hostile work environment; HR must investigate immediately rather than waiting for a pattern."},
{id:"q616",m:"m7",t:"k",s:"In Oncale v. Sundowner (1998), the Supreme Court held that:",o:["Only women may bring harassment claims","Harassment requires physical contact","Same-sex harassment is actionable under Title VII","Off-duty conduct is never covered"],a:2,e:"Oncale established that Title VII bars sexual harassment even when the harasser and victim are the same sex."},
{id:"q617",m:"m7",t:"k",s:"After the EEOC rescinded its 2024 harassment guidance in January 2026, what is the status of Bostock v. Clayton County?",o:["It was overruled","It remains binding Supreme Court precedent: Title VII covers sexual orientation and gender identity","It is unenforceable","It applies only to federal workers"],a:1,e:"Rescinding guidance does not erase case law; Bostock remains enforceable federal law, and many states independently protect LGBTQ workers."},
{id:"q618",m:"m7",t:"sj",s:"A transgender employee uses the restroom matching gender identity and coworkers complain. What is the BEST response?",o:["Affirm the employee's access consistent with gender identity, and offer single-user options to anyone wanting more privacy","Require use of facilities matching sex assigned at birth","Remove all restroom signs","Do nothing and hope it resolves"],a:0,e:"Post-Bostock, denying access based on gender identity risks Title VII liability; privacy concerns are met with options for all, not exclusion."},
{id:"q619",m:"m7",t:"k",s:"The Pregnant Workers Fairness Act requires employers with 15 or more employees to:",o:["Provide 12 weeks of paid leave","Hire without regard to pregnancy only","Offer light duty to every worker","Reasonably accommodate known limitations related to pregnancy, childbirth, or related conditions absent undue hardship"],a:3,e:"The PWFA (effective 2023) extends an ADA-style accommodation duty to pregnancy-related limitations, with no minimum severity threshold."},
{id:"q620",m:"m7",t:"sj",s:"A pregnant cashier asks to sit on a stool at the register, and the manager demands a doctor's note first. What should HR advise?",o:["Support the manager: documentation is always required","Grant the predictable accommodation without demanding documentation, since the need is obvious","Deny it: sitting changes an essential function","Require full FMLA certification"],a:1,e:"EEOC's PWFA rule treats sit/stand, water, bathroom, and food/drink breaks as predictable assessments; demanding documentation for obvious needs is unreasonable."},
{id:"q621",m:"m7",t:"k",s:"Under the PWFA, an employee who temporarily cannot perform an essential function is still 'qualified' when:",o:["The inability is permanent","Tenure exceeds 10 years","The inability is temporary (generally around 40 weeks) and the function can be resumed in the near future","A physician guarantees full recovery"],a:2,e:"The PWFA expressly covers temporary suspensions of essential functions, a broader definition of qualified than the ADA's."},
{id:"q622",m:"m7",t:"sj",s:"A pregnant warehouse worker is restricted from lifting over 20 pounds for two months. Light duty is routinely given to injured workers, but her supervisor refuses it for her. What is the risk?",o:["PDA and PWFA liability: denying an accommodation routinely granted to others suggests pregnancy discrimination","None: pregnancy is legally different","Only a morale problem","None unless she requests FMLA"],a:0,e:"Under Young v. UPS and the PWFA, withholding accommodations routinely granted to similarly restricted workers supports a pregnancy discrimination claim."},
{id:"q623",m:"m7",t:"k",s:"The PUMP for Nursing Mothers Act (2022) requires employers to provide:",o:["Two years of paid nursing leave","Reasonable break time and a private space other than a bathroom for expressing milk for one year","On-site daycare","A lactation consultant"],a:1,e:"The PUMP Act expanded 2010 protections to cover exempt employees too: unpaid break time and a shielded private space for one year after the child's birth."},
{id:"q624",m:"m7",t:"sj",s:"A nursing mother is told to pump in a restroom stall because no other space is available. What must HR do?",o:["Accept it: space is tight","Tell her to pump at home","Reduce her schedule","Find a compliant private space that is not a bathroom, such as a lockable converted office"],a:3,e:"The PUMP Act expressly requires a space other than a bathroom that is shielded from view and free from intrusion."},
{id:"q625",m:"m7",t:"k",s:"The Lilly Ledbetter Fair Pay Act (2009) provides that:",o:["Pay claims expire 90 days after the pay decision","Only intentional discrimination counts","Each discriminatory paycheck restarts the EEOC charge-filing clock","Back pay is capped at one year"],a:2,e:"Ledbetter overturned the single-decision accrual rule: every paycheck affected by past discrimination is a new unlawful practice for timeliness."},
{id:"q626",m:"m7",t:"sj",s:"An employee learns she has been underpaid relative to male peers for three years; her last paycheck was last week. Can she file an EEOC charge?",o:["No: the pay decision was made three years ago","Yes: under Ledbetter, the recent paycheck makes the charge timely if filed within 180/300 days of it","Only if she resigns first","Only through a union grievance"],a:1,e:"Each paycheck resets the filing clock, so a charge filed within the deadline measured from a recent paycheck is timely."},
{id:"q627",m:"m7",t:"k",s:"An employee must generally file an EEOC charge within:",o:["180 days, or 300 days where a state or local deferral agency exists","30 days","Two years","Five years"],a:0,e:"Title VII, ADA, and ADEA charges are due within 180 days of the act, extended to 300 days when a state or local fair employment agency shares jurisdiction."},
{id:"q628",m:"m7",t:"k",s:"After the EEOC issues a notice of right to sue, the employee has how long to file in federal court?",o:["30 days","180 days","One year","90 days"],a:3,e:"The right-to-sue letter triggers a strict 90-day window to file suit; missing it generally extinguishes the claim."},
{id:"q629",m:"m7",t:"k",s:"The McDonnell Douglas burden-shifting framework applies to:",o:["Only wage claims","Individual disparate treatment cases lacking direct evidence: prima facie case, then the employer's reason, then pretext","Union representation elections","Workers compensation appeals"],a:1,e:"McDonnell Douglas structures circumstantial cases: the employee shows a prima facie case, the employer articulates a legitimate reason, and the employee shows pretext."},
{id:"q630",m:"m7",t:"sj",s:"A manager fires a 58-year-old for poor performance with no prior warnings, while younger low performers received coaching. What should HR do FIRST?",o:["Approve the termination","Backdate a performance improvement plan","Pause and investigate: check documentation, comparator treatment, and whether the stated reason is pretextual","Transfer the employee"],a:2,e:"Thin documentation plus better-treated comparators signals pretext under McDonnell Douglas; HR must verify the legitimate reason before acting."},
{id:"q631",m:"m7",t:"k",s:"Under the mixed-motive framework of the Civil Rights Act of 1991, an employer is liable when:",o:["A protected trait was a motivating factor, even if other lawful reasons also existed","Discrimination was the sole reason","The employee resigned","A union was involved"],a:0,e:"Mixed-motive liability attaches when bias was a motivating factor; the employer's same-decision defense only limits remedies, not liability."},
{id:"q632",m:"m7",t:"k",s:"In Ricci v. DeStefano (2009), the Supreme Court held an employer may discard test results out of disparate-impact fears only when it has:",o:["A hunch about liability","Union approval","Budget concerns","A strong basis in evidence that it would face disparate-impact liability"],a:3,e:"Ricci reconciles the tension: discarding results to avoid impact liability is itself disparate treatment unless supported by a strong basis in evidence."},
{id:"q633",m:"m7",t:"sj",s:"A promotion exam screens out minority candidates at a high rate, and leadership wants to scrap the results immediately. What should HR advise?",o:["Scrap the results now","Assess test validity and whether a strong basis in evidence of disparate-impact liability exists before acting","Promote everyone who took the test","Hide the scores"],a:1,e:"Per Ricci, acting on fear alone creates reverse-discrimination exposure; HR needs evidence of likely impact liability and a validity analysis first."},
{id:"q634",m:"m7",t:"k",s:"'Cat's paw' liability (Staub v. Proctor Hospital) means an employer can be liable when:",o:["A workplace pet is injured","Two employees conspire","A biased supervisor's recommendation proximately causes an unbiased decisionmaker's adverse action","The CEO personally discriminates"],a:2,e:"Cat's paw: even an unbiased final decisionmaker creates liability if a subordinate's discriminatory animus proximately caused the decision; independent investigation breaks the chain."},
{id:"q635",m:"m7",t:"sj",s:"A supervisor with documented age-based remarks recommends firing a 61-year-old, and the HR manager is inclined to approve without review. What is the BEST safeguard?",o:["Conduct an independent review of the underlying facts before deciding","Approve it: the HR manager is unbiased","Ask the supervisor to rephrase the recommendation","Delay the decision six months"],a:0,e:"Rubber-stamping a potentially biased recommendation preserves cat's paw liability; an independent factual investigation severs the causal chain."},
{id:"q636",m:"m7",t:"k",s:"For an ADEA waiver in a severance agreement to be valid under OWBPA, it must:",o:["Be verbal","Be signed within 48 hours","Waive future claims","Be knowing and voluntary, in writing, with 21 days to consider (45 for group programs), 7 days to revoke, and consideration beyond what is already owed"],a:3,e:"OWBPA imposes strict waiver requirements including consideration periods and a 7-day revocation right; waivers cannot cover future claims."},
{id:"q637",m:"m7",t:"sj",s:"In a group layoff, a 62-year-old is offered severance and told to sign within 10 days. What is the defect?",o:["None","Group-program waivers require 45 days to consider plus 7 days to revoke, so 10 days invalidates the ADEA waiver","Severance itself is illegal","Only the dollar amount matters"],a:1,e:"Group layoffs trigger OWBPA's 45-day consideration period; a rushed waiver is unenforceable as to ADEA claims."},
{id:"q638",m:"m7",t:"k",s:"For ADEA disparate impact claims, the employer's defense is that the practice was based on:",o:["Business necessity","Good intentions","A reasonable factor other than age (RFOA)","A BFOQ"],a:2,e:"Smith v. Jackson gives ADEA impact claims the lighter RFOA defense rather than Title VII's business necessity; Gross separately requires but-for causation for treatment claims."},
{id:"q639",m:"m7",t:"sj",s:"A RIF uses highest salary in role as a selection factor, and the list skews heavily over age 40. What must HR do?",o:["Analyze for age disparate impact, validate the factor as reasonable (RFOA), and adjust if it is not","Proceed: salary is a neutral factor","Keep the analysis secret","Fire the analysts"],a:0,e:"Facially neutral factors correlated with age demand impact analysis; under the ADEA the factor must be reasonable, and HR should test less-discriminatory alternatives."},
{id:"q640",m:"m7",t:"k",s:"A bona fide occupational qualification may rest on sex, religion, or national origin, but:",o:["Also on race","Only in retail settings","Whenever customers prefer it","Never on race or color, and customer preference alone is insufficient"],a:3,e:"BFOQ never covers race or color, and customer preference does not create one (Diaz v. Pan Am); the trait must go to the essence of the business."},
{id:"q641",m:"m7",t:"sj",s:"A restaurant owner wants to hire only female servers for the image customers expect. What should HR advise?",o:["Comply: it is a marketing decision","Refuse: customer preference is not a BFOQ, and sex-based hiring for these roles violates Title VII","Hire women but pay them less","Poll the customers"],a:1,e:"Image and customer preference fail the essence-of-the-business test; sex-segregated hiring for front-of-house roles is unlawful."},
{id:"q642",m:"m7",t:"k",s:"The ministerial exception (Hosanna-Tabor) provides that:",o:["Churches must follow all EEO laws","Only one denomination qualifies","Religious organizations may select employees performing vital religious duties free from employment discrimination claims","It covers only volunteers"],a:2,e:"Hosanna-Tabor and Our Lady of Guadalupe bar employment discrimination suits over the selection of ministerial employees on First Amendment grounds."},
{id:"q643",m:"m7",t:"k",s:"The Ending Forced Arbitration of Sexual Assault and Sexual Harassment Act (2022) provides that:",o:["Pre-dispute mandatory arbitration agreements are unenforceable for sexual assault and sexual harassment claims at the survivor's election","All employment arbitration is banned","NDAs are banned entirely","Only federal workers are covered"],a:0,e:"The 2022 Act lets accusers void pre-dispute arbitration clauses for sexual assault and harassment claims; other claims under the same agreement may still be arbitrated."},
{id:"q644",m:"m7",t:"sj",s:"An employee who signed a mandatory arbitration agreement reports sexual assault by a coworker, and the company moves to compel arbitration. What is the likely outcome?",o:["Arbitration will be compelled","The court will likely deny arbitration of the assault claim under the 2022 Act if the survivor elects court","The claim will be dismissed outright","HR chooses the forum"],a:1,e:"Under the Ending Forced Arbitration Act, the survivor may invalidate the pre-dispute arbitration clause for the sexual assault claim."},
{id:"q645",m:"m7",t:"k",s:"The Speak Out Act (2022) provides that pre-dispute nondisclosure agreements are unenforceable with respect to:",o:["Trade secrets","Wages","Sexual assault and sexual harassment","All workplace disputes"],a:2,e:"Speak Out voids NDAs signed before a dispute arises insofar as they cover sexual assault or harassment; post-dispute settlement NDAs remain generally permitted."},
{id:"q646",m:"m7",t:"sj",s:"After a harassment investigation ends in a settlement, both sides want a confidentiality clause. Is it allowed?",o:["No: Speak Out bans every NDA","Only if the settlement is unpaid","Only for executives","Yes: Speak Out targets pre-dispute NDAs, so a post-dispute settlement NDA is generally enforceable"],a:3,e:"Speak Out's limits apply to NDAs executed before the dispute; confidentiality negotiated to settle an existing claim remains available."},
{id:"q647",m:"m7",t:"k",s:"In Epic Systems v. Lewis (2018), the Supreme Court held that:",o:["Class waivers in arbitration agreements are unenforceable","Class and collective action waivers in employment arbitration agreements are enforceable","The NLRA bans arbitration","Only unions may arbitrate"],a:1,e:"Epic Systems: the Federal Arbitration Act requires enforcement of individualized arbitration, including class and collective waivers, despite NLRA concerted-activity arguments."},
{id:"q648",m:"m7",t:"k",s:"Under Burlington Northern v. White, retaliation covers employer actions that:",o:["Might dissuade a reasonable worker from making or supporting a discrimination charge","Only affect pay or rank","Are documented in writing","Occur within 24 hours of a complaint"],a:0,e:"Burlington Northern's materially-adverse standard is broader than the discrimination standard: any action that could chill complaints can qualify."},
{id:"q649",m:"m7",t:"sj",s:"An employee filed an EEOC charge last month; now the manager denies her a lateral transfer she is qualified for. What should HR do FIRST?",o:["Approve the denial","Transfer her regardless of qualifications","Scrutinize the decision for retaliation: close timing plus adverse action demands a well-documented legitimate reason","Ignore the charge"],a:2,e:"Close timing between protected activity and adverse action supports a retaliation inference; HR must verify an independent, documented, legitimate reason."},
{id:"q650",m:"m7",t:"k",s:"Combined compensatory and punitive damages caps under the Civil Rights Act of 1991 range from:",o:["$10,000 to $50,000","Unlimited","A flat $1 million","$50,000 to $300,000 depending on employer size"],a:3,e:"The 1991 Act caps combined compensatory and punitive damages by headcount, from $50,000 (15-100 employees) to $300,000 (500+); back pay is not capped."},
{id:"q651",m:"m7",t:"k",s:"An advantage of bringing a race discrimination claim under 42 U.S.C. Section 1981 instead of Title VII is:",o:["A lower burden of proof","No damages caps and a longer limitations period","No employer is required","An automatic win"],a:1,e:"Section 1981 reaches race and ethnicity discrimination in contracting with uncapped damages and a four-year catch-all limitations period, though it requires proof of intentional discrimination."},
{id:"q652",m:"m7",t:"sj",s:"An employee who recently complained of harassment is now missing deadlines, and the manager wants a PIP. What is the BEST approach?",o:["Block the PIP entirely","Fire the employee","Proceed only if the performance issues are genuine, documented, and consistent with how others are treated, keeping the two tracks separate","Move the complainant to another team"],a:2,e:"Legitimate performance management may continue after a complaint, but HR must ensure the documentation is real and consistent to defeat a retaliation inference."},
{id:"q653",m:"m7",t:"k",s:"EEOC 'pattern or practice' lawsuits differ from individual charges in that they:",o:["Allege systemic discrimination affecting a class, often seeking broad injunctive relief","Seek only apologies","Are filed by unions","Carry no remedies"],a:0,e:"Pattern-or-practice cases attack company-wide policies; the EEOC or DOJ pursues class-wide relief including injunctions and systemic reforms."},
{id:"q654",m:"m7",t:"k",s:"After courts vacated the 2024 DOL overtime rule and DOL formally rescinded it effective May 15, 2026, the federal salary threshold for white-collar exemptions is:",o:["$1,128 per week","$43,888 per year","$684 per week under the restored 2019 rule","$58,656 per year"],a:2,e:"The 2024 increases were vacated and rescinded; the $684/week ($35,568/year) threshold from the 2019 rule is back in force, with $107,432 for highly compensated employees."},
{id:"q655",m:"m7",t:"sj",s:"A company raised several salaries in 2024 to meet the now-vacated overtime threshold. What is the BEST guidance for 2026?",o:["Federal law no longer requires maintaining the higher threshold, but revert prospectively only after weighing contracts, morale, and stricter state thresholds","Immediately cut salaries back without notice","Reclassify everyone as nonexempt","Do nothing: the 2024 rule still applies"],a:0,e:"The rescission removes the federal mandate, but pay cuts carry contract, morale, and state-law risks (several states exceed $684/week); decide deliberately, not reflexively."},
{id:"q656",m:"m7",t:"k",s:"An employer docks an exempt employee's pay for a partial-day absence to attend a dentist appointment. What is the consequence?",o:["None: it was only four hours","It violates the salary basis test and can destroy the exemption","It is allowed once per year","It converts the worker to hourly permanently"],a:1,e:"The salary basis test bars partial-day docking (with narrow exceptions like FMLA leave or the first/last week); improper deductions can void the exemption for the employee."},
{id:"q657",m:"m7",t:"k",s:"Which of the following must be included in the FLSA 'regular rate' when computing overtime?",o:["Discretionary holiday gifts","Expense reimbursements","Paid time off","Nondiscretionary production bonuses"],a:3,e:"Nondiscretionary bonuses (promised for performance or hours) are part of the regular rate, so overtime must be computed at 1.5 times the rate including them."},
{id:"q658",m:"m7",t:"k",s:"A private-sector employer wants to give nonexempt staff comp time instead of overtime pay. Is this allowed?",o:["Yes, with employee consent","No: private employers may not substitute comp time for FLSA overtime; only public agencies may within limits","Yes, up to 40 hours","Only for salaried staff"],a:1,e:"The FLSA prohibits private-sector comp time in lieu of overtime; public employers may use it within statutory accrual caps."},
{id:"q659",m:"m7",t:"sj",s:"A nonexempt employee works 44 hours; the manager offers this Friday off next week instead of overtime pay. What should HR do?",o:["Approve: the employee agreed","Pay for 44 hours next week","Stop it and pay overtime for the hours over 40 in the workweek","Average the two weeks"],a:2,e:"Overtime is computed per single workweek; private employers cannot average weeks or swap time off to avoid the premium."},
{id:"q660",m:"m7",t:"k",s:"For tipped employees, the federal rules provide:",o:["A $2.13 cash wage with a maximum $5.12 tip credit, and total earnings must reach at least $7.25 per hour","A flat $7.25 cash wage with no credit","Tips belong to the house","No overtime is ever owed"],a:0,e:"Employers may take up to a $5.12 tip credit against the $7.25 minimum wage, paying at least $2.13 in cash wages, and must make up any shortfall."},
{id:"q661",m:"m7",t:"sj",s:"A restaurant requires servers to share tips with the shift manager. What is the problem?",o:["None: managers work hard","Tip pools must be equal","It is fine if voluntary","Managers and supervisors may not receive distributions from a tip pool"],a:3,e:"FLSA tip-pooling rules prohibit employers, managers, and supervisors from keeping or sharing in employees' tips."},
{id:"q662",m:"m7",t:"sj",s:"A 15-year-old is scheduled for 4 hours on a school day and 25 hours in the school week. What is the violation?",o:["None: teens may work freely","Only the daily limit","Federal child labor limits for 14- and 15-year-olds: 3 hours on a school day and 18 hours in a school week","Only if grades drop"],a:2,e:"For 14- and 15-year-olds, federal law caps work at 3 hours on school days, 18 hours in school weeks, and restricts permissible hours and hazardous tasks."},
{id:"q663",m:"m7",t:"k",s:"In Integrity Staffing Solutions v. Busk (2014), the Supreme Court held that time spent in post-shift security screenings is:",o:["Always compensable","Not compensable because the screenings were not integral and indispensable to the employees' principal activities","Compensable only on weekends","Covered by the Portal-to-Portal Act exemption for managers"],a:1,e:"Preliminary and postliminary activities are compensable only if integral and indispensable to principal work; the Court found anti-theft screenings were not."},
{id:"q664",m:"m7",t:"sj",s:"An on-call technician must stay within 15 minutes of the plant, cannot drink alcohol, and is called out several times per shift. This time is likely:",o:["Compensable as hours worked: the restrictions are so significant the employee is engaged to wait","Never compensable","Compensable only if a call comes","Paid at half rate"],a:0,e:"On-call time is compensable when restrictions effectively confine the employee (engaged to wait); freedom to use time for personal benefit means merely waiting to be engaged."},
{id:"q665",m:"m7",t:"k",s:"Time spent in training is NOT compensable only when all four are true:",o:["It is job-related","It is during work hours","It is mandatory","It is outside regular hours, voluntary, not directly job-related, and no productive work is performed"],a:3,e:"DOL's four-factor test: training time is unpaid only if outside hours, voluntary, not directly related to the job, and no productive work results; otherwise it is hours worked."},
{id:"q666",m:"m7",t:"sj",s:"A company requires nonexempt staff to attend a mandatory Saturday product training. How must the time be treated?",o:["Unpaid: it benefits the employee","Paid at straight time only","Compensable hours worked, counting toward overtime","As a gift"],a:2,e:"Mandatory, job-related training during or outside hours is hours worked; it counts toward the 40-hour overtime threshold."},
{id:"q667",m:"m7",t:"sj",s:"A field technician drives between job sites during the workday. A dispatcher drives from home to the first site. Which travel is compensable?",o:["Neither","Inter-site travel during the workday is compensable; ordinary home-to-work commuting is not","Only the commute","Both are unpaid"],a:1,e:"Travel that is part of the day's work (between sites, to a special assignment) is hours worked; normal commuting generally is not."},
{id:"q668",m:"m7",t:"sj",s:"A nonexempt remote employee regularly answers emails at 10 p.m. The manager says not to pay for it since it was unauthorized. What is correct?",o:["Pay for all hours worked, then manage the behavior prospectively through policy and discipline","Refuse payment: it was unauthorized","Pay only if pre-approved","Delete the emails"],a:0,e:"The FLSA requires payment for suffered or permitted work even if unauthorized; the remedy is to pay and then enforce a prior-approval policy going forward."},
{id:"q669",m:"m7",t:"k",s:"The computer-employee exemption may be satisfied on an hourly basis at:",o:["$15.00 per hour","$20.00 per hour","Minimum wage","$27.63 per hour"],a:3,e:"Unlike other white-collar exemptions, the computer exemption allows an hourly test: at least $27.63 per hour, alongside the duties test."},
{id:"q670",m:"m7",t:"k",s:"HR suspects several 'independent contractors' are misclassified. Which factor points MOST toward employee status under the economic reality test?",o:["They invoice monthly","They have business cards","The company controls when, where, and how they perform core business work on an ongoing basis","They work from home"],a:2,e:"Economic reality weighs control, integration into the business, permanence, and opportunity for profit or loss; controlled, ongoing core work signals employment."},
{id:"q671",m:"m7",t:"sj",s:"Long-term contractors work set schedules, use company tools, serve only this company, and cannot work for others. What should HR do?",o:["Nothing: the contract says contractor","Audit the classifications and prepare to reclassify: these facts indicate likely employees, with tax and overtime exposure","Raise their rates","Extend the contracts"],a:1,e:"Labels do not control; sustained control plus economic dependence indicates employment, creating FLSA, tax-withholding, and benefits exposure."},
{id:"q672",m:"m7",t:"k",s:"Under the primary beneficiary test (Glatt), an unpaid intern is more likely lawful when:",o:["The intern's training resembles an educational experience and the company derives no immediate advantage from the work","The intern works full-time hours","The intern replaces a paid employee","The internship exceeds one year"],a:0,e:"Glatt's seven-factor test asks who primarily benefits; internships structured like education, without displacing paid workers, point to lawful unpaid status."},
{id:"q673",m:"m7",t:"k",s:"A 'serious health condition' under the FMLA includes:",o:["The common cold","A routine checkup","A cosmetic procedure","An inpatient stay or a period of incapacity requiring continuing treatment by a health care provider"],a:3,e:"FMLA serious health conditions center on inpatient care or continuing treatment (multiple treatments, chronic conditions, long-term supervision); minor ailments alone do not qualify."},
{id:"q674",m:"m7",t:"sj",s:"An employee with a chronic condition needs two hours off every other week for treatment. The manager wants to deny intermittent leave. What is correct?",o:["Deny it: leave must be in full weeks","Intermittent leave is permitted for a qualifying serious health condition; grant it and manage scheduling cooperatively","Require resignation","Count it against attendance points"],a:1,e:"The FMLA expressly permits intermittent leave for serious health conditions; employers may transfer the employee to an equivalent alternate position to accommodate scheduling."},
{id:"q675",m:"m7",t:"sj",s:"FMLA abuse is suspected: an employee's intermittent leave always falls on Fridays and Mondays. What is the BEST first step?",o:["Hire a private investigator","Seek recertification or a second opinion at the employer's expense","Terminate immediately","Demand a new diagnosis every week"],a:1,e:"The statute provides tools for suspected abuse: recertification and employer-paid second/third opinions; surveillance and termination without medical support invite interference claims."},
{id:"q676",m:"m7",t:"sj",s:"An employee submits an incomplete FMLA medical certification, and the manager wants to deny leave today. What must HR do?",o:["Give written notice of the deficiency and at least 7 calendar days to cure it","Deny immediately","Approve without certification","Ask coworkers for details"],a:0,e:"DOL rules require 15 days to provide certification initially and at least 7 days to cure deficiencies; denying without the cure period violates the FMLA."},
{id:"q677",m:"m7",t:"k",s:"Military caregiver leave under the FMLA provides:",o:["12 weeks","39 weeks","52 weeks","Up to 26 weeks in a single 12-month period to care for a covered servicemember with a serious injury or illness"],a:3,e:"Caregiver leave is the FMLA's extended entitlement: 26 weeks per servicemember per 12-month period, counted separately from the standard 12 weeks."},
{id:"q678",m:"m7",t:"k",s:"Qualifying exigency leave under the FMLA allows an eligible employee up to:",o:["26 weeks","6 weeks","12 weeks for needs arising from a family member's covered active duty, such as childcare or legal arrangements","4 weeks"],a:2,e:"Exigency leave covers non-medical needs tied to a spouse, child, or parent's covered active duty: short-notice deployment, military events, childcare, and counseling."},
{id:"q679",m:"m7",t:"k",s:"A 'key employee' under the FMLA is:",o:["Anyone with a key to the building","Among the highest-paid 10 percent of employees within 75 miles, whose restoration would cause substantial and grievous economic injury","Any manager","Any employee on leave over 6 weeks"],a:1,e:"Key-employee status requires both top-10-percent pay and a grievous-injury finding, plus written notice to the employee when leave is designated."},
{id:"q680",m:"m7",t:"sj",s:"The company wants to deny restoration to a key employee on FMLA leave but never gave the required notice. What is the result?",o:["Restoration may not be denied: the employer must notify the employee in writing of key-employee status when leave is designated","Notice is optional","The employee is fired automatically","FMLA no longer applies"],a:0,e:"Without timely written notice of key-employee status and the potential denial of restoration, the employer loses the right to deny reinstatement."},
{id:"q681",m:"m7",t:"k",s:"An employee on FMLA leave also has accrued paid vacation. The employer may:",o:["Never touch the vacation","Only allow unpaid leave","Extend FMLA to 16 weeks","Require substitution so paid leave runs concurrently with FMLA, with proper notice"],a:3,e:"Employers may require (or employees may elect) substitution of accrued paid leave, but the FMLA designation notice must inform the employee it will run concurrently."},
{id:"q682",m:"m7",t:"sj",s:"A manager will not promote an employee whose cancer is in remission, saying 'it will probably come back.' What is the violation?",o:["None: it is a business judgment","FMLA interference","ADA 'regarded as' discrimination: acting on myths and fears about a disability","GINA violation"],a:2,e:"The ADA's regarded-as prong bars adverse actions based on perceived disability; no accommodation is owed under this prong, but discrimination is prohibited."},
{id:"q683",m:"m7",t:"sj",s:"An applicant is rejected after mentioning her child has a serious disability and will need the company health plan. This is:",o:["Lawful cost control","ADA association discrimination","A GINA violation","Permitted underwriting"],a:1,e:"The ADA prohibits discrimination based on association with a person with a disability, including benefits-cost motives."},
{id:"q684",m:"m7",t:"sj",s:"An employee with well-controlled epilepsy operates a forklift, and the safety manager wants a blanket ban on epileptics in the role. What is required?",o:["An individualized direct-threat assessment: significant risk of substantial harm that cannot be reduced by accommodation, based on medical evidence","A blanket ban is fine","Termination","A coworker vote"],a:0,e:"Direct threat must be assessed individually using current medical knowledge and the job's actual risks; stereotypes and generalizations violate the ADA."},
{id:"q685",m:"m7",t:"sj",s:"A post-offer medical exam reveals an old back injury. The employer may rescind the offer only if:",o:["The injury is disclosed","Any accommodation costs money","The CEO approves","The exclusion is job-related and consistent with business necessity, and no reasonable accommodation would allow performance"],a:3,e:"Post-offer exams are allowed when given to all entering employees in the job category, but screening out based on results must meet the job-related and business-necessity standard."},
{id:"q686",m:"m7",t:"k",s:"When may an employer require a medical examination of a current employee?",o:["Annually for everyone","Whenever a manager is curious","Only when job-related and consistent with business necessity, such as fitness-for-duty after a safety concern","Only with union approval"],a:2,e:"Current-employee exams face the strictest ADA standard: job-related and consistent with business necessity, typically tied to performance or safety evidence."},
{id:"q687",m:"m7",t:"k",s:"ADA medical information must be:",o:["Posted in the break room","Kept in separate confidential medical files with strictly limited access","Shared with all managers","Included in the personnel file"],a:1,e:"Medical records, including accommodation documentation, must be stored separately from personnel files and disclosed only to those with a defined need to know."},
{id:"q688",m:"m7",t:"sj",s:"During hiring, an interviewer asks whether the candidate has ever filed a workers compensation claim. This is:",o:["A prohibited disability-related inquiry at the pre-offer stage","Acceptable small talk","Required by OSHA","Allowed if asked of everyone"],a:0,e:"Pre-offer questions likely to elicit disability information, including workers comp history, violate the ADA; such inquiries must wait until after a conditional offer."},
{id:"q689",m:"m7",t:"sj",s:"An employee with diabetes requests to keep juice at the workstation in a food-free clean room. What is the BEST first step?",o:["Deny: clean rooms have no exceptions","Grant immediately without discussion","Transfer the employee","Begin the interactive process: explore accommodations such as sealed containers or scheduled breaks that meet both needs"],a:3,e:"The ADA requires dialogue before denial; often a middle ground (sealed containers, break access) satisfies the medical need without compromising the clean room."},
{id:"q690",m:"m7",t:"k",s:"Which accommodation is generally considered unreasonable under the ADA?",o:["A modified schedule","Screen-reading software","Eliminating an essential function of the job","A sit-stand desk"],a:2,e:"Employers need not eliminate essential functions, create new positions, or accept indefinite leave with no return date; reassignment to a vacant role may be reasonable."},
{id:"q691",m:"m7",t:"sj",s:"An employee exhausts 12 weeks of FMLA leave but still cannot return, and the company has no leave beyond FMLA. What must HR consider?",o:["Automatic termination","Whether additional unpaid leave is a reasonable accommodation under the ADA, absent undue hardship","Nothing further","A lawsuit"],a:1,e:"FMLA exhaustion does not end the inquiry; the ADA may require additional leave as an accommodation unless it imposes undue hardship or the employee cannot return."},
{id:"q692",m:"m7",t:"sj",s:"A pregnant employee has pregnancy complications. In what logical order should HR analyze the applicable laws?",o:["Consider PWFA accommodation first, then FMLA eligibility, then ADA if a disability is involved; the laws can run concurrently","FMLA only","ADA only","Pick whichever is cheapest"],a:0,e:"Pregnancy complications can trigger the PWFA (accommodation), FMLA (leave), and ADA (if a disability results); analyze each and apply the most protective provisions concurrently."},
{id:"q693",m:"m7",t:"sj",s:"An employee injured on the job is on workers compensation leave and also FMLA-eligible. What should HR do?",o:["Choose one law","Ignore FMLA","Wait for the doctor","Run FMLA concurrently with proper designation notice, and separately analyze ADA accommodation at return"],a:3,e:"Workers comp, FMLA, and ADA frequently overlap: designate FMLA concurrently with notice, and handle return-to-work through the ADA interactive process."},
{id:"q694",m:"m7",t:"sj",s:"A supervisor learns an employee's FMLA leave reason from a medical certification and shares it with the team. What is the problem?",o:["None: teams share everything","It is only a problem if written","Medical certification details are confidential; sharing violates FMLA confidentiality rules and erodes trust","It violates HIPAA against the employer"],a:2,e:"FMLA medical information must be kept confidential and shared only with those who need to know (supervisors get restrictions, not diagnoses)."},
{id:"q695",m:"m7",t:"sj",s:"An employee is fired two days after returning from FMLA leave for a minor tardiness, while others are only warned. What is the exposure?",o:["None: tardiness is misconduct","FMLA retaliation: close timing plus inconsistent discipline supports an inference of retaliation","Only a morale issue","A COBRA violation"],a:1,e:"Adverse action close on the heels of FMLA leave, combined with comparator evidence, is the classic retaliation fact pattern; the reason must be well-documented and consistent."},
{id:"q696",m:"m7",t:"k",s:"New York City Local Law 144 (2023) requires employers using automated employment decision tools to:",o:["Conduct an annual independent bias audit, publish a summary, and give candidates 10 days' notice","Ban all AI in hiring","Audit only once ever","Notify the mayor"],a:0,e:"Local Law 144 mandates yearly bias audits of AEDTs used for hiring or promotion in NYC, public summaries, and advance notice to candidates and employees."},
{id:"q697",m:"m7",t:"sj",s:"An AI resume screener advances men at a significantly higher rate than women. What is the BEST immediate response?",o:["Keep using it: AI is objective","Blame the vendor","Delete all hiring data","Pause the tool, validate it for job-relatedness, investigate the disparity, and meet bias-audit obligations where they apply"],a:3,e:"Algorithmic disparate impact is analyzed like any selection procedure: validate under the Uniform Guidelines, fix or drop biased tools, and comply with laws like NYC Local Law 144."},
{id:"q698",m:"m7",t:"k",s:"The Illinois Artificial Intelligence Video Interview Act requires employers to:",o:["Ban video interviews","Notify applicants that AI will analyze the interview, obtain consent, and destroy the video on request","Share videos publicly","Use only Illinois vendors"],a:1,e:"Illinois requires advance notice and consent when AI analyzes video interviews, limits distribution, and mandates destruction of the video upon applicant request."},
{id:"q699",m:"m7",t:"k",s:"A growing number of states prohibit employers from:",o:["Posting salary ranges","Conducting background checks","Asking candidates about salary history","Hiring out of state"],a:2,e:"Salary-history bans aim to break cycles of pay discrimination; employers should set pay from the role's range and market data, not prior earnings."},
{id:"q700",m:"m7",t:"sj",s:"A hiring manager asks a candidate's current salary during an interview in a state with a salary-history ban. What should HR do?",o:["Stop the practice: train managers to use the posted range and not seek prior pay","Allow it for senior roles","Allow it if the candidate volunteers first everywhere","Document the answer and match it"],a:0,e:"Where banned, even voluntary-disclosure rules vary; the safe practice is to anchor offers to the position's range and train interviewers to avoid the question."},
{id:"q701",m:"m7",t:"k",s:"'Ban-the-box' laws generally:",o:["Ban all criminal background checks","Restrict when in the hiring process criminal history may be asked about or considered","Apply only to federal jobs","Require hiring all ex-offenders"],a:1,e:"Fair-chance laws typically remove conviction questions from initial applications and delay checks until later, often requiring individualized assessment before adverse action."},
{id:"q702",m:"m7",t:"sj",s:"A job application asks about convictions on page one, but the city has a fair-chance ordinance. What must HR do?",o:["Keep the question: it is efficient","Ask only about felonies","Move it to the interview","Remove the question from the initial application and delay any background check until the ordinance permits, with individualized assessment"],a:3,e:"Fair-chance ordinances set timing rules and often require assessing job-relatedness and business necessity before rejecting based on criminal history."},
{id:"q703",m:"m7",t:"k",s:"CROWN Acts, now adopted in many states, prohibit discrimination based on:",o:["Political affiliation","Credit scores","Hair texture and protective hairstyles associated with race, such as locs, braids, and twists","Tattoos"],a:2,e:"CROWN (Creating a Respectful and Open World for Natural Hair) laws extend race protections to hair texture and protective styles in employment and education."},
{id:"q704",m:"m7",t:"sj",s:"A grooming policy bans locs and braids as 'unprofessional.' An employee complains. What is the BEST action?",o:["Enforce the policy evenly","Revise the policy: race-neutral on its face but discriminatory in effect, and unlawful in CROWN Act states","Offer a wig stipend","Transfer the employee"],a:1,e:"Grooming rules targeting protective hairstyles carry disparate-impact and CROWN Act risk; neutral, safety-based appearance standards are the compliant alternative."},
{id:"q705",m:"m7",t:"k",s:"Under Jespersen v. Harrah's, sex-differentiated grooming standards are:",o:["Permitted only if they do not impose an unequal burden on one sex","Always illegal","Always legal","Decided by customer vote"],a:0,e:"Jespersen upheld a makeup requirement where no unequal burden was proven, but standards imposing materially greater burdens on one sex violate Title VII; several states now go further."},
