{id:"q372",m:"m3",t:"sj",s:"Recruiting sells candidates on startup energy and rapid growth, but the reality is bureaucratic and flat. New-hire turnover within a year is high. The BEST fix is to:",o:["Shorten the probationary period","Increase starting salaries to compensate","Align the EVP with reality: fix the message, the experience, or both, since misaligned promises drive early exits","Hide the bureaucracy during interviews"],a:2,e:"EVP-reality gaps create psychological contract breach, the top predictor of first-year exits. Either change the promise to match reality or change reality to match the promise."},
{id:"q373",m:"m3",t:"k",s:"Tracking regretted versus non-regretted attrition helps HR because it distinguishes:",o:["Full-time from part-time exits","Layoffs from resignations","Voluntary from involuntary turnover","Departures the company wanted to prevent from those it did not, such as low performers and retirements"],a:3,e:"Not all turnover is equal. Regretted attrition (high performers, critical skills lost) is the metric that matters for retention strategy; non-regretted exits may even be healthy."},
{id:"q374",m:"m3",t:"sj",s:"Regretted attrition is 22 percent in engineering but 6 percent elsewhere in the company. The FIRST step should be to:",o:["Conduct targeted stay interviews and exit analysis within engineering to find the specific drivers","Hire more engineers to backfill","Benchmark engineering pay nationally","Give all engineers an immediate raise"],a:0,e:"Segmented problems need segmented diagnosis. Company-wide fixes waste money; find what is actually pushing engineers out before prescribing."},
{id:"q375",m:"m3",t:"k",s:"Research on counteroffers consistently shows that:",o:["They are illegal in most states","They permanently resolve retention risk","Most employees who accept counteroffers leave within a year, because the underlying issues remain","They improve team morale"],a:2,e:"Studies find the majority of counteroffer acceptors depart within 6-12 months. The raise treats the symptom; the reasons they looked (manager, growth, workload) persist."},
{id:"q376",m:"m3",t:"sj",s:"A top performer resigns to join a competitor. The manager wants to make a counteroffer on the spot. The BEST guidance HR can give is to:",o:["Refuse all counteroffers as policy","Ask the competitor for details","Match the offer immediately and add a bonus","Explore why the employee is leaving first, since counteroffers rarely stick and can create internal equity problems"],a:3,e:"Diagnose before prescribing: if the driver is pay, a targeted response may work; if it is the manager or growth, money will not hold them. Hasty counters also trigger equity complaints."},
{id:"q377",m:"m3",t:"k",s:"Rehiring former employees, often called boomerang employees, tends to:",o:["Reduce ramp-up time and improve retention, since both sides understand the fit","Violate non-compete agreements","Lower team morale","Increase training costs sharply"],a:0,e:"Boomerangs know the culture and systems, ramp faster, and have realistic expectations, which is why alumni networks are a strategic talent pool."},
{id:"q378",m:"m3",t:"sj",s:"HR wants to build an alumni network to enable boomerang rehires. The MOST important design element is:",o:["Alumni-only job boards","A large launch event","Graceful offboarding and ongoing relationship touchpoints, since how people leave determines whether they return","Strict non-solicitation agreements"],a:2,e:"Boomerang pipelines are built at exit: respectful departures, stay-in-touch rhythms, and alumni value (not just asks) determine whether former stars consider returning."},
{id:"q379",m:"m3",t:"k",s:"Employee referral hires typically show higher retention than other sources, mainly because:",o:["Referrals skip onboarding","Referral hires are never terminated","Referral bonuses are large","Referrers pre-screen for fit, provide realistic previews, and aid social integration"],a:3,e:"Referrers stake their reputation, so they screen for fit; they also give candidates honest previews and built-in social connections, which speeds belonging and retention."},
{id:"q380",m:"m3",t:"sj",s:"Referral volume is low and quality is mixed. To improve the program's retention impact, HR should:",o:["Pay bonuses after 6 to 12 months of retention, make referring easy, and recognize referrers publicly","Limit referrals to executives","Require referrals for every opening","Double the bonus paid at hire"],a:0,e:"Paying at hire rewards volume; paying on retention rewards quality. Frictionless submission plus recognition sustains participation without gaming."},
{id:"q381",m:"m3",t:"k",s:"The honeymoon-hangover effect in onboarding research describes the pattern in which:",o:["Onboarding has no measurable effect","New hires never adjust","New-hire satisfaction starts high, then dips around months 3 to 6 as reality sets in","Veterans resent newcomers"],a:2,e:"Early euphoria fades as novelty wears off and real frustrations surface. The dip is normal and predictable, which means it can be managed with timed support."},
{id:"q382",m:"m3",t:"sj",s:"First-year turnover is 35 percent, with exits clustering in months 4 through 6. The BEST intervention is to:",o:["Increase new-hire starting pay","Shorten onboarding to one day","Extend the probationary period","Strengthen 30/60/90-day check-ins and manager coaching through the hangover period"],a:3,e:"Exits cluster where the honeymoon ends. Structured manager check-ins at 30/60/90 days catch disillusionment early, when intervention still works."},
{id:"q383",m:"m3",t:"k",s:"Pre-boarding, the period between offer acceptance and day one, primarily aims to:",o:["Maintain excitement, finish administrative tasks early, and prevent offer reneges","Assign annual goals","Conduct exit interviews","Complete performance reviews early"],a:0,e:"The gap between signing and starting is when doubt and competing offers strike. Pre-boarding keeps the emotional commitment warm and clears admin so day one is about belonging."},
{id:"q384",m:"m3",t:"sj",s:"A strong candidate signed an offer but starts in six weeks. The hiring manager asks what to do in the meantime. The BEST advice is to:",o:["Require daily check-in calls","Do nothing until day one","Send a welcome note, arrange a team introduction, complete paperwork early, and share the first-week agenda","Assign pre-work projects"],a:2,e:"Light, warm, useful contact sustains commitment: a personal welcome, human connection to the team, admin cleared early, and a preview that reduces first-day anxiety."},
{id:"q385",m:"m3",t:"k",s:"An onboarding buddy is MOST effective when the buddy is:",o:["An HR administrator","An executive sponsor","The new hire's direct manager","A trained peer who can answer cultural and practical questions the new hire may not ask a boss"],a:3,e:"Buddies work because they are safe: peers answer the unwritten-rules questions (where to eat, how things really get done) that newcomers will not ask their manager."},
{id:"q386",m:"m3",t:"sj",s:"A buddy program exists on paper, but new hires report never actually meeting their buddy. The fix is to:",o:["Give buddies clear expectations, scheduled touchpoints in the first 90 days, and light accountability","Replace buddies with an intranet FAQ","Make buddies optional","Assign two buddies per hire"],a:0,e:"Buddy programs fail from vagueness, not bad intent. Defined touchpoints (week 1 coffee, week 4 lunch, 90-day check), simple guidance, and follow-up make the role real."},
{id:"q387",m:"m3",t:"k",s:"Moments that matter in the employee lifecycle refers to:",o:["Quarterly earnings calls","Annual enrollment periods","High-emotion inflection points such as the first day, a promotion, parental leave, or bereavement, which disproportionately shape engagement","Payday schedules"],a:2,e:"Employees judge the employer relationship by peak emotional moments. Getting the first day, the promotion conversation, or the return from leave right pays lasting dividends."},
{id:"q388",m:"m3",t:"sj",s:"An employee returning from parental leave feels disconnected and is considering quitting. The BEST reboarding approach is:",o:["Suggest extending the leave unpaid","Move the employee to a different team","Assign a full workload immediately to catch up","A structured return: a catch-up plan, phased workload, updated context on changes, and a regular check-in cadence"],a:3,e:"Returns from leave are moments that matter. Reboarding with context, gradual ramp, and explicit check-ins rebuilds belonging before disengagement hardens into resignation."},
{id:"q389",m:"m3",t:"k",s:"Retention (stay) bonuses are LEAST effective when they are:",o:["Paid as a lump sum with no attention to the underlying reasons people want to leave","Tied to milestone dates","Paired with honest communication","Targeted at critical roles"],a:0,e:"Stay bonuses buy time, not commitment. Without addressing the real drivers of departure, the bonus just sets the date of a more expensive resignation."},
{id:"q390",m:"m3",t:"sj",s:"During an acquisition, HR proposes stay bonuses for 40 critical staff. The BEST design is to:",o:["Keep the bonuses secret from recipients","Give everyone the same flat amount on closing day","Target truly critical roles, tie payouts to milestone dates through integration, and pair with honest communication about the future","Pay bonuses only to executives"],a:2,e:"Effective stay bonuses are surgical: critical roles only, cliff-vested across integration milestones, with transparent communication. Blanket or secret bonuses waste money and breed distrust."},
{id:"q391",m:"m3",t:"k",s:"Research on flexible work arrangements and engagement most consistently finds that:",o:["Only fully remote work engages employees","Flexibility only matters to parents","Flexibility has no effect on engagement","Autonomy over when and where work happens predicts engagement, while flexibility without boundaries predicts burnout"],a:3,e:"The active ingredient is autonomy, not location. Flexible arrangements raise engagement when paired with clear expectations and boundaries; always-on flexibility does the opposite."},
{id:"q392",m:"m3",t:"sj",s:"Leadership is considering a full return-to-office mandate, and employee listening data shows strong resistance. To assess the engagement risk responsibly, HR should:",o:["Model which populations are affected, gather structured input, and pilot before mandating, since blanket mandates spike regretted attrition","Announce it on a Friday afternoon","Exempt only executives","Implement the mandate and measure afterward"],a:0,e:"RTO is a retention event disguised as a policy. Segment impact (caregivers, long commutes, top performers), test assumptions with a pilot, and decide with data on who you can afford to lose."},
{id:"q393",m:"m3",t:"k",s:"The strongest drivers of remote-worker isolation are:",o:["Home office ergonomics","Poor video quality","Lack of informal interaction and unclear expectations, not the technology itself","Time zone differences alone"],a:2,e:"Isolation is social and structural: missing hallway moments and ambiguous expectations. Technology enables connection, but rituals and clarity create it."},
{id:"q394",m:"m3",t:"sj",s:"A remote team's engagement scores are slipping, with comments about feeling invisible. The MOST effective interventions are:",o:["Longer video meetings","A bigger home-office stipend","More surveillance software","Intentional connection rituals, clear outcomes-based expectations, and periodic in-person gatherings"],a:3,e:"Remote engagement needs deliberate design: rituals replace hallway moments, outcome clarity replaces visibility management, and in-person time builds the trust that sustains distance."},
{id:"q395",m:"m3",t:"k",s:"Large-scale four-day-week trials (Iceland, UK) most consistently reported:",o:["Maintained or improved productivity alongside reduced stress and burnout","Mass resignations","No measurable effects","Sharp productivity declines"],a:0,e:"Across thousands of workers, reduced-hours trials held output steady while improving well-being. The mechanism is focus: fewer hours force prioritization and cut low-value work."},
{id:"q396",m:"m3",t:"sj",s:"The company offers unlimited PTO, but average usage is 8 days a year and burnout scores are rising. The BEST fix is to:",o:["Require HR approval for every request","Remove the policy and go back to fixed days","Set minimum vacation expectations, have leaders visibly model time off, and track usage","Increase the accrual rate"],a:2,e:"Unlimited PTO fails without norms: ambiguity makes people take less. Minimums, leader modeling, and usage tracking convert the policy from a trap into a benefit."},
{id:"q397",m:"m3",t:"k",s:"Research links excessive meetings to disengagement primarily through:",o:["Too many donuts","Video fatigue alone","Boring agendas","Fragmented focus time and reduced autonomy over one's own schedule"],a:3,e:"The damage is structural: back-to-back meetings shred deep-work time and signal that employees do not control their own calendars, eroding the autonomy engagement depends on."},
{id:"q398",m:"m3",t:"sj",s:"Calendar analytics show managers average 30 meeting hours per week, and focus-time complaints are rising. The BEST first move is to:",o:["Ban all meetings on Fridays immediately","Audit meeting purpose and norms (no-meeting blocks, 25-minute defaults, optional attendance) rather than mandating cuts blindly","Hire more managers","Require cameras on"],a:0,e:"Diagnose before prescribing: categorize meetings by value, then redesign norms (shorter defaults, protected focus blocks, clear purpose). Blanket bans just push meetings underground."},
{id:"q399",m:"m3",t:"k",s:"Right-to-disconnect laws, adopted in countries such as France and parts of Canada and Australia, generally:",o:["Give employees the right to ignore after-hours work communications without penalty","Require companies to provide phones","Mandate overtime for emails","Ban all remote work"],a:0,e:"Right-to-disconnect rules protect non-work time from the expectation of constant availability. Even where not legally required, the principle guides healthy boundary norms."},
{id:"q400",m:"m3",t:"sj",s:"After-hours messaging is constant and burnout scores are climbing. The BEST norm-setting move is to:",o:["Punish late-night senders","Monitor everyone's login times","Have leaders model boundaries and establish explicit team agreements on response-time expectations","Disable the messaging app at 6 PM"],a:2,e:"Boundaries are set by behavior, not policy. When leaders send midnight messages, any policy is fiction; team agreements plus modeled behavior reset the norm."},
{id:"q401",m:"m3",t:"k",s:"Role clarity is a strong driver of engagement because:",o:["It reduces headcount needs","It replaces the need for managers","It eliminates all stress","Employees who know what is expected can direct their effort effectively and experience competence"],a:3,e:"Clarity connects to SDT's competence need: people engage when they understand expectations, priorities, and how success is measured. Ambiguity burns motivational fuel on guessing."},
{id:"q402",m:"m3",t:"sj",s:"After a reorganization, engagement fell and comments cite confusion about who decides what. The BEST fix is to:",o:["Reorganize again, more clearly","Clarify decision rights with a RACI for key decisions and have managers reset expectations one-on-one","Publish a new org chart only","Wait for the dust to settle"],a:0,e:"Post-reorg ambiguity is a decision-rights problem. RACI (responsible, accountable, consulted, informed) on key decisions plus manager-led expectation resets restores clarity fast."},
{id:"q403",m:"m3",t:"k",s:"Gallup's strengths-based management research finds that:",o:["Employees who use their strengths every day are far more likely to be engaged","Strengths are fixed at birth","Everyone has the same strengths","Weakness-fixing is the best development strategy"],a:0,e:"The strengths finding: people who have the opportunity to do what they do best every day are dramatically more engaged. Development ROI is higher building strengths than patching weaknesses."},
{id:"q404",m:"m3",t:"sj",s:"A manager assigns tasks randomly, and a disengaged analyst's known strengths go unused. HR should coach the manager to:",o:["Send the analyst to training","Reassign the analyst out","Give the analyst only easy tasks","Learn each team member's strengths and align assignments to them where possible"],a:3,e:"Strengths-based managing starts with knowing the team: have strengths conversations, then shape work allocation around them. Fit is a manager skill, not luck."},
{id:"q405",m:"m3",t:"k",s:"Unscheduled absenteeism is a useful leading indicator of engagement problems because:",o:["It often precedes turnover and reflects withdrawal when survey data lags behind","It only affects hourly workers","It measures job satisfaction directly","It is easy to punish"],a:0,e:"Absenteeism is behavioral withdrawal: rising unscheduled absence frequently foreshadows resignations by months, giving HR an early signal surveys miss."},
{id:"q406",m:"m3",t:"sj",s:"One shift's unscheduled absenteeism has doubled in two months while other shifts are stable. The FIRST step is to:",o:["Issue written warnings to the shift","Investigate shift-specific causes such as supervision, workload, or schedule changes before moving to discipline","Offer perfect-attendance bonuses","Ignore it as seasonal"],a:0,e:"Segmented spikes point to local causes: a new supervisor, changed schedules, or workload shifts. Discipline without diagnosis punishes symptoms and misses the fix."},
{id:"q407",m:"m3",t:"k",s:"Presenteeism, working while ill, costs employers primarily through:",o:["Improved team morale","Lower insurance premiums","Higher catering bills","Reduced productivity, prolonged illness, and contagion, often exceeding the cost of absenteeism"],a:3,e:"Sick workers produce less, stay sick longer, and infect others. Cultures that stigmatize absence buy presenteeism, which research prices above absenteeism itself."},
{id:"q408",m:"m3",t:"sj",s:"The attendance policy penalizes every absence equally, so sick employees come to work ill. The BEST policy fix is to:",o:["Separate occasional genuine illness from abuse patterns, so the policy does not incentivize presenteeism","Eliminate sick days entirely","Require doctor notes for every absence","Increase the penalties"],a:0,e:"Blunt attendance policies manufacture presenteeism. Distinguish patterns of abuse from legitimate illness, and design the policy so staying home sick is the rational choice."},
{id:"q409",m:"m3",t:"k",s:"Change fatigue, in engagement terms, is best described as:",o:["Resistance to all technology","A generational trait","Physical tiredness from overtime","Exhaustion and cynicism from cumulative, poorly paced change, which reduces commitment to new initiatives"],a:3,e:"Change fatigue is a capacity problem: overlapping initiatives with no recovery time deplete the goodwill change needs. Cynicism about the next launch is the symptom."},
{id:"q410",m:"m3",t:"sj",s:"The company is entering its third reorganization in 18 months and engagement is cratering. To protect engagement, HR should advise leaders to:",o:["Accelerate to get it over with","Slow the pace where possible, explain the why clearly, protect islands of stability, and sequence changes","Hide the plans until launch day","Replace the change sponsors"],a:0,e:"Fatigued organizations need pacing, purpose, and predictability: fewer concurrent changes, a compelling why, stable routines preserved, and honest timelines rebuild change capacity."},
{id:"q411",m:"m3",t:"k",s:"Survivor syndrome after layoffs typically includes:",o:["Guilt, anxiety, distrust of leadership, and resentment over redistributed workloads","Celebration among survivors","Improved morale","Immediate productivity gains"],a:0,e:"Survivors grieve colleagues, fear they are next, distrust the process, and absorb extra work. Unaddressed survivor syndrome drives the second wave of exits: your best people leaving voluntarily."},
{id:"q412",m:"m3",t:"sj",s:"After layoffs, remaining employees are disengaged and overloaded. The BEST immediate plan is to:",o:["Hire replacements quietly","Discourage talking about it","Promise bonuses next quarter","Acknowledge the loss honestly, rebalance workloads explicitly, communicate the path forward, and check in frequently"],a:3,e:"Survivor recovery needs honesty (name what happened), relief (real workload rebalancing, not just words), direction (where the company goes now), and sustained listening."},
{id:"q413",m:"m3",t:"k",s:"Engaging contingent and temporary workers is challenging mainly because:",o:["They work too few hours","Labor law forbids it","They are unmotivated by nature","Traditional engagement levers such as career growth, benefits, and belonging often do not extend to them"],a:3,e:"The engagement toolkit assumes employment: growth paths, benefits, inclusion. Contingent workers sit outside those systems, so engagement must come from the work experience itself: respect, clarity, and fair treatment."},
{id:"q414",m:"m3",t:"sj",s:"Long-term temporary workers report feeling like second-class citizens. Within legal constraints, the BEST response is to:",o:["Exclude them from meetings to avoid co-employment risk","Ignore the feedback","Convert everyone immediately regardless of budget","Include them in team rituals, ensure respectful treatment and clear communication, and create pathways to convert strong performers"],a:3,e:"Dignity is free: inclusion in team life, honest communication, and visible conversion paths engage contingent workers. (Note: keep co-employment rules in mind and coordinate with legal on classification.)"},
{id:"q415",m:"m3",t:"k",s:"For hourly frontline workers, the strongest engagement drivers emphasize different factors than for knowledge workers, particularly:",o:["Unlimited PTO","Equity grants","Stock options and sabbaticals","Schedule stability and predictability, fair and transparent pay, respectful supervision, and physical safety"],a:3,e:"Frontline engagement research points to basics done well: predictable schedules, a living wage paid fairly, supervisors who show respect, and safe conditions. Higher-order perks matter little without these."},
{id:"q416",m:"m3",t:"sj",s:"A retail chain has 90 percent annual turnover. Schedules are posted two days in advance and change constantly. The BEST intervention is to:",o:["Add a ping-pong table","Increase the dress code flexibility","Raise the employee discount","Implement predictable scheduling with advance notice and employee input on availability, plus supervisor training"],a:3,e:"Schedule chaos is a top frontline quit driver: it makes childcare, second jobs, and life unplannable. Advance notice plus input attacks the root cause; perks do not."},
{id:"q417",m:"m3",t:"k",s:"Financial wellness programs affect engagement and retention because:",o:["They are legally required","Only executives have financial stress","They replace pay raises","Financial stress is among the top sources of employee distraction, and reducing it improves focus and retention"],a:3,e:"Money worries are a leading cause of presenteeism and turnover. Emergency savings support, coaching, and fair pay practices address a distraction no engagement initiative can outrun."},
{id:"q418",m:"m3",t:"sj",s:"Frontline workers cite money stress, and several mention using payday lenders. The BEST employer response is to:",o:["Give everyone a raise tomorrow","Ban discussions of pay","Offer company payday loans at lower rates","Provide earned-wage access, confidential financial coaching, and emergency savings options, rather than becoming a lender"],a:3,e:"Employer-as-lender creates conflicts and dependency. Earned-wage access plus coaching and emergency savings address the cash-flow crunch structurally without the employer holding the debt."},
{id:"q419",m:"m4",t:"k",s:"Bloom's revised taxonomy orders cognitive learning objectives from simplest to most complex as:",o:["Create, evaluate, analyze, apply, understand, remember","Remember, understand, apply, analyze, evaluate, create","Understand, remember, create, apply, analyze, evaluate","Apply, remember, understand, evaluate, create, analyze"],a:1,e:"Bloom's revised levels: remember, understand, apply, analyze, evaluate, create. Higher levels demand more than recall, so objectives should target the level the job actually requires."},
{id:"q420",m:"m4",t:"k",s:"A well-written learning objective using Bloom's taxonomy should:",o:["Use vague verbs like understand and learn","Specify an observable action with a measurable standard, such as: demonstrate the lockout procedure without error","List the instructor's credentials","Describe the catering arrangements"],a:1,e:"Objectives need observable verbs (demonstrate, calculate, resolve) plus conditions and standards. Vague verbs like understand cannot be assessed, so they cannot prove learning happened."},
{id:"q421",m:"m4",t:"sj",s:"A training request asks for a course so managers will better understand leadership. As an L&D professional, the BEST response is to:",o:["Build a two-day leadership course immediately","Push back on the vague objective: define which leadership behaviors are needed, in which situations, measured how, then design to that","Order leadership books for all managers","Schedule motivational speakers"],a:2,e:"Understand is unmeasurable and leadership is not one skill. Translate the request into specific behaviors and business outcomes first; design follows diagnosis."},
{id:"q422",m:"m4",t:"k",s:"Gagne's nine events of instruction include all of the following EXCEPT:",o:["Gain attention and state objectives","Present content and provide guidance","Elicit performance and give feedback","Set the training budget and book the venue"],a:3,e:"Gagne's events: gain attention, inform objectives, recall prior learning, present content, guide learning, elicit performance, give feedback, assess, enhance retention. Logistics are not instructional events."},
{id:"q423",m:"m4",t:"sj",s:"A safety training has high completion but incidents persist. Applying Gagne's events, the most likely design gap is:",o:["The budget was too low","Missing guided practice with feedback and retention activities: learners never performed the skill or got corrective feedback","The room was too cold","Attendance was voluntary"],a:1,e:"Completion-heavy programs often present content but skip elicit performance, feedback, and retention enhancement. Safety skills need practice with correction, not just presentation."},
{id:"q424",m:"m4",t:"k",s:"Kolb's experiential learning cycle describes learning as a four-stage loop:",o:["Lecture, test, grade, repeat","Concrete experience, reflective observation, abstract conceptualization, active experimentation","Watch, copy, master, teach","Plan, do, check, act"],a:1,e:"Kolb: experience something, reflect on it, form concepts, test them in new situations. Effective programs cycle through all four stages rather than camping on one."},
{id:"q425",m:"m4",t:"sj",s:"A leadership program is all lectures and case discussions, and behavior never changes. Redesigning around Kolb's cycle, the BEST addition is:",o:["More lectures","Real stretch experiences with structured reflection, concept-building, and planned experimentation back on the job","Shorter sessions","Better slides"],a:2,e:"Lectures cover conceptualization only. Kolb demands the full loop: genuine experience, guided reflection, frameworks to make sense of it, and deliberate on-the-job experimentation."},
{id:"q426",m:"m4",t:"k",s:"Bandura's social learning theory emphasizes that much workplace learning occurs through:",o:["Reading manuals alone","Observation, modeling, and vicarious reinforcement, powered by self-efficacy beliefs","Punishment only","Genetic predisposition"],a:1,e:"Bandura: people learn by watching credible models and noting consequences. Self-efficacy (belief I can do it) determines whether observed skills are attempted; mentors and exemplars are powerful L&D tools."},
{id:"q427",m:"m4",t:"sj",s:"New sales reps can recite the pitch but freeze on live calls. To build self-efficacy (Bandura), the BEST approach is:",o:["More product lectures","Graduated mastery experiences: start with low-stakes role plays, then coached live calls with early wins","Threaten termination for low numbers","Assign reading"],a:2,e:"Self-efficacy grows through mastery experiences: sequenced successes of increasing difficulty, plus modeling and encouragement. Confidence to perform comes from performing, not from more content."},
{id:"q428",m:"m4",t:"k",s:"Knowles' principles of andragogy (adult learning) hold that adult learners:",o:["Prefer lectures to experience","Need to know why, bring experience as a resource, are self-directed, and learn best when the content solves real problems","Learn identically to children","Avoid all collaboration"],a:1,e:"Andragogy: adults need the why, draw on rich experience, prefer self-direction, become ready to learn when facing real problems, and are motivated intrinsically. Design with these, not against them."},
{id:"q429",m:"m4",t:"sj",s:"Experienced technicians resent a mandatory retraining that treats them like beginners. Applying andragogy, the BEST redesign is to:",o:["Make it longer to ensure compliance","Honor their experience: pre-assess, let them test out of what they know, use peer teaching, and anchor content to real problems they face","Exempt them entirely","Deliver it as a lecture"],a:1,e:"Nothing kills adult learning faster than ignoring experience. Pre-assessment with test-out, peer expertise, and problem-centered design respect competence while closing real gaps."},
{id:"q430",m:"m4",t:"k",s:"Cognitive load theory (Sweller) warns instructional designers to manage:",o:["Only the difficulty of the content","Intrinsic load (content complexity), extraneous load (poor design), and germane load (effort toward understanding)","The weight of training binders","Room temperature"],a:1,e:"Working memory is limited. Reduce extraneous load (cluttered slides, split attention), manage intrinsic load (sequence complexity), and protect germane load (effort that builds schemas)."},
{id:"q431",m:"m4",t:"sj",s:"A compliance e-learning module packs 200 words per slide with narration reading the same text. The cognitive-load fix is to:",o:["Add background music","Cut text to essentials, use visuals with concise narration instead of redundant on-screen text, and chunk the content","Make the font smaller to fit more","Add more slides"],a:2,e:"Redundant text plus narration overloads working memory (redundancy effect). Mayer's coherence and modality principles: trim to essentials, narrate visuals, chunk into digestible segments."},
{id:"q432",m:"m4",t:"k",s:"Mayer's principles of multimedia learning include the coherence principle, which states that:",o:["More media is always better","Learners learn better when extraneous words, pictures, and sounds are excluded","Audio should never be used","All content needs animation"],a:1,e:"Coherence: cut the interesting-but-irrelevant extras. Every decorative graphic, tangent, and sound effect consumes working memory that should build understanding."},
{id:"q433",m:"m4",t:"k",s:"The Ebbinghaus forgetting curve implies that without reinforcement, learners forget most new material within days. The evidence-based countermeasure is:",o:["Longer single sessions","Spaced repetition: distributed practice and retrieval spaced over time","Louder instructors","More handouts"],a:1,e:"Spacing effect: distributed practice with expanding intervals dramatically improves retention versus massed cramming. Design reinforcement at 1 day, 1 week, 1 month intervals."},
{id:"q434",m:"m4",t:"sj",s:"Product knowledge test scores collapse six weeks after training. The BEST redesign is to:",o:["Repeat the full course quarterly","Build spaced reinforcement: brief retrieval quizzes and scenario refreshers pushed at expanding intervals after the course","Make the initial course twice as long","Blame the learners"],a:1,e:"The forgetting curve is predictable, so reinforcement should be designed in: short spaced retrieval beats re-teaching. Push 5-minute refreshers at 1 week, 1 month, and quarterly."},
{id:"q435",m:"m4",t:"k",s:"Retrieval practice (the testing effect) improves long-term retention because:",o:["Tests punish inattention","The act of recalling strengthens memory pathways more than re-reading or re-watching","Tests are stressful","It fills class time"],a:1,e:"Retrieval is a memory modifier, not just a measurement: effortful recall rewires storage strength. Low-stakes quizzing beats re-study for durable learning."},
{id:"q436",m:"m4",t:"sj",s:"A compliance refresher currently asks learners to re-read the policy annually. To leverage the testing effect, the BEST change is to:",o:["Add more pages to re-read","Replace re-reading with scenario-based retrieval questions with feedback, spaced across the year","Remove the refresher","Require essays"],a:1,e:"Re-reading creates fluency illusions. Scenario quizzes force retrieval, expose gaps, and with feedback actually teach; spacing them sustains the knowledge all year."},
{id:"q437",m:"m4",t:"k",s:"Deliberate practice (Ericsson) differs from mere experience or repetition in that it is:",o:["Longer","Designed around specific weaknesses, with immediate feedback and repeated refinement at the edge of ability","Unsupervised","Only for musicians and athletes"],a:1,e:"Deliberate practice: targeted drills on weak sub-skills, immediate expert feedback, and progressive difficulty. Ten years of experience without it is one year repeated ten times."},
{id:"q438",m:"m4",t:"sj",s:"Call center reps handle volume but struggle with angry callers. Designing deliberate practice, the BEST approach is:",o:["More call shadowing","Isolated drills on de-escalation sub-skills with recorded role plays, expert feedback, and graduated difficulty","A lecture on empathy","Longer scripts"],a:1,e:"Break the skill into sub-skills (acknowledge emotion, reframe, offer options), drill each with feedback, then integrate under realistic pressure. Shadowing alone never builds the hard parts."},
{id:"q439",m:"m4",t:"k",s:"Dweck's growth mindset research suggests that in a learning culture, the most productive belief to cultivate is:",o:["Talent is fixed and rare","Abilities can be developed through effort, strategy, and feedback","Failure should be hidden","Only experts should attempt hard tasks"],a:1,e:"Growth mindset: abilities are developable. Cultures that praise effort, strategy, and learning from failure get more risk-taking and faster skill growth than those that worship innate talent."},
{id:"q440",m:"m4",t:"sj",s:"Employees avoid stretch assignments, fearing that any failure will brand them as low potential. To build a growth-mindset culture, the BEST leadership move is to:",o:["Lower performance standards","Publicly reward smart risk-taking and treat well-designed failures as learning data, starting with leaders sharing their own","Punish failed projects","Remove stretch assignments"],a:1,e:"Mindset is set by what gets rewarded. When leaders model learning from failure and recognize effort and strategy (not just flawless outcomes), risk-taking becomes safe."},
{id:"q441",m:"m4",t:"k",s:"Senge's five disciplines of a learning organization include all of the following EXCEPT:",o:["Systems thinking","Personal mastery","Mental models","Individual piece-rate incentives"],a:2,e:"Senge's five: systems thinking, personal mastery, mental models, shared vision, and team learning. Individual incentives that reward hoarding knowledge work against the learning organization."},
{id:"q442",m:"m4",t:"k",s:"Learning in the flow of work (Bersin) means:",o:["Taking courses during work hours","Embedding bite-size learning, guidance, and knowledge into the tools and moments where work actually happens","Eliminating all formal training","Learning only from managers"],a:3,e:"Flow-of-work learning meets people at the moment of need: searchable answers, in-app guidance, and micro-resources inside daily tools, rather than pulling them into courses."},
{id:"q443",m:"m4",t:"sj",s:"Field technicians waste hours calling support for procedures that exist in manuals nobody opens. The BEST flow-of-work solution is to:",o:["Write longer manuals","Put searchable step-by-step guidance and short videos inside the work-order app they already use","Schedule monthly classroom refreshers","Hire more support staff"],a:0,e:"Meet the need in the workflow: mobile-accessible, searchable performance support at the job site beats manuals and courses for just-in-time procedural knowledge."},
{id:"q444",m:"m4",t:"k",s:"The decision rule for performance support (job aids) versus training is:",o:["Always train; never use job aids","Use job aids when the task is infrequent, complex, or high-consequence and performance matters more than memorization; train when the skill must be automatic","Job aids are only for executives","Training is always cheaper"],a:1,e:"Do not train what can be looked up. Job aids win for infrequent or complex procedures (emergency checklists); training wins when recall must be instant (CPR, de-escalation)."},
{id:"q445",m:"m4",t:"sj",s:"Help-desk analysts keep misquoting the new refund policy, which changes quarterly. The BEST intervention is to:",o:["Run a two-day policy training","Build a one-page decision aid embedded in the ticketing tool, plus a 15-minute briefing on the change","Fire repeat offenders","Send the 40-page policy by email"],a:2,e:"A changing policy is a classic job-aid case: analysts need the right answer at the moment of the call, not memorization of rules that will change again next quarter."},
{id:"q446",m:"m4",t:"k",s:"An electronic performance support system (EPSS) is:",o:["A payroll module","An integrated system that provides on-the-job help, guidance, and knowledge exactly when and where a worker needs it","A video conferencing tool","An applicant tracking system"],a:3,e:"EPSS: context-sensitive help woven into work systems (wizards, knowledge bases, guided workflows). It collapses the gap between learning and doing."},
{id:"q447",m:"m4",t:"k",s:"Effective blended learning design is driven primarily by:",o:["The newest technology available","Matching each learning objective to the modality that teaches it best: what needs practice, discussion, reference, or experience","Instructor preference","Minimizing all face-to-face time"],a:0,e:"Blend by objective, not by fashion: knowledge transfer can go digital, but judgment, practice, and feedback need live or coached modalities. Technology serves the design, not vice versa."},
{id:"q448",m:"m4",t:"sj",s:"Technicians across 12 sites need hands-on equipment skills plus regulatory knowledge. The BEST blended design is to:",o:["Fly everyone to headquarters for a week","Deliver regulations and theory online with checks for understanding, then run regional hands-on labs with expert feedback","Send videos only","Skip the training"],a:1,e:"Put knowledge online (self-paced, verifiable) and reserve scarce face-to-face time for what only it can do: supervised hands-on practice with corrective feedback."},
{id:"q449",m:"m4",t:"k",s:"Best practices for virtual instructor-led training (VILT) include:",o:["90-minute lecture blocks","Frequent interaction every 3 to 5 minutes, small cohorts, a producer to manage tech, and camera-optional norms with active participation","No breaks","Reading slides aloud"],a:2,e:"VILT fights distraction with design: micro-interactions (polls, chat, breakout), producers handling tech so facilitators can teach, and engagement measured by participation, not cameras."},
{id:"q450",m:"m4",t:"sj",s:"A mandatory webinar has cameras off, zero chat activity, and dismal assessment scores. The BEST fix is to:",o:["Make cameras mandatory","Redesign for interaction: shorten segments, add polls and breakouts, use a producer, and hold learners accountable with applied tasks","Record it and hope","Double the session length"],a:3,e:"Passive webinars produce passive learning. Interaction cadence, producer support, and post-session application tasks convert attendance into engagement and retention."},
{id:"q451",m:"m4",t:"k",s:"The flipped classroom model in corporate training means:",o:["Instructors lecture from the back of the room","Learners absorb content (videos, readings) before the session, and session time is used for practice, discussion, and application","Canceling all sessions","Only using virtual reality"],a:0,e:"Flip the sequence: content consumption happens solo beforehand; precious synchronous time goes to what needs humans: practice, coaching, debate, and feedback."},
{id:"q452",m:"m4",t:"sj",s:"Manager training sessions are dominated by lectures, with no time left for practice. Applying the flipped model, the BEST change is to:",o:["Add more lecture topics","Move frameworks and concepts to pre-work videos with a readiness check, and devote the live session to role plays with feedback","Shorten the program","Remove the pre-work"],a:1,e:"Protect live time for skill-building: pre-work covers concepts, and the session becomes a practice lab. A readiness check keeps pre-work honest."},
{id:"q453",m:"m4",t:"k",s:"Branching scenarios (scenario-based e-learning) are MOST valuable for developing:",o:["Typing speed","Judgment and decision-making under realistic conditions, where choices have visible consequences","Memorization of definitions","Physical strength"],a:2,e:"Branching scenarios simulate decisions with consequences: learners choose, see outcomes, and get feedback. They build judgment far better than content review for ambiguous, high-stakes situations."},
{id:"q454",m:"m4",t:"sj",s:"Customer-service reps know the policy manual but make poor judgment calls with upset customers. The BEST training investment is:",o:["More policy quizzes","Branching scenarios built from real difficult calls, with consequences and expert feedback on each decision point","A stricter script","Longer manuals"],a:3,e:"Judgment is trained through decisions, not content. Real-call scenarios with visible consequences and feedback build the pattern recognition that manuals cannot."},
{id:"q455",m:"m4",t:"k",s:"Simulations versus role plays: the key selection criterion is:",o:["Cost only","Fidelity to the real task and safety: use simulations for dangerous, expensive, or rare events; role plays for interpersonal skills with human feedback","Participant age","Room size"],a:0,e:"Match fidelity to need: simulations replicate equipment and environments safely (surgery, flight, machinery); role plays develop human interaction skills where a partner's reactions are the point."},
{id:"q456",m:"m4",t:"sj",s:"Operators must master a new chemical process where mistakes can cause injuries. The BEST training method is:",o:["Reading the safety manual","High-fidelity simulation allowing repeated practice of normal and emergency procedures without real-world risk","Watching a video once","On-the-job trial and error"],a:1,e:"High consequence plus low tolerance for error equals simulation: learners can fail safely, repeat until automatic, and practice emergencies that cannot be rehearsed live."},
{id:"q457",m:"m4",t:"k",s:"Gamification in learning (points, badges, leaderboards) works best when designers remember that:",o:["Competition motivates everyone equally","Extrinsic rewards can undermine intrinsic motivation and leaderboards can humiliate low performers; game mechanics must serve learning goals","More badges are always better","Games replace all instruction"],a:2,e:"Gamification is seasoning, not substance: progress mechanics and meaningful challenges engage, but public leaderboards and badge-chasing can distort behavior and crush the strugglers who need learning most."},
{id:"q458",m:"m4",t:"sj",s:"A gamified compliance course with public leaderboards sparked complaints and cheating. The BEST fix is to:",o:["Add bigger prizes","Remove public rankings, keep personal progress tracking and team challenges, and refocus game elements on mastery rather than competition","Make the leaderboard bigger","Require daily play"],a:1,e:"Keep the engagement mechanics (progress, narrative, challenge) and drop the toxic ones (public ranking). Design for mastery and collaboration, not zero-sum competition on compliance."},
{id:"q459",m:"m4",t:"k",s:"Action learning (Revans) is best described as:",o:["Watching training videos faster","Small groups tackling real, complex organizational problems while explicitly reflecting on the learning process","Physical exercise programs","Individual online courses"],a:0,e:"Action learning: real problems, real stakes, small diverse groups, with structured reflection on both the solution and the learning. It develops leaders while producing business value."},
{id:"q460",m:"m4",t:"sj",s:"HR is designing an action learning project for high-potentials. The MOST critical success factor is:",o:["A comfortable meeting room","A genuinely important, ambiguous problem with executive sponsorship, plus structured reflection time built into the process","Easy problems with known answers","No deadlines"],a:1,e:"Action learning fails with toy problems or no reflection. Real stakes create real learning; sponsor engagement ensures recommendations land; reflection converts experience into leadership growth."},
{id:"q461",m:"m4",t:"k",s:"The case method (Harvard-style) develops managers primarily through:",o:["Memorizing best practices","Analyzing rich, ambiguous real situations and defending decisions under peer challenge","Listening to lectures","Taking personality tests"],a:1,e:"Cases build judgment: incomplete information, competing stakeholders, no single right answer. The learning is in the analysis and the debate, not the case's ending."},
{id:"q462",m:"m4",t:"k",s:"Stretch assignments develop employees most effectively when they:",o:["Are impossible to complete","Push beyond current capability but remain achievable, with support and feedback available","Are done entirely alone","Carry no consequences"],a:3,e:"The stretch zone sits between comfort and panic: challenging enough to demand new skills, supported enough to allow learning from mistakes. Sink-or-swim is not development, it is attrition."},
{id:"q463",m:"m4",t:"sj",s:"A promising analyst is given a stretch assignment leading a cross-functional project, with no guidance. The BEST way to structure it for development is to:",o:["Let the analyst figure it out alone","Define clear outcomes, assign a sponsor for air cover, schedule reflection check-ins, and debrief lessons afterward","Take the project back","Reduce the scope to routine tasks"],a:2,e:"Stretch without support is abandonment. Outcomes plus sponsor plus check-ins plus debrief turn a risky assignment into a developmental crucible."},
{id:"q464",m:"m4",t:"k",s:"Job shadowing is MOST useful as a development tool when the goal is:",o:["Entertainment","Career exploration and tacit knowledge transfer: seeing how experienced performers actually work","Punishment","Reducing headcount"],a:1,e:"Shadowing reveals the unwritten how: decision rhythms, stakeholder handling, and tacit expertise that never appears in procedures. Pair it with debrief questions to surface the tacit."},
{id:"q465",m:"m4",t:"k",s:"Cross-training programs offer the organization resilience and flexibility, but a key risk to manage is:",o:["Employees learning too much","Diluted expertise if everyone becomes a generalist with no deep specialists, plus initial productivity dips","Excessive documentation","Too much teamwork"],a:2,e:"Cross-training builds coverage and empathy, but over-rotation erodes deep expertise and the learning curve temporarily slows output. Balance breadth with specialist depth."},
{id:"q466",m:"m4",t:"sj",s:"A cross-training initiative meets resistance: it is seen as extra work with no payoff. The BEST response is to:",o:["Make it mandatory without explanation","Connect it to career growth and pay progression, start with volunteers, and showcase early success stories","Abandon the initiative","Do it secretly"],a:1,e:"Resistance signals a value gap: people will not invest effort without a why. Tie cross-skilling to advancement, prove it with volunteers, and let results recruit the skeptics."},
{id:"q467",m:"m4",t:"k",s:"A secondment, as a development method, is:",o:["A termination process","A temporary assignment to another team, department, or organization to build skills and perspective","A type of bonus","A disciplinary action"],a:0,e:"Secondments immerse employees in different contexts: new functions, business units, or even external organizations. The perspective shift is the development."},
{id:"q468",m:"m4",t:"k",s:"Mentoring circles (group mentoring) are particularly effective for:",o:["Replacing all training","Scaling mentoring access: one mentor guides a small peer group, combining guidance with peer learning","Executive compensation","Disciplinary meetings"],a:1,e:"Circles multiply scarce mentor capacity and add peer learning: members learn from the mentor and from each other's questions and experiences. Ideal for broad populations like new managers."},
{id:"q469",m:"m4",t:"sj",s:"Demand for mentors far exceeds supply, and 1:1 matching has a six-month waitlist. The BEST structural solution is to:",o:["End the mentoring program","Launch mentoring circles for common needs while reserving 1:1 mentoring for specialized situations","Assign random mentors","Lower mentor quality standards"],a:2,e:"Tier the offering: circles handle common developmental needs at scale; scarce 1:1 mentoring goes where individualization truly matters. Access beats perfection."},
{id:"q470",m:"m4",t:"k",s:"Reverse mentoring, in which junior employees mentor senior leaders, is MOST valuable for:",o:["Teaching executives basic manners","Building digital, cultural, and generational fluency in senior leaders while giving juniors visibility and voice","Reducing junior headcount","Performance reviews"],a:3,e:"Reverse mentoring trades expertise both ways: leaders gain fluency in technology and emerging culture; juniors gain exposure and confidence. The relationship itself builds inclusion."},
{id:"q471",m:"m4",t:"sj",s:"Senior leaders resist a proposed reverse-mentoring program as a gimmick. The BEST way to launch it is to:",o:["Mandate participation for all executives","Pilot with willing leaders around a real business need (such as digital customer trends), set clear expectations, and share early wins","Cancel the idea","Pair people randomly with no structure"],a:0,e:"Skepticism fades with proof: a focused pilot tied to a genuine knowledge gap, with structure and visible outcomes, converts critics better than mandates or vague promises."},
{id:"q472",m:"m4",t:"k",s:"Peer coaching differs from traditional mentoring in that peer coaching:",o:["Requires an executive sponsor","Is a reciprocal relationship between equals focused on current challenges, rather than a senior-to-junior guidance relationship","Is always paid","Never involves feedback"],a:1,e:"Peer coaching: equals coaching equals on live issues, trading perspectives. It scales development without hierarchy and builds coaching skill in both parties."},
{id:"q473",m:"m4",t:"k",s:"Learning cohorts (groups progressing through a program together) improve outcomes mainly through:",o:["Lower costs only","Social accountability, peer learning, and shared identity that sustain motivation over time","Less content","Faster completion"],a:2,e:"Cohorts create commitment devices: peers notice absence, discussion deepens understanding, and shared experience builds networks that outlast the program."},
{id:"q474",m:"m4",t:"sj",s:"A nine-month leadership cohort is losing momentum: attendance is slipping by month five. The BEST intervention is to:",o:["Extend the program","Re-energize with a live challenge: apply learning to a real business problem, add peer accountability check-ins, and celebrate milestones","Cancel remaining sessions","Make attendance optional"],a:1,e:"Long programs die from abstraction. Real application projects, peer accountability, and visible milestones restore purpose and energy mid-program."},
{id:"q475",m:"m4",t:"k",s:"Communities of practice (Wenger) are:",o:["Mandatory training classes","Self-organizing groups who share a craft or profession and learn from each other through ongoing interaction","Social clubs","Project teams"],a:0,e:"CoPs: practitioners bound by shared expertise, learning through storytelling, problem-solving, and shared repertoires. Organizations can nurture but not command them."},
{id:"q476",m:"m4",t:"k",s:"The leadership pipeline model (Charan, Drotter, and Noel) argues that the most common cause of leadership failure in transitions is:",o:["Lack of intelligence","Failing to change what is valued, what time is spent on, and what skills are used when moving to a new leadership level","Insufficient budget","Bad luck"],a:1,e:"Pipeline passages (managing self to managing others to managing managers) require transformations in values, time application, and skills. Most failures come from doing the old job at the new level."},
{id:"q477",m:"m4",t:"sj",s:"Newly promoted managers keep doing their old technical work and neglecting coaching. The BEST development response targets the pipeline passage by:",o:["Sending them to advanced technical training","Training the identity shift: what to stop doing, how to value team results over personal output, and coaching skills practice","Demoting them","Ignoring it"],a:2,e:"The managing-self to managing-others passage demands new values (team success over personal heroics) and new skills (coaching, delegating). Technical training feeds the exact trap they are in."},
{id:"q478",m:"m4",t:"k",s:"The GROW model for coaching conversations stands for:",o:["Gain, Review, Organize, Win","Goal, Reality, Options, Will (way forward)","Grade, Rank, Order, Warn","Give, Receive, Offer, Withhold"],a:3,e:"GROW: establish the Goal, explore the current Reality, generate Options, and commit to the Will (actions and accountability). A simple structure that keeps coaching conversations productive."},
{id:"q479",m:"m4",t:"sj",s:"A manager jumps straight to giving advice in development conversations, and direct reports feel unheard. Coaching the manager in GROW, the key shift is to:",o:["Give better advice","Spend most of the conversation in Goal and Reality with powerful questions, letting the employee generate Options before the manager adds any","Skip to Will immediately","Avoid all questions"],a:0,e:"Advice-first coaching creates dependence. GROW discipline: the coach's questions do the heavy lifting in Goal and Reality so the employee owns the Options and the Will."},
{id:"q480",m:"m4",t:"k",s:"Using 360-degree feedback for development (rather than appraisal) works best when:",o:["Results determine bonuses","It is confidential, developmental-only, paired with coaching support, and separated from pay and promotion decisions","Everyone sees everyone else's ratings","It is done once and never repeated"],a:1,e:"Developmental 360s need safety: confidentiality, no link to rewards, and coaching to interpret results. Tying 360s to pay triggers rating inflation and gaming."},
{id:"q481",m:"m4",t:"sj",s:"A company linked 360 feedback scores to bonuses, and ratings are now inflated and political. The BEST fix is to:",o:["Weight peer ratings more heavily","Decouple the 360 from compensation decisions, return it to a developmental purpose with coaching, and use separate processes for evaluation","Average the inflated scores","Fire low-rated managers"],a:2,e:"When 360s determine pay, raters collude and inflate. Restore validity by separating development feedback from evaluation, each with its own process and purpose."},
{id:"q482",m:"m4",t:"k",s:"An assessment center differs from a development center in that:",o:["They are identical","An assessment center evaluates candidates for selection or promotion decisions, while a development center diagnoses strengths and gaps to guide growth","Development centers are only for executives","Assessment centers never use simulations"],a:1,e:"Same methods (simulations, exercises, multiple assessors), different purpose: assessment centers judge readiness for decisions; development centers diagnose for growth plans. Purpose shapes design and feedback."}
);
</script>
<script>
"use strict";
/* ---- 1000Q EXPANSION batch 3 ---- */
QUESTIONS.push(
{id:"q483",m:"m5",t:"k",s:"In May 2026 the DOL formally rescinded the 2024 overtime rule. The operative federal salary threshold for white-collar exemptions is now:",o:["$844 per week","$684 per week ($35,568 annually), with the highly compensated employee threshold at $107,432","$1,128 per week","There is no federal salary threshold"],a:1,e:"After Texas courts vacated the 2024 rule, DOL's May 2026 technical amendment reinstated the 2019 levels: $684/week standard, $107,432 HCE, and no automatic increases."},
{id:"q484",m:"m5",t:"sj",s:"In 2024 the company raised several supervisors to $50,000 to meet the then-expected overtime threshold. The 2024 rule is now dead. What is the BEST next step?",o:["Immediately cut their salaries back to prior levels","Audit classifications under the reinstated $684/week threshold and duties tests, then decide deliberately with legal counsel","Do nothing - the raises are legally required","Reclassify everyone as nonexempt"],a:1,e:"The vacated rule doesn't compel pay cuts, but it does require re-auditing: some roles may still be properly exempt at $684/week; cutting pay unilaterally creates morale and contract risk."},
{id:"q485",m:"m5",t:"k",s:"Under the salary basis test, an employer may NOT:",o:["Pay a guaranteed salary each week","Dock for a full-day absence for personal reasons","Suspend without pay for a full week for a safety violation","Dock an exempt employee's pay for a partial-day absence"],a:3,e:"Partial-day docking destroys the salary basis (a few narrow exceptions aside). Full-day personal absences, FMLA offsets, and disciplinary suspensions follow specific rules."},
{id:"q486",m:"m5",t:"k",s:"The FLSA 'safe harbor' protects an employer from losing exemptions after improper deductions when the employer:",o:["Never makes mistakes","Fires the payroll clerk","Has a clearly communicated policy prohibiting improper deductions, reimburses employees, and commits to future compliance","Pays everyone hourly"],a:2,e:"Safe harbor: written policy against improper pay deductions + complaint mechanism + reimbursement + good-faith commitment preserves the exemption despite isolated errors."},
{id:"q487",m:"m5",t:"k",s:"An employee earns $20/hour plus a $200 weekly non-discretionary production bonus and works 45 hours. The regular rate is:",o:["$20.00","$24.44 ($900 + $200 = $1,100 / 45 hours)","$30.00","$22.50"],a:1,e:"Regular rate includes non-discretionary bonuses: ($20 x 45 + $200) / 45 = $24.44. Overtime is then paid at 1.5x this rate for the 5 overtime hours."},
{id:"q488",m:"m5",t:"k",s:"A discretionary year-end gift from the owner with no prior promise is:",o:["Excluded from the regular rate because it is truly discretionary","Included in the regular rate","Always illegal","Counted as wages for FMLA"],a:0,e:"Genuinely discretionary bonuses (no contract, promise, or expectation) are excluded from the regular rate. Labeling a promised bonus 'discretionary' doesn't make it so."},
{id:"q489",m:"m5",t:"sj",s:"Two retail employees each work 25 hours at Store A and 25 hours at Store B, same company, same week. Payroll treats them separately with no overtime. What is the problem?",o:["None - separate stores are separate employers","Only the second store owes overtime","Joint employment: combined 50 hours triggers 10 hours of overtime at the weighted average rate","They are exempt"],a:2,e:"Hours for the same employer (or joint employers) combine in a workweek. Splitting hours across locations to avoid overtime is a classic FLSA violation."},
{id:"q490",m:"m5",t:"k",s:"Under the fluctuating workweek method, overtime is paid at:",o:["One-half the regular rate, because the salary already covers straight time for all hours","Time and one-half of the regular rate","Double time","A flat fee"],a:0,e:"Fluctuating workweek: fixed salary covers straight time for all hours worked, so overtime hours get only the additional half-time premium. Requires a clear mutual understanding."},
{id:"q491",m:"m5",t:"k",s:"Private-sector employers generally may NOT:",o:["Pay overtime","Offer compensatory time off in lieu of overtime pay","Hire part-time workers","Pay weekly"],a:1,e:"Comp time instead of overtime pay is generally limited to public-sector employers under FLSA. Private employers must pay the overtime premium in wages."},
{id:"q492",m:"m5",t:"k",s:"Time spent in required training is compensable UNLESS:",o:["It is boring","All four criteria are met: outside normal hours, voluntary, not job-related, and no productive work performed","The employee is salaried","It is online"],a:1,e:"Training time is work time unless all four tests are satisfied (outside hours, voluntary, not directly job-related, no productive work). Most employer-required training fails this test."},
{id:"q493",m:"m5",t:"k",s:"On-call time is compensable when the employee:",o:["Carries a pager","Is at home","Checks email once","Is so restricted that they cannot effectively use the time for their own purposes"],a:3,e:"Engaged to wait vs waiting to be engaged: severe restrictions (short response time, geographic limits, frequent calls) make on-call time compensable work time."},
{id:"q494",m:"m5",t:"sj",s:"A manager tells hourly staff to 'finish up off the clock' to stay under budget. What is HR's BEST response?",o:["Look the other way - budgets matter","Stop it immediately, retrain the manager, and audit for back wages owed - off-the-clock work is a willful FLSA violation","Suggest they clock out for lunch only","Transfer the manager"],a:1,e:"Suffered or permitted work must be paid, and directing off-the-clock work is willful - extending the statute of limitations to 3 years and inviting liquidated damages."},
{id:"q495",m:"m5",t:"k",s:"Incentive stock options (ISOs) differ from non-qualified stock options (NQSOs) in that ISOs:",o:["Are taxed at exercise always","Have no tax rules","Can receive favorable capital-gains treatment if holding periods are met, but are limited to $100,000 of exercisable value per year","Are only for executives"],a:2,e:"ISOs: no regular tax at exercise (AMT may apply), capital gains if held 2 years from grant/1 year from exercise; $100K annual limit on first-exercisable value."},
{id:"q496",m:"m5",t:"k",s:"Restricted stock units (RSUs) differ from stock options because RSUs:",o:["Always expire worthless","Cannot be taxed","Are illegal","Have value even if the stock price stays flat, since they convert to shares at vesting"],a:3,e:"RSUs deliver actual shares at vesting - they retain value unless the stock goes to zero. Options are worthless if the price stays below the strike price."},
{id:"q497",m:"m5",t:"k",s:"Section 162(m) limits a public company's tax deduction for compensation to covered executives to:",o:["$1 million per year per covered executive, with narrow exceptions","No limit","$500,000","$10 million"],a:0,e:"162(m): public companies generally cannot deduct more than $1M annually per covered executive (CEO, CFO, and others). Performance-based exceptions were largely repealed in 2017."},
{id:"q498",m:"m5",t:"k",s:"Section 409A primarily governs:",o:["Minimum wage","Health insurance","Nonqualified deferred compensation - imposing strict rules on deferral elections and distribution timing","Union dues"],a:2,e:"409A: deferred comp (SERPs, deferred bonuses) must follow rigid election and distribution rules; violations trigger immediate taxation plus 20% penalty."},
{id:"q499",m:"m5",t:"sj",s:"The CEO wants a supplemental executive retirement plan (SERP) that pays out whenever the executive chooses. What should HR flag?",o:["Nothing - executives deserve flexibility","SERPs are illegal","Only the board matters","409A requires distributions only on fixed permissible events (separation, disability, death, fixed date, change in control, emergency) - flexible timing triggers penalties"],a:3,e:"409A permits distributions only on six specified events. 'Whenever the executive chooses' is exactly what 409A prohibits - with 20% additional tax as the price."},
{id:"q500",m:"m5",t:"k",s:"A 'golden parachute' payment subject to Section 280G:",o:["May trigger a 20% excise tax on the executive and lost corporate deduction if it exceeds 3x the base amount on a change in control","Is always tax-free","Applies to all employees","Is required by law"],a:0,e:"280G: change-in-control payments exceeding 3x the executive's 5-year average compensation trigger a 20% excise tax and deny the company its deduction."},
{id:"q501",m:"m5",t:"k",s:"Clawback policies for executive incentive pay are required for listed companies under:",o:["No law","Dodd-Frank Section 954 (SEC listing rules): recovery of erroneously awarded incentive comp after accounting restatements","State law only","Union contracts"],a:1,e:"Dodd-Frank 954 and SEC listing standards require listed companies to recover incentive pay based on misstated financials - no misconduct finding needed."},
{id:"q502",m:"m5",t:"k",s:"An employee stock ownership plan (ESOP) is:",o:["A stock option","A bonus plan","A qualified retirement plan that invests primarily in employer stock","Illegal"],a:2,e:"ESOPs are tax-qualified retirement plans holding employer stock - used for ownership culture, succession (selling owners), and tax advantages."},
{id:"q503",m:"m5",t:"k",s:"Gainsharing (e.g., Scanlon, Rucker, Improshare plans) differs from profit sharing in that gainsharing:",o:["Pays only executives","Is illegal","Requires union approval","Ties payouts to productivity/cost improvements employees can directly influence, not overall profits"],a:3,e:"Gainsharing rewards controllable productivity gains (labor cost ratios, units per hour) - giving line employees line of sight that profit sharing lacks."},
{id:"q504",m:"m5",t:"sj",s:"The plant missed profit targets due to a market downturn, and the gainsharing payout is zero despite record productivity. Employees are furious. What is the design flaw?",o:["None - payouts are payouts","Employees don't understand math","The plan mixed formulas: gainsharing should pay on productivity gains regardless of profit; profit-based gates belong in profit-sharing plans","Pay more base salary"],a:2,e:"Don't contaminate gainsharing with profit gates - it destroys line of sight. If you want both, run separate plans with clear identities."},
{id:"q505",m:"m5",t:"k",s:"A 401(k) safe harbor plan allows the employer to:",o:["Skip all contributions","Discriminate freely","Avoid annual ADP/ACP nondiscrimination testing by making required matching or nonelective contributions that vest immediately","Eliminate vesting"],a:2,e:"Safe harbor: commit to prescribed match/nonelective contributions with immediate vesting, and the plan is deemed to pass ADP/ACP testing - trading cost for certainty."},
{id:"q506",m:"m5",t:"k",s:"Under SECURE 2.0, most new 401(k) plans must:",o:["Exclude part-timers","Automatically enroll employees at 3-10% with automatic escalation","Eliminate matching","Offer only Roth"],a:1,e:"SECURE 2.0: new 401(k)/403(b) plans (with exceptions for small/older businesses) must auto-enroll at 3-10% with 1% annual escalation to at least 10%."},
{id:"q507",m:"m5",t:"k",s:"A 3-year cliff vesting schedule means:",o:["0% vested until 3 years of service, then 100%","Immediate vesting","20% per year","Vesting only at retirement"],a:0,e:"Cliff: nothing, then everything at the cliff date (3-year max for employer matches under PPA). Graded vesting phases in (e.g., 20% per year over 6 years for matches)."},
{id:"q508",m:"m5",t:"k",s:"A plan is 'top-heavy' when:",o:["It has too many participants","It is overfunded","Fees are high","Key employees hold more than 60% of plan assets, triggering minimum contributions for non-key employees"],a:3,e:"Top-heavy (416): key employees > 60% of assets → employer must make minimum contributions (generally 3%) for non-key employees."},
{id:"q509",m:"m5",t:"k",s:"Catch-up contributions allow participants age 50+ to contribute beyond normal 401(k) limits. Under SECURE 2.0, catch-up contributions for higher earners must be:",o:["Pre-tax","Made in cash only","Skipped","Designated Roth (after-tax) for those earning above $145,000 (indexed)"],a:3,e:"SECURE 2.0: catch-ups for employees earning over $145K (indexed) must go to Roth. Plan amendments and payroll coding need to reflect this."},
{id:"q510",m:"m5",t:"k",s:"A defined benefit plan's funding is backstopped by:",o:["The FDIC","The Pension Benefit Guaranty Corporation (PBGC), which insures benefits up to statutory limits","No one","The stock market"],a:1,e:"PBGC insures most private DB plans; if a plan terminates underfunded, PBGC pays benefits subject to maximum guarantee limits."},
{id:"q511",m:"m5",t:"k",s:"A 457(b) plan is available to:",o:["State/local government and tax-exempt organization employees","All private employers","Only executives","Nobody"],a:0,e:"457(b): deferred comp for governmental and tax-exempt employees. Governmental 457(b)s allow independent contribution limits alongside 401(k)/403(b)."},
{id:"q512",m:"m5",t:"sj",s:"A departing executive's agreement includes a 2-year noncompete. They claim 'the FTC banned noncompetes.' What is the accurate response?",o:["The FTC's 2024 ban was vacated by a federal court and formally withdrawn in 2026, so enforceability is governed by state law - have counsel review the agreement","They're right - all noncompetes are void","Ignore the claim","Extend the noncompete"],a:0,e:"The federal ban never took effect: vacated nationwide in Ryan v. FTC, appeals dropped Sept 2025, rule removed from the CFR Feb 2026. State law and the agreement's reasonableness control."},
{id:"q513",m:"m5",t:"k",s:"For a noncompete to be enforceable in most states, it must:",o:["Last forever","Cover all employees","Protect a legitimate business interest and be reasonable in scope, geography, and duration","Be verbal"],a:2,e:"Reasonableness test: legitimate interest (trade secrets, customer relationships, specialized training) + narrowly tailored time/geography/scope. Overbroad covenants get narrowed or voided."},
{id:"q514",m:"m5",t:"k",s:"An HSA (Health Savings Account) requires enrollment in:",o:["A qualified high-deductible health plan (HDHP), with no disqualifying other coverage","Any health plan","Medicare","An FSA"],a:0,e:"HSA eligibility: HDHP coverage + no other non-HDHP coverage (with exceptions like dental/vision) + not enrolled in Medicare + can't be claimed as a dependent."},
{id:"q515",m:"m5",t:"k",s:"Unlike an FSA, HSA funds:",o:["Roll over indefinitely, are portable, and can be invested","Expire annually","Cannot be used for medical expenses","Are taxed twice"],a:0,e:"HSA: triple tax advantage (deductible, tax-free growth, tax-free medical withdrawals), no use-it-or-lose-it, portable, investable - FSAs generally forfeit unused balances."},
{id:"q516",m:"m5",t:"k",s:"An HRA (Health Reimbursement Arrangement) differs from an HSA in that:",o:["Employees fund it","It has no rules","Only the employer funds it, and unused amounts may or may not roll over per plan design","It replaces insurance"],a:2,e:"HRA = employer-funded reimbursement account; employer sets eligible expenses and rollover rules. No employee contributions, no portability requirement."},
{id:"q517",m:"m5",t:"sj",s:"Wellness program offers a 30% premium discount for completing biometric screening. What legal limits apply?",o:["Participatory vs health-contingent rules: under ACA the incentive cap is 30% (50% for tobacco); ADA voluntariness and GINA limits on spousal/family data also apply","None","Wellness is illegal","Only state law matters"],a:0,e:"Health-contingent wellness incentives: ACA caps (30%/50% tobacco), reasonable alternative standards, plus ADA 'voluntary' limits and GINA restrictions on collecting family medical info."},
{id:"q518",m:"m5",t:"k",s:"The ACA employer mandate applies to:",o:["All employers","Only small businesses","Government only","Applicable large employers (50+ full-time equivalents): offer affordable minimum-value coverage or face penalties"],a:3,e:"ALEs (50+ FTEs) must offer affordable, minimum-value coverage to full-time employees or face 4980H(a)/(b) penalties."},
{id:"q519",m:"m5",t:"k",s:"Under ACA, coverage is 'affordable' if the employee's share of self-only premium does not exceed:",o:["5% of pay","50% of pay","$0","9.5% of household income (indexed annually) under the federal poverty line, W-2, or rate-of-pay safe harbor"],a:3,e:"Affordability: employee self-only contribution at or below 9.5% (indexed) of household income; employers use one of three safe harbors (FPL, W-2, rate of pay) to measure."},
{id:"q520",m:"m5",t:"k",s:"Self-funded (self-insured) health plans appeal to employers because they:",o:["Eliminate all risk","Avoid state insurance mandates and premium taxes under ERISA preemption, with stop-loss coverage capping catastrophic risk","Are always cheaper","Require no administration"],a:1,e:"Self-funding: ERISA preempts state benefit mandates, no premium tax, cash-flow advantages - with stop-loss insurance capping large-claim exposure."},
{id:"q521",m:"m5",t:"k",s:"Mental Health Parity (MHPAEA) requires:",o:["Unlimited therapy","No mental health coverage","Parity between mental health/substance use benefits and medical/surgical benefits in financial requirements and treatment limits","Separate deductibles"],a:2,e:"Parity: copays, visit limits, prior authorization, and network standards for MH/SUD cannot be more restrictive than for medical/surgical care. 2024 rules tightened NQTL analysis."},
{id:"q522",m:"m5",t:"k",s:"Section 125 permitted election changes allow mid-year benefits changes only upon:",o:["Any employee request","Manager approval","Open enrollment only","Qualifying life events (marriage, birth, loss of coverage) consistent with the change"],a:3,e:"Cafeteria plan elections are irrevocable mid-year except on permitted events (change in status, cost/coverage changes) - and the election change must be consistent with the event."},
{id:"q523",m:"m5",t:"k",s:"The federal tip credit allows employers to pay a cash wage of $2.13/hour only if:",o:["The employee agrees verbally","Tips bring total hourly earnings to at least $7.25 and the employer informs employees of tip-credit provisions","Tips are pooled with managers","The employee works part-time"],a:1,e:"Tip credit max is $5.12 ($7.25 - $2.13): tips must bridge the gap, employees must be informed, and managers/supervisors can't take from tip pools."},
{id:"q524",m:"m5",t:"k",s:"Under the 80/20 rule for tipped employees, an employer may NOT take a tip credit for time spent:",o:["Serving customers","Taking breaks","On non-tipped side work exceeding 20% of hours or 30 continuous minutes","Training"],a:2,e:"DOL's 80/20 (and 30-minute) rule: tip credit is lost for side work beyond 20% of the workweek or 30 continuous minutes - track and pay full minimum wage for that time."},
{id:"q525",m:"m5",t:"k",s:"Service charges (e.g., automatic 20% banquet fee) differ from tips because:",o:["Service charges belong to the employer and need not be distributed to staff; tips belong to employees","They're the same","Service charges are illegal","Tips are taxed more"],a:0,e:"Service charges are employer revenue, not tips - no tip-credit or tip-pooling rules apply, though DOL's Jan 2026 opinion letter (FLSA 2026-4) clarified 7(i) commission-exemption treatment."},
{id:"q526",m:"m5",t:"sj",s:"A banquet manager distributes the 20% service charge to servers but keeps a cut. Servers complain. What is HR's BEST move?",o:["Let the manager decide","Clarify in writing that service charges are employer property, set a transparent distribution policy, and ensure tipped minimum-wage rules are still met","Eliminate service charges","Do nothing"],a:1,e:"Because service charges aren't tips, distribution is the employer's call - but ambiguity breeds wage claims. Written policy + minimum-wage compliance + transparency resolves it."},
{id:"q527",m:"m5",t:"k",s:"Final-paycheck timing rules:",o:["Are federal and uniform","Vary by state - some require immediate payment on involuntary termination, others allow next regular payday","Don't exist","Apply only to executives"],a:1,e:"No federal final-pay timing law; states vary widely (e.g., immediate/next-day for terminations in some states, next payday in others). Multi-state employers need a matrix."},
{id:"q528",m:"m5",t:"k",s:"Under the FLSA, employers may make deductions from wages for cash shortages or breakage:",o:["Freely","Never","With verbal approval","Only if the deduction doesn't bring pay below minimum wage or cut into overtime owed"],a:3,e:"Deductions for shortages/damage are allowed only if they don't reduce pay below minimum wage or eat into overtime - and many states restrict them further."},
{id:"q529",m:"m5",t:"k",s:"Supplemental wages (bonuses, commissions) are subject to federal income tax withholding at:",o:["A flat 22% (up to $1M; 37% above) under the optional flat-rate method","The employee's normal rate always","0%","50%"],a:0,e:"Supplemental wages: optional flat 22% withholding up to $1M in a year, 37% on amounts above $1M. Employees can still owe more or less at filing."},
{id:"q530",m:"m5",t:"k",s:"A 'red-circle' rate in compensation means:",o:["A bonus","Below-minimum pay","Pay above the grade maximum, typically frozen until the range catches up","A demotion"],a:2,e:"Red-circled: employee paid above range max (often after demotion or range restructuring) - base frozen until market movement brings the range up to the rate."},
{id:"q531",m:"m5",t:"k",s:"Range penetration measures:",o:["How far an employee's pay has progressed through the salary range: (rate - min) / (max - min)","How many apply","Turnover","Market ratio"],a:0,e:"Range penetration shows position in range: 0% at minimum, 100% at maximum. High penetration + low compa-ratio signals ranges lagging market."},
{id:"q532",m:"m5",t:"k",s:"A merit increase matrix typically combines:",o:["Age and tenure","Department and shift","Performance rating and position in range (compa-ratio/quartile) to guide increase percentages","Random numbers"],a:2,e:"Merit matrices: higher increases for strong performers low in range; smaller increases for strong performers already high in range - controlling compa-ratio distribution."},
{id:"q533",m:"m5",t:"sj",s:"A top performer at 120% compa-ratio demands a big merit increase. The budget is tight. What is the BEST approach?",o:["Use a lump-sum bonus (no base increase) plus non-cash recognition, and explain the range logic transparently","Give the increase anyway","Deny with no explanation","Promote them to justify it"],a:0,e:"Above-range base increases compound permanently. Lump sums reward performance without inflating base or worsening range position - paired with honest communication."},
