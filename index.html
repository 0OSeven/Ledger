<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; media-src 'self' blob:; connect-src 'none'; worker-src 'self'; manifest-src 'self'; form-action 'none'; base-uri 'none'; frame-ancestors 'none'">
<title>Archive</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Archive">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#12151A">
<style>
:root{
  --bg:#12151A; --surface:#1B2027; --surface2:#232A33; --line:#2E3742;
  --text:#E6EAEE; --muted:#8A96A4; --accent:#7FB6A6; --danger:#D9707A;
  --sat:env(safe-area-inset-top); --sab:env(safe-area-inset-bottom);
  --ff:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--bg)}
body{font-family:var(--ff);color:var(--text);font-size:16px;line-height:1.45;
  -webkit-user-select:none;user-select:none;overscroll-behavior:none}
button,input,select{font:inherit;color:inherit;background:none;border:none;outline:none}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.screen{position:fixed;inset:0;display:none;flex-direction:column;background:var(--bg)}
.screen.on{display:flex}

/* ---------- Lock / setup ---------- */
#lock,#setup{align-items:center;justify-content:center;padding:0 28px calc(var(--sab) + 20px)}
.mark{width:44px;height:44px;border:1.5px solid var(--line);border-radius:12px;position:relative;margin-bottom:22px}
.mark::after{content:"";position:absolute;left:50%;top:52%;transform:translate(-50%,-50%);
  width:13px;height:13px;border:1.5px solid var(--accent);border-radius:3px}
.ltitle{font-size:17px;font-weight:500;letter-spacing:.2px}
.lsub{font-size:13.5px;color:var(--muted);margin-top:6px;text-align:center;max-width:280px}
.dots{display:flex;gap:14px;margin:32px 0 26px;height:12px}
.dot{width:11px;height:11px;border-radius:50%;border:1.4px solid var(--line);transition:background .12s,border-color .12s}
.dot.f{background:var(--accent);border-color:var(--accent)}
.shake{animation:sh .38s}
@keyframes sh{15%{transform:translateX(-9px)}35%{transform:translateX(8px)}55%{transform:translateX(-6px)}75%{transform:translateX(4px)}100%{transform:translateX(0)}}
.pad{display:grid;grid-template-columns:repeat(3,78px);gap:16px;justify-content:center}
.key{height:70px;border-radius:50%;background:var(--surface);font-size:27px;font-weight:300;
  display:flex;align-items:center;justify-content:center;transition:background .1s,transform .08s}
.key:active{background:var(--surface2);transform:scale(.94)}
.key.blank{background:none}
.key.util{font-size:14px;color:var(--muted);background:none;font-weight:400}
.linkbtn{color:var(--accent);font-size:14px;padding:14px 8px;margin-top:20px}
.pwrow{display:flex;gap:10px;width:100%;max-width:330px;margin-top:26px}
.pwrow input{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:11px;
  padding:14px 15px;font-size:16px;-webkit-user-select:text;user-select:text}
.pwrow button{background:var(--accent);color:#0E1114;border-radius:11px;padding:0 20px;font-weight:600;font-size:15px}
.err{color:var(--danger);font-size:13.5px;height:18px;margin-top:14px;text-align:center}

/* ---------- Gallery ---------- */
.bar{display:flex;align-items:center;gap:6px;padding:calc(var(--sat) + 10px) 12px 10px;
  background:rgba(18,21,26,.86);backdrop-filter:blur(18px);
  border-bottom:1px solid var(--line);position:relative;z-index:4}
.bar h1{font-size:17px;font-weight:600;flex:1;padding-left:6px;letter-spacing:.1px}
.ibtn{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center}
.ibtn:active{background:var(--surface2)}
.ibtn svg{width:21px;height:21px;stroke:var(--text);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.txtbtn{font-size:15px;color:var(--accent);padding:8px 8px}

.chips{display:flex;gap:8px;padding:11px 14px;overflow-x:auto;scrollbar-width:none;
  border-bottom:1px solid var(--line);flex-shrink:0}
.chips::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;padding:6px 13px;border-radius:20px;background:var(--surface);
  font-size:13.5px;color:var(--muted);border:1px solid transparent}
.chip.on{background:var(--surface2);color:var(--text);border-color:var(--line)}
.chip.add{color:var(--accent);background:none;border:1px dashed var(--line)}

#grid{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;display:grid;
  grid-template-columns:repeat(3,1fr);gap:2px;padding:2px 2px calc(var(--sab) + 96px);align-content:start}
@media(min-width:620px){#grid{grid-template-columns:repeat(5,1fr)}}
.cell{position:relative;aspect-ratio:1;background:var(--surface);overflow:hidden}
.cell img{width:100%;height:100%;object-fit:cover;display:block}
.cell.sel img{transform:scale(.86);border-radius:8px;transition:transform .13s}
.tick{position:absolute;right:6px;bottom:6px;width:21px;height:21px;border-radius:50%;
  border:1.6px solid rgba(255,255,255,.85);background:rgba(0,0,0,.3);display:none}
.cell.selmode .tick{display:block}
.cell.sel .tick{background:var(--accent);border-color:var(--accent)}
.cell.sel .tick::after{content:"";position:absolute;left:6px;top:2.5px;width:5px;height:10px;
  border:solid #0E1114;border-width:0 2px 2px 0;transform:rotate(43deg)}

.empty{grid-column:1/-1;text-align:center;padding:88px 30px;color:var(--muted);font-size:14.5px;line-height:1.7}
.empty b{display:block;color:var(--text);font-size:16px;font-weight:500;margin-bottom:8px}

.fabs{position:fixed;right:18px;bottom:calc(var(--sab) + 20px);display:flex;flex-direction:column;gap:13px;z-index:6}
.fab{width:56px;height:56px;border-radius:50%;background:var(--accent);color:#0E1114;
  display:flex;align-items:center;justify-content:center;box-shadow:0 8px 22px rgba(0,0,0,.45)}
.fab:active{transform:scale(.93)}
.fab svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.fab.alt{background:var(--surface2);color:var(--text);border:1px solid var(--line)}

/* ---------- Sheets ---------- */
.veil{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:20;display:none}
.veil.on{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--surface);
  border-radius:20px 20px 0 0;padding:8px 0 calc(var(--sab) + 10px);transform:translateY(110%);
  transition:transform .22s cubic-bezier(.32,.72,0,1);max-height:88vh;overflow-y:auto}
.sheet.on{transform:translateY(0)}
.grab{width:36px;height:4px;background:var(--line);border-radius:2px;margin:6px auto 12px}
.sh{font-size:12.5px;color:var(--muted);padding:14px 20px 7px}
.row{display:flex;align-items:center;gap:12px;padding:14px 20px;border-top:1px solid var(--line)}
.row:active{background:var(--surface2)}
.row .g{flex:1;min-width:0}
.row .t{font-size:15.5px}
.row .d{font-size:12.5px;color:var(--muted);margin-top:2px}
.row.dz{color:var(--danger)}
.row select{background:var(--surface2);border-radius:8px;padding:7px 10px;font-size:14px}
.sw{width:46px;height:28px;border-radius:14px;background:var(--line);position:relative;flex-shrink:0;transition:background .15s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;
  background:#fff;transition:transform .15s}
.sw.on{background:var(--accent)}
.sw.on::after{transform:translateX(18px)}
.prompt{padding:20px}
.prompt input{width:100%;background:var(--surface2);border:1px solid var(--line);border-radius:11px;
  padding:13px 14px;font-size:16px;-webkit-user-select:text;user-select:text}
.prompt .btns{display:flex;gap:10px;margin-top:14px}
.prompt .btns button{flex:1;padding:13px;border-radius:11px;background:var(--surface2);font-size:15px}
.prompt .btns .go{background:var(--accent);color:#0E1114;font-weight:600}
.prompt .btns .go.dz{background:var(--danger);color:#fff}
.prompt p{font-size:13.5px;color:var(--muted);margin-bottom:14px;line-height:1.6}
.prompt h3{font-size:16.5px;margin-bottom:10px;font-weight:600}

/* ---------- Camera ---------- */
#cam{background:#000;z-index:15}
#video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000}
#video.mir{transform:scaleX(-1)}
.camtop{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;
  padding:calc(var(--sat) + 10px) 16px 0;z-index:3}
.cambot{position:absolute;left:0;right:0;bottom:0;display:flex;align-items:center;justify-content:space-between;
  padding:22px 30px calc(var(--sab) + 24px);z-index:3;background:linear-gradient(transparent,rgba(0,0,0,.5))}
.shutter{width:72px;height:72px;border-radius:50%;border:4px solid #fff;background:rgba(255,255,255,.22);transition:transform .09s,background .09s}
.shutter:active{transform:scale(.87);background:#fff}
.cside{width:50px;height:50px;border-radius:50%;background:rgba(255,255,255,.14);
  display:flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0}
.cside svg{width:22px;height:22px;stroke:#fff;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.cside img{width:100%;height:100%;object-fit:cover}
.pill{background:rgba(0,0,0,.45);border-radius:16px;padding:6px 13px;font-size:13px;color:#fff}
.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:4}
.flash.go{animation:fl .3s}
@keyframes fl{0%{opacity:.85}100%{opacity:0}}

/* ---------- Viewer ---------- */
#viewer{background:#000;z-index:18}
#slides{position:absolute;inset:0;display:flex;transition:transform .26s cubic-bezier(.32,.72,0,1);will-change:transform}
.slide{flex:0 0 100%;height:100%;display:flex;align-items:center;justify-content:center;overflow:hidden}
.slide img{max-width:100%;max-height:100%;object-fit:contain;transform-origin:center center}
.vtop,.vbot{position:absolute;left:0;right:0;z-index:3;display:flex;align-items:center;
  transition:opacity .2s;background:rgba(0,0,0,.42);backdrop-filter:blur(10px)}
.vtop{top:0;padding:calc(var(--sat) + 8px) 12px 8px;justify-content:space-between}
.vbot{bottom:0;padding:12px 26px calc(var(--sab) + 14px);justify-content:space-around}
.vhide .vtop,.vhide .vbot{opacity:0;pointer-events:none}
.vbot .ibtn svg,.vtop .ibtn svg{stroke:#fff}
.vmeta{font-size:12.5px;color:rgba(255,255,255,.75)}

/* ---------- misc ---------- */
#cover{position:fixed;inset:0;z-index:60;background:var(--bg);display:none;
  align-items:center;justify-content:center}
#cover.on{display:flex}
#toast{position:fixed;left:50%;bottom:calc(var(--sab) + 96px);transform:translate(-50%,20px);
  background:var(--surface2);border:1px solid var(--line);border-radius:11px;padding:11px 17px;
  font-size:14px;z-index:50;opacity:0;pointer-events:none;transition:all .2s;max-width:86vw;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
#busy{position:fixed;inset:0;z-index:55;background:rgba(18,21,26,.9);display:none;
  flex-direction:column;align-items:center;justify-content:center;gap:16px}
#busy.on{display:flex}
.spin{width:30px;height:30px;border:2.5px solid var(--line);border-top-color:var(--accent);
  border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
#busyTxt{font-size:14px;color:var(--muted)}
.hidden{display:none!important}
</style>
</head>
<body>

<!-- ============ SETUP ============ -->
<div class="screen" id="setup">
  <div class="mark"></div>
  <div class="ltitle" id="suTitle">Choose a passcode</div>
  <div class="lsub" id="suSub">Six digits or more. It's never stored anywhere — if you forget it, the photos can't be recovered.</div>
  <div class="dots" id="suDots"></div>
  <div class="err" id="suErr"></div>
  <div class="pad" id="suPad"></div>
  <div class="pwrow hidden" id="suPw">
    <input type="password" id="suPwIn" placeholder="Passphrase" autocomplete="new-password" autocapitalize="off" spellcheck="false">
    <button id="suPwGo">Next</button>
  </div>
  <button class="linkbtn" id="suToggle">Use a passphrase instead</button>
</div>

<!-- ============ LOCK ============ -->
<div class="screen" id="lock">
  <div class="mark"></div>
  <div class="ltitle">Enter passcode</div>
  <div class="dots" id="lkDots"></div>
  <div class="err" id="lkErr"></div>
  <div class="pad" id="lkPad"></div>
  <div class="pwrow hidden" id="lkPw">
    <input type="password" id="lkPwIn" placeholder="Passphrase" autocomplete="current-password" autocapitalize="off" spellcheck="false">
    <button id="lkPwGo">Unlock</button>
  </div>
  <button class="linkbtn" id="lkRestore">Restore from a backup file</button>
</div>

<!-- ============ GALLERY ============ -->
<div class="screen" id="app">
  <div class="bar">
    <h1 id="title">Archive</h1>
    <button class="txtbtn hidden" id="selCancel">Done</button>
    <button class="ibtn" id="btnSelect" aria-label="Select photos"><svg viewBox="0 0 24 24"><path d="M4 12l5 5L20 6"/></svg></button>
    <button class="ibtn" id="btnSettings" aria-label="Settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.6 1.6 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.6 1.6 0 00-1.8-.3 1.6 1.6 0 00-1 1.5V21a2 2 0 11-4 0v-.1A1.6 1.6 0 008 19.4a1.6 1.6 0 00-1.8.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.6 1.6 0 00.3-1.8 1.6 1.6 0 00-1.5-1H2a2 2 0 110-4h.1A1.6 1.6 0 004.6 8a1.6 1.6 0 00-.3-1.8l-.1-.1a2 2 0 112.8-2.8l.1.1a1.6 1.6 0 001.8.3H9a1.6 1.6 0 001-1.5V2a2 2 0 114 0v.1a1.6 1.6 0 001 1.5 1.6 1.6 0 001.8-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.6 1.6 0 00-.3 1.8V9a1.6 1.6 0 001.5 1H22a2 2 0 110 4h-.1a1.6 1.6 0 00-1.5 1z"/></svg></button>
    <button class="ibtn" id="btnLock" aria-label="Lock now"><svg viewBox="0 0 24 24"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 018 0v3"/></svg></button>
  </div>
  <div class="chips" id="chips"></div>
  <div id="grid"></div>
  <div class="fabs" id="fabs">
    <button class="fab alt" id="btnImport" aria-label="Add from files"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
    <button class="fab" id="btnCam" aria-label="Take a photo"><svg viewBox="0 0 24 24"><path d="M3 8.5A1.5 1.5 0 014.5 7h2.2a1 1 0 00.8-.4l1-1.3a1 1 0 01.8-.4h5.4a1 1 0 01.8.4l1 1.3a1 1 0 00.8.4h2.2A1.5 1.5 0 0121 8.5v9A1.5 1.5 0 0119.5 19h-15A1.5 1.5 0 013 17.5z"/><circle cx="12" cy="13" r="3.4"/></svg></button>
  </div>
  <div class="fabs hidden" id="selFabs" style="flex-direction:row">
    <button class="fab alt" id="btnMove" aria-label="Move to album"><svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 012-2h4l2 2h8a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2z"/></svg></button>
    <button class="fab alt" id="btnDel" style="color:var(--danger)" aria-label="Delete selected"><svg viewBox="0 0 24 24"><path d="M4 7h16M9 7V5a1 1 0 011-1h4a1 1 0 011 1v2M6 7l1 13a1 1 0 001 1h8a1 1 0 001-1l1-13"/></svg></button>
  </div>
</div>

<!-- ============ CAMERA ============ -->
<div class="screen" id="cam">
  <video id="video" playsinline autoplay muted></video>
  <div class="flash" id="flash"></div>
  <div class="camtop">
    <button class="cside" id="camClose" aria-label="Close camera"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    <div class="pill" id="camCount">0 saved</div>
    <button class="cside" id="camTorch" aria-label="Toggle light"><svg viewBox="0 0 24 24"><path d="M13 2L4.5 13H11l-1 9 8.5-11H12z"/></svg></button>
  </div>
  <div class="cambot">
    <div class="cside" id="camLast"></div>
    <button class="shutter" id="camShot" aria-label="Take photo"></button>
    <button class="cside" id="camFlip" aria-label="Switch camera"><svg viewBox="0 0 24 24"><path d="M17 3l3 3-3 3"/><path d="M20 6H8a4 4 0 00-4 4v1"/><path d="M7 21l-3-3 3-3"/><path d="M4 18h12a4 4 0 004-4v-1"/></svg></button>
  </div>
</div>

<!-- ============ VIEWER ============ -->
<div class="screen" id="viewer">
  <div id="slides"></div>
  <div class="vtop">
    <button class="ibtn" id="vClose" aria-label="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    <div class="vmeta" id="vMeta"></div>
    <div style="width:38px"></div>
  </div>
  <div class="vbot">
    <button class="ibtn" id="vMove" aria-label="Move to album"><svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 012-2h4l2 2h8a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2z"/></svg></button>
    <button class="ibtn" id="vInfo" aria-label="Details"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg></button>
    <button class="ibtn" id="vDel" aria-label="Delete"><svg viewBox="0 0 24 24" style="stroke:var(--danger)"><path d="M4 7h16M9 7V5a1 1 0 011-1h4a1 1 0 011 1v2M6 7l1 13a1 1 0 001 1h8a1 1 0 001-1l1-13"/></svg></button>
  </div>
</div>

<div id="cover"><div class="mark" style="margin:0"></div></div>
<div class="veil" id="veil"></div>
<div class="sheet" id="sheet"><div class="grab"></div><div id="sheetBody"></div></div>
<div id="toast"></div>
<div id="busy"><div class="spin"></div><div id="busyTxt">Working…</div></div>
<input type="file" id="filePick" accept="image/*" multiple class="hidden">
<input type="file" id="backupPick" accept=".vault,application/octet-stream" class="hidden">

<script>
"use strict";
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const te = new TextEncoder(), tdec = new TextDecoder();
const rnd = n => crypto.getRandomValues(new Uint8Array(n));
const uid = () => Date.now().toString(36) + '-' + [...rnd(6)].map(b => b.toString(16).padStart(2,'0')).join('');
const ITERS = 650000;

let MK = null;                 // master CryptoKey (memory only)
let MKRAW = null;              // raw key bytes, kept only while unlocked, used to rewrap on passcode change
let items = [], albums = [], curAlbum = 'all';
let settings = { autolock: 60, strip: true };
let urlCache = new Map(), selMode = false, sel = new Set();
let hiddenAt = 0, idleTimer = null;

/* ---------------- IndexedDB ---------------- */
let db;
function openDB(){
  return new Promise((res, rej) => {
    const r = indexedDB.open('archive_store', 1);
    r.onupgradeneeded = e => {
      const d = e.target.result;
      if (!d.objectStoreNames.contains('meta'))   d.createObjectStore('meta', { keyPath:'k' });
      if (!d.objectStoreNames.contains('items'))  d.createObjectStore('items', { keyPath:'id' });
      if (!d.objectStoreNames.contains('albums')) d.createObjectStore('albums', { keyPath:'id' });
    };
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
}
const req = r => new Promise((res, rej) => { r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
const store = (n, m='readonly') => db.transaction(n, m).objectStore(n);
const dbGet  = (s, k) => req(store(s).get(k));
const dbAll  = s => req(store(s).getAll());
const dbPut  = (s, v) => req(store(s, 'readwrite').put(v));
const dbDel  = (s, k) => req(store(s, 'readwrite').delete(k));
const dbClear= s => req(store(s, 'readwrite').clear());

/* ---------------- Crypto ---------------- */
async function kek(pass, salt, iters){
  const base = await crypto.subtle.importKey('raw', te.encode(pass), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name:'PBKDF2', salt, iterations:iters, hash:'SHA-256' },
    base, { name:'AES-GCM', length:256 }, false, ['encrypt','decrypt']);
}
async function enc(buf, key = MK){
  const iv = rnd(12);
  const ct = await crypto.subtle.encrypt({ name:'AES-GCM', iv }, key, buf);
  return { iv, ct };
}
const dec = (iv, ct, key = MK) =>
  crypto.subtle.decrypt({ name:'AES-GCM', iv:new Uint8Array(iv) }, key, ct);

async function createVault(pass){
  const raw = rnd(32), salt = rnd(16);
  const k = await kek(pass, salt, ITERS);
  const w = await enc(raw.buffer, k);
  await dbPut('meta', { k:'vault', salt, iters:ITERS, wiv:w.iv, wct:w.ct });
  await dbPut('meta', { k:'settings', v:settings });
  MKRAW = raw.slice(0);
  MK = await crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['encrypt','decrypt']);
}
async function unlock(pass){
  const m = await dbGet('meta', 'vault');
  const k = await kek(pass, m.salt, m.iters);
  const raw = new Uint8Array(await dec(m.wiv, m.wct, k)); // throws if the passcode is wrong
  MKRAW = raw.slice(0);
  MK = await crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['encrypt','decrypt']);
}

/* ---------------- Image helpers ---------------- */
async function toBitmap(blob){
  try { return await createImageBitmap(blob, { imageOrientation:'from-image' }); }
  catch(e){
    const url = URL.createObjectURL(blob);
    try {
      return await new Promise((res, rej) => {
        const i = new Image();
        i.onload = () => res(i); i.onerror = () => rej(new Error('decode'));
        i.src = url;
      });
    } finally { setTimeout(() => URL.revokeObjectURL(url), 4000); }
  }
}
function reencode(src, max, q){
  const w = src.width || src.naturalWidth, h = src.height || src.naturalHeight;
  const s = Math.min(1, max / Math.max(w, h));
  const c = document.createElement('canvas');
  c.width = Math.max(1, Math.round(w * s)); c.height = Math.max(1, Math.round(h * s));
  c.getContext('2d').drawImage(src, 0, 0, c.width, c.height);
  return new Promise(r => c.toBlob(r, 'image/jpeg', q));
}
async function addPhoto(blob, album){
  const bm = await toBitmap(blob);
  let full = blob, type = blob.type || 'image/jpeg';
  if (settings.strip || !/^image\/(jpeg|png|webp)$/.test(type)){
    full = await reencode(bm, 3200, 0.92); type = 'image/jpeg';
  }
  const thumb = await reencode(bm, 400, 0.72);
  const [fb, tb] = await Promise.all([full.arrayBuffer(), thumb.arrayBuffer()]);
  const a = await enc(fb), b = await enc(tb);
  const rec = { id:uid(), album:album ?? null, ts:Date.now(), type,
                w:bm.width || bm.naturalWidth, h:bm.height || bm.naturalHeight,
                size:fb.byteLength, iv:a.iv, ct:a.ct, tiv:b.iv, tct:b.ct };
  await dbPut('items', rec);
  if (bm.close) bm.close();
  items.unshift(stripHeavy(rec));
  return rec;
}
const stripHeavy = r => ({ id:r.id, album:r.album, ts:r.ts, type:r.type, w:r.w, h:r.h, size:r.size });

async function thumbURL(id){
  if (urlCache.has(id)) return urlCache.get(id);
  const r = await dbGet('items', id);
  if (!r) return null;
  const buf = await dec(r.tiv, r.tct);
  const url = URL.createObjectURL(new Blob([buf], { type:'image/jpeg' }));
  urlCache.set(id, url);
  return url;
}
async function fullURL(id){
  const key = 'F' + id;
  if (urlCache.has(key)) return urlCache.get(key);
  const r = await dbGet('items', id);
  const buf = await dec(r.iv, r.ct);
  const url = URL.createObjectURL(new Blob([buf], { type:r.type || 'image/jpeg' }));
  urlCache.set(key, url);
  trimFullCache();
  return url;
}
function trimFullCache(){
  const keep = new Set([vList[vIdx-1], vList[vIdx], vList[vIdx+1]].filter(Boolean).map(id => 'F' + id));
  const full = [...urlCache.keys()].filter(k => k[0] === 'F' && !keep.has(k));
  while (full.length > 5){
    const k = full.shift();
    URL.revokeObjectURL(urlCache.get(k));
    urlCache.delete(k);
    const i = vList.indexOf(k.slice(1));
    if (i >= 0 && $('#slides').children[i]) $('#slides').children[i].querySelector('img').removeAttribute('src');
  }
}
function purgeURLs(){ urlCache.forEach(u => URL.revokeObjectURL(u)); urlCache.clear(); }

/* ---------------- Keypad ---------------- */
function buildPad(padEl, dotsEl, onDone, minLen = 6){
  let buf = '';
  const paint = () => {
    dotsEl.innerHTML = '';
    const n = Math.max(minLen, buf.length);
    for (let i = 0; i < n; i++){
      const d = document.createElement('div');
      d.className = 'dot' + (i < buf.length ? ' f' : '');
      dotsEl.appendChild(d);
    }
  };
  const keys = ['1','2','3','4','5','6','7','8','9','del','0','go'];
  padEl.innerHTML = '';
  keys.forEach(k => {
    const b = document.createElement('button');
    if (k === 'del'){ b.className = 'key util'; b.textContent = 'Delete'; }
    else if (k === 'go'){ b.className = 'key util'; b.textContent = 'Enter'; b.style.color = 'var(--accent)'; }
    else { b.className = 'key'; b.textContent = k; }
    b.onclick = () => {
      if (k === 'del') buf = buf.slice(0, -1);
      else if (k === 'go'){ if (buf.length >= minLen) { const v = buf; buf = ''; paint(); onDone(v); } }
      else if (buf.length < 32) buf += k;
      paint();
      if (navigator.vibrate) navigator.vibrate(4);
    };
    padEl.appendChild(b);
  });
  paint();
  return { reset(){ buf = ''; paint(); } };
}
function shake(el){ el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake'); }

/* ---------------- Setup flow ---------------- */
let firstPass = null, suPad;
function setupFlow(){
  show('setup');
  const dots = $('#suDots');
  suPad = buildPad($('#suPad'), dots, v => handleNew(v));
  $('#suPwGo').onclick = () => { const v = $('#suPwIn').value; if (v.length >= 8) { $('#suPwIn').value=''; handleNew(v);} else $('#suErr').textContent = 'Use at least 8 characters.'; };
  $('#suToggle').onclick = () => {
    const usingPad = !$('#suPad').classList.contains('hidden');
    $('#suPad').classList.toggle('hidden', usingPad);
    dots.classList.toggle('hidden', usingPad);
    $('#suPw').classList.toggle('hidden', !usingPad);
    $('#suToggle').textContent = usingPad ? 'Use a numeric passcode instead' : 'Use a passphrase instead';
    firstPass = null; $('#suTitle').textContent = usingPad ? 'Choose a passphrase' : 'Choose a passcode';
    $('#suErr').textContent = '';
  };
}
async function handleNew(v){
  $('#suErr').textContent = '';
  if (firstPass === null){
    firstPass = v;
    $('#suTitle').textContent = 'Enter it again';
    $('#suSub').textContent = 'Confirming you typed what you meant to.';
    return;
  }
  if (v !== firstPass){
    firstPass = null; shake($('#setup'));
    $('#suErr').textContent = "Those didn't match. Start again.";
    $('#suTitle').textContent = 'Choose a passcode';
    return;
  }
  busy(true, 'Creating your vault…');
  await createVault(v);
  firstPass = null;
  busy(false);
  await loadAll();
  enterApp();
}

/* ---------------- Lock flow ---------------- */
let lkPad;
function lockFlow(){
  show('lock');
  $('#lkErr').textContent = '';
  lkPad = buildPad($('#lkPad'), $('#lkDots'), tryUnlock);
  $('#lkPwGo').onclick = () => { const v = $('#lkPwIn').value; $('#lkPwIn').value = ''; tryUnlock(v); };
  $('#lkPwIn').onkeydown = e => { if (e.key === 'Enter') $('#lkPwGo').click(); };
}
async function tryUnlock(v){
  busy(true, 'Unlocking…');
  try {
    await unlock(v);
    busy(false);
    await loadAll();
    enterApp();
  } catch(e){
    busy(false);
    shake($('#lock'));
    $('#lkErr').textContent = 'Wrong passcode.';
    if (navigator.vibrate) navigator.vibrate([12,40,12]);
    // keypad mode: also allow passphrase entry if the vault used one
    if ($('#lkPad').classList.contains('hidden')) return;
    $('#lkPw').classList.remove('hidden');
  }
}
function lockNow(){
  if (MKRAW) MKRAW.fill(0);
  MK = null; MKRAW = null; items = []; albums = []; sel.clear(); selMode = false;
  purgeURLs(); stopCam(); closeSheet();
  $('#grid').innerHTML = '';
  lockFlow();
}

/* ---------------- Load & render ---------------- */
async function loadAll(){
  const s = await dbGet('meta', 'settings');
  if (s && s.v) settings = Object.assign(settings, s.v);
  const raw = await dbAll('items');
  items = raw.map(stripHeavy).sort((a,b) => b.ts - a.ts);
  const al = await dbAll('albums');
  albums = [];
  for (const a of al){
    try { albums.push({ id:a.id, name:tdec.decode(await dec(a.iv, a.ct)) }); } catch(e){}
  }
  albums.sort((a,b) => a.name.localeCompare(b.name));
}
function enterApp(){ show('app'); renderChips(); renderGrid(); armIdle(); requestPersist(); }

function renderChips(){
  const c = $('#chips'); c.innerHTML = '';
  const mk = (id, label) => {
    const b = document.createElement('button');
    b.className = 'chip' + (curAlbum === id ? ' on' : '');
    b.textContent = label;
    b.onclick = () => { curAlbum = id; renderChips(); renderGrid(); };
    if (id !== 'all' && id !== 'none'){
      let t; b.addEventListener('touchstart', () => { t = setTimeout(() => albumMenu(id), 550); }, {passive:true});
      b.addEventListener('touchend', () => clearTimeout(t));
      b.oncontextmenu = e => { e.preventDefault(); albumMenu(id); };
    }
    c.appendChild(b);
  };
  mk('all', 'All');
  albums.forEach(a => mk(a.id, a.name));
  if (items.some(i => !i.album)) mk('none', 'Unsorted');
  const add = document.createElement('button');
  add.className = 'chip add'; add.textContent = '+ Album';
  add.onclick = newAlbum; c.appendChild(add);
}

let io = new IntersectionObserver(async es => {
  for (const e of es){
    if (!e.isIntersecting) continue;
    io.unobserve(e.target);
    const id = e.target.dataset.id;
    try {
      const u = await thumbURL(id);
      if (u) e.target.querySelector('img').src = u;
    } catch(err){}
  }
}, { rootMargin:'400px' });

function visible(){
  if (curAlbum === 'all')  return items;
  if (curAlbum === 'none') return items.filter(i => !i.album);
  return items.filter(i => i.album === curAlbum);
}
function renderGrid(){
  const g = $('#grid'); g.innerHTML = '';
  const list = visible();
  $('#title').textContent = curAlbum === 'all' ? 'Archive'
    : (curAlbum === 'none' ? 'Unsorted' : (albums.find(a => a.id === curAlbum)?.name || 'Archive'));
  if (!list.length){
    g.innerHTML = '<div class="empty"><b>Nothing here yet</b>Tap the camera to take a photo, or the plus to bring one in from your files.</div>';
    return;
  }
  list.forEach(it => {
    const d = document.createElement('div');
    d.className = 'cell' + (selMode ? ' selmode' : '') + (sel.has(it.id) ? ' sel' : '');
    d.dataset.id = it.id;
    d.innerHTML = '<img alt="" decoding="async"><div class="tick"></div>';
    d.onclick = () => selMode ? toggleSel(it.id, d) : openViewer(it.id);
    let t;
    d.addEventListener('touchstart', () => { t = setTimeout(() => { if (!selMode){ selMode = true; renderSelUI(); toggleSel(it.id, d); } }, 500); }, {passive:true});
    d.addEventListener('touchend', () => clearTimeout(t));
    d.addEventListener('touchmove', () => clearTimeout(t), {passive:true});
    g.appendChild(d);
    io.observe(d);
  });
}
function toggleSel(id, el){
  sel.has(id) ? sel.delete(id) : sel.add(id);
  el.classList.toggle('sel', sel.has(id));
  $('#title').textContent = sel.size ? sel.size + ' selected' : 'Select photos';
}
function renderSelUI(){
  $$('.cell').forEach(c => c.classList.toggle('selmode', selMode));
  $('#selCancel').classList.toggle('hidden', !selMode);
  $('#btnSelect').classList.toggle('hidden', selMode);
  $('#fabs').classList.toggle('hidden', selMode);
  $('#selFabs').classList.toggle('hidden', !selMode);
  if (!selMode){ sel.clear(); $$('.cell').forEach(c => c.classList.remove('sel')); renderGrid(); }
  else $('#title').textContent = 'Select photos';
}
$('#btnSelect').onclick = () => { selMode = true; renderSelUI(); };
$('#selCancel').onclick = () => { selMode = false; renderSelUI(); };
$('#btnLock').onclick = lockNow;

/* ---------------- Albums ---------------- */
async function saveAlbum(name){
  const e = await enc(te.encode(name));
  const rec = { id:uid(), iv:e.iv, ct:e.ct };
  await dbPut('albums', rec);
  albums.push({ id:rec.id, name });
  albums.sort((a,b) => a.name.localeCompare(b.name));
  return rec.id;
}
function newAlbum(){
  askText('New album', 'Name it something you\'ll recognise.', '', async v => {
    if (!v.trim()) return;
    await saveAlbum(v.trim()); renderChips(); toast('Album created');
  });
}
function albumMenu(id){
  const a = albums.find(x => x.id === id); if (!a) return;
  openSheet(`<div class="sh">${escapeHtml(a.name)}</div>
    <button class="row" id="arn"><div class="g"><div class="t">Rename album</div></div></button>
    <button class="row dz" id="adl"><div class="g"><div class="t">Delete album</div><div class="d">Photos move to Unsorted, nothing is deleted</div></div></button>`);
  $('#arn').onclick = () => { closeSheet(); askText('Rename album', '', a.name, async v => {
    if (!v.trim()) return;
    const e = await enc(te.encode(v.trim()));
    await dbPut('albums', { id, iv:e.iv, ct:e.ct });
    a.name = v.trim(); albums.sort((x,y) => x.name.localeCompare(y.name)); renderChips(); renderGrid();
  }); };
  $('#adl').onclick = async () => {
    closeSheet();
    for (const it of items.filter(i => i.album === id)){
      const r = await dbGet('items', it.id); r.album = null; await dbPut('items', r); it.album = null;
    }
    await dbDel('albums', id);
    albums = albums.filter(x => x.id !== id);
    if (curAlbum === id) curAlbum = 'all';
    renderChips(); renderGrid(); toast('Album deleted');
  };
}
function moveSheet(ids){
  const rows = albums.map(a => `<button class="row mv" data-a="${a.id}"><div class="g"><div class="t">${escapeHtml(a.name)}</div></div></button>`).join('');
  openSheet(`<div class="sh">Move ${ids.length} photo${ids.length>1?'s':''} to</div>
    <button class="row mv" data-a=""><div class="g"><div class="t">Unsorted</div></div></button>
    ${rows}
    <button class="row" id="mvNew"><div class="g"><div class="t" style="color:var(--accent)">New album…</div></div></button>`);
  $$('.mv').forEach(b => b.onclick = async () => { await doMove(ids, b.dataset.a || null); closeSheet(); });
  $('#mvNew').onclick = () => { closeSheet(); askText('New album', '', '', async v => {
    if (!v.trim()) return; const id = await saveAlbum(v.trim()); await doMove(ids, id);
  }); };
}
async function doMove(ids, album){
  for (const id of ids){
    const r = await dbGet('items', id); r.album = album; await dbPut('items', r);
    const it = items.find(i => i.id === id); if (it) it.album = album;
  }
  selMode = false; renderSelUI(); renderChips(); renderGrid(); toast('Moved');
}
$('#btnMove').onclick = () => { if (sel.size) moveSheet([...sel]); };
$('#btnDel').onclick  = () => { if (sel.size) confirmDelete([...sel]); };

function confirmDelete(ids){
  askConfirm('Delete ' + ids.length + ' photo' + (ids.length>1?'s':'') + '?',
    'This is permanent. There is no recently-deleted folder.', 'Delete', true, async () => {
    for (const id of ids){
      await dbDel('items', id);
      const u = urlCache.get(id); if (u) URL.revokeObjectURL(u);
      const f = urlCache.get('F'+id); if (f) URL.revokeObjectURL(f);
      urlCache.delete(id); urlCache.delete('F'+id);
    }
    items = items.filter(i => !ids.includes(i.id));
    selMode = false; renderSelUI(); renderGrid(); toast('Deleted');
  });
}

/* ---------------- Camera ---------------- */
let stream = null, facing = 'environment', shotCount = 0;
$('#btnCam').onclick = startCam;
$('#camClose').onclick = () => { stopCam(); show('app'); renderGrid(); };
$('#camFlip').onclick = () => { facing = facing === 'environment' ? 'user' : 'environment'; startCam(true); };
$('#camShot').onclick = capture;
$('#camTorch').onclick = toggleTorch;

async function startCam(keepScreen){
  if (!keepScreen){ shotCount = 0; $('#camCount').textContent = '0 saved'; $('#camLast').innerHTML = ''; }
  show('cam');
  stopStream();
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode:{ ideal:facing }, width:{ ideal:4032 }, height:{ ideal:3024 } }, audio:false });
  } catch(err){
    try { stream = await navigator.mediaDevices.getUserMedia({ video:true, audio:false }); }
    catch(e2){ show('app'); toast('Camera unavailable. Check the site\'s camera permission.'); return; }
  }
  const v = $('#video');
  v.srcObject = stream;
  v.classList.toggle('mir', facing === 'user');
  const track = stream.getVideoTracks()[0];
  const caps = track.getCapabilities ? track.getCapabilities() : {};
  $('#camTorch').style.display = caps.torch ? 'flex' : 'none';
  try { await v.play(); } catch(e){}
}
function stopStream(){ if (stream){ stream.getTracks().forEach(t => t.stop()); stream = null; } }
function stopCam(){ stopStream(); const v = $('#video'); if (v) v.srcObject = null; }

async function toggleTorch(){
  const t = stream && stream.getVideoTracks()[0]; if (!t) return;
  const on = !(t._torch);
  try { await t.applyConstraints({ advanced:[{ torch:on }] }); t._torch = on;
        $('#camTorch').style.background = on ? 'rgba(255,255,255,.45)' : 'rgba(255,255,255,.14)'; }
  catch(e){ toast('This camera has no light control.'); }
}
async function capture(){
  const v = $('#video'); if (!v.videoWidth) return;
  $('#flash').classList.remove('go'); void $('#flash').offsetWidth; $('#flash').classList.add('go');
  if (navigator.vibrate) navigator.vibrate(8);
  const c = document.createElement('canvas');
  c.width = v.videoWidth; c.height = v.videoHeight;
  const ctx = c.getContext('2d');
  if (facing === 'user'){ ctx.translate(c.width, 0); ctx.scale(-1, 1); }
  ctx.drawImage(v, 0, 0, c.width, c.height);
  const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', 0.92));
  try {
    await addPhoto(blob, curAlbum === 'all' || curAlbum === 'none' ? null : curAlbum);
    shotCount++;
    $('#camCount').textContent = shotCount + ' saved';
    const u = await thumbURL(items[0].id);
    $('#camLast').innerHTML = '<img alt="">';
    $('#camLast').firstChild.src = u;
  } catch(e){ toast('Could not save that shot.'); }
}

/* ---------------- Viewer ---------------- */
let vList = [], vIdx = 0;
async function openViewer(id){
  vList = visible().map(i => i.id);
  vIdx = vList.indexOf(id);
  show('viewer');
  $('#viewer').classList.remove('vhide');
  $('#slides').innerHTML = vList.map(() => '<div class="slide"><img alt=""></div>').join('');
  place(false);
  await paintSlide(vIdx); paintMeta();
  paintSlide(vIdx+1); paintSlide(vIdx-1);
}
function place(anim){
  const s = $('#slides');
  s.style.transition = anim ? '' : 'none';
  s.style.transform = 'translateX(' + (-vIdx * 100) + '%)';
  if (!anim) requestAnimationFrame(() => s.style.transition = '');
}
async function paintSlide(i){
  if (i < 0 || i >= vList.length) return;
  const img = $('#slides').children[i].querySelector('img');
  if (img.src) return;
  try { img.src = await fullURL(vList[i]); } catch(e){}
}
function paintMeta(){
  const it = items.find(i => i.id === vList[vIdx]); if (!it) return;
  const d = new Date(it.ts);
  $('#vMeta').textContent = d.toLocaleDateString(undefined, { day:'numeric', month:'short', year:'numeric' })
    + ' · ' + d.toLocaleTimeString(undefined, { hour:'numeric', minute:'2-digit' })
    + '  (' + (vIdx+1) + '/' + vList.length + ')';
}
function goTo(i){
  if (i < 0 || i >= vList.length) { place(true); return; }
  vIdx = i; place(true); paintMeta();
  paintSlide(i); paintSlide(i+1); paintSlide(i-1);
}
(function viewerGestures(){
  const el = $('#viewer'); let x0 = 0, y0 = 0, dx = 0, drag = false, moved = false, t0 = 0;
  el.addEventListener('touchstart', e => {
    if (e.touches.length !== 1) { drag = false; return; }
    x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; dx = 0; drag = true; moved = false; t0 = Date.now();
    $('#slides').style.transition = 'none';
  }, {passive:true});
  el.addEventListener('touchmove', e => {
    if (!drag || e.touches.length !== 1) return;
    dx = e.touches[0].clientX - x0;
    const dy = e.touches[0].clientY - y0;
    if (Math.abs(dx) > 8 || Math.abs(dy) > 8) moved = true;
    if (Math.abs(dy) > Math.abs(dx) * 1.6) return;
    $('#slides').style.transform = 'translateX(calc(' + (-vIdx * 100) + '% + ' + dx + 'px))';
  }, {passive:true});
  el.addEventListener('touchend', e => {
    if (!drag) return; drag = false;
    $('#slides').style.transition = '';
    const quick = Date.now() - t0 < 260 && Math.abs(dx) > 40;
    if (dx < -70 || (quick && dx < 0)) goTo(vIdx + 1);
    else if (dx > 70 || (quick && dx > 0)) goTo(vIdx - 1);
    else { place(true); if (!moved) $('#viewer').classList.toggle('vhide'); }
  });
  document.addEventListener('keydown', e => {
    if (!$('#viewer').classList.contains('on')) return;
    if (e.key === 'ArrowRight') goTo(vIdx + 1);
    if (e.key === 'ArrowLeft')  goTo(vIdx - 1);
    if (e.key === 'Escape') $('#vClose').click();
  });
})();
$('#vClose').onclick = () => { show('app'); renderGrid(); };
$('#vDel').onclick = () => confirmDelete([vList[vIdx]]);
$('#vMove').onclick = () => moveSheet([vList[vIdx]]);
$('#vInfo').onclick = () => {
  const it = items.find(i => i.id === vList[vIdx]); if (!it) return;

    <div class="row"><div class="g"><div class="t">${it.w} × ${it.h}</div><div class="d">Dimensions</div></div></div>
    <div class="row"><div class="g"><div class="t">${fmtBytes(it.size)}</div><div class="d">Encrypted size</div></div></div>
    <div class="row"><div class="g"><div class="t">${new Date(it.ts).toLocaleString()}</div><div class="d">Added</div></div></div>
    <div class="row"><div class="g"><div class="t">${escapeHtml(al)}</div><div class="d">Album</div></div></div>`);
};

/* ---------------- Settings ---------------- */
$('#btnSettings').onclick = async () => {
  const est = navigator.storage && navigator.storage.estimate ? await navigator.storage.estimate() : {};
  const used = est.usage ? fmtBytes(est.usage) : '—';
  const quota = est.quota ? fmtBytes(est.quota) : '—';
  const persisted = navigator.storage && navigator.storage.persisted ? await navigator.storage.persisted() : false;
  openSheet(`
    <div class="sh">Security</div>
    <div class="row"><div class="g"><div class="t">Lock when I leave the app</div><div class="d">Re-ask for the passcode after this long</div></div>
      <select id="setAL">
        <option value="0">Immediately</option><option value="60">1 minute</option>
        <option value="300">5 minutes</option><option value="900">15 minutes</option></select></div>
    <button class="row" id="setStrip"><div class="g"><div class="t">Remove location data on import</div><div class="d">Re-saves imported photos without GPS or device tags</div></div>
      <div class="sw ${settings.strip?'on':''}"></div></button>
    <button class="row" id="setPass"><div class="g"><div class="t">Change passcode</div><div class="d">Instant — your photos aren't re-encrypted</div></div></button>

    <div class="sh">Your data</div>
    <button class="row" id="setExport"><div class="g"><div class="t">Save an encrypted backup</div><div class="d">${items.length} photo${items.length===1?'':'s'} · stays encrypted in the file</div></div></button>
    <button class="row" id="setImport"><div class="g"><div class="t">Restore from a backup</div><div class="d">Replaces everything currently in the vault</div></div></button>
    <button class="row" id="setVerify"><div class="g"><div class="t">Check every photo opens</div><div class="d">Decrypts all of them and reports any damage</div></div></button>
    <div class="row"><div class="g"><div class="t">${used} used of ${quota}</div><div class="d">${persisted ? 'Storage marked as persistent' : 'Storage not yet marked persistent'}</div></div></div>

    <div class="sh">Danger</div>
    <button class="row dz" id="setWipe"><div class="g"><div class="t">Erase this vault</div><div class="d">Deletes every photo and the key. Unrecoverable.</div></div></button>
    <div class="row"><div class="g"><div class="d">Nothing in this app is sent anywhere. It has no network permission at all.</div></div></div>`);

  $('#setAL').value = String(settings.autolock);
  $('#setAL').onchange = e => saveSettings({ autolock:+e.target.value });
  $('#setStrip').onclick = e => { settings.strip = !settings.strip;
    $('#setStrip .sw').classList.toggle('on', settings.strip); saveSettings({}); };
  $('#setPass').onclick   = () => { closeSheet(); changePass(); };
  $('#setExport').onclick = () => { closeSheet(); exportBackup(); };
  $('#setImport').onclick = () => { closeSheet(); $('#backupPick').click(); };
  $('#setVerify').onclick = () => { closeSheet(); verifyAll(); };
  $('#setWipe').onclick   = () => { closeSheet(); wipeVault(); };
};
async function saveSettings(p){ Object.assign(settings, p); await dbPut('meta', { k:'settings', v:settings }); }

function changePass(){
  askText('New passcode', 'Six digits or more, or a longer passphrase. Your photos stay as they are — only the key wrapping changes.', '', async v => {
    if (!v || v.length < 6) { toast('Too short.'); return; }
    askText('Type it once more', '', '', async v2 => {
      if (v !== v2) { toast("Those didn't match."); return; }
      busy(true, 'Rewrapping the key…');
      const m = await dbGet('meta', 'vault');
      const rawKey = await crypto.subtle.exportKey('raw', await reExportable());
      const salt = rnd(16), k = await kek(v, salt, ITERS);
      const w = await enc(rawKey, k);
      await dbPut('meta', { k:'vault', salt, iters:ITERS, wiv:w.iv, wct:w.ct });
      busy(false); toast('Passcode changed');
    }, true);
  }, true);
}
// MK itself is non-extractable; rewrapping uses the raw copy held only while unlocked.
async function reExportable(){
  if (!MKRAW) throw new Error('locked');
  return crypto.subtle.importKey('raw', MKRAW, 'AES-GCM', true, ['encrypt','decrypt']);
}

/* ---------------- Backup ---------------- */
const b64 = buf => { const u = new Uint8Array(buf); let s = '';
  for (let i = 0; i < u.length; i += 8192) s += String.fromCharCode.apply(null, u.subarray(i, i+8192));
  return btoa(s); };
const unb64 = s => { const bin = atob(s), u = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return u; };

async function exportBackup(){
  busy(true, 'Building backup…');
  const meta = await dbGet('meta', 'vault');
  const rawItems = await dbAll('items');
  const rawAlbums = await dbAll('albums');
  const head = { v:1, made:Date.now(),
    salt:b64(meta.salt), iters:meta.iters, wiv:b64(meta.wiv), wct:b64(meta.wct),
    albums: rawAlbums.map(a => ({ id:a.id, iv:b64(a.iv), ct:b64(a.ct) })),
    items: rawItems.map(r => ({ id:r.id, album:r.album, ts:r.ts, type:r.type, w:r.w, h:r.h, size:r.size,
      iv:b64(r.iv), tiv:b64(r.tiv), len:r.ct.byteLength, tlen:r.tct.byteLength })) };
  const hb = te.encode(JSON.stringify(head));
  const lead = new Uint8Array(8);
  lead.set(te.encode('PVLT'), 0);
  new DataView(lead.buffer).setUint32(4, hb.byteLength, false);
  const parts = [lead, hb];
  for (const r of rawItems){ parts.push(r.ct, r.tct); }
  const blob = new Blob(parts, { type:'application/octet-stream' });
  busy(false);
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'archive-' + new Date().toISOString().slice(0,10) + '.vault';
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 8000);
  toast('Backup saved. It needs your passcode to open.');
}
$('#backupPick').onchange = async e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  askConfirm('Restore this backup?', 'Everything currently in the vault is replaced, and afterwards you unlock with the passcode that backup was made with.', 'Restore', true,
    () => doRestore(f));
};
$('#lkRestore').onclick = () => $('#backupPick').click();

async function doRestore(f){
  busy(true, 'Reading backup…');
  try {
    const lead = new Uint8Array(await f.slice(0, 8).arrayBuffer());
    if (tdec.decode(lead.subarray(0,4)) !== 'PVLT') throw new Error('Not a backup file');
    const hlen = new DataView(lead.buffer).getUint32(4, false);
    const head = JSON.parse(tdec.decode(await f.slice(8, 8 + hlen).arrayBuffer()));
    await dbClear('items'); await dbClear('albums');
    await dbPut('meta', { k:'vault', salt:unb64(head.salt), iters:head.iters,
                          wiv:unb64(head.wiv), wct:unb64(head.wct) });
    for (const a of head.albums) await dbPut('albums', { id:a.id, iv:unb64(a.iv), ct:unb64(a.ct) });
    let off = 8 + hlen, n = 0;
    for (const it of head.items){
      busy(true, 'Restoring ' + (++n) + ' of ' + head.items.length + '…');
      const ct  = await f.slice(off, off + it.len).arrayBuffer(); off += it.len;
      const tct = await f.slice(off, off + it.tlen).arrayBuffer(); off += it.tlen;
      await dbPut('items', { id:it.id, album:it.album, ts:it.ts, type:it.type, w:it.w, h:it.h, size:it.size,
                             iv:unb64(it.iv), ct, tiv:unb64(it.tiv), tct });
    }
    busy(false);
    MK = null; MKRAW = null; purgeURLs();
    toast('Restored. Unlock with that backup\'s passcode.');
    lockFlow();
  } catch(err){
    busy(false); toast('That file could not be read: ' + err.message);
  }
}
async function verifyAll(){
  const all = await dbAll('items');
  let bad = 0, n = 0;
  for (const r of all){
    busy(true, 'Checking ' + (++n) + ' of ' + all.length + '…');
    try { await dec(r.iv, r.ct); } catch(e){ bad++; }
  }
  busy(false);
  toast(bad ? bad + ' photo' + (bad>1?'s':'') + ' could not be decrypted.' : 'All ' + all.length + ' photos open fine.');
}
function wipeVault(){
  askText('Erase everything', 'Type ERASE to confirm. Every photo, the album list and the key are deleted. A backup file you already saved is not affected.', '', async v => {
    if (v !== 'ERASE'){ toast('Not erased.'); return; }
    busy(true, 'Erasing…');
    await dbClear('items'); await dbClear('albums'); await dbClear('meta');
    purgeURLs(); MK = null; MKRAW = null; items = []; albums = [];
    busy(false); toast('Vault erased'); setupFlow();
  });
}

/* ---------------- Prompts ---------------- */
function askText(title, note, val, cb, isPass){
  openSheet(`<div class="prompt"><h3>${escapeHtml(title)}</h3>${note ? '<p>'+escapeHtml(note)+'</p>' : ''}
    <input id="pIn" type="${isPass?'password':'text'}" value="${escapeHtml(val||'')}" autocapitalize="off" spellcheck="false" autocomplete="off">
    <div class="btns"><button id="pNo">Cancel</button><button class="go" id="pYes">Save</button></div></div>`);
  setTimeout(() => $('#pIn').focus(), 120);
  $('#pNo').onclick = closeSheet;
  $('#pYes').onclick = () => { const v = $('#pIn').value; closeSheet(); cb(v); };
  $('#pIn').onkeydown = e => { if (e.key === 'Enter') $('#pYes').click(); };
}
function askConfirm(title, note, label, danger, cb){
  openSheet(`<div class="prompt"><h3>${escapeHtml(title)}</h3><p>${escapeHtml(note)}</p>
    <div class="btns"><button id="cNo">Cancel</button><button class="go ${danger?'dz':''}" id="cYes">${escapeHtml(label)}</button></div></div>`);
  $('#cNo').onclick = closeSheet;
  $('#cYes').onclick = () => { closeSheet(); cb(); };
}
const escapeHtml = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function fmtBytes(b){ if (!b) return '0 B'; const u = ['B','KB','MB','GB','TB'];
  const i = Math.floor(Math.log(b)/Math.log(1024)); return (b/Math.pow(1024,i)).toFixed(i?1:0) + ' ' + u[i]; }

/* ---------------- Auto-lock ---------------- */
function armIdle(){
  clearTimeout(idleTimer);
  if (!MK || settings.autolock === 0) return;
  idleTimer = setTimeout(() => { if (MK) lockNow(); }, settings.autolock * 1000);
}
['touchstart','click','keydown'].forEach(ev =>
  document.addEventListener(ev, () => { if (MK) armIdle(); }, { passive:true, capture:true }));

document.addEventListener('visibilitychange', () => {
  if (document.hidden){
    hiddenAt = Date.now();
    if (MK) $('#cover').classList.add('on');   // blank the app-switcher preview
    stopStream();
  } else {
    $('#cover').classList.remove('on');
    if (MK){
      const gone = (Date.now() - hiddenAt) / 1000;
      if (settings.autolock === 0 || gone > settings.autolock) lockNow();
      else { armIdle(); if ($('#cam').classList.contains('on')) startCam(true); }
    }
  }
});
window.addEventListener('pagehide', () => { if (MK) $('#cover').classList.add('on'); });

async function requestPersist(){
  try { if (navigator.storage && navigator.storage.persist && !(await navigator.storage.persisted()))
    await navigator.storage.persist(); } catch(e){}
}

/* ---------------- Boot ---------------- */
(async function boot(){
  if (!crypto.subtle){
    document.body.innerHTML = '<div style="padding:60px 26px;color:#8A96A4;font-family:sans-serif">' +
      'This app needs a secure connection. Open it over https:// and it will work.</div>';
    return;
  }
  db = await openDB();
  const v = await dbGet('meta', 'vault');
  v ? lockFlow() : setupFlow();
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
