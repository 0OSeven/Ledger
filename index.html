<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; media-src 'self' blob:; connect-src 'none'; worker-src 'self'; manifest-src 'self'; form-action 'none'; base-uri 'none'; frame-ancestors 'none'">
<title>Archive</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Archive">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0F1216">
<style>
:root{
  --bg:#0F1216; --raised:#181D24; --raised2:#212832; --line:#2A323D; --line2:#333C48;
  --text:#F0F3F6; --dim:#98A3B2; --faint:#6B7683;
  --accent:#7FB6A6; --danger:#FF6B6B;
  --sat:env(safe-area-inset-top); --sab:env(safe-area-inset-bottom);
  --ease:cubic-bezier(.32,.72,0,1);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--bg)}
body{color:var(--text);font-size:16px;line-height:1.4;-webkit-user-select:none;user-select:none;
  overscroll-behavior:none;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
  -webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit;background:none;border:none;outline:none;
  -webkit-appearance:none;appearance:none}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

.screen{position:fixed;inset:0;display:none;flex-direction:column;background:var(--bg)}
.screen.on{display:flex}
.hidden{display:none!important}

/* ═════ Lock & setup ═════ */
#lock,#setup{align-items:center;justify-content:center;padding:0 26px calc(var(--sab) + 16px)}
.mark{width:46px;height:46px;border:1.5px solid var(--line2);border-radius:13px;position:relative;margin-bottom:20px}
.mark::after{content:"";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:14px;height:14px;border:1.5px solid var(--accent);border-radius:3px}
.ltitle{font-size:17px;font-weight:590;letter-spacing:-.2px}
.lsub{font-size:13.5px;color:var(--dim);margin-top:7px;text-align:center;max-width:288px;line-height:1.5}
.dots{display:flex;gap:15px;margin:30px 0 22px;height:12px;align-items:center}
.ddot{width:11px;height:11px;border-radius:50%;border:1.4px solid var(--line2);
  transition:background .13s,border-color .13s,transform .13s}
.ddot.f{background:var(--accent);border-color:var(--accent);transform:scale(1.08)}
.shake{animation:sh .4s}
@keyframes sh{12%{transform:translateX(-10px)}30%{transform:translateX(9px)}50%{transform:translateX(-6px)}70%{transform:translateX(4px)}100%{transform:translateX(0)}}
.pad{display:grid;grid-template-columns:repeat(3,76px);gap:18px;justify-content:center}
.key{height:68px;border-radius:50%;background:var(--raised);font-size:27px;font-weight:300;
  display:flex;align-items:center;justify-content:center;transition:background .09s,transform .09s;width:100%}
.key:active{background:var(--raised2);transform:scale(.93)}
.key.util{font-size:14.5px;background:none;font-weight:400;color:var(--dim)}
.key.util.go{color:var(--accent);font-weight:590}
.linkbtn{color:var(--accent);font-size:14.5px;padding:16px 10px;margin-top:16px}
.pwrow{display:flex;gap:10px;width:100%;max-width:340px;margin-top:24px}
.pwrow input{flex:1;background:var(--raised);border:1px solid var(--line);border-radius:12px;
  padding:14px 15px;font-size:16px;-webkit-user-select:text;user-select:text}
.pwrow button{background:var(--accent);color:#0B0E11;border-radius:12px;padding:0 20px;font-weight:640;font-size:15px}
.err{color:var(--danger);font-size:13.5px;height:19px;margin-top:14px;text-align:center}

/* ═════ Nav ═════ */
.nav{padding:calc(var(--sat) + 6px) 6px 0;background:rgba(15,18,22,.8);
  -webkit-backdrop-filter:saturate(180%) blur(22px);backdrop-filter:saturate(180%) blur(22px);
  border-bottom:.5px solid transparent;transition:border-color .2s;position:relative;z-index:5;flex-shrink:0}
.nav.stuck{border-bottom-color:var(--line)}
.navrow{display:flex;align-items:center;gap:2px;min-height:44px;position:relative}
.navrow .spacer{flex:1}
.navtitle{font-size:17px;font-weight:640;letter-spacing:-.35px;
  position:absolute;left:50%;transform:translateX(-50%);opacity:0;transition:opacity .2s;
  pointer-events:none;white-space:nowrap}
.nav.stuck .navtitle{opacity:1}
.bigtitle{font-size:33px;font-weight:700;letter-spacing:-.9px;padding:2px 14px 10px;
  transition:opacity .18s,transform .18s;transform-origin:left center}
.nav.stuck .bigtitle{opacity:0;transform:scale(.6) translateY(-14px);height:0;padding:0 14px;overflow:hidden}
.ico{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  transition:background .12s;flex-shrink:0}
.ico:active{background:var(--raised2)}
.ico svg{width:22px;height:22px;stroke:var(--text);fill:none;stroke-width:1.75;
  stroke-linecap:round;stroke-linejoin:round}
.tbtn{font-size:16px;color:var(--accent);padding:10px 12px}
.tbtn.strong{font-weight:640}

/* ═════ Chips ═════ */
.chips{display:flex;gap:8px;padding:2px 14px 12px;overflow-x:auto;scrollbar-width:none;flex-shrink:0}
.chips::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;padding:7px 14px;border-radius:19px;background:var(--raised);
  font-size:14px;color:var(--dim);transition:background .12s,color .12s,transform .1s;flex-shrink:0}
.chip:active{transform:scale(.96)}
.chip.on{background:var(--accent);color:#0B0E11;font-weight:590}
.chip.add{color:var(--faint);background:none;box-shadow:inset 0 0 0 1px var(--line)}

/* ═════ Grid ═════ */
#grid{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;display:grid;
  grid-template-columns:repeat(3,1fr);gap:3px;padding:0 3px calc(var(--sab) + 110px);align-content:start}
@media(min-width:600px){#grid{grid-template-columns:repeat(5,1fr)}}
@media(min-width:900px){#grid{grid-template-columns:repeat(7,1fr)}}
.mhead{grid-column:1/-1;position:sticky;top:0;z-index:2;padding:16px 11px 8px;
  font-size:15.5px;font-weight:640;letter-spacing:-.3px;
  background:linear-gradient(var(--bg) 62%,rgba(15,18,22,0))}
.cell{position:relative;aspect-ratio:1;background:var(--raised);overflow:hidden;
  transition:opacity .2s,transform .2s}
.cell img{width:100%;height:100%;object-fit:cover;display:block;opacity:0;
  transition:opacity .22s,transform .18s var(--ease)}
.cell img.in{opacity:1}
.cell:active img{transform:scale(.96)}
.cell.gone{opacity:0;transform:scale(.8)}
.cell .tick{position:absolute;right:5px;bottom:5px;width:22px;height:22px;border-radius:50%;
  border:1.5px solid rgba(255,255,255,.9);background:rgba(0,0,0,.25);
  box-shadow:0 1px 3px rgba(0,0,0,.4);opacity:0;transform:scale(.6);
  transition:opacity .15s,transform .15s,background .15s}
.selmode .cell .tick{opacity:1;transform:scale(1)}
.selmode .cell.sel img{transform:scale(.86)}
.cell.sel .tick{background:var(--accent);border-color:var(--accent)}
.cell.sel .tick::after{content:"";position:absolute;left:7px;top:3.5px;width:5px;height:10px;
  border:solid #0B0E11;border-width:0 2.2px 2.2px 0;transform:rotate(43deg)}
.empty{grid-column:1/-1;text-align:center;padding:96px 34px;color:var(--dim);font-size:14.5px;line-height:1.65}
.empty b{display:block;color:var(--text);font-size:17px;font-weight:590;margin-bottom:9px;letter-spacing:-.3px}

/* ═════ Floating controls ═════ */
.fabs{position:fixed;right:16px;bottom:calc(var(--sab) + 18px);display:flex;flex-direction:column;
  gap:12px;z-index:6}
.fab{width:56px;height:56px;border-radius:50%;background:var(--accent);color:#0B0E11;
  display:flex;align-items:center;justify-content:center;box-shadow:0 6px 20px rgba(0,0,0,.5);
  transition:transform .1s}
.fab:active{transform:scale(.92)}
.fab svg{width:25px;height:25px;stroke:currentColor;fill:none;stroke-width:1.85;stroke-linecap:round;stroke-linejoin:round}
.fab.alt{background:var(--raised2);color:var(--text);box-shadow:0 6px 18px rgba(0,0,0,.45)}
.toolbar{position:fixed;left:0;right:0;bottom:0;z-index:7;display:flex;justify-content:space-around;
  align-items:center;padding:10px 16px calc(var(--sab) + 10px);
  background:rgba(15,18,22,.85);-webkit-backdrop-filter:blur(22px);backdrop-filter:blur(22px);
  border-top:.5px solid var(--line);transform:translateY(110%);transition:transform .28s var(--ease)}
.toolbar.on{transform:translateY(0)}
.tool{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 16px;
  font-size:11px;color:var(--accent);border-radius:10px}
.tool:disabled{opacity:.32}
.tool svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.tool.dz{color:var(--danger)}

/* ═════ Sheets ═════ */
.veil{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:30;opacity:0;pointer-events:none;
  transition:opacity .25s}
.veil.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:31;background:var(--bg);
  border-radius:14px 14px 0 0;transform:translateY(101%);transition:transform .34s var(--ease);
  max-height:92vh;display:flex;flex-direction:column;box-shadow:0 -.5px 0 var(--line)}
.sheet.on{transform:translateY(0)}
.grab{width:36px;height:5px;background:var(--line2);border-radius:3px;margin:8px auto 0;flex-shrink:0}
.shead{display:flex;align-items:center;padding:8px 6px 4px;flex-shrink:0}
.shead .t{flex:1;text-align:center;font-size:17px;font-weight:640;letter-spacing:-.35px}
.shead .side{min-width:66px}
.sbody{overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:calc(var(--sab) + 24px)}

/* grouped inset list */
.gsec{margin:24px 16px 0}
.gsec:first-child{margin-top:14px}
.ghead{font-size:13px;color:var(--dim);padding:0 4px 7px}
.gfoot{font-size:12.5px;color:var(--faint);padding:8px 4px 0;line-height:1.5}
.group{background:var(--raised);border-radius:12px;overflow:hidden}
.cellrow{display:flex;align-items:center;gap:12px;padding:12px 15px;min-height:50px;
  width:100%;text-align:left;position:relative;transition:background .1s}
.cellrow + .cellrow::before{content:"";position:absolute;left:15px;right:0;top:0;height:.5px;background:var(--line)}
button.cellrow:active{background:var(--raised2)}
.cellrow .g{flex:1;min-width:0}
.cellrow .t{font-size:16px;letter-spacing:-.2px}
.cellrow .d{font-size:12.5px;color:var(--dim);margin-top:2px;line-height:1.4}
.cellrow .v{font-size:15.5px;color:var(--dim);flex-shrink:0;font-variant-numeric:tabular-nums}
.cellrow.dz .t{color:var(--danger)}
.chev{width:8px;height:8px;border:solid var(--faint);border-width:0 1.8px 1.8px 0;
  transform:rotate(-45deg);flex-shrink:0;margin-left:2px}
.check{width:15px;height:9px;border:solid var(--accent);border-width:0 0 2px 2px;
  transform:rotate(-45deg);flex-shrink:0;margin-bottom:4px;opacity:0;transition:opacity .12s}
.cellrow.picked .check{opacity:1}
.sw{width:50px;height:30px;border-radius:15px;background:var(--line2);position:relative;flex-shrink:0;
  transition:background .2s}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:26px;height:26px;border-radius:50%;
  background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .22s var(--ease)}
.sw.on{background:var(--accent)}
.sw.on::after{transform:translateX(20px)}

/* action sheet + prompt */
.acts{padding:6px 10px calc(var(--sab) + 10px)}
.actgrp{background:var(--raised);border-radius:14px;overflow:hidden;margin-bottom:9px}
.act{width:100%;padding:16px;font-size:18px;text-align:center;color:var(--accent);position:relative}
.act + .act::before,.acttitle + .act::before{content:"";position:absolute;left:0;right:0;top:0;height:.5px;background:var(--line)}
.act:active{background:var(--raised2)}
.act.dz{color:var(--danger)}
.act.strong{font-weight:640}
.acttitle{padding:16px 20px 14px;text-align:center;font-size:13.5px;color:var(--dim);line-height:1.5}
.prompt{padding:4px 20px 20px}
.prompt h3{font-size:19px;font-weight:640;letter-spacing:-.4px;margin-bottom:8px;text-align:center}
.prompt p{font-size:13.5px;color:var(--dim);margin-bottom:16px;line-height:1.5;text-align:center}
.prompt input{width:100%;background:var(--raised);border:1px solid var(--line);border-radius:11px;
  padding:14px;font-size:16px;-webkit-user-select:text;user-select:text;margin-bottom:12px}
.prompt .btns{display:flex;gap:10px}
.prompt .btns button{flex:1;padding:14px;border-radius:12px;background:var(--raised);font-size:16px}
.prompt .btns .go{background:var(--accent);color:#0B0E11;font-weight:640}

/* ═════ Camera ═════ */
#cam{background:#000;z-index:15}
#video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000}
#video.mir{transform:scaleX(-1)}
.camtop{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;
  align-items:center;padding:calc(var(--sat) + 10px) 16px 0;z-index:3}
.cambot{position:absolute;left:0;right:0;bottom:0;display:flex;align-items:center;
  justify-content:space-between;padding:24px 32px calc(var(--sab) + 26px);z-index:3;
  background:linear-gradient(transparent,rgba(0,0,0,.55))}
.shutter{width:74px;height:74px;border-radius:50%;border:4px solid #fff;background:rgba(255,255,255,.2);
  transition:transform .08s,background .08s}
.shutter:active{transform:scale(.86);background:#fff}
.cside{width:52px;height:52px;border-radius:50%;background:rgba(255,255,255,.13);
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  display:flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0;
  transition:transform .1s}
.cside:active{transform:scale(.93)}
.cside svg{width:23px;height:23px;stroke:#fff;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.cside img{width:100%;height:100%;object-fit:cover}
.cside.lit{background:#fff}
.cside.lit svg{stroke:#000;fill:#000}
.pill{background:rgba(0,0,0,.42);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  border-radius:15px;padding:6px 14px;font-size:13px;color:#fff;font-variant-numeric:tabular-nums}
.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:4}
.flash.go{animation:fl .28s}
@keyframes fl{0%{opacity:.9}100%{opacity:0}}

/* ═════ Viewer ═════ */
#viewer{background:transparent;z-index:20}
#vbg{position:absolute;inset:0;background:#000}
#slides{position:absolute;inset:0;display:flex;will-change:transform}
.slide{flex:0 0 100%;height:100%;position:relative;overflow:hidden}
.zoom{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;will-change:transform}
.zoom img{max-width:100%;max-height:100%;object-fit:contain;display:block}
.zoom img.ph{position:absolute;filter:blur(8px);transform:scale(1.03)}
.vtop,.vbot{position:absolute;left:0;right:0;z-index:3;display:flex;align-items:center;
  transition:opacity .25s;background:rgba(0,0,0,.4);
  -webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px)}
.vtop{top:0;padding:calc(var(--sat) + 4px) 8px 6px;justify-content:space-between}
.vbot{bottom:0;padding:8px 22px calc(var(--sab) + 8px);justify-content:space-around}
.vhide .vtop,.vhide .vbot{opacity:0;pointer-events:none}
.vtop .ico svg,.vbot .ico svg{stroke:#fff}
.vmeta{font-size:12.5px;color:rgba(255,255,255,.82);text-align:center;line-height:1.35;
  font-variant-numeric:tabular-nums}
.vmeta span{display:block;font-size:11px;color:rgba(255,255,255,.5);margin-top:1px}
.vbot .ico{width:54px;height:44px;border-radius:11px}

/* ═════ misc ═════ */
#cover{position:fixed;inset:0;z-index:70;background:var(--bg);display:none;
  align-items:center;justify-content:center}
#cover.on{display:flex}
#toast{position:fixed;left:50%;bottom:calc(var(--sab) + 104px);transform:translate(-50%,16px) scale(.96);
  background:rgba(40,47,57,.95);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);
  border-radius:14px;padding:12px 18px;font-size:14.5px;z-index:60;opacity:0;pointer-events:none;
  transition:all .26s var(--ease);max-width:84vw;text-align:center;line-height:1.4;
  box-shadow:0 8px 28px rgba(0,0,0,.5)}
#toast.on{opacity:1;transform:translate(-50%,0) scale(1)}
#busy{position:fixed;inset:0;z-index:65;background:rgba(15,18,22,.93);
  -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
  display:none;flex-direction:column;align-items:center;justify-content:center;gap:18px}
#busy.on{display:flex}
.spin{width:32px;height:32px;border:2.5px solid var(--line2);border-top-color:var(--accent);
  border-radius:50%;animation:sp .75s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
#busyTxt{font-size:14.5px;color:var(--dim);font-variant-numeric:tabular-nums}
</style>
</head>
<body>

<!-- ══════ SETUP ══════ -->
<div class="screen" id="setup">
  <div class="mark"></div>
  <div class="ltitle" id="suTitle">Choose a passcode</div>
  <div class="lsub" id="suSub">Six digits or more. It is never stored anywhere, so if you forget it the photos cannot be recovered.</div>
  <div class="dots" id="suDots"></div>
  <div class="err" id="suErr"></div>
  <div class="pad" id="suPad"></div>
  <div class="pwrow hidden" id="suPw">
    <input type="password" id="suPwIn" placeholder="Passphrase" autocomplete="new-password" autocapitalize="off" spellcheck="false">
    <button id="suPwGo">Next</button>
  </div>
  <button class="linkbtn" id="suToggle">Use a passphrase instead</button>
</div>

<!-- ══════ LOCK ══════ -->
<div class="screen" id="lock">
  <div class="mark"></div>
  <div class="ltitle">Enter passcode</div>
  <div class="dots" id="lkDots"></div>
  <div class="err" id="lkErr"></div>
  <div class="pad" id="lkPad"></div>
  <div class="pwrow hidden" id="lkPw">
    <input type="password" id="lkPwIn" placeholder="Passphrase" autocomplete="current-password" autocapitalize="off" spellcheck="false">
    <button id="lkPwGo">Unlock</button>
  </div>
  <button class="linkbtn" id="lkRestore">Restore from a backup file</button>
</div>

<!-- ══════ LIBRARY ══════ -->
<div class="screen" id="app">
  <div class="nav" id="nav">
    <div class="navrow">
      <button class="tbtn hidden" id="selCancel">Cancel</button>
      <div class="spacer"></div>
      <div class="navtitle" id="navTitle">Archive</div>
      <button class="ico" id="btnSelect" aria-label="Select"><svg viewBox="0 0 24 24"><path d="M9 11.5l3 3L22 4.5"/><path d="M21 12.5V19a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg></button>
      <button class="ico" id="btnSettings" aria-label="Settings"><svg viewBox="0 0 24 24"><path d="M4 6.5h10M18.8 6.5H20M4 12h2.7M11.5 12H20M4 17.5h10M18.8 17.5H20"/><circle cx="16.2" cy="6.5" r="2.2"/><circle cx="9" cy="12" r="2.2"/><circle cx="16.2" cy="17.5" r="2.2"/></svg></button>
      <button class="ico" id="btnLock" aria-label="Lock now"><svg viewBox="0 0 24 24"><rect x="4" y="10.5" width="16" height="10.5" rx="2.4"/><path d="M8 10.5V7a4 4 0 018 0v3.5"/></svg></button>
    </div>
    <div class="bigtitle" id="bigTitle">Archive</div>
    <div class="chips" id="chips"></div>
  </div>
  <div id="grid"></div>
  <div class="fabs" id="fabs">
    <button class="fab alt" id="btnImport" aria-label="Add from files"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
    <button class="fab" id="btnCam" aria-label="Take a photo"><svg viewBox="0 0 24 24"><path d="M3 8.6A1.6 1.6 0 014.6 7h2.1a1 1 0 00.83-.45l1-1.5A1 1 0 019.36 4.6h5.28a1 1 0 01.83.45l1 1.5a1 1 0 00.83.45h2.1A1.6 1.6 0 0121 8.6v8.8a1.6 1.6 0 01-1.6 1.6H4.6A1.6 1.6 0 013 17.4z"/><circle cx="12" cy="13" r="3.5"/></svg></button>
  </div>
  <div class="toolbar" id="selBar">

<script>
"use strict";
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const te = new TextEncoder(), tdec = new TextDecoder();
const rnd = n => crypto.getRandomValues(new Uint8Array(n));
const uid = () => Date.now().toString(36) + '-' + [...rnd(6)].map(b => b.toString(16).padStart(2,'0')).join('');
const ITERS = 650000;
const tap = ms => { try { if (navigator.vibrate) navigator.vibrate(ms); } catch(e){} };

let MK = null, MKRAW = null;
let items = [], albums = [], curAlbum = 'all';
let settings = { autolock: 60, strip: true };
let urlCache = new Map(), selMode = false, sel = new Set();
let hiddenAt = 0, idleTimer = null;

/* ══════ IndexedDB ══════ */
let db;
function openDB(){
  return new Promise((res, rej) => {
    const r = indexedDB.open('archive_store', 1);
    r.onupgradeneeded = e => {
      const d = e.target.result;
      if (!d.objectStoreNames.contains('meta'))   d.createObjectStore('meta', { keyPath:'k' });
      if (!d.objectStoreNames.contains('items'))  d.createObjectStore('items', { keyPath:'id' });
      if (!d.objectStoreNames.contains('albums')) d.createObjectStore('albums', { keyPath:'id' });
    };
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
}
const req = r => new Promise((res, rej) => { r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
const store = (n, m='readonly') => db.transaction(n, m).objectStore(n);
const dbGet   = (s, k) => req(store(s).get(k));
const dbAll   = s => req(store(s).getAll());
const dbPut   = (s, v) => req(store(s, 'readwrite').put(v));
const dbDel   = (s, k) => req(store(s, 'readwrite').delete(k));
const dbClear = s => req(store(s, 'readwrite').clear());

/* ══════ Crypto ══════ */
async function kek(pass, salt, iters){
  const base = await crypto.subtle.importKey('raw', te.encode(pass), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name:'PBKDF2', salt, iterations:iters, hash:'SHA-256' },
    base, { name:'AES-GCM', length:256 }, false, ['encrypt','decrypt']);
}
async function enc(buf, key = MK){
  const iv = rnd(12);
  return { iv, ct: await crypto.subtle.encrypt({ name:'AES-GCM', iv }, key, buf) };
}
const dec = (iv, ct, key = MK) =>
  crypto.subtle.decrypt({ name:'AES-GCM', iv:new Uint8Array(iv) }, key, ct);

async function createVault(pass){
  const raw = rnd(32), salt = rnd(16);
  const w = await enc(raw.buffer, await kek(pass, salt, ITERS));
  await dbPut('meta', { k:'vault', salt, iters:ITERS, wiv:w.iv, wct:w.ct });
  await dbPut('meta', { k:'settings', v:settings });
  MKRAW = raw.slice(0);
  MK = await crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['encrypt','decrypt']);
}
async function unlockVault(pass){
  const m = await dbGet('meta', 'vault');
  const raw = new Uint8Array(await dec(m.wiv, m.wct, await kek(pass, m.salt, m.iters)));
  MKRAW = raw.slice(0);
  MK = await crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['encrypt','decrypt']);
}

/* ══════ Images ══════ */
async function toBitmap(blob){
  try { return await createImageBitmap(blob, { imageOrientation:'from-image' }); }
  catch(e){
    const url = URL.createObjectURL(blob);
    try {
      return await new Promise((res, rej) => {
        const i = new Image();
        i.onload = () => res(i); i.onerror = () => rej(new Error('decode'));
        i.src = url;
      });
    } finally { setTimeout(() => URL.revokeObjectURL(url), 4000); }
  }
}
function reencode(src, max, q){
  const w = src.width || src.naturalWidth, h = src.height || src.naturalHeight;
  const s = Math.min(1, max / Math.max(w, h));
  const c = document.createElement('canvas');
  c.width = Math.max(1, Math.round(w * s)); c.height = Math.max(1, Math.round(h * s));
  c.getContext('2d').drawImage(src, 0, 0, c.width, c.height);
  return new Promise(r => c.toBlob(r, 'image/jpeg', q));
}
const light = r => ({ id:r.id, album:r.album, ts:r.ts, type:r.type, w:r.w, h:r.h, size:r.size });

async function addPhoto(blob, album){
  const bm = await toBitmap(blob);
  let full = blob, type = blob.type || 'image/jpeg';
  if (settings.strip || !/^image\/(jpeg|png|webp)$/.test(type)){
    full = await reencode(bm, 3200, 0.92); type = 'image/jpeg';
  }
  const thumb = await reencode(bm, 400, 0.72);
  const [fb, tb] = await Promise.all([full.arrayBuffer(), thumb.arrayBuffer()]);
  const a = await enc(fb), b = await enc(tb);
  const rec = { id:uid(), album:album ?? null, ts:Date.now(), type,
                w:bm.width || bm.naturalWidth, h:bm.height || bm.naturalHeight,
                size:fb.byteLength, iv:a.iv, ct:a.ct, tiv:b.iv, tct:b.ct };
  await dbPut('items', rec);
  if (bm.close) bm.close();
  items.unshift(light(rec));
  return rec;
}
async function thumbURL(id){
  if (urlCache.has(id)) return urlCache.get(id);
  const r = await dbGet('items', id); if (!r) return null;
  const url = URL.createObjectURL(new Blob([await dec(r.tiv, r.tct)], { type:'image/jpeg' }));
  urlCache.set(id, url);
  return url;
}
async function fullURL(id){
  const key = 'F' + id;
  if (urlCache.has(key)) return urlCache.get(key);
  const r = await dbGet('items', id); if (!r) return null;
  const url = URL.createObjectURL(new Blob([await dec(r.iv, r.ct)], { type:r.type || 'image/jpeg' }));
  urlCache.set(key, url);
  trimFull();
  return url;
}
function trimFull(){
  const keep = new Set([V.list[V.i-1], V.list[V.i], V.list[V.i+1]].filter(Boolean).map(x => 'F' + x));
  const full = [...urlCache.keys()].filter(k => k[0] === 'F' && !keep.has(k));
  while (full.length > 5){
    const k = full.shift();
    URL.revokeObjectURL(urlCache.get(k));
    urlCache.delete(k);
  }
}
function dropURLs(id){
  ['', 'F'].forEach(p => { const u = urlCache.get(p + id);
    if (u){ URL.revokeObjectURL(u); urlCache.delete(p + id); } });
}
function purgeURLs(){ urlCache.forEach(u => URL.revokeObjectURL(u)); urlCache.clear(); }

/* ══════ Chrome ══════ */
const show = id => { $$('.screen').forEach(s => s.classList.remove('on')); $('#'+id).classList.add('on'); };
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove('on'), 2600); }
function busy(on, txt='Working…'){ $('#busyTxt').textContent = txt; $('#busy').classList.toggle('on', on); }

function openSheet(body, head){
  $('#sheetHead').innerHTML = head || '';
  $('#sheetBody').innerHTML = body;
  $('#sheetBody').scrollTop = 0;
  $('#veil').classList.add('on'); $('#sheet').classList.add('on');
}
function closeSheet(){ $('#veil').classList.remove('on'); $('#sheet').classList.remove('on'); }
$('#veil').onclick = closeSheet;
const later = fn => setTimeout(fn, 190);

function actionSheet(title, actions){
  const rows = actions.map((a,i) =>
    `<button class="act ${a.dz?'dz':''} ${a.strong?'strong':''}" data-i="${i}">${esc(a.label)}</button>`).join('');
  openSheet(`<div class="acts">
      <div class="actgrp">${title ? `<div class="acttitle">${esc(title)}</div>` : ''}${rows}</div>
      <div class="actgrp"><button class="act strong" id="actCancel">Cancel</button></div>
    </div>`);
  $$('#sheetBody .act[data-i]').forEach(b => b.onclick = () => {
    closeSheet(); later(() => actions[+b.dataset.i].fn());
  });
  $('#actCancel').onclick = closeSheet;
}
function askText(title, note, val, cb, isPass){
  openSheet(`<div class="prompt"><h3>${esc(title)}</h3>${note ? `<p>${esc(note)}</p>` : ''}
    <input id="pIn" type="${isPass?'password':'text'}" value="${esc(val||'')}" autocapitalize="off" spellcheck="false" autocomplete="off">
    <div class="btns"><button id="pNo">Cancel</button><button class="go" id="pYes">Save</button></div></div>`);
  setTimeout(() => { const i = $('#pIn'); if (i) i.focus(); }, 220);
  $('#pNo').onclick = closeSheet;
  $('#pYes').onclick = () => { const v = $('#pIn').value; closeSheet(); later(() => cb(v)); };
  $('#pIn').onkeydown = e => { if (e.key === 'Enter') $('#pYes').click(); };
}
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function fmtBytes(b){ if (!b) return '0 B'; const u = ['B','KB','MB','GB','TB'];
  const i = Math.min(u.length-1, Math.floor(Math.log(b)/Math.log(1024)));
  return (b/Math.pow(1024,i)).toFixed(i?1:0) + ' ' + u[i]; }

/* ══════ Keypad ══════ */
function buildPad(padEl, dotsEl, onDone, minLen = 6){
  let buf = '';
  const paint = () => {
    dotsEl.innerHTML = '';
    for (let i = 0, n = Math.max(minLen, buf.length); i < n; i++){
      const d = document.createElement('div');
      d.className = 'ddot' + (i < buf.length ? ' f' : '');
      dotsEl.appendChild(d);
    }
  };
  padEl.innerHTML = '';
  ['1','2','3','4','5','6','7','8','9','del','0','go'].forEach(k => {
    const b = document.createElement('button');
    if (k === 'del'){ b.className = 'key util'; b.textContent = 'Delete'; }
    else if (k === 'go'){ b.className = 'key util go'; b.textContent = 'Enter'; }
    else { b.className = 'key'; b.textContent = k; }
    b.onclick = () => {
      if (k === 'del') buf = buf.slice(0, -1);
      else if (k === 'go'){ if (buf.length >= minLen){ const v = buf; buf = ''; paint(); onDone(v); return; } }
      else if (buf.length < 32) buf += k;
      paint(); tap(4);
    };
    padEl.appendChild(b);
  });
  paint();
}
function shake(el){ el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake'); }

/* ══════ Setup ══════ */
let firstPass = null;
function setupFlow(){
  show('setup');
  firstPass = null;
  $('#suTitle').textContent = 'Choose a passcode';
  buildPad($('#suPad'), $('#suDots'), handleNew);
  $('#suPwGo').onclick = () => {
    const v = $('#suPwIn').value;
    if (v.length >= 8){ $('#suPwIn').value = ''; handleNew(v); }
    else $('#suErr').textContent = 'Use at least 8 characters.';
  };
  $('#suToggle').onclick = () => {
    const usingPad = !$('#suPad').classList.contains('hidden');
    $('#suPad').classList.toggle('hidden', usingPad);
    $('#suDots').classList.toggle('hidden', usingPad);
    $('#suPw').classList.toggle('hidden', !usingPad);
    $('#suToggle').textContent = usingPad ? 'Use a numeric passcode instead' : 'Use a passphrase instead';
    firstPass = null; $('#suErr').textContent = '';
    $('#suTitle').textContent = usingPad ? 'Choose a passphrase' : 'Choose a passcode';
  };
}
async function handleNew(v){
  $('#suErr').textContent = '';
  if (firstPass === null){
    firstPass = v;
    $('#suTitle').textContent = 'Enter it again';
    $('#suSub').textContent = 'Just confirming you typed what you meant to.';
    return;
  }
  if (v !== firstPass){
    firstPass = null; shake($('#setup')); tap([12,40,12]);
    $('#suErr').textContent = "Those didn't match. Start again.";
    $('#suTitle').textContent = 'Choose a passcode';
    return;
  }
  busy(true, 'Creating your vault…');
  await createVault(v);
  firstPass = null; busy(false);
  await loadAll(); enterApp();
}

/* ══════ Lock ══════ */
function lockFlow(){
  show('lock');
  $('#lkErr').textContent = '';
  buildPad($('#lkPad'), $('#lkDots'), tryUnlock);
  $('#lkPwGo').onclick = () => { const v = $('#lkPwIn').value; $('#lkPwIn').value = ''; tryUnlock(v); };
  $('#lkPwIn').onkeydown = e => { if (e.key === 'Enter') $('#lkPwGo').click(); };
}
async function tryUnlock(v){
  busy(true, 'Unlocking…');
  try {
    await unlockVault(v); busy(false);
    await loadAll(); enterApp();
  } catch(e){
    busy(false); shake($('#lock')); tap([12,40,12]);
    $('#lkErr').textContent = 'Wrong passcode.';
    $('#lkPw').classList.remove('hidden');
  }
}
function lockNow(){
  if (MKRAW) MKRAW.fill(0);
  MK = null; MKRAW = null; items = []; albums = []; sel.clear(); selMode = false;
  purgeURLs(); stopCam(); closeSheet();
  V.list = []; $('#slides').innerHTML = '';
  document.body.classList.remove('selmode');
  $('#grid').innerHTML = ''; $('#selBar').classList.remove('on');
  lockFlow();
}
$('#btnLock').onclick = lockNow;

/* ══════ Load ══════ */
async function loadAll(){
  const s = await dbGet('meta', 'settings');
  if (s && s.v) settings = Object.assign(settings, s.v);
  items = (await dbAll('items')).map(light).sort((a,b) => b.ts - a.ts);
  albums = [];
  for (const a of await dbAll('albums')){
    try { albums.push({ id:a.id, name:tdec.decode(await dec(a.iv, a.ct)) }); } catch(e){}
  }
  albums.sort((a,b) => a.name.localeCompare(b.name));
}
function enterApp(){ show('app'); renderChips(); renderGrid(); armIdle(); requestPersist(); }

/* ══════ Library ══════ */
function visible(){
  if (curAlbum === 'all')  return items;
  if (curAlbum === 'none') return items.filter(i => !i.album);
  return items.filter(i => i.album === curAlbum);
}
const albumName = id => (albums.find(a => a.id === id) || {}).name;
const scopeName = () =>
  curAlbum === 'all' ? 'Archive' : curAlbum === 'none' ? 'Unsorted' : (albumName(curAlbum) || 'Archive');

function longPress(el, fn){
  let t, moved;
  el.addEventListener('touchstart', () => { moved = false;
    t = setTimeout(() => { if (!moved){ tap(14); fn(); } }, 470); }, { passive:true });
  el.addEventListener('touchmove', () => { moved = true; clearTimeout(t); }, { passive:true });
  el.addEventListener('touchend', () => clearTimeout(t));
  el.addEventListener('touchcancel', () => clearTimeout(t));
  el.addEventListener('contextmenu', e => { e.preventDefault(); fn(); });
}
function renderChips(){
  const c = $('#chips'); c.innerHTML = '';
  const mk = (id, label, extra) => {
    const b = document.createElement('button');
    b.className = 'chip' + (curAlbum === id ? ' on' : '') + (extra || '');
    b.textContent = label;
    b.onclick = () => { curAlbum = id; tap(4); renderChips(); renderGrid(); $('#grid').scrollTop = 0; };
    c.appendChild(b);
    return b;
  };
  mk('all', 'All');
  albums.forEach(a => longPress(mk(a.id, a.name), () => albumMenu(a.id)));
  if (items.some(i => !i.album)) mk('none', 'Unsorted');
  mk('__add', 'New album', ' add').onclick = newAlbum;
}

const io = new IntersectionObserver(async es => {
  for (const e of es){
    if (!e.isIntersecting) continue;
    io.unobserve(e.target);
    try {
      const u = await thumbURL(e.target.dataset.id);
      const img = e.target.querySelector('img');
      if (u && img){ img.onload = () => img.classList.add('in'); img.src = u; }
    } catch(err){}
  }
}, { root:null, rootMargin:'500px 0px' });

const monthLabel = ts => {
  const d = new Date(ts), n = new Date();
  return d.toLocaleDateString(undefined,
    { month:'long', year: d.getFullYear() === n.getFullYear() ? undefined : 'numeric' });
};
function renderGrid(){
  const g = $('#grid'); g.innerHTML = '';
  const list = visible();
  $('#navTitle').textContent = $('#bigTitle').textContent = selMode
    ? (sel.size ? sel.size + ' selected' : 'Select photos') : scopeName();
  if (!list.length){
    g.innerHTML = `<div class="empty"><b>Nothing here yet</b>
      Tap the camera to take a photo straight into the vault, or the plus to bring one in from your files.</div>`;
    return;
  }
  let last = null;
  const frag = document.createDocumentFragment();
  list.forEach(it => {
    const key = monthLabel(it.ts);
    if (key !== last){
      const h = document.createElement('div');
      h.className = 'mhead'; h.textContent = key;
      frag.appendChild(h); last = key;
    }
    const d = document.createElement('div');
    d.className = 'cell' + (sel.has(it.id) ? ' sel' : '');
    d.dataset.id = it.id;
    d.innerHTML = '<img alt="" decoding="async"><div class="tick"></div>';
    d.onclick = () => selMode ? toggleSel(it.id, d) : openViewer(it.id);
    longPress(d, () => {
      if (selMode) return;
      selMode = true; paintSelUI(); toggleSel(it.id, d);
    });
    frag.appendChild(d);
    io.observe(d);
  });
  g.appendChild(frag);
}
$('#grid').addEventListener('scroll', () => {
  $('#nav').classList.toggle('stuck', $('#grid').scrollTop > 6);
}, { passive:true });

function toggleSel(id, el){
  sel.has(id) ? sel.delete(id) : sel.add(id);
  el.classList.toggle('sel', sel.has(id));
  tap(4); paintSelCount();
}
function paintSelCount(){
  const n = sel.size;
  $('#navTitle').textContent = $('#bigTitle').textContent = n ? `${n} selected` : 'Select photos';
  $('#btnMove').disabled = $('#btnDel').disabled = !n;
}
function paintSelUI(){
  document.body.classList.toggle('selmode', selMode);
  $('#selCancel').classList.toggle('hidden', !selMode);
  $('#btnSelect').classList.toggle('hidden', selMode);
  $('#btnSettings').classList.toggle('hidden', selMode);
  $('#btnLock').classList.toggle('hidden', selMode);
  $('#fabs').classList.toggle('hidden', selMode);
  $('#selBar').classList.toggle('on', selMode);
  if (selMode) paintSelCount();
  else {
    sel.clear();
    $$('.cell').forEach(c => c.classList.remove('sel'));
    $('#navTitle').textContent = $('#bigTitle').textContent = scopeName();
  }
}
$('#btnSelect').onclick = () => { selMode = true; paintSelUI(); };
$('#selCancel').onclick = () => { selMode = false; paintSelUI(); };
$('#btnSelAll').onclick = () => {
  const list = visible();
  if (sel.size === list.length) sel.clear(); else list.forEach(i => sel.add(i.id));
  $$('.cell').forEach(c => c.classList.toggle('sel', sel.has(c.dataset.id)));
  tap(6); paintSelCount();
};
$('#btnMove').onclick = () => { if (sel.size) moveSheet([...sel]); };
$('#btnDel').onclick  = () => { if (sel.size) confirmDelete([...sel]); };

/* ══════ Albums ══════ */
async function saveAlbum(name){
  const e = await enc(te.encode(name));
  const rec = { id:uid(), iv:e.iv, ct:e.ct };
  await dbPut('albums', rec);
  albums.push({ id:rec.id, name });
  albums.sort((a,b) => a.name.localeCompare(b.name));
  return rec.id;
}
function newAlbum(){

  actionSheet(name, [

async function doMove(ids, album){

async function startCam(keep){
  if (!keep){ shotCount = 0; $('#camCount').textContent = '0 saved'; $('#camLast').innerHTML = ''; }
  show('cam'); stopStream();
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video:{ facingMode:{ ideal:facing }, width:{ ideal:4032 }, height:{ ideal:3024 } }, audio:false });
  } catch(err){
    try { stream = await navigator.mediaDevices.getUserMedia({ video:true, audio:false }); }
    catch(e2){ show('app'); toast('Camera unavailable. Check this site\u2019s camera permission.'); return; }
  }
  const v = $('#video');
  v.srcObject = stream;
  v.classList.toggle('mir', facing === 'user');
  const t = stream.getVideoTracks()[0];
  const caps = t.getCapabilities ? t.getCapabilities() : {};
  $('#camTorch').style.visibility = caps.torch ? 'visible' : 'hidden';
  $('#camTorch').classList.remove('lit');
  try { await v.play(); } catch(e){}
}
function stopStream(){ if (stream){ stream.getTracks().forEach(t => t.stop()); stream = null; } }
function stopCam(){ stopStream(); const v = $('#video'); if (v) v.srcObject = null; }
async function toggleTorch(){
  const t = stream && stream.getVideoTracks()[0]; if (!t) return;
  const on = !t._torch;
  try { await t.applyConstraints({ advanced:[{ torch:on }] }); t._torch = on;
        $('#camTorch').classList.toggle('lit', on); }
  catch(e){ toast('This camera has no light control.'); }
}
async function capture(){
  const v = $('#video'); if (!v.videoWidth) return;
  const f = $('#flash'); f.classList.remove('go'); void f.offsetWidth; f.classList.add('go');
  tap(9);
  const c = document.createElement('canvas');
  c.width = v.videoWidth; c.height = v.videoHeight;
  const ctx = c.getContext('2d');
  if (facing === 'user'){ ctx.translate(c.width, 0); ctx.scale(-1, 1); }
  ctx.drawImage(v, 0, 0, c.width, c.height);
  const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', 0.92));
  try {
    const dest = (curAlbum === 'all' || curAlbum === 'none') ? null : curAlbum;
    await addPhoto(blob, dest);
    $('#camCount').textContent = ++shotCount + ' saved';
    const u = await thumbURL(items[0].id);
    $('#camLast').innerHTML = '<img alt="">';
    if (u) $('#camLast').firstChild.src = u;
  } catch(e){ toast('Could not save that shot.'); }
}

/* ══════ Viewer ══════
   One paged strip. Each slide has its own zoom transform. Horizontal drag pages,
   vertical drag at scale 1 dismisses, pinch and double-tap zoom, and panning
   takes over from paging once zoomed in.
   ═══════════════════ */
const V = { list:[], i:0, scale:1, x:0, y:0, fit:{ w:0, h:0 } };

function openViewer(id){
  V.list = visible().map(i => i.id);
  V.i = Math.max(0, V.list.indexOf(id));
  show('viewer');
  $('#viewer').classList.remove('vhide');
  $('#vbg').style.opacity = '1';
  buildSlides();
}
function closeViewer(){
  $('#slides').innerHTML = '';
  $('#slides').style.transform = '';
  V.list = []; V.scale = 1; V.x = 0; V.y = 0;
  show('app'); renderChips(); renderGrid();
}
$('#vClose').onclick = closeViewer;

function buildSlides(){
  $('#slides').innerHTML = V.list.map(() => '<div class="slide"><div class="zoom"></div></div>').join('');
  snapPage(false);
  resetZoom(false);
  paintMeta();
  [V.i, V.i+1, V.i-1].forEach(loadSlide);
}
async function loadSlide(i){
  if (i < 0 || i >= V.list.length) return;
  const slide = $('#slides').children[i];
  if (!slide) return;
  const z = slide.querySelector('.zoom');
  if (!z || z.dataset.done) return;
  z.dataset.done = '1';
  const id = V.list[i];
  try {
    const t = await thumbURL(id);
    if (t){ const ph = new Image(); ph.className = 'ph'; ph.alt = ''; ph.src = t; z.appendChild(ph); }
  } catch(e){}
  try {
    const u = await fullURL(id);
    if (!u){ z.dataset.done = ''; return; }
    const img = new Image(); img.alt = ''; img.decoding = 'async';
    img.onload = () => {
      const ph = z.querySelector('.ph'); if (ph) ph.remove();
      if (i === V.i) measure();
    };
    img.src = u;
    z.appendChild(img);
  } catch(e){ z.dataset.done = ''; }
}
function measure(){
  const img = $('#slides').children[V.i] &&
              $('#slides').children[V.i].querySelector('.zoom img:not(.ph)');
  if (!img || !img.naturalWidth){ V.fit = { w:innerWidth, h:innerHeight }; return; }
  const k = Math.min(innerWidth / img.naturalWidth, innerHeight / img.naturalHeight, 1);
  V.fit = { w: img.naturalWidth * k, h: img.naturalHeight * k };
}
function snapPage(anim){
  const s = $('#slides');
  s.style.transition = anim ? 'transform .32s var(--ease)' : 'none';
  s.style.transform = `translate3d(${-V.i * innerWidth}px,0,0)`;
  if (!anim) requestAnimationFrame(() => { s.style.transition = 'transform .32s var(--ease)'; });
}
function applyZoom(anim){
  const slide = $('#slides').children[V.i];
  const z = slide && slide.querySelector('.zoom');
  if (!z) return;
  z.style.transition = anim ? 'transform .28s var(--ease)' : 'none';
  z.style.transform = `translate3d(${V.x}px,${V.y}px,0) scale(${V.scale})`;
}
function resetZoom(anim){ V.scale = 1; V.x = 0; V.y = 0; applyZoom(anim); }
function clampPan(){
  const ow = (V.fit.w * V.scale - innerWidth) / 2;
  const oh = (V.fit.h * V.scale - innerHeight) / 2;
  V.x = ow > 0 ? Math.max(-ow, Math.min(ow, V.x)) : 0;
  V.y = oh > 0 ? Math.max(-oh, Math.min(oh, V.y)) : 0;
}
function goTo(i){
  if (i < 0 || i >= V.list.length){ snapPage(true); return; }
  resetZoom(false);
  V.i = i; snapPage(true); paintMeta(); tap(3);
  [i, i+1, i-1].forEach(loadSlide);
  measure(); trimFull();
}
function paintMeta(){
  const it = items.find(i => i.id === V.list[V.i]);
  if (!it){ $('#vMeta').textContent = ''; return; }
  const d = new Date(it.ts);
  const al = it.album ? albumName(it.album) : null;
  $('#vMeta').innerHTML =
    esc(d.toLocaleDateString(undefined, { day:'numeric', month:'short', year:'numeric' })) +
    ' · ' + esc(d.toLocaleTimeString(undefined, { hour:'numeric', minute:'2-digit' })) +
    `<span>${V.i+1} of ${V.list.length}${al ? ' · ' + esc(al) : ''}</span>`;
}

(function gestures(){
  const el = $('#viewer');
  let mode = null, sx = 0, sy = 0, dx = 0, dy = 0;
  let sX = 0, sY = 0, sScale = 1, sDist = 0, sMid = null, t0 = 0;
  let lastTap = 0, lastX = 0, lastY = 0;
  const dist = t => Math.hypot(t[0].clientX - t[1].clientX, t[0].clientY - t[1].clientY);
  const mid  = t => ({ x:(t[0].clientX + t[1].clientX)/2, y:(t[0].clientY + t[1].clientY)/2 });

  el.addEventListener('touchstart', e => {
    if (!V.list.length) return;
    if (e.target.closest('.vtop, .vbot')){ mode = 'ui'; return; }
    $('#slides').style.transition = 'none';
    const slide = $('#slides').children[V.i];
    const z = slide && slide.querySelector('.zoom');
    if (z) z.style.transition = 'none';
    if (e.touches.length === 2){
      mode = 'pinch'; sDist = dist(e.touches) || 1; sMid = mid(e.touches);
      sScale = V.scale; sX = V.x; sY = V.y;
      if (!V.fit.w) measure();
      return;
    }
    if (e.touches.length !== 1) return;
    sx = e.touches[0].clientX; sy = e.touches[0].clientY;
    sX = V.x; sY = V.y; dx = dy = 0; t0 = Date.now();
    mode = V.scale > 1 ? 'pan' : null;
  }, { passive:true });

  el.addEventListener('touchmove', e => {
    if (mode === 'ui' || !V.list.length) return;
    if (mode === 'pinch' && e.touches.length === 2){
      const k = dist(e.touches) / sDist;
      const ns = Math.max(1, Math.min(6, sScale * k));
      const m = mid(e.touches);
      V.x = sX + (m.x - sMid.x) - (sMid.x - innerWidth/2) * (ns/sScale - 1);
      V.y = sY + (m.y - sMid.y) - (sMid.y - innerHeight/2) * (ns/sScale - 1);
      V.scale = ns;
      clampPan(); applyZoom(false);
      return;
    }
    if (e.touches.length !== 1) return;
    dx = e.touches[0].clientX - sx;
    dy = e.touches[0].clientY - sy;
    if (!mode){
      if (Math.abs(dx) < 7 && Math.abs(dy) < 7) return;
      mode = Math.abs(dy) > Math.abs(dx) * 1.25 ? 'dismiss' : 'page';
    }
    if (mode === 'pan'){
      V.x = sX + dx; V.y = sY + dy; clampPan(); applyZoom(false);
    } else if (mode === 'page'){
      let d = dx;
      if ((V.i === 0 && d > 0) || (V.i === V.list.length - 1 && d < 0)) d *= 0.32;
      $('#slides').style.transform = `translate3d(${-V.i * innerWidth + d}px,0,0)`;
    } else if (mode === 'dismiss'){
      const k = Math.min(1, Math.abs(dy) / 320);
      $('#slides').style.transform = `translate3d(${dx*0.4}px,${dy}px,0) scale(${1 - k*0.22})`;
      $('#vbg').style.opacity = String(1 - k*0.7);
      $('#viewer').classList.add('vhide');
    }
  }, { passive:true });

  el.addEventListener('touchend', e => {
    if (e.touches.length) return;
    const was = mode; mode = null;
    if (was === 'ui' || !V.list.length) return;

    if (was === 'pinch'){
      if (V.scale <= 1.03) resetZoom(true); else { clampPan(); applyZoom(true); }
      return;
    }
    if (was === 'pan'){ clampPan(); applyZoom(true); return; }
    if (was === 'dismiss'){
      if (Math.abs(dy) > 110){
        $('#slides').style.transition = 'transform .24s ease-out';
        $('#slides').style.transform =
          `translate3d(0,${dy > 0 ? innerHeight : -innerHeight}px,0) scale(.72)`;
        $('#vbg').style.opacity = '0';
        setTimeout(closeViewer, 190);
      } else {
        $('#vbg').style.opacity = '1';
        $('#viewer').classList.remove('vhide');
        snapPage(true);
      }
      return;
    }
    if (was === 'page'){
      const fast = Date.now() - t0 < 250 && Math.abs(dx) > 44;
      if (dx < -innerWidth*0.22 || (fast && dx < 0))     goTo(V.i + 1);
      else if (dx > innerWidth*0.22 || (fast && dx > 0)) goTo(V.i - 1);
      else snapPage(true);
      return;
    }

    // a tap with no drag
    const now = Date.now(), t = e.changedTouches[0];
    if (now - lastTap < 300 && Math.hypot(t.clientX - lastX, t.clientY - lastY) < 40){
      lastTap = 0;
      if (V.scale > 1) resetZoom(true);
      else {
        if (!V.fit.w) measure();
        V.scale = 2.6;
        V.x = (innerWidth/2 - t.clientX) * 1.6;
        V.y = (innerHeight/2 - t.clientY) * 1.6;
        clampPan(); applyZoom(true);
      }
      tap(6);
      return;
    }
    lastTap = now; lastX = t.clientX; lastY = t.clientY;
    setTimeout(() => {
      if (lastTap === now && V.list.length) $('#viewer').classList.toggle('vhide');
    }, 300);
  });

  document.addEventListener('keydown', e => {
    if (!$('#viewer').classList.contains('on')) return;
    if (e.key === 'ArrowRight') goTo(V.i + 1);
    if (e.key === 'ArrowLeft')  goTo(V.i - 1);
    if (e.key === 'Escape') closeViewer();
  });
  addEventListener('resize', () => {
    if ($('#viewer').classList.contains('on')){
      snapPage(false); measure(); clampPan(); applyZoom(false);
    }
  });
})();

function changePass(){
  askText('New passcode', 'Six characters or more. A passphrase is meaningfully stronger than digits.', '', v => {
    if (!v || v.length < 6){ toast('Too short — six characters minimum.'); return; }
    askText('Enter it again', '', '', async v2 => {
      if (v !== v2){ toast("Those didn't match. Nothing changed."); return; }
      busy(true, 'Rewrapping the key…');
      try {
        const ex = await crypto.subtle.importKey('raw', MKRAW, 'AES-GCM', true, ['encrypt','decrypt']);
        const raw = await crypto.subtle.exportKey('raw', ex);
        const salt = rnd(16);
        const w = await enc(raw, await kek(v, salt, ITERS));
        await dbPut('meta', { k:'vault', salt, iters:ITERS, wiv:w.iv, wct:w.ct });
        busy(false); toast('Passcode changed');
      } catch(e){ busy(false); toast('Could not change the passcode.'); }
    }, true);
  }, true);
}

/* ══════ Backup ══════ */
const b64 = buf => { const u = new Uint8Array(buf); let s = '';
  for (let i = 0; i < u.length; i += 8192) s += String.fromCharCode.apply(null, u.subarray(i, i+8192));
  return btoa(s); };
const unb64 = s => { const bin = atob(s), u = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return u; };

async function exportBackup(){
  busy(true, 'Building backup…');
  try {
    const meta = await dbGet('meta', 'vault');
    const rawItems = await dbAll('items'), rawAlbums = await dbAll('albums');
    const head = { v:1, made:Date.now(),
      salt:b64(meta.salt), iters:meta.iters, wiv:b64(meta.wiv), wct:b64(meta.wct),
      albums: rawAlbums.map(a => ({ id:a.id, iv:b64(a.iv), ct:b64(a.ct) })),
      items: rawItems.map(r => ({ id:r.id, album:r.album, ts:r.ts, type:r.type, w:r.w, h:r.h, size:r.size,
        iv:b64(r.iv), tiv:b64(r.tiv), len:r.ct.byteLength, tlen:r.tct.byteLength })) };
    const hb = te.encode(JSON.stringify(head));
    const lead = new Uint8Array(8);
    lead.set(te.encode('PVLT'), 0);
    new DataView(lead.buffer).setUint32(4, hb.byteLength, false);
    const parts = [lead, hb];
    rawItems.forEach(r => { parts.push(r.ct, r.tct); });
    const blob = new Blob(parts, { type:'application/octet-stream' });
    busy(false);
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'archive-' + new Date().toISOString().slice(0,10) + '.vault';
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 10000);
    toast('Backup saved. It opens only with this passcode.');
  } catch(e){ busy(false); toast('Backup failed.'); }
}
$('#backupPick').onchange = e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  actionSheet('Everything currently in the vault is replaced. Afterwards you unlock with the passcode that backup was made with.',
    [{ label:'Restore', dz:true, fn: () => doRestore(f) }]);
};
$('#lkRestore').onclick = () => $('#backupPick').click();

async function doRestore(f){
  busy(true, 'Reading backup…');
  try {
    const lead = new Uint8Array(await f.slice(0, 8).arrayBuffer());
    if (tdec.decode(lead.subarray(0,4)) !== 'PVLT') throw new Error('not a backup file');
    const hlen = new DataView(lead.buffer).getUint32(4, false);
    const head = JSON.parse(tdec.decode(await f.slice(8, 8 + hlen).arrayBuffer()));
    await dbClear('items'); await dbClear('albums');
    await dbPut('meta', { k:'vault', salt:unb64(head.salt), iters:head.iters,
                          wiv:unb64(head.wiv), wct:unb64(head.wct) });
    for (const a of head.albums) await dbPut('albums', { id:a.id, iv:unb64(a.iv), ct:unb64(a.ct) });
    let off = 8 + hlen, n = 0;
    for (const it of head.items){
      busy(true, `Restoring ${++n} of ${head.items.length}…`);
      const ct  = await f.slice(off, off + it.len).arrayBuffer();  off += it.len;
      const tct = await f.slice(off, off + it.tlen).arrayBuffer(); off += it.tlen;
      await dbPut('items', { id:it.id, album:it.album, ts:it.ts, type:it.type, w:it.w, h:it.h,
                             size:it.size, iv:unb64(it.iv), ct, tiv:unb64(it.tiv), tct });
    }
    busy(false);
    if (MKRAW) MKRAW.fill(0);
    MK = null; MKRAW = null; purgeURLs(); items = []; albums = [];
    toast("Restored. Unlock with that backup's passcode.");
    lockFlow();
  } catch(err){ busy(false); toast('That file could not be read: ' + err.message); }
}
async function verifyAll(){
  const all = await dbAll('items');
  if (!all.length){ toast('Nothing to check yet.'); return; }
  let bad = 0, n = 0;
  for (const r of all){
    busy(true, `Checking ${++n} of ${all.length}…`);
    try { await dec(r.iv, r.ct); } catch(e){ bad++; }
  }
  busy(false);
  toast(bad ? `${bad} photo${bad>1?'s':''} could not be decrypted.`
            : `All ${all.length} photos open correctly.`);
}
function wipeVault(){
  askText('Erase everything', 'Type ERASE to confirm. Every photo, the album list and the key are deleted. A backup file you already saved is not affected.', '', async v => {
    if (v !== 'ERASE'){ toast('Not erased.'); return; }
    busy(true, 'Erasing…');
    await dbClear('items'); await dbClear('albums'); await dbClear('meta');
    purgeURLs();
    if (MKRAW) MKRAW.fill(0);
    MK = null; MKRAW = null; items = []; albums = []; curAlbum = 'all';
    busy(false); toast('Vault erased'); setupFlow();
  });
}

/* ══════ Auto-lock ══════ */
function armIdle(){
  clearTimeout(idleTimer);
  if (!MK || settings.autolock === 0) return;
  idleTimer = setTimeout(() => { if (MK) lockNow(); }, settings.autolock * 1000);
}
['touchstart','click','keydown'].forEach(ev =>
  document.addEventListener(ev, () => { if (MK) armIdle(); }, { passive:true, capture:true }));

document.addEventListener('visibilitychange', () => {
  if (document.hidden){
    hiddenAt = Date.now();
    if (MK) $('#cover').classList.add('on');
    stopStream();
  } else {
    $('#cover').classList.remove('on');
    if (!MK) return;
    const gone = (Date.now() - hiddenAt) / 1000;
    if (settings.autolock === 0 || gone > settings.autolock) lockNow();
    else { armIdle(); if ($('#cam').classList.contains('on')) startCam(true); }
  }
});
addEventListener('pagehide', () => { if (MK) $('#cover').classList.add('on'); });
async function requestPersist(){
  try {
    if (navigator.storage && navigator.storage.persist && !(await navigator.storage.persisted()))
      await navigator.storage.persist();
  } catch(e){}
}

/* ══════ Boot ══════ */
(async function boot(){
  if (!crypto.subtle){
    document.body.innerHTML = '<div style="padding:64px 26px;color:#98A3B2;' +
      'font:16px -apple-system,sans-serif;line-height:1.6">This app needs a secure connection. ' +
      'Open it over https:// and it will work.</div>';
    return;
  }
  db = await openDB();
  (await dbGet('meta', 'vault')) ? lockFlow() : setupFlow();
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
