<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Vault">
<meta name="theme-color" content="#000000">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self' blob: data:; media-src 'self' blob:; font-src 'none'; connect-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'">
<link rel="apple-touch-icon" href="icon.png">
<title>Vault</title>
<style>
:root{
  --bg:#000; --panel:#0b0b10; --card:#121218; --card2:#181820;
  --line:rgba(255,255,255,.09); --txt:#f2f2f7; --dim:#9a9aa5; --dim2:#6b6b76;
  --acc:#7c5cff; --acc2:#22d3ee; --danger:#ff453a; --ok:#30d158;
  --r:18px; --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  --tabbar-h:76px;
}
html,body{height:100%;background:#000}
body{margin:0;color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent;touch-action:manipulation;overscroll-behavior:none;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input{font:inherit}
.hidden{display:none!important}
.center{min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 28px calc(32px + var(--sab));text-align:center;background:radial-gradient(120% 60% at 50% 0%,#141422 0%,#000 60%)}
.appicon{width:88px;height:88px;border-radius:22px;margin-bottom:22px;box-shadow:0 12px 40px rgba(124,92,255,.35)}
h1{font-size:30px;font-weight:700;margin:0 0 8px;letter-spacing:-.5px}
.sub{color:var(--dim);font-size:15px;line-height:1.5;margin:0 0 26px;max-width:300px}
.field{width:100%;max-width:320px;box-sizing:border-box;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:15px 16px;color:var(--txt);font-size:17px;margin-bottom:12px;outline:none;text-align:center}
.field:focus{border-color:var(--acc)}
.btn{width:100%;max-width:320px;padding:15px;border-radius:14px;font-size:17px;font-weight:600;background:linear-gradient(135deg,var(--acc),#5a3ee0);color:#fff;margin-top:4px}
.btn:active{transform:scale(.98);opacity:.92}
.btn.ghost{background:var(--card);border:1px solid var(--line);margin-top:10px}
.err{color:var(--danger);font-size:14px;min-height:20px;margin:10px 0 0}
.hintline{color:var(--dim2);font-size:13px;margin-top:18px;line-height:1.6;max-width:300px}
#screen-main{position:fixed;inset:0;display:flex;flex-direction:column;background:#000}
#main-head{padding:calc(var(--sat) + 10px) 18px 10px;display:flex;align-items:center;justify-content:space-between;flex:none}
#main-head h2{margin:0;font-size:28px;font-weight:700;letter-spacing:-.5px}
.hbtns{display:flex;gap:6px}
.hbtn{width:38px;height:38px;border-radius:50%;background:var(--card);display:flex;align-items:center;justify-content:center;font-size:17px;border:1px solid var(--line)}
.hbtn:active{background:var(--card2)}
#tab-content{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:4px 14px calc(var(--tabbar-h) + var(--sab) + 18px)}
#searchbar{display:none;margin:2px 0 12px}
#searchbar.on{display:block}
#searchbar input{width:100%;box-sizing:border-box;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;color:var(--txt);font-size:16px;outline:none}
.sect{font-size:13px;font-weight:600;color:var(--dim);text-transform:uppercase;letter-spacing:.8px;margin:14px 4px 10px}
.agrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.acard{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;text-align:left;width:100%}
.acard:active{transform:scale(.98)}
.acard .cover{position:relative;aspect-ratio:4/3;background:#1a1a22;display:flex;align-items:center;justify-content:center;overflow:hidden}
.acard .cover img{width:100%;height:100%;object-fit:cover}
.acard .cover .ph{font-size:34px;color:#3a3a46}
.acard .meta{padding:10px 12px 12px}
.acard .nm{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acard .ct{font-size:13px;color:var(--dim);margin-top:2px}
.ccov{position:relative;aspect-ratio:16/8;background:#14141c;display:grid;grid-template-columns:1fr 1fr 1fr;gap:2px;overflow:hidden}
.ccov img{width:100%;height:100%;object-fit:cover}
.ccov .ph{grid-column:1/-1;align-self:center;text-align:center;font-size:30px;color:#3a3a46}
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:3px}
.pcell{position:relative;aspect-ratio:1;background:#14141c;overflow:hidden}
.pcell img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.pcell .vbadge{position:absolute;right:5px;bottom:5px;background:rgba(0,0,0,.65);border-radius:6px;font-size:11px;font-weight:600;padding:2px 6px;pointer-events:none}
.pcell .favb{position:absolute;left:5px;top:5px;font-size:13px;text-shadow:0 1px 4px #000;pointer-events:none}
.pcell .selcheck{position:absolute;right:6px;top:6px;width:24px;height:24px;border-radius:50%;border:2px solid rgba(255,255,255,.85);background:rgba(0,0,0,.35);display:none;align-items:center;justify-content:center;font-size:14px;color:#fff;pointer-events:none}
body.selecting .pcell .selcheck{display:flex}
.pcell.sel .selcheck{background:var(--acc);border-color:var(--acc)}
.pcell.sel img{opacity:.55}
.trashdays{position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.7);font-size:11px;padding:4px 6px;color:#ffd60a;pointer-events:none}
#view-overlay{position:fixed;inset:0;background:#000;z-index:40;display:flex;flex-direction:column;transform:translateX(100%);transition:transform .28s ease}
#view-overlay.open{transform:none}
#view-head{padding:calc(var(--sat) + 8px) 12px 10px;display:flex;align-items:center;gap:8px;flex:none;border-bottom:1px solid var(--line)}
#view-head .back{font-size:17px;color:var(--acc2);padding:8px}
#view-title{flex:1;font-size:19px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center}
#view-title .sub2{display:block;font-size:12px;font-weight:400;color:var(--dim)}
#view-actions{display:flex;gap:2px}
.vabtn{font-size:15px;color:var(--acc2);padding:8px 6px;font-weight:600;white-space:nowrap}
.vabtn.warn{color:var(--danger)}
#view-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:10px 0 calc(var(--tabbar-h) + var(--sab) + 8px)}
#view-body .pgrid{padding:0 2px}
#selbar{position:fixed;left:12px;right:12px;bottom:calc(var(--sab) + 12px);z-index:60;background:rgba(24,24,32,.96);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid var(--line);border-radius:20px;padding:10px 14px;display:none;align-items:center;justify-content:space-between}
#selbar.on{display:flex}
#selbar .n{font-size:15px;font-weight:600}
#selbar .ops{display:flex;gap:14px}
#selbar button{font-size:15px;font-weight:600;color:var(--acc2)}
#selbar button.warn{color:var(--danger)}
#tabbar{position:fixed;left:0;right:0;bottom:0;z-index:50;height:calc(var(--tabbar-h) + var(--sab));padding-bottom:var(--sab);background:rgba(14,14,20,.86);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border-top:1px solid var(--line);display:flex}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--dim2);font-size:11px;font-weight:500}
.tab .ic{font-size:22px}
.tab.on{color:var(--txt)}
#viewer{position:fixed;inset:0;background:#000;z-index:100;display:none;touch-action:none}
#viewer.open{display:block}
#vtrack{position:absolute;inset:0;display:flex;height:100%;will-change:transform}
.slide{position:relative;flex:0 0 100%;height:100%;display:flex;align-items:center;justify-content:center;overflow:hidden}
.slide img,.slide video{max-width:100%;max-height:100%;object-fit:contain;will-change:transform}
.slide video{width:100%;height:100%;background:#000}
.vchrome{position:absolute;left:0;right:0;z-index:5;display:flex;align-items:center;justify-content:space-between;padding:12px 14px;transition:opacity .25s}
#vtop{top:0;padding-top:calc(var(--sat) + 12px);background:linear-gradient(rgba(0,0,0,.55),transparent)}
#vbot{bottom:0;padding-bottom:calc(var(--sab) + 14px);background:linear-gradient(transparent,rgba(0,0,0,.6));justify-content:space-around}
#viewer.hidechrome .vchrome{opacity:0;pointer-events:none}
.vcbtn{width:40px;height:40px;border-radius:50%;background:rgba(30,30,40,.7);display:flex;align-items:center;justify-content:center;font-size:18px}
.vcbtn.lit{color:#ff375f}
#vcount{font-size:15px;font-weight:600;text-shadow:0 1px 6px #000}
#vname{font-size:12px;color:var(--dim);text-shadow:0 1px 6px #000;max-width:46vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#sheetwrap{position:fixed;inset:0;z-index:200;display:none}
#sheetwrap.open{display:block}
#sheetbg{position:absolute;inset:0;background:rgba(0,0,0,.55)}
#sheetstack{position:absolute;left:10px;right:10px;bottom:calc(var(--sab) + 10px)}
#sheet{background:#1c1c24;border-radius:22px;overflow:hidden;animation:sheetup .25s ease}
@keyframes sheetup{from{transform:translateY(40px);opacity:0}}
.sheetopt{display:flex;align-items:center;gap:14px;width:100%;padding:16px 18px;font-size:17px;border-bottom:1px solid var(--line);text-align:left}
.sheetopt:last-child{border-bottom:0}
.sheetopt:active{background:#26262f}
.sheetopt .e{font-size:22px;width:30px;text-align:center;flex:none}
.sheetopt small{display:block;font-size:12px;color:var(--dim);font-weight:400}
.sheetopt.danger{color:var(--danger)}
#sheetcancel{margin-top:8px;background:#1c1c24;border-radius:22px;width:100%;padding:16px;font-size:17px;font-weight:600}
#modalwrap{position:fixed;inset:0;z-index:300;display:none;align-items:center;justify-content:center;padding:30px;background:rgba(0,0,0,.6)}
#modalwrap.open{display:flex}
#modal{background:#1e1e28;border-radius:20px;padding:22px;width:100%;max-width:320px;text-align:center}
#modal h3{margin:0 0 6px;font-size:18px}
#modal p{color:var(--dim);font-size:14px;margin:0 0 16px;line-height:1.5}
#modal input{width:100%;box-sizing:border-box;background:#121218;border:1px solid var(--line);border-radius:12px;padding:12px;color:var(--txt);font-size:16px;margin-bottom:12px;outline:none;text-align:center}
.mrow{display:flex;gap:10px}
.mrow button{flex:1;padding:13px;border-radius:12px;font-size:16px;font-weight:600}
.mcancel{background:#2a2a35}
.mok{background:linear-gradient(135deg,var(--acc),#5a3ee0);color:#fff}
.mok.danger{background:var(--danger)}
.srow{display:flex;align-items:center;justify-content:space-between;width:100%;padding:16px 4px;font-size:17px;border-bottom:1px solid var(--line);text-align:left}
.srow:active{background:var(--card)}
.srow .lab small{display:block;font-size:13px;color:var(--dim);margin-top:2px;font-weight:400}
.srow .chev{color:var(--dim2);font-size:18px}
.srow.danger{color:var(--danger)}
.toggle{width:52px;height:31px;border-radius:16px;background:#2c2c36;position:relative;transition:background .2s;flex:none}
.toggle.on{background:var(--ok)}
.toggle::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;transition:left .2s}
.toggle.on::after{left:23px}
#toast{position:fixed;left:50%;transform:translateX(-50%) translateY(20px);bottom:calc(var(--tabbar-h) + var(--sab) + 16px);background:rgba(30,30,40,.95);border:1px solid var(--line);padding:12px 20px;border-radius:14px;font-size:15px;z-index:400;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;max-width:86vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%)}
#progwrap{position:fixed;inset:0;z-index:350;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.55)}
#progwrap.open{display:flex}
#prog{background:#1e1e28;border-radius:18px;padding:24px 28px;text-align:center;min-width:230px}
#prog .bar{height:8px;background:#2c2c36;border-radius:5px;margin:14px 0 8px;overflow:hidden}
#prog .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--acc),var(--acc2));border-radius:5px;transition:width .2s}
#prog .t{font-size:15px;font-weight:600}
#prog .s{font-size:13px;color:var(--dim)}
.empty{text-align:center;color:var(--dim2);padding:60px 30px;font-size:15px;line-height:1.7}
.empty .big{font-size:44px;display:block;margin-bottom:12px}
</style>
</head>
<body>
<!-- SETUP -->
<div id="screen-setup" class="center hidden">
  <img class="appicon" src="icon.png" alt="" onerror="this.style.display='none'">
  <h1>Vault</h1>
  <p class="sub">Create a passphrase. Everything is encrypted on this device before it is stored.</p>
  <input id="su-p1" type="password" class="field" placeholder="Passphrase" autocomplete="new-password">
  <input id="su-p2" type="password" class="field" placeholder="Confirm passphrase" autocomplete="new-password">
  <button class="btn" id="su-go">Create Vault</button>
  <div class="err" id="su-err"></div>
  <p class="hintline">Use something long and memorable. There is no recovery if you forget it.</p>
</div>
<!-- LOCK -->
<div id="screen-lock" class="center hidden">
  <img class="appicon" src="icon.png" alt="" onerror="this.style.display='none'">
  <h1>Vault</h1>
  <p class="sub">Enter your passphrase to unlock.</p>
  <input id="lk-p" type="password" class="field" placeholder="Passphrase" autocomplete="current-password">
  <button class="btn" id="lk-go">Unlock</button>
  <div class="err" id="lk-err"></div>
  <p class="hintline" id="lk-attempts"></p>
</div>
<!-- MAIN -->
<div id="screen-main" class="hidden">
  <div id="main-head">
    <h2 id="main-title">Albums</h2>
    <div class="hbtns">
      <button class="hbtn" id="btn-add" aria-label="Add">＋</button>
      <button class="hbtn" id="btn-search" aria-label="Search">🔍</button>
      <button class="hbtn" id="btn-locknow" aria-label="Lock">🔒</button>
    </div>
  </div>
  <div id="searchbar"><input id="searchinput" placeholder="Search photos and videos" autocomplete="off"></div>
  <div id="tab-content"></div>
  <div id="tabbar">
    <button class="tab on" data-tab="albums"><span class="ic">🖼️</span><span>Albums</span></button>
    <button class="tab" data-tab="collections"><span class="ic">🗂️</span><span>Folders</span></button>
    <button class="tab" data-tab="settings"><span class="ic">⚙️</span><span>Settings</span></button>
  </div>
</div>
<!-- SUB VIEW -->
<div id="view-overlay">
  <div id="view-head">
    <button class="back" id="view-back">‹ Back</button>
    <div id="view-title"></div>
    <div id="view-actions"></div>
  </div>
  <div id="view-body"></div>
</div>
<div id="selbar">
  <span class="n" id="selcount">0 selected</span>
  <div class="ops">
    <button id="sel-all">Select All</button>
    <button id="sel-move">Move</button>
    <button id="sel-del" class="warn">Delete</button>
    <button id="sel-cancel">Cancel</button>
  </div>
</div>
<!-- VIEWER -->
<div id="viewer">
  <div id="vtrack"></div>
  <div class="vchrome" id="vtop">
    <button class="vcbtn" id="v-close">✕</button>
    <div style="text-align:center"><div id="vcount"></div><div id="vname"></div></div>
    <button class="vcbtn" id="v-fav">♡</button>
  </div>
  <div class="vchrome" id="vbot">
    <button class="vcbtn" id="v-play" title="Slideshow">▶</button>
    <button class="vcbtn" id="v-move" title="Move">📁</button>
    <button class="vcbtn" id="v-dl" title="Save">⤓</button>
    <button class="vcbtn" id="v-del" title="Delete">🗑</button>
  </div>
</div>
<!-- SHEET -->
<div id="sheetwrap"><div id="sheetbg"></div><div id="sheetstack"><div id="sheet"></div><button id="sheetcancel">Cancel</button></div></div>
<!-- MODAL -->
<div id="modalwrap"><div id="modal"><h3 id="m-title"></h3><p id="m-msg"></p><input id="m-input" class="hidden"><div class="mrow"><button class="mcancel" id="m-cancel">Cancel</button><button class="mok" id="m-ok">OK</button></div></div></div>
<!-- TOAST + PROGRESS -->
<div id="toast"></div>
<div id="progwrap"><div id="prog"><div class="t" id="prog-t">Working…</div><div class="bar"><i id="prog-i"></i></div><div class="s" id="prog-s"></div></div></div>
<!-- hidden pickers -->
<input type="file" id="pick-imgs" accept="image/*" multiple class="hidden">
<input type="file" id="pick-vids" accept="video/*" multiple class="hidden">
<input type="file" id="pick-cam" accept="image/*" capture="environment" class="hidden">
<input type="file" id="pick-vcam" accept="video/*" capture="environment" class="hidden">
<input type="file" id="pick-backup" accept="application/json,.json" class="hidden">
<script>
"use strict";
/* ================= utils ================= */
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=()=> (crypto.randomUUID?crypto.randomUUID():"id-"+Date.now()+"-"+Math.random().toString(36).slice(2));
function b64e(b){const u=b instanceof Uint8Array?b:new Uint8Array(b);let s="";for(let i=0;i<u.length;i+=32768){s+=String.fromCharCode.apply(null,u.subarray(i,i+32768))}return btoa(s)}
const b64d=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0)).buffer;
const fmtDur=s=>{s=Math.max(0,Math.round(s||0));const m=Math.floor(s/60);return m?m+":"+String(s%60).padStart(2,"0"):"0:"+String(s).padStart(2,"0")};
const fmtBytes=n=>n>1e9?(n/1e9).toFixed(1)+" GB":n>1e6?(n/1e6).toFixed(1)+" MB":Math.max(1,Math.round(n/1e3))+" KB";
const fmtDate=t=>new Date(t).toLocaleDateString(undefined,{month:"short",day:"numeric",year:"numeric"});
function toast(m,ms){const t=$("toast");t.textContent=m;t.classList.add("show");clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove("show"),ms||2200)}
function prog(show,t,s,p){$("progwrap").classList.toggle("open",!!show);if(t)$("prog-t").textContent=t;if(s!=null)$("prog-s").textContent=s;if(p!=null)$("prog-i").style.width=(p*100).toFixed(0)+"%"}
// kill iOS pinch-to-zoom-page gesture (page must never zoom; viewer handles its own pinch)
document.addEventListener("gesturestart",e=>e.preventDefault());
document.addEventListener("gesturechange",e=>e.preventDefault());
</script>
<script>
"use strict";
/* ================= crypto ================= */
const ITER=310000;
async function deriveKey(pass,saltB64){
  const salt=saltB64?new Uint8Array(b64d(saltB64)):(window.crypto.getRandomValues(new Uint8Array(16)));
  const km=await crypto.subtle.importKey("raw",new TextEncoder().encode(pass),"PBKDF2",false,["deriveKey"]);
  const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:salt,iterations:ITER,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["encrypt","decrypt"]);
  return {key,saltB64:saltB64||b64e(salt.buffer)};
}
async function encBytes(key,buf){
  const iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=await crypto.subtle.encrypt({name:"AES-GCM",iv:iv},key,buf);
  return {iv:b64e(iv.buffer),data:b64e(ct)};
}
async function decBytes(key,ivB64,dataB64){
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:new Uint8Array(b64d(ivB64))},key,b64d(dataB64));
  return new Uint8Array(pt);
}
async function encText(key,str){const r=await encBytes(key,new TextEncoder().encode(str));return r.iv+"$"+r.data}
async function decText(key,s){const i=s.indexOf("$");const b=await decBytes(key,s.slice(0,i),s.slice(i+1));return new TextDecoder().decode(b)}
/* ================= storage ================= */
const DB="pvault",VS="v2";
let dbp=null;
function db(){if(dbp)return dbp;dbp=new Promise((res,rej)=>{const r=indexedDB.open(DB,2);
  r.onupgradeneeded=e=>{const d=e.target.result;if(!d.objectStoreNames.contains("kv"))d.createObjectStore("kv");if(!d.objectStoreNames.contains("items"))d.createObjectStore("items",{keyPath:"id"});};
  r.onsuccess=e=>res(e.target.result);r.onerror=e=>rej(e.target.error)});return dbp}
async function kvGet(k){const d=await db();return new Promise((res,rej)=>{const t=d.transaction("kv").objectStore("kv").get(k);t.onsuccess=()=>res(t.result);t.onerror=()=>rej(t.error)})}
async function kvPut(k,v){const d=await db();return new Promise((res,rej)=>{const t=d.transaction("kv","readwrite").objectStore("kv").put(v,k);t.onsuccess=()=>res();t.onerror=()=>rej(t.error)})}
async function kvDel(k){const d=await db();return new Promise((res,rej)=>{const t=d.transaction("kv","readwrite").objectStore("kv").delete(k);t.onsuccess=()=>res();t.onerror=()=>rej(t.error)})}
async function itemsAll(){const d=await db();return new Promise((res,rej)=>{const t=d.transaction("items").objectStore("items").getAll();t.onsuccess=()=>res(t.result||[]);t.onerror=()=>rej(t.error)})}
async function itemPut(it){const d=await db();return new Promise((res,rej)=>{const t=d.transaction("items","readwrite").objectStore("items").put(it);t.onsuccess=()=>res();t.onerror=()=>rej(t.error)})}
async function itemsPutMany(arr){const d=await db();return new Promise((res,rej)=>{const tx=d.transaction("items","readwrite");const st=tx.objectStore("items");arr.forEach(a=>st.put(a));tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error)})}
async function itemDel(id){const d=await db();return new Promise((res,rej)=>{const t=d.transaction("items","readwrite").objectStore("items").delete(id);t.onsuccess=()=>res();t.onerror=()=>rej(t.error)})}
async function wipeAll(){const d=await db();return new Promise((res,rej)=>{const tx=d.transaction(["kv","items"],"readwrite");tx.objectStore("kv").clear();tx.objectStore("items").clear();tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error)})}
/* ================= state ================= */
const S={key:null,items:[],albums:[],collections:[],autoLockMin:5,tab:"albums",searching:false,sortMode:"new",
  sel:new Set(),viewCtx:null,viewerList:[],viewerIdx:0,slideEls:[],thumbCache:new Map(),blobCache:new Map(),slideTimer:null};
const byId=id=>S.items.find(i=>i.id===id);
const liveItems=()=>S.items.filter(i=>!i.trashed);
const albumItems=aid=>liveItems().filter(i=>i.albumId===aid);
const unsortedItems=()=>liveItems().filter(i=>!i.albumId||!S.albums.some(a=>a.id===i.albumId));
const favItems=()=>liveItems().filter(i=>i.fav);
const trashItems=()=>S.items.filter(i=>i.trashed);
function saveLibrary(){return kvPut("library",JSON.stringify({albums:S.albums,collections:S.collections,autoLockMin:S.autoLockMin,failed:S.failed||0}))}
async function loadLibrary(){const raw=await kvGet("library");if(raw){try{const o=JSON.parse(raw);S.albums=o.albums||[];S.collections=o.collections||[];S.autoLockMin=o.autoLockMin==null?5:o.autoLockMin;S.failed=o.failed||0}catch(e){}}}
function purgeTrash(){const cut=Date.now()-30*864e5;let n=0;S.items.filter(i=>i.trashed&&i.trashedAt<cut).forEach(i=>{itemDel(i.id);n++});if(n){S.items=S.items.filter(i=>!(i.trashed&&i.trashedAt<cut));saveLibrary()}}
/* ================= thumbnails ================= */
function canvasThumb(img,w,h){const c=document.createElement("canvas");const sc=Math.max(w/img.naturalWidth,h/img.naturalHeight);const dw=img.naturalWidth*sc,dh=img.naturalHeight*sc;c.width=w;c.height=h;const x=c.getContext("2d");x.drawImage(img,(w-dw)/2,(h-dh)/2,dw,dh);return new Promise(res=>c.toBlob(b=>res(b),"image/jpeg",.72))}
async function makePhotoThumb(file){const url=URL.createObjectURL(file);try{const img=await new Promise((res,rej)=>{const im=new Image();im.onload=()=>res(im);im.onerror=rej;im.src=url});const blob=await canvasThumb(img,320,320);return new Uint8Array(await blob.arrayBuffer())}finally{URL.revokeObjectURL(url)}}
async function makeVideoThumb(file){const url=URL.createObjectURL(file);const v=document.createElement("video");v.muted=true;v.playsInline=true;v.preload="auto";v.src=url;
  try{
    await new Promise((res,rej)=>{v.onloadedmetadata=res;v.onerror=()=>rej(new Error("video"));setTimeout(()=>rej(new Error("timeout")),15000)});
    const t=Math.min(0.25,(v.duration||1)/2);
    await new Promise((res,rej)=>{const to=setTimeout(()=>rej(new Error("seek")),8000);v.onseeked=()=>{clearTimeout(to);res()};try{v.currentTime=t}catch(e){clearTimeout(to);rej(e)}});
    const c=document.createElement("canvas");const vw=v.videoWidth||320,vh=v.videoHeight||240;const sc=Math.max(320/vw,320/vh);c.width=320;c.height=320;const x=c.getContext("2d");const dw=vw*sc,dh=vh*sc;x.drawImage(v,(320-dw)/2,(320-dh)/2,dw,dh);
    const blob=await new Promise(r=>c.toBlob(r,"image/jpeg",.72));return {thumb:new Uint8Array(await blob.arrayBuffer()),dur:v.duration||0};
  }finally{URL.revokeObjectURL(url);v.src=""}}
async function thumbURL(it){let u=S.thumbCache.get(it.id);if(u)return u;
  const tb=await decBytes(S.key,it.thumbIv,it.thumb);u=URL.createObjectURL(new Blob([tb],{type:"image/jpeg"}));S.thumbCache.set(it.id,u);return u}
async function fullURL(it){let u=S.blobCache.get(it.id);if(u)return u;
  const b=await decBytes(S.key,it.iv,it.data);u=URL.createObjectURL(new Blob([b],{type:it.type}));S.blobCache.set(it.id,u);return u}
/* ================= import pipeline ================= */
async function importFiles(files,albumId){
  const list=[...files];if(!list.length)return;
  prog(true,"Encrypting…","0 of "+list.length,0);
  let done=0,fail=0;
  for(const f of list){
    try{
      const isVid=f.type.startsWith("video/");
      const buf=new Uint8Array(await f.arrayBuffer());
      const e=await encBytes(S.key,buf);
      let thumb,dur=0;
      if(isVid){const r=await makeVideoThumb(f);thumb=r.thumb;dur=r.dur}
      else{thumb=await makePhotoThumb(f)}
      const te=await encBytes(S.key,thumb);
      const fname=f.name||(isVid?"video":"photo");
      const it={id:uid(),kind:isVid?"video":"photo",nameEnc:await encText(S.key,fname),type:f.type||(isVid?"video/mp4":"image/jpeg"),
        added:Date.now(),albumId:albumId||null,fav:0,trashed:0,trashedAt:0,dur:dur,
        iv:e.iv,data:e.data,thumbIv:te.iv,thumb:te.data};
      await itemPut(it);S.items.push(it);S.names.set(it.id,fname);done++;
    }catch(err){console.warn("import failed",f&&f.name,err);fail++}
    prog(true,"Encrypting…",done+" of "+list.length,done/list.length);
  }
  prog(false);saveLibrary();refreshCurrent();
  toast(fail?done+" added, "+fail+" failed":done+" added to vault");
}
</script>
<script>
"use strict";
/* ================= sheet & modal ================= */
let sheetCleanup=null;
function openSheet(opts){const sh=$("sheet");sh.innerHTML="";sheetCleanup=null;
  opts.forEach(o=>{const b=document.createElement("button");b.className="sheetopt"+(o.danger?" danger":"");
    b.innerHTML='<span class="e">'+o.e+'</span><span>'+esc(o.t)+(o.s?'<small>'+esc(o.s)+'</small>':"")+'</span>';
    b.onclick=()=>{closeSheet();o.fn&&o.fn()};sh.appendChild(b)});
  $("sheetwrap").classList.add("open");
  $("sheetbg").onclick=closeSheet;$("sheetcancel").onclick=closeSheet;
  sheetCleanup=()=>{};
}
function closeSheet(){$("sheetwrap").classList.remove("open")}
let modalResolve=null;
function modal(o){return new Promise(res=>{modalResolve=res;
  $("m-title").textContent=o.title||"";$("m-msg").textContent=o.msg||"";
  const inp=$("m-input");inp.classList.toggle("hidden",!o.input);inp.value=o.value||"";inp.placeholder=o.placeholder||"";
  const ok=$("m-ok");ok.textContent=o.ok||"OK";ok.classList.toggle("danger",!!o.danger);
  $("modalwrap").classList.add("open");if(o.input)setTimeout(()=>inp.focus(),80)})}
function closeModal(v){$("modalwrap").classList.remove("open");if(modalResolve){const r=modalResolve;modalResolve=null;r(v)}}
$("m-cancel").onclick=()=>closeModal(null);$("m-ok").onclick=()=>closeModal($("m-input").classList.contains("hidden")?true:$("m-input").value);
/* ================= render: tabs ================= */
function setTab(t){S.tab=t;document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("on",b.dataset.tab===t));
  $("main-title").textContent=t==="albums"?"Albums":t==="collections"?"Folders":"Settings";
  $("searchbar").classList.toggle("on",t==="albums"&&S.searching);
  if(t==="albums")renderAlbums();else if(t==="collections")renderCollections();else renderSettings()}
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{exitSelect();setTab(b.dataset.tab)});
$("btn-search").onclick=()=>{S.searching=!S.searching;$("searchinput").value="";setTab("albums");if(S.searching)setTimeout(()=>$("searchinput").focus(),60)};
$("searchinput").addEventListener("input",e=>renderAlbums(e.target.value.trim().toLowerCase()));
async function coverFor(ids){ // ids: item array -> dataURL of newest thumb
  const vis=ids.filter(i=>!i.trashed).sort((a,b)=>b.added-a.added);
  if(!vis.length)return null;
  try{return await thumbURL(vis[0])}catch(e){return null}
}
function albumCounts(){const m={};liveItems().forEach(i=>{if(i.albumId)m[i.albumId]=(m[i.albumId]||0)+1});return m}
async function renderAlbums(q){
  const el=$("tab-content");const counts=albumCounts();
  if(q){ // search results
    const hits=liveItems().filter(i=>nm(i).toLowerCase().includes(q));
    el.innerHTML='<div class="sect">'+hits.length+' result'+(hits.length===1?"":"s")+'</div><div class="pgrid" id="sg"></div>';
    const g=$("sg");for(const it of hits){g.appendChild(await pcell(it))}
    bindCells(g,hits);return;
  }
  const favs=favItems(),uns=unsortedItems();
  let h='<div class="sect">Smart albums</div><div class="agrid">';
  h+='<button class="acard" data-smart="fav"><div class="cover" data-cov="fav"></div><div class="meta"><div class="nm">♥ Favorites</div><div class="ct">'+favs.length+' item'+(favs.length===1?"":"s")+'</div></div></button>';
  h+='<button class="acard" data-smart="uns"><div class="cover" data-cov="uns"></div><div class="meta"><div class="nm">Unsorted</div><div class="ct">'+uns.length+' item'+(uns.length===1?"":"s")+'</div></div></button>';
  h+='</div>';
  if(S.albums.length){h+='<div class="sect">My albums</div><div class="agrid">';
    S.albums.forEach(a=>{const n=counts[a.id]||0;
      h+='<button class="acard" data-album="'+a.id+'"><div class="cover" data-cov="'+a.id+'"></div><div class="meta"><div class="nm">'+esc(a.name)+'</div><div class="ct">'+n+' item'+(n===1?"":"s")+'</div></div></button>'});
    h+='</div>'}else if(!favs.length&&!uns.length){
    h+='<div class="empty"><span class="big">🖼️</span>Nothing here yet.<br>Tap ＋ to add photos or videos.</div>'}
  el.innerHTML=h;
  el.querySelectorAll("[data-smart]").forEach(b=>b.onclick=()=>openSmart(b.dataset.smart));
  el.querySelectorAll("[data-album]").forEach(b=>b.onclick=()=>openAlbum(b.dataset.album));
  el.querySelectorAll("[data-cov]").forEach(async d=>{
    const k=d.dataset.cov;const ids=k==="fav"?favs:k==="uns"?uns:albumItems(k);
    const u=await coverFor(ids);
    d.innerHTML=u?'<img src="'+u+'" alt="">':'<span class="ph">🖼️</span>'});
}
async function renderCollections(){
  const el=$("tab-content");const counts=albumCounts();
  let h="";
  if(!S.collections.length)h='<div class="empty"><span class="big">🗂️</span>No folders yet.<br>Tap ＋ to create one and group albums.</div>';
  else{S.collections.forEach(c=>{
    const aids=c.albumIds||[];const n=aids.reduce((s,id)=>s+(counts[id]||0),0);
    h+='<button class="acard" data-col="'+c.id+'" style="margin-bottom:12px"><div class="ccov" data-ccov="'+c.id+'"></div><div class="meta"><div class="nm">'+esc(c.name)+'</div><div class="ct">'+aids.length+' album'+(aids.length===1?"":"s")+' · '+n+' item'+(n===1?"":"s")+'</div></div></button>'});
  }
  el.innerHTML=h;
  el.querySelectorAll("[data-col]").forEach(b=>b.onclick=()=>openCollection(b.dataset.col));
  el.querySelectorAll("[data-ccov]").forEach(async d=>{
    const c=S.collections.find(x=>x.id===d.dataset.ccov);if(!c)return;
    const ids=(c.albumIds||[]).flatMap(id=>albumItems(id)).sort((a,b)=>b.added-a.added).slice(0,3);
    if(!ids.length){d.innerHTML='<span class="ph">🗂️</span>';return}
    d.innerHTML="";for(const it of ids){try{const u=await thumbURL(it);const im=document.createElement("img");im.src=u;d.appendChild(im)}catch(e){}}});
}
function renderSettings(){
  const el=$("tab-content");const bytes=S.items.reduce((s,i)=>s+Math.round((i.data||"").length*3/4)+Math.round((i.thumb||"").length*3/4),0);
  el.innerHTML=
   '<div class="sect">Vault</div>'+
   '<button class="srow" id="s-trash"><span class="lab">🗑 Recently Deleted<small>'+trashItems().length+' items · kept 30 days</small></span><span class="chev">›</span></button>'+
   '<button class="srow" id="s-lock"><span class="lab">Auto-lock<small>'+(S.autoLockMin===0?"Off":"After "+S.autoLockMin+" min")+'</small></span><span class="chev">›</span></button>'+
   '<div class="sect">Security</div>'+
   '<button class="srow" id="s-pass"><span class="lab">Change passphrase</span><span class="chev">›</span></button>'+
   '<div class="srow"><span class="lab">Failed unlock attempts<small>'+(S.failed||0)+' recorded</small></span><button class="vabtn" id="s-failreset">Reset</button></div>'+
   '<div class="sect">Backup</div>'+
   '<button class="srow" id="s-exp"><span class="lab">Export encrypted backup</span><span class="chev">›</span></button>'+
   '<button class="srow" id="s-imp"><span class="lab">Import backup</span><span class="chev">›</span></button>'+
   '<div class="sect">Storage</div>'+
   '<div class="srow"><span class="lab">On this device<small>'+fmtBytes(bytes)+' · '+S.items.length+' items</small></span></div>'+
   '<div class="sect">Danger</div>'+
   '<button class="srow danger" id="s-del"><span class="lab">Delete vault</span><span class="chev">›</span></button>';
  $("s-trash").onclick=openTrash;
  $("s-lock").onclick=()=>{openSheet([0,1,2,5,10,30].map(m=>({e:m===0?"🚫":"⏱",t:m===0?"Off":"After "+m+" min",fn:()=>{S.autoLockMin=m;saveLibrary();renderSettings();resetLockTimer()}})))};
  $("s-pass").onclick=changePassphrase;
  $("s-failreset").onclick=()=>{S.failed=0;saveLibrary();renderSettings()};
  $("s-exp").onclick=exportBackup;
  $("s-imp").onclick=()=>$("pick-backup").click();
  $("s-del").onclick=async()=>{const ok=await modal({title:"Delete vault?",msg:"This erases every photo, video, album and folder on this device. This cannot be undone.",ok:"Delete",danger:true});if(ok){await wipeAll();location.reload()}};
}
</script>
<script>
"use strict";
/* ================= sub views ================= */
function openView(title,sub,actions){$("view-title").innerHTML=esc(title)+(sub?'<span class="sub2">'+esc(sub)+'</span>':"");
  const va=$("view-actions");va.innerHTML="";(actions||[]).forEach(a=>{const b=document.createElement("button");b.className="vabtn"+(a.warn?" warn":"");b.textContent=a.t;b.onclick=a.fn;va.appendChild(b)});
  $("view-body").scrollTop=0;$("view-overlay").classList.add("open")}
function closeView(){exitSelect();$("view-overlay").classList.remove("open");S.viewCtx=null;refreshCurrent()}
$("view-back").onclick=closeView;
function sortedItems(ids){const a=[...ids];
  if(S.sortMode==="old")a.sort((x,y)=>x.added-y.added);
  else if(S.sortMode==="name")a.sort((x,y)=>nm(x).localeCompare(nm(y)));
  else a.sort((x,y)=>y.added-x.added);return a}
function sortLabel(){return S.sortMode==="new"?"Newest":S.sortMode==="old"?"Oldest":"Name"}
async function pcell(it){const d=document.createElement("button");d.className="pcell";d.dataset.id=it.id;
  try{d.innerHTML='<img src="'+await thumbURL(it)+'" alt="">'}catch(e){}
  if(it.kind==="video")d.innerHTML+='<span class="vbadge">▶ '+fmtDur(it.dur)+'</span>';
  if(it.fav)d.innerHTML+='<span class="favb">♥</span>';
  if(it.trashed){const days=Math.max(0,Math.ceil((30*864e5-(Date.now()-it.trashedAt))/864e5));d.innerHTML+='<span class="trashdays">'+days+' day'+(days===1?"":"s")+' left</span>'}
  d.innerHTML+='<span class="selcheck">✓</span>';return d}
function bindCells(grid,list){grid.querySelectorAll(".pcell").forEach(c=>{
  const id=c.dataset.id;
  c.onclick=()=>{
    if(document.body.classList.contains("selecting")){toggleSel(id,c);return}
    if(S.viewCtx&&S.viewCtx.kind==="trash"){trashItemSheet(byId(id));return}
    openViewer(list,list.findIndex(i=>i.id===id))}})}
async function renderGridInto(ids){const body=$("view-body");
  if(!ids.length){body.innerHTML='<div class="empty"><span class="big">🖼️</span>Nothing here yet.</div>';return}
  body.innerHTML='<div class="pgrid" id="vg"></div>';const g=$("vg");
  for(const it of sortedItems(ids)){g.appendChild(await pcell(it))}
  bindCells(g,sortedItems(ids))}
function openSmart(which){
  const fav=which==="fav";const ids=fav?favItems():unsortedItems();
  S.viewCtx={kind:"smart",which:which};
  openView(fav?"Favorites":"Unsorted",ids.length+" items",[{t:"Sort: "+sortLabel(),fn:()=>cycleSort()},{t:"Select",fn:enterSelect}]);
  renderGridInto(ids)}
function openAlbum(aid){
  const a=S.albums.find(x=>x.id===aid);if(!a)return;
  const ids=albumItems(aid);
  S.viewCtx={kind:"album",id:aid};
  openView(a.name,ids.length+" items",[
    {t:"＋ Add",fn:()=>importSheet(aid)},
    {t:"Sort: "+sortLabel(),fn:()=>cycleSort()},
    {t:"Select",fn:enterSelect},
    {t:"⋯",fn:()=>albumMenu(aid)}]);
  renderGridInto(ids)}
function openCollection(cid){
  const c=S.collections.find(x=>x.id===cid);if(!c)return;
  S.viewCtx={kind:"collection",id:cid};
  const aids=c.albumIds||[];const n=aids.reduce((s,id)=>s+albumItems(id).length,0);
  openView(c.name,aids.length+" albums · "+n+" items",[{t:"⋯",fn:()=>collectionMenu(cid)}]);
  const body=$("view-body");const counts=albumCounts();
  if(!aids.length){body.innerHTML='<div class="empty"><span class="big">🗂️</span>No albums in this folder yet.</div>';return}
  let h='<div style="padding:0 14px"><div class="agrid">';
  S.albums.filter(a=>aids.includes(a.id)).forEach(a=>{const k=counts[a.id]||0;
    h+='<button class="acard" data-album="'+a.id+'"><div class="cover" data-cov="'+a.id+'"></div><div class="meta"><div class="nm">'+esc(a.name)+'</div><div class="ct">'+k+' item'+(k===1?"":"s")+'</div></div></button>'});
  body.innerHTML=h+'</div></div>';
  body.querySelectorAll("[data-album]").forEach(b=>b.onclick=()=>openAlbum(b.dataset.album));
  body.querySelectorAll("[data-cov]").forEach(async d=>{const u=await coverFor(albumItems(d.dataset.cov));d.innerHTML=u?'<img src="'+u+'" alt="">':'<span class="ph">🖼️</span>'});
}
function openTrash(){
  const ids=trashItems().sort((a,b)=>b.trashedAt-a.trashedAt);
  S.viewCtx={kind:"trash"};
  openView("Recently Deleted",ids.length+" items",ids.length?[{t:"Empty",warn:true,fn:emptyTrash}]:[]);
  const body=$("view-body");
  if(!ids.length){body.innerHTML='<div class="empty"><span class="big">🗑</span>Trash is empty.<br>Deleted items stay here for 30 days.</div>';return}
  body.innerHTML='<div class="pgrid" id="vg"></div>';const g=$("vg");
  (async()=>{for(const it of ids){g.appendChild(await pcell(it))}bindCells(g,ids)})()}
function trashItemSheet(it){if(!it)return;
  openSheet([{e:"↩",t:"Recover",fn:async()=>{it.trashed=0;it.trashedAt=0;await itemPut(it);openTrash();refreshCurrent()}},
    {e:"🗑",t:"Delete forever",danger:true,fn:async()=>{const ok=await modal({title:"Delete forever?",msg:"This item will be permanently erased.",ok:"Delete",danger:true});if(ok){await itemDel(it.id);S.items=S.items.filter(x=>x.id!==it.id);S.thumbCache.delete(it.id);openTrash();refreshCurrent()}}}])}
async function emptyTrash(){const ok=await modal({title:"Empty trash?",msg:"Permanently erase everything in Recently Deleted.",ok:"Empty",danger:true});
  if(!ok)return;const ids=trashItems();for(const it of ids){await itemDel(it.id);S.thumbCache.delete(it.id)}
  S.items=S.items.filter(i=>!i.trashed);openTrash();refreshCurrent();toast("Trash emptied")}
function cycleSort(){S.sortMode=S.sortMode==="new"?"old":S.sortMode==="old"?"name":"new";
  const ctx=S.viewCtx;if(!ctx)return;
  if(ctx.kind==="album")openAlbum(ctx.id);else if(ctx.kind==="smart")openSmart(ctx.which)}
async function albumMenu(aid){const a=S.albums.find(x=>x.id===aid);if(!a)return;
  openSheet([
    {e:"✏️",t:"Rename",fn:async()=>{const v=await modal({title:"Rename album",input:true,value:a.name,ok:"Save"});if(v&&v.trim()){a.name=v.trim().slice(0,60);await saveLibrary();openAlbum(aid);refreshCurrent()}}},
    {e:"🗑",t:"Delete album",s:"Items move to Unsorted",danger:true,fn:async()=>{const ok=await modal({title:"Delete album?",msg:"“"+a.name+"” will be removed. Its items move to Unsorted.",ok:"Delete",danger:true});
      if(ok){S.albums=S.albums.filter(x=>x.id!==aid);S.collections.forEach(c=>c.albumIds=(c.albumIds||[]).filter(id=>id!==aid));await saveLibrary();closeView()}}}])}
function collectionMenu(cid){const c=S.collections.find(x=>x.id===cid);if(!c)return;
  const inCol=(c.albumIds||[]).map(id=>S.albums.find(a=>a.id===id)).filter(Boolean);
  const outCol=S.albums.filter(a=>!(c.albumIds||[]).includes(a.id));
  const opts=[{e:"✏️",t:"Rename",fn:async()=>{const v=await modal({title:"Rename folder",input:true,value:c.name,ok:"Save"});if(v&&v.trim()){c.name=v.trim().slice(0,60);await saveLibrary();openCollection(cid);refreshCurrent()}}}];
  outCol.forEach(a=>opts.push({e:"➕",t:"Add “"+a.name+"”",fn:async()=>{c.albumIds.push(a.id);await saveLibrary();openCollection(cid);refreshCurrent()}}));

/* viewer gestures */
let gMode=null,gX=0,gY=0,gT=0,gDX=0,gD0=0,gS0=1,gTX0=0,gTY0=0,lastTap=0,pendingSingle=null;
viewer.addEventListener("touchstart",e=>{

  if(e.touches.length===2){gMode="pinch";clearTimeout(pendingSingle);
    const a=e.touches[0],b=e.touches[1];gD0=Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY);gS0=curSlide()._s||1;
  }else if(e.touches.length===1){const t=e.touches[0];gMode="tap";gX=t.clientX;gY=t.clientY;gT=Date.now();gDX=0;
    const sl=curSlide();gTX0=sl._tx||0;gTY0=sl._ty||0}

viewer.addEventListener("touchmove",e=>{
  e.preventDefault();

  if(gMode==="pinch"&&e.touches.length===2&&m){
    const a=e.touches[0],b=e.touches[1];
    const d=Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY);
    const s=Math.max(1,Math.min(4,gS0*d/Math.max(1,gD0)));
    const r=sl.getBoundingClientRect();
    m.style.transformOrigin=((a.clientX+b.clientX)/2-r.left)+"px "+((a.clientY+b.clientY)/2-r.top)+"px";
    sl._s=s;m.style.transform="translate("+(sl._tx||0)+"px,"+(sl._ty||0)+"px) scale("+s+")";
  }else if(gMode==="tap"&&e.touches.length===1&&m){
    const t=e.touches[0],dx=t.clientX-gX,dy=t.clientY-gY;gDX=dx;
    if((sl._s||1)>1){gMode="zoompan";
      const max=160*(sl._s||1);
      sl._tx=Math.max(-max,Math.min(max,gTX0+dx));sl._ty=Math.max(-max,Math.min(max,gTY0+dy));
      m.style.transform="translate("+sl._tx+"px,"+sl._ty+"px) scale("+sl._s+")";
    }else if(Math.abs(dx)>8||Math.abs(dy)>8){gMode="swipe";
      vtrack.style.transform="translateX(calc(-100% + "+dx+"px))"}
  }else if(gMode==="zoompan"&&e.touches.length===1&&m){
    const t=e.touches[0];
    const max=160*(sl._s||1);

    const dx=e.changedTouches[0].clientX-gX;gMode=null;

  }
});
function doubleTapZoom(x,y){

async function changePassphrase(){

  prog(true,"Verifying…");

  let ok=false;try{ok=(await decText(oldKey,await kvGet("check")))==="vault-ok"}catch(e){}

  prog(false);
  const p2=modal({title:"New passphrase",msg:"At least 6 characters.",input:true,ok:"Continue"});$("m-input").type="password";
  const nw=await p2;$("m-input").type="text";if(!nw)return;

  const cf=await p3;$("m-input").type="text";if(cf!==nw){toast("Passphrases do not match");return}
  prog(true,"Re-encrypting…","",0);
  const {key:newKey,saltB64:newSalt}=await deriveKey(nw);

  for(const it of items){
    const data=await decBytes(oldKey,it.iv,it.data);const th=await decBytes(oldKey,it.thumbIv,it.thumb);
    const e1=await encBytes(newKey,data),e2=await encBytes(newKey,th);

    d++;if(d%5===0)prog(true,"Re-encrypting…",d+" of "+items.length,d/items.length);
  }
  await itemsPutMany(items);
  await kvPut("salt",newSalt);await kvPut("check",await encText(newKey,"vault-ok"));

  prog(false);toast("Passphrase changed")}

    S.key=key;S.failed=0;
    await loadLibrary();
    S.items=await itemsAll();
    for(const it of S.items)S.names.set(it.id,await decryptName(it));
    await upgradeNames();
    purgeTrash();
    try{if(navigator.storage&&navigator.storage.persist)await navigator.storage.persist()}catch(e){}
    prog(false);$("lk-p").value="";enterMain();
  }catch(e){prog(false);er.textContent="Could not unlock."}};
$("lk-p").addEventListener("keydown",e=>{if(e.key==="Enter")$("lk-go").click()});
$("su-p2").addEventListener("keydown",e=>{if(e.key==="Enter")$("su-go").click()});
function refreshCurrent(){
  if(!$("view-overlay").classList.contains("open")){setTab(S.tab);return}
  const c=S.viewCtx;if(!c){setTab(S.tab);return}
  if(c.kind==="album")openAlbum(c.id);else if(c.kind==="smart")openSmart(c.which);
  else if(c.kind==="collection")openCollection(c.id);else if(c.kind==="trash")openTrash()}
(async function boot(){
  try{const has=await kvGet("check");
    try{S.failed=JSON.parse(await kvGet("library")).failed||0}catch(e){}
    if(has){updateAttemptsLine();$("screen-lock").classList.remove("hidden")}
    else $("screen-setup").classList.remove("hidden");
  }catch(e){$("screen-setup").classList.remove("hidden")}
})();
</script>
