<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000000">
  <link rel="apple-touch-icon" href="icon.png">
<!-- Zero-network guarantee: this page is forbidden from making ANY network request. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self' blob:; connect-src 'none'; base-uri 'none'; form-action 'none';">
<title>Vault</title>
<style>
/* Private Vault — sleek modern iPhone design
   True-black OLED base, frosted glass, soft gradients, spring motion. */
:root{
  --bg:#000000;
  --card:rgba(255,255,255,.065);
  --card-solid:#141416;
  --line:rgba(255,255,255,.10);
  --txt:#f5f5f7;
  --dim:#9a9aa2;
  --accent:#0a84ff;
  --accent2:#5e5ce6;
  --grad:linear-gradient(135deg,#0a84ff 0%,#5e5ce6 100%);
  --red:#ff453a;
  --green:#30d158;
  --tabbar-h:84px;
  --r-lg:24px; --r-md:18px; --r-sm:14px;
  --spring:cubic-bezier(.32,.72,.28,1);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;color:var(--txt);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  min-height:100%; overscroll-behavior:none;
  background:radial-gradient(130% 55% at 50% -5%, #12141f 0%, #000 62%) fixed, #000;
  -webkit-user-select:none; user-select:none;}
input,select,textarea{-webkit-user-select:text; user-select:text;}
.hidden{display:none !important;}
.hidden-input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none;}
.dim{color:var(--dim);}
.fine{font-size:12.5px;line-height:1.55;}
.err{color:var(--red);font-size:13.5px;min-height:20px;margin:6px 0;}
.hint{font-size:12.5px;color:var(--dim);min-height:18px;margin:2px 0 8px;}

.screen{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;}

/* ---------- gate (setup / lock) ---------- */
.gate{max-width:380px;width:100%;margin:auto;padding:36px 26px;text-align:center;
  animation:rise .45s var(--spring) both;}
.gate-icon{width:88px;height:88px;margin:0 auto 18px;border-radius:24px;display:block;
  box-shadow:0 12px 32px rgba(0,0,0,.5);}
.gate h1{margin:8px 0 8px;font-size:30px;font-weight:700;letter-spacing:-.5px;}
.gate p{margin:0 0 16px;color:var(--dim);font-size:14.5px;line-height:1.6;}
.gate input{width:100%;padding:16px 18px;margin:7px 0;border-radius:var(--r-md);
  border:1px solid var(--line);background:var(--card);color:var(--txt);
  font-size:16px;outline:none;transition:border-color .2s, box-shadow .2s;}
.gate input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(10,132,255,.22);}

/* ---------- buttons ---------- */
.btn{display:block;width:100%;padding:16px;margin:14px 0 0;border:none;border-radius:20px;
  font-size:16.5px;font-weight:700;letter-spacing:-.2px;cursor:pointer;
  transition:transform .15s var(--spring), opacity .15s;}
.btn:active{transform:scale(.97);}
.btn.primary{background:var(--grad);color:#fff;
  box-shadow:0 10px 26px rgba(10,132,255,.35), inset 0 1px 0 rgba(255,255,255,.25);}
.btn.ghost{background:var(--card);color:var(--txt);border:1px solid var(--line);}
.btn.danger{background:rgba(255,69,58,.12);color:var(--red);border:1px solid rgba(255,69,58,.4);}
.btn:disabled{opacity:.5;}
.icon-btn{background:rgba(255,255,255,.07);border:1px solid var(--line);color:var(--txt);
  width:42px;height:42px;border-radius:50%;cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;flex:none;
  transition:transform .15s var(--spring);}
.icon-btn:active{transform:scale(.9);}
.icon-btn svg{width:21px;height:21px;display:block;}
.icon-btn.danger{color:var(--red);background:rgba(255,69,58,.12);border-color:rgba(255,69,58,.35);}

/* ---------- main layout ---------- */
#topbar{display:flex;align-items:center;justify-content:space-between;
  padding:calc(14px + env(safe-area-inset-top)) 20px 12px;
  position:sticky;top:0;z-index:5;
  background:linear-gradient(to bottom, rgba(0,0,0,.85), rgba(0,0,0,0));
  -webkit-backdrop-filter:blur(2px); backdrop-filter:blur(2px);}
#topbar-title{font-size:24px;font-weight:800;letter-spacing:-.6px;}
#view{flex:1;padding:4px 18px calc(var(--tabbar-h) + 30px);max-width:720px;width:100%;margin:0 auto;}
#view > *{animation:rise .38s var(--spring) both;}
#view > *:nth-child(2){animation-delay:.04s;} #view > *:nth-child(3){animation-delay:.08s;}
#view > *:nth-child(4){animation-delay:.12s;} #view > *:nth-child(5){animation-delay:.16s;}
@keyframes rise{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:none;}}

/* floating frosted tab bar */
#tabbar{position:fixed;left:14px;right:14px;bottom:calc(10px + env(safe-area-inset-bottom));
  height:74px;border-radius:30px;z-index:10;
  background:rgba(22,22,26,.68);
  -webkit-backdrop-filter:blur(28px) saturate(180%); backdrop-filter:blur(28px) saturate(180%);
  border:1px solid rgba(255,255,255,.12);
  box-shadow:0 14px 40px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.08);
  display:flex;align-items:stretch;justify-content:space-around;
  padding:6px 4px;}
.tab{flex:1;background:none;border:none;color:var(--dim);display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:5px;font-size:11.5px;font-weight:600;
  letter-spacing:.2px;cursor:pointer;border-radius:22px;
  transition:color .2s, background .2s, transform .15s var(--spring);}
.tab:active{transform:scale(.94);}
.tab svg{width:25px;height:25px;}
.tab.active{color:#fff;}
#fab{width:64px;height:64px;border-radius:50%;background:var(--grad);border:none;color:#fff;
  align-self:center;margin-top:-38px;flex:none;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 12px 30px rgba(10,132,255,.5), inset 0 1px 0 rgba(255,255,255,.3);
  transition:transform .15s var(--spring);}
#fab:active{transform:scale(.92);}
#fab svg{width:28px;height:28px;}

/* ---------- lists ---------- */
.row-item{display:flex;align-items:center;gap:15px;width:100%;text-align:left;
  background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);
  padding:14px 16px;margin:10px 0;color:var(--txt);cursor:pointer;
  -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px);
  transition:transform .15s var(--spring), background .2s;}
.row-item:active{transform:scale(.98);background:rgba(255,255,255,.1);}
.row-thumb{width:56px;height:56px;border-radius:18px;flex:none;overflow:hidden;
  background:linear-gradient(135deg,rgba(10,132,255,.22),rgba(94,92,230,.22));
  border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:#cfd4ff;}
.row-thumb img{width:100%;height:100%;object-fit:cover;}
.row-thumb svg{width:27px;height:27px;}
.row-main{flex:1;min-width:0;}
.row-name{font-size:16.5px;font-weight:700;letter-spacing:-.2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block;}
.row-sub{font-size:13px;color:var(--dim);margin-top:3px;display:block;}
.row-chev{color:var(--dim);font-size:22px;font-weight:300;}
.empty{text-align:center;color:var(--dim);padding:56px 24px;line-height:1.7;font-size:14.5px;}
.empty b{color:var(--txt);}
.section-head{display:flex;align-items:center;justify-content:space-between;margin:16px 4px 6px;}
.section-head h2{font-size:20px;margin:0;font-weight:800;letter-spacing:-.4px;}
.link-btn{background:rgba(10,132,255,.14);border:1px solid rgba(10,132,255,.35);color:#7db9ff;
  font-size:14.5px;font-weight:700;cursor:pointer;padding:9px 16px;border-radius:999px;
  transition:transform .15s var(--spring);}
.link-btn:active{transform:scale(.95);}

/* ---------- album detail ---------- */
.detail-head{display:flex;align-items:center;gap:6px;margin:10px 0 6px;}
.detail-head h2{flex:1;margin:0;font-size:22px;font-weight:800;letter-spacing:-.5px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px;}
.cell{aspect-ratio:1;border-radius:20px;overflow:hidden;background:var(--card);
  border:1px solid var(--line);position:relative;cursor:pointer;
  transition:transform .15s var(--spring);}
.cell:active{transform:scale(.96);}
.cell img{width:100%;height:100%;object-fit:cover;display:block;}
.cell-loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;}
.shimmer{position:absolute;inset:0;
  background:linear-gradient(100deg,transparent 20%,rgba(255,255,255,.09) 50%,transparent 80%);
  background-size:200% 100%;animation:sh 1.4s linear infinite;}
@keyframes sh{from{background-position:180% 0;}to{background-position:-80% 0;}}

/* ---------- add sheet ---------- */
#sheet{position:fixed;inset:0;z-index:40;}
#sheet-scrim{position:absolute;inset:0;background:rgba(0,0,0,.6);
  -webkit-backdrop-filter:blur(3px); backdrop-filter:blur(3px);
  animation:fade .22s ease;}
@keyframes fade{from{opacity:0;}to{opacity:1;}}
#sheet-card{position:absolute;left:0;right:0;bottom:0;
  background:rgba(24,24,28,.92);
  -webkit-backdrop-filter:blur(30px) saturate(170%); backdrop-filter:blur(30px) saturate(170%);
  border-top:1px solid rgba(255,255,255,.12);
  border-radius:32px 32px 0 0;padding:18px 20px calc(30px + env(safe-area-inset-bottom));
  animation:sheetup .34s var(--spring);}
#sheet-card::before{content:"";display:block;width:44px;height:5px;border-radius:99px;
  background:rgba(255,255,255,.25);margin:0 auto 26px;}
@keyframes sheetup{from{transform:translateY(70px);opacity:.5;}to{transform:none;opacity:1;}}
.sheet-row{display:flex;justify-content:space-evenly;align-items:flex-start;}
.big-action{background:none;border:none;color:var(--txt);display:flex;flex-direction:column;
  align-items:center;gap:13px;cursor:pointer;padding:8px 12px;
  transition:transform .15s var(--spring);}
.big-action:active{transform:scale(.93);}
.big-circle{width:92px;height:92px;border-radius:32px;display:flex;align-items:center;justify-content:center;
  border:1px solid rgba(255,255,255,.14);
  box-shadow:0 10px 26px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.18);}
.big-action:nth-child(1) .big-circle{background:linear-gradient(135deg,rgba(10,132,255,.5),rgba(10,132,255,.18));}
.big-action:nth-child(2) .big-circle{background:linear-gradient(135deg,rgba(94,92,230,.5),rgba(94,92,230,.18));}
.big-action:nth-child(3) .big-circle{background:linear-gradient(135deg,rgba(48,209,88,.42),rgba(48,209,88,.15));}
.big-circle svg{width:40px;height:40px;color:#fff;}
.big-label{font-size:13.5px;font-weight:800;letter-spacing:1.1px;line-height:1.45;text-transform:uppercase;color:#e8e8ee;}
#sheet-close{display:flex;margin:32px auto 0;width:76px;height:76px;border-radius:50%;
  background:linear-gradient(135deg,#ff5f56,#e0342b);border:none;color:#fff;cursor:pointer;
  align-items:center;justify-content:center;
  box-shadow:0 12px 28px rgba(255,69,58,.4), inset 0 1px 0 rgba(255,255,255,.25);
  transition:transform .15s var(--spring);}
#sheet-close:active{transform:scale(.92);}
#sheet-close svg{width:30px;height:30px;}
#sheet-target{text-align:center;margin:16px 0 0;}

/* ---------- viewer ---------- */
#viewer{position:fixed;inset:0;background:#000;z-index:50;display:flex;flex-direction:column;
  animation:fade .2s ease;}
#viewer-bar{display:flex;align-items:center;gap:8px;
  padding:calc(10px + env(safe-area-inset-top)) 12px 12px;
  background:linear-gradient(to bottom, rgba(0,0,0,.75), transparent);z-index:2;}
#viewer-meta{flex:1;min-width:0;padding:0 6px;}
#viewerName{font-size:16px;font-weight:700;letter-spacing:-.2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
#viewer-body{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;padding:4px;}
#viewerImg{max-width:100%;max-height:100%;object-fit:contain;border-radius:12px;}

/* ---------- modal ---------- */
#modal{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;
  padding:26px;animation:fade .18s ease;}
#modal-scrim{position:absolute;inset:0;background:rgba(0,0,0,.62);
  -webkit-backdrop-filter:blur(4px); backdrop-filter:blur(4px);}
#modalCard{position:relative;background:rgba(26,26,31,.94);
  -webkit-backdrop-filter:blur(28px) saturate(170%); backdrop-filter:blur(28px) saturate(170%);
  border:1px solid rgba(255,255,255,.13);border-radius:28px;
  box-shadow:0 24px 70px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.1);
  padding:26px 24px;width:100%;max-width:380px;animation:pop .28s var(--spring);}
@keyframes pop{from{transform:scale(.92) translateY(10px);opacity:0;}to{transform:none;opacity:1;}}
#modalCard h3{margin:0 0 8px;font-size:19px;font-weight:800;letter-spacing:-.3px;}
#modalCard p{color:var(--dim);font-size:14px;line-height:1.65;margin:0 0 10px;}
#modalCard p b{color:var(--txt);}
#modalCard input,#modalCard select{width:100%;padding:14px 16px;margin:7px 0;border-radius:var(--r-md);
  border:1px solid var(--line);background:rgba(0,0,0,.4);color:var(--txt);font-size:16px;outline:none;
  transition:border-color .2s, box-shadow .2s;}
#modalCard input:focus,#modalCard select:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(10,132,255,.2);}
.modal-btns{display:flex;gap:10px;margin-top:14px;}
.modal-btns .btn{margin:0;}
.opt-list{display:flex;flex-direction:column;gap:9px;margin-top:8px;}
.opt{background:rgba(0,0,0,.35);border:1px solid var(--line);border-radius:var(--r-md);color:var(--txt);
  padding:15px 16px;font-size:15.5px;font-weight:600;cursor:pointer;text-align:left;
  transition:transform .15s var(--spring), border-color .2s;}
.opt:active{transform:scale(.98);}
.opt.sel{border-color:var(--accent);box-shadow:0 0 0 3px rgba(10,132,255,.18);}

/* ---------- settings ---------- */
.set-row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;
  background:var(--card);border:1px solid var(--line);border-radius:20px;
  padding:16px 18px;margin:10px 0;color:var(--txt);font-size:16px;font-weight:600;
  cursor:pointer;transition:transform .15s var(--spring), background .2s;}
.set-row:active{transform:scale(.98);background:rgba(255,255,255,.1);}
.set-row .grow{flex:1;}
.set-row .val{color:var(--dim);font-size:14px;font-weight:500;}
.set-row.danger{color:var(--red);}
.set-note{background:var(--card);border:1px solid var(--line);border-radius:20px;
  padding:16px 18px;margin:16px 0;font-size:13.5px;line-height:1.7;color:var(--dim);}
.set-note b{color:var(--txt);}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:8px;}
.dot.ok{background:var(--green);box-shadow:0 0 10px rgba(48,209,88,.8);}
.dot.bad{background:var(--red);box-shadow:0 0 10px rgba(255,69,58,.8);}

/* ---------- toast ---------- */
#toast{position:fixed;top:calc(16px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);
  background:rgba(30,30,36,.85);color:var(--txt);padding:13px 22px;border-radius:999px;
  border:1px solid rgba(255,255,255,.14);font-size:14px;font-weight:600;
  -webkit-backdrop-filter:blur(20px); backdrop-filter:blur(20px);
  box-shadow:0 10px 30px rgba(0,0,0,.5);
  z-index:100;max-width:88vw;text-align:center;animation:rise .3s var(--spring);}

</style>
</head>
<body>
<div id="app">

  <!-- FIRST RUN: create passphrase -->
  <section id="screen-setup" class="screen hidden">
    <div class="gate">
      <img class="gate-icon" src="icon.png" alt="">
      <h1>Vault</h1>
      <p class="dim">Create a passphrase to encrypt everything.</p>
      <div id="setup-error" class="err"></div>
      <input id="setup-pw1" type="password" placeholder="Passphrase (12+ characters recommended)" autocomplete="new-password">
      <input id="setup-pw2" type="password" placeholder="Repeat passphrase" autocomplete="new-password">
      <div id="pw-hint" class="hint"></div>
      <button class="btn primary" data-act="setup-go">Create vault</button>
    </div>
  </section>

  <!-- UNLOCK -->
  <section id="screen-lock" class="screen hidden">
    <div class="gate">
      <img class="gate-icon" src="icon.png" alt="">
      <h1>Vault</h1>
      <p class="dim">Enter your passphrase to unlock.</p>
      <div id="lock-error" class="err"></div>
      <input id="lock-pw" type="password" placeholder="Passphrase" autocomplete="current-password">
      <button class="btn primary" data-act="unlock-go">Unlock</button>
    </div>
  </section>

  <!-- MAIN -->
  <section id="screen-main" class="screen hidden">
    <header id="topbar">
      <span id="topbar-title">Vault</span>
      <button class="icon-btn" data-act="lock-now" aria-label="Lock now">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
      </button>
    </header>
    <main id="view"></main>
    <nav id="tabbar">
      <button class="tab" data-act="tab" data-id="albums">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="6" width="13" height="13" rx="2"/><path d="M7 3.5h11a2 2 0 0 1 2 2V17"/></svg>
        <span>Albums</span>
      </button>
      <button class="tab" data-act="tab" data-id="collections">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
        <span>Collections</span>
      </button>
      <button id="fab" data-act="open-sheet" aria-label="Add">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 5v14M5 12h14"/></svg>
      </button>
      <button class="tab" data-act="tab" data-id="settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="3.1"/><path d="M12 2.5v2.6M12 18.9v2.6M2.5 12h2.6M18.9 12h2.6M5.3 5.3l1.8 1.8M16.9 16.9l1.8 1.8M18.7 5.3l-1.8 1.8M7.1 16.9l-1.8 1.8"/></svg>
        <span>Settings</span>
      </button>
    </nav>
  </section>

  <!-- ADD SHEET -->
  <div id="sheet" class="hidden">
    <div id="sheet-scrim" data-act="close-sheet"></div>
    <div id="sheet-card">
      <div class="sheet-row">
        <button class="big-action" data-act="sheet-camera">
          <span class="big-circle"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="7" width="18" height="13" rx="2"/><circle cx="12" cy="13" r="3.4"/><path d="M8.5 7L10 4.5h4L15.5 7"/></svg></span>
          <span class="big-label">Open<br>Camera</span>
        </button>
        <button class="big-action" data-act="sheet-import">
          <span class="big-circle"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="10" r="1.6"/><path d="M5 17.5l4.5-4.5 3 3 2-2 4.5 4.5"/></svg></span>
          <span class="big-label">Import<br>Photos</span>
        </button>
        <button class="big-action" data-act="sheet-new-album">
          <span class="big-circle"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="6" width="13" height="13" rx="2"/><path d="M7 3.5h11a2 2 0 0 1 2 2V17"/><path d="M18.5 14v5M16 16.5h5"/></svg></span>
          <span class="big-label">New<br>Album</span>
        </button>
      </div>
      <button id="sheet-close" data-act="close-sheet" aria-label="Close">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
      <p id="sheet-target" class="dim fine"></p>
    </div>
  </div>

  <!-- PHOTO VIEWER -->
  <div id="viewer" class="hidden">
    <div id="viewer-bar">
      <button class="icon-btn" data-act="viewer-close" aria-label="Close">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
      <div id="viewer-meta"><div id="viewerName"></div><div id="viewerDate" class="dim fine"></div></div>
      <button class="icon-btn" data-act="photo-move" aria-label="Move to album">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M12 11v6M9.5 13.5L12 11l2.5 2.5"/></svg>
      </button>
      <button class="icon-btn danger" data-act="photo-delete" aria-label="Delete photo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 7h16M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2M6.5 7l1 13h9l1-13"/></svg>
      </button>
    </div>
    <div id="viewer-body"><img id="viewerImg" alt=""></div>
  </div>

  <!-- GENERIC MODAL -->
  <div id="modal" class="hidden">
    <div id="modal-scrim" data-act="modal-close"></div>
    <div id="modalCard"></div>
  </div>

  <div id="toast" class="hidden"></div>

  <input type="file" id="filepicker" accept="image/*" multiple class="hidden-input">
  <input type="file" id="camerapicker" accept="image/*" capture="environment" class="hidden-input">
  <input type="file" id="backuppicker" accept=".json,application/json" class="hidden-input">
</div>
<script>
'use strict';
/* ============================================================
   Private Vault — zero-network encrypted photo vault.
   - PBKDF2-SHA256 (310,000 iterations) -> AES-256-GCM
   - Passphrase is never stored. Only ciphertext touches storage.
   - This file makes no network requests (see Content-Security-Policy).
   ============================================================ */

/* ---------------- utils ---------------- */
const $ = id => document.getElementById(id);
const te = new TextEncoder(), td = new TextDecoder();

function u8ToB64(u8){
  let s = '';
  for(let i=0;i<u8.length;i+=0x8000) s += String.fromCharCode.apply(null, u8.subarray(i,i+0x8000));
  return btoa(s);
}
function b64ToU8(b){
  const s = atob(b), u = new Uint8Array(s.length);
  for(let i=0;i<s.length;i++) u[i] = s.charCodeAt(i);
  return u;
}
function newId(){
  if(crypto.randomUUID) return crypto.randomUUID();
  const b = crypto.getRandomValues(new Uint8Array(16));
  return [...b].map(x=>x.toString(16).padStart(2,'0')).join('');
}
function esc(s){ return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtDate(ts){ return new Date(ts).toLocaleString(undefined,{month:'short',day:'numeric',year:'numeric',hour:'numeric',minute:'2-digit'}); }

let toastTimer=null;
function toast(msg, ms=2600){
  const t=$('toast'); t.textContent=msg; t.classList.remove('hidden');
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.add('hidden'), ms);
}

/* ---------------- crypto ---------------- */
const ITER = 310000, VERIFY = 'pvault-ok-v1';

async function deriveKey(pass, salt){
  const base = await crypto.subtle.importKey('raw', te.encode(pass), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey(
    {name:'PBKDF2', salt:salt, iterations:ITER, hash:'SHA-256'},
    base, {name:'AES-GCM', length:256}, false, ['encrypt','decrypt']);
}
async function encBytes(key, bytes){
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM', iv}, key, bytes));
  return {iv, ct};
}
async function decBytes(key, iv, ct){
  return new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM', iv}, key, ct));
}
async function encText(key, str){
  const {iv,ct} = await encBytes(key, te.encode(str));
  return {iv:u8ToB64(iv), ct:u8ToB64(ct)};
}
async function decText(key, ivB64, ctB64){
  return td.decode(await decBytes(key, b64ToU8(ivB64), b64ToU8(ctB64)));
}

/* ---------------- storage (IndexedDB) ---------------- */
function openDB(){
  return new Promise((res,rej)=>{
    const r = indexedDB.open('pvault', 1);
    r.onupgradeneeded = ()=>{
      const db = r.result;
      db.createObjectStore('kv', {keyPath:'k'});
      db.createObjectStore('photos', {keyPath:'id'});
      db.createObjectStore('albums', {keyPath:'id'});
      db.createObjectStore('collections', {keyPath:'id'});
    };
    r.onsuccess = ()=>res(r.result);
    r.onerror = ()=>rej(r.error||new Error('IndexedDB open failed'));
  });
}
let _db=null;
async function db(){ if(!_db) _db = await openDB(); return _db; }
function reqOf(p){ return new Promise((res,rej)=>{ p.onsuccess=()=>res(p.result); p.onerror=()=>rej(p.error); }); }
async function kvGet(k){ const d=await db(); const r=await reqOf(d.transaction('kv').objectStore('kv').get(k)); return r?r.v:undefined; }
async function kvPut(k,v){ const d=await db(); await reqOf(d.transaction('kv','readwrite').objectStore('kv').put({k,v})); }
async function allRecs(s){ const d=await db(); return reqOf(d.transaction(s).objectStore(s).getAll()); }
async function putRec(s,v){ const d=await db(); await reqOf(d.transaction(s,'readwrite').objectStore(s).put(v)); }
async function delRec(s,k){ const d=await db(); await reqOf(d.transaction(s,'readwrite').objectStore(s).delete(k)); }
async function clearRecs(s){ const d=await db(); await reqOf(d.transaction(s,'readwrite').objectStore(s).clear()); }

/* ---------------- session state ---------------- */
const S = {
  key:null, tab:'albums', view:{name:'albums'},
  photos:[], albums:[], collections:[],       // decrypted metadata; photo bytes lazy
  prefs:{autolock:5}, pendingAlbum:null, viewing:null, selftest:null, lockTimer:null
};
function show(id){
  document.querySelectorAll('.screen').forEach(e=>e.classList.add('hidden'));
  $(id).classList.remove('hidden');
}
function albumById(id){ return S.albums.find(a=>a.rec.id===id); }
function photosIn(albumId){ return S.photos.filter(p=>p.rec.albumId===albumId); }
function albumsIn(colId){ return S.albums.filter(a=>a.rec.collectionId===colId); }

/* ---------------- self test ---------------- */
async function selfTest(){
  const out = {crypto:false, storage:false, detail:''};
  try{
    if(!crypto.subtle) throw new Error('WebCrypto is not available in this browser');
    const k = await crypto.subtle.generateKey({name:'AES-GCM',length:256}, false, ['encrypt','decrypt']);
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const ct = await crypto.subtle.encrypt({name:'AES-GCM',iv}, k, te.encode('selftest'));
    const pt = await crypto.subtle.decrypt({name:'AES-GCM',iv}, k, ct);
    if(td.decode(pt)!=='selftest') throw new Error('encrypt/decrypt round-trip mismatch');
    out.crypto = true;
  }catch(e){ out.detail += 'Encryption: '+e.message+'. '; }
  try{ const d = await openDB(); d.close(); out.storage = true; }
  catch(e){ out.detail += 'Storage: '+(e.message||e)+'. '; }
  return out;
}

/* ---------------- setup / unlock / lock ---------------- */
async function setupVault(){
  const p1=$('setup-pw1').value, p2=$('setup-pw2').value, err=$('setup-error');
  err.textContent='';
  if(p1.length<8){ err.textContent='Use at least 8 characters — 12 or more is much better.'; return; }
  if(p1!==p2){ err.textContent='The two passphrases do not match.'; return; }
  try{
    const t = await selfTest(); S.selftest=t;
    if(!t.crypto||!t.storage) throw new Error(t.detail||'Self-test failed.');
    const salt = crypto.getRandomValues(new Uint8Array(16));
    const key = await deriveKey(p1, salt);
    const v = await encText(key, VERIFY);
    await kvPut('meta',{salt:u8ToB64(salt), iters:ITER, verifyIv:v.iv, verifyCt:v.ct});
    $('setup-pw1').value=''; $('setup-pw2').value='';
    S.key = key; await loadVault(); enterMain();
    toast('Vault created.');
  }catch(e){ err.textContent='Could not create vault: '+(e.message||e); }
}

async function unlockVault(){
  const pw=$('lock-pw').value, err=$('lock-error');
  err.textContent='';
  if(!pw) return;
  try{
    const meta = await kvGet('meta');
    const key = await deriveKey(pw, b64ToU8(meta.salt));
    const v = await decText(key, meta.verifyIv, meta.verifyCt);
    if(v!==VERIFY) throw new Error('bad');
    $('lock-pw').value='';
    S.key = key; await loadVault(); enterMain();
  }catch(e){ err.textContent='Wrong passphrase — try again.'; }
}

async function loadVault(){
  const [pr,ar,cr] = await Promise.all([allRecs('photos'),allRecs('albums'),allRecs('collections')]);
  S.photos=[]; S.albums=[]; S.collections=[];
  for(const r of pr){ const name=await decText(S.key,r.nameIv,r.nameCt); S.photos.push({rec:r,name,url:null}); }
  for(const r of ar){ S.albums.push({rec:r,name:await decText(S.key,r.nameIv,r.nameCt)}); }
  for(const r of cr){ S.collections.push({rec:r,name:await decText(S.key,r.nameIv,r.nameCt)}); }
  S.photos.sort((a,b)=>b.rec.addedAt-a.rec.addedAt);
  S.albums.sort((a,b)=>a.rec.createdAt-b.rec.createdAt);
  S.collections.sort((a,b)=>a.rec.createdAt-b.rec.createdAt);
}

function doLock(){
  for(const p of S.photos){ if(p.url){ URL.revokeObjectURL(p.url); p.url=null; } }
  S.key=null; S.photos=[]; S.albums=[]; S.collections=[];
  S.viewing=null; S.pendingAlbum=null;
  closeModal(); $('viewer').classList.add('hidden'); $('sheet').classList.add('hidden');
  const pw=$('lock-pw'); if(pw) pw.value='';
  $('lock-error').textContent='';
  show('screen-lock');
  clearTimeout(S.lockTimer);
}

function enterMain(){
  S.tab='albums'; S.view={name:'albums'};
  show('screen-main'); render(); resetLockTimer();
}

/* ---------------- auto-lock ---------------- */
function resetLockTimer(){
  clearTimeout(S.lockTimer);
  const m = S.prefs.autolock;
  if(m>0 && S.key) S.lockTimer=setTimeout(doLock, m*60*1000);
}
function armAutoLock(){
  ['pointerdown','keydown','touchstart'].forEach(ev=>document.addEventListener(ev,resetLockTimer,{passive:true}));
  document.addEventListener('visibilitychange',()=>{ if(document.hidden && S.key) doLock(); });
}

/* ---------------- photos ---------------- */
async function photoURL(p){
  if(p.url) return p.url;
  const bytes = await decBytes(S.key, p.rec.iv, p.rec.ct);
  p.url = URL.createObjectURL(new Blob([bytes],{type:p.rec.type||'image/jpeg'}));
  return p.url;
}

async function addFiles(fileList, albumId){
  const files=[...fileList].filter(f=>f.type.startsWith('image/'));
  if(!files.length){ toast('No images selected.'); return; }
  toast('Encrypting '+files.length+' photo'+(files.length>1?'s':'')+'…');
  try{
    for(const f of files){
      const buf = new Uint8Array(await f.arrayBuffer());
      const ne = await encText(S.key, f.name||'photo');
      const de = await encBytes(S.key, buf);
      await putRec('photos',{id:newId(), albumId:albumId||'unsorted', addedAt:Date.now(),
        type:f.type||'image/jpeg', size:buf.length, nameIv:ne.iv, nameCt:ne.ct, iv:de.iv, ct:de.ct});
    }
    await loadVault(); render(); resetLockTimer();
    toast(files.length>1?files.length+' photos added.':'Photo added.');
  }catch(e){ toast('Could not add photos: '+(e.message||e)); }
}

async function deletePhoto(id){
  const p=S.photos.find(x=>x.rec.id===id); if(!p) return;
  if(p.url){ URL.revokeObjectURL(p.url); }
  await delRec('photos',id);
  await loadVault(); $('viewer').classList.add('hidden'); S.viewing=null; render(); resetLockTimer();
  toast('Photo deleted.');
}

async function movePhotoTo(id, albumId){
  const p=S.photos.find(x=>x.rec.id===id); if(!p) return;
  p.rec.albumId=albumId; await putRec('photos',p.rec);
  await loadVault(); render(); resetLockTimer();
  toast('Moved.');
}

/* ---------------- albums & collections ---------------- */
async function createAlbum(name, collectionId){
  const ne=await encText(S.key,name);
  await putRec('albums',{id:newId(),collectionId:collectionId||null,createdAt:Date.now(),nameIv:ne.iv,nameCt:ne.ct});
  await loadVault(); render();
}
async function renameAlbum(id,name){
  const a=albumById(id); if(!a) return;
  const ne=await encText(S.key,name);
  a.rec.nameIv=ne.iv; a.rec.nameCt=ne.ct; await putRec('albums',a.rec);
  await loadVault(); render();
}
async function deleteAlbum(id){
  for(const p of S.photos.filter(x=>x.rec.albumId===id)){ p.rec.albumId='unsorted'; await putRec('photos',p.rec); }
  await delRec('albums',id);
  await loadVault(); S.view={name:'albums'}; render();
}
async function createCollection(name){
  const ne=await encText(S.key,name);
  await putRec('collections',{id:newId(),createdAt:Date.now(),nameIv:ne.iv,nameCt:ne.ct});
  await loadVault(); render();
}
async function renameCollection(id,name){
  const c=S.collections.find(x=>x.rec.id===id); if(!c) return;
  const ne=await encText(S.key,name);
  c.rec.nameIv=ne.iv; c.rec.nameCt=ne.ct; await putRec('collections',c.rec);
  await loadVault(); render();
}
async function deleteCollection(id){
  for(const a of S.albums.filter(x=>x.rec.collectionId===id)){ a.rec.collectionId=null; await putRec('albums',a.rec); }
  await delRec('collections',id);
  await loadVault(); S.view={name:'collections'}; render();
}

/* ---------------- passphrase change ---------------- */
async function changePassphrase(cur, nw){
  const meta=await kvGet('meta');
  const oldKey=await deriveKey(cur,b64ToU8(meta.salt));
  try{ if(await decText(oldKey,meta.verifyIv,meta.verifyCt)!==VERIFY) throw 0; }
  catch(e){ throw new Error('Current passphrase is wrong.'); }
  for(const p of S.photos){ if(p.url){ URL.revokeObjectURL(p.url); p.url=null; } }
  const newSalt=crypto.getRandomValues(new Uint8Array(16));
  const newKey=await deriveKey(nw,newSalt);
  const [pr,ar,cr]=await Promise.all([allRecs('photos'),allRecs('albums'),allRecs('collections')]);
  // decrypt everything with the old key first — nothing is overwritten until this succeeds
  const dp=[],da=[],dc=[];
  for(const r of pr) dp.push({r,name:await decText(oldKey,r.nameIv,r.nameCt),bytes:await decBytes(oldKey,r.iv,r.ct)});
  for(const r of ar) da.push({r,name:await decText(oldKey,r.nameIv,r.nameCt)});
  for(const r of cr) dc.push({r,name:await decText(oldKey,r.nameIv,r.nameCt)});
  // re-encrypt with the new key
  const v=await encText(newKey,VERIFY);
  await kvPut('meta',{salt:u8ToB64(newSalt),iters:ITER,verifyIv:v.iv,verifyCt:v.ct});
  for(const {r,name,bytes} of dp){
    const ne=await encText(newKey,name), de=await encBytes(newKey,bytes);
    await putRec('photos',{...r,nameIv:ne.iv,nameCt:ne.ct,iv:de.iv,ct:de.ct});
  }
  for(const {r,name} of da){ const ne=await encText(newKey,name); await putRec('albums',{...r,nameIv:ne.iv,nameCt:ne.ct}); }
  for(const {r,name} of dc){ const ne=await encText(newKey,name); await putRec('collections',{...r,nameIv:ne.iv,nameCt:ne.ct}); }
  S.key=newKey; await loadVault(); render();
}

/* ---------------- encrypted backup ---------------- */
function serRec(r){
  const o={...r};
  for(const k of ['iv','ct']) if(o[k] instanceof Uint8Array) o[k]=u8ToB64(o[k]);
  return o;
}
async function exportBackup(){
  try{
    const meta=await kvGet('meta');
    const [pr,ar,cr]=await Promise.all([allRecs('photos'),allRecs('albums'),allRecs('collections')]);
    const b={magic:'pvault-backup-v1',exportedAt:new Date().toISOString(),meta,
      photos:pr.map(serRec), albums:ar.map(serRec), collections:cr.map(serRec)};
    const blob=new Blob([JSON.stringify(b)],{type:'application/json'});
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download='vault-backup-'+new Date().toISOString().slice(0,10)+'.pvault.json';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href),8000);
    toast('Backup downloaded.');
  }catch(e){ toast('Export failed: '+(e.message||e)); }
}
function deserRec(r){
  const o={...r};
  for(const k of ['iv','ct']) if(typeof o[k]==='string') o[k]=b64ToU8(o[k]);
  return o;
}
async function importBackup(file){
  try{
    const b=JSON.parse(await file.text());
    if(!b||b.magic!=='pvault-backup-v1'||!b.meta||!b.meta.salt||!Array.isArray(b.photos))
      throw new Error('This file is not a valid vault backup.');
    openModal(`<h3>Restore backup?</h3>
      <p>This replaces <b>everything</b> currently in the vault with the backup from ${esc(b.exportedAt||'unknown date')}. This cannot be undone.</p>
      <div class="modal-btns"><button class="btn ghost" data-act="modal-close">Cancel</button>
      <button class="btn danger" id="import-confirm">Replace all</button></div>`);
    $('import-confirm').onclick=async ()=>{
      closeModal(); toast('Restoring…');
      await Promise.all([clearRecs('photos'),clearRecs('albums'),clearRecs('collections')]);
      await kvPut('meta',b.meta);
      for(const r of b.photos) await putRec('photos',deserRec(r));
      for(const r of (b.albums||[])) await putRec('albums',deserRec(r));
      for(const r of (b.collections||[])) await putRec('collections',deserRec(r));
      doLock(); toast('Backup restored.');
    };
  }catch(e){ toast('Import failed: '+(e.message||e)); }
}

/* ---------------- rendering ---------------- */
const ICON_ALBUM='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="6" width="13" height="13" rx="2"/><path d="M7 3.5h11a2 2 0 0 1 2 2V17"/></svg>';
const ICON_FOLDER='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1 2 2H5a2 2 0 0 1-2-2z"/></svg>';

function setTab(t){
  S.tab=t;
  document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.id===t));
  if(t==='albums') S.view={name:'albums'};
  if(t==='collections') S.view={name:'collections'};
  if(t==='settings') S.view={name:'settings'};
  $('topbar-title').textContent = t==='settings' ? 'Settings' : 'Vault';
  render();
}

function render(){
  const v=$('view');
  if(S.view.name==='albums') v.innerHTML=viewAlbums();
  else if(S.view.name==='collections') v.innerHTML=viewCollections();
  else if(S.view.name==='collection') v.innerHTML=viewCollection(S.view.id);
  else if(S.view.name==='album') v.innerHTML=viewAlbum(S.view.id);
  else if(S.view.name==='settings') v.innerHTML=viewSettings();
  if(S.view.name==='album') fillGrid(S.view.id);
}

function albumRow({id,name,sub,icon}){
  return `<button class="row-item" data-act="open-album" data-id="${id}">
    <span class="row-thumb">${icon||ICON_ALBUM}</span>
    <span class="row-main"><span class="row-name">${esc(name)}</span><span class="row-sub" style="display:block">${esc(sub)}</span></span>
    <span class="row-chev">›</span></button>`;
}

function viewAlbums(){
  const unsorted=photosIn('unsorted').length;
  let h=`<div class="section-head"><h2>Albums</h2><button class="link-btn" data-act="sheet-new-album">+ New</button></div>`;
  h+=albumRow({id:'unsorted',name:'Unsorted',sub:unsorted+(unsorted===1?' photo':' photos')});
  for(const a of S.albums){
    const n=photosIn(a.rec.id).length;
    const col=a.rec.collectionId?S.collections.find(c=>c.rec.id===a.rec.collectionId):null;
    h+=albumRow({id:a.rec.id,name:a.name,sub:n+(n===1?' photo':' photos')+(col?' · '+col.name:'')});
  }
  if(!S.albums.length) h+=`<div class="empty">No albums yet.<br>Tap <b>+</b> below to import photos or create one.</div>`;
  return h;
}

function viewCollections(){
  let h=`<div class="section-head"><h2>Collections</h2><button class="link-btn" data-act="new-collection">+ New</button></div>`;
  for(const c of S.collections){
    const n=albumsIn(c.rec.id).length;
    h+=`<button class="row-item" data-act="open-collection" data-id="${c.rec.id}">
      <span class="row-thumb">${ICON_FOLDER}</span>
      <span class="row-main"><span class="row-name">${esc(c.name)}</span>
      <span class="row-sub" style="display:block">${n+(n===1?' album':' albums')}</span></span>
      <span class="row-chev">›</span></button>`;
  }
  if(!S.collections.length) h+=`<div class="empty">Collections group albums together.<br>Tap <b>+ New</b> to create one.</div>`;
  return h;
}

function viewCollection(id){
  const c=S.collections.find(x=>x.rec.id===id); if(!c) return viewCollections();
  const list=albumsIn(id);
  let h=`<div class="detail-head"><button class="icon-btn" data-act="back" aria-label="Back">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 5l-7 7 7 7"/></svg></button>
    <h2>${esc(c.name)}</h2>
    <button class="icon-btn" data-act="col-rename" data-id="${id}" aria-label="Rename">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 20l4-1 11-11a2.1 2.1 0 0 0-3-3L5 16z"/></svg></button>
    <button class="icon-btn danger" data-act="col-delete" data-id="${id}" aria-label="Delete">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 7h16M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2M6.5 7l1 13h9l1-13"/></svg></button></div>`;
  for(const a of list){
    const n=photosIn(a.rec.id).length;
    h+=albumRow({id:a.rec.id,name:a.name,sub:n+(n===1?' photo':' photos')});
  }
  if(!list.length) h+=`<div class="empty">No albums in this collection yet.</div>`;
  return h;
}

function viewAlbum(id){
  let name, editable=true;
  if(id==='unsorted'){ name='Unsorted'; editable=false; }
  else{ const a=albumById(id); if(!a) return viewAlbums(); name=a.name; }
  const list=photosIn(id);
  let h=`<div class="detail-head"><button class="icon-btn" data-act="back" aria-label="Back">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 5l-7 7 7 7"/></svg></button>
    <h2>${esc(name)}</h2>`;
  if(editable) h+=`<button class="icon-btn" data-act="album-rename" data-id="${id}" aria-label="Rename">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 20l4-1 11-11a2.1 2.1 0 0 0-3-3L5 16z"/></svg></button>
    <button class="icon-btn danger" data-act="album-delete" data-id="${id}" aria-label="Delete">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 7h16M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2M6.5 7l1 13h9l1-13"/></svg></button>`;
  h+=`<button class="icon-btn" data-act="album-add" data-id="${id}" aria-label="Add photos">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg></button></div>`;
  h+=`<div class="grid" id="grid"></div>`;
  if(!list.length) h+=`<div class="empty">No photos here yet.<br>Tap <b>+</b> above to add some.</div>`;
  return h;
}

function fillGrid(albumId){
  const g=$('grid'); if(!g) return;
  const list=photosIn(albumId);
  g.innerHTML='';
  for(const p of list){
    const cell=document.createElement('div');
    cell.className='cell'; cell.dataset.act='open-photo'; cell.dataset.id=p.rec.id;
    cell.innerHTML='<div class="shimmer"></div>';
    g.appendChild(cell);
    photoURL(p).then(url=>{
      if(!document.body.contains(cell)) return;
      cell.innerHTML='';
      const img=document.createElement('img');
      img.src=url; img.loading='lazy'; img.alt='';
      cell.appendChild(img);
    }).catch(()=>{ cell.innerHTML='<div class="cell-loading">!</div>'; });
  }
}

function lockLabel(){
  const m=S.prefs.autolock;
  return m===0?'Never':m===1?'1 minute':m+' minutes';
}
function viewSettings(){
  return `<div class="section-head"><h2>Settings</h2></div>
  <button class="set-row" data-act="set-autolock"><span class="grow">Auto-lock</span><span class="val">${lockLabel()}</span><span class="row-chev">›</span></button>
  <button class="set-row" data-act="set-changepw"><span class="grow">Change passphrase</span><span class="row-chev">›</span></button>
  <button class="set-row" data-act="set-export"><span class="grow">Export encrypted backup</span><span class="row-chev">›</span></button>
  <button class="set-row" data-act="set-import"><span class="grow">Import encrypted backup</span><span class="row-chev">›</span></button>
  <button class="set-row" data-act="lock-now"><span class="grow">Lock now</span></button>
  <button class="set-row danger" data-act="set-wipe"><span class="grow">Delete all vault data</span></button>`;
}

/* ---------------- modal helpers ---------------- */
function openModal(html){ $('modalCard').innerHTML=html; $('modal').classList.remove('hidden'); const i=$('modalCard').querySelector('input'); if(i) setTimeout(()=>i.focus(),80); }
function closeModal(){ $('modal').classList.add('hidden'); $('modalCard').innerHTML=''; }
function modalInput({title,text,label,def,ok,onOk}){
  openModal(`<h3>${esc(title)}</h3>${text?`<p>${text}</p>`:''}
    <input id="m-input" type="text" value="${esc(def||'')}" placeholder="${esc(label||'')}" maxlength="80">
    <div class="modal-btns"><button class="btn ghost" data-act="modal-close">Cancel</button>
    <button class="btn primary" id="m-ok">${esc(ok||'Save')}</button></div>`);
  $('m-ok').onclick=()=>{ const v=$('m-input').value.trim(); if(!v){toast('Enter a name.');return;} closeModal(); onOk&&onOk(v); };
}
function modalConfirm({title,text,okLabel,danger,onOk}){
  openModal(`<h3>${esc(title)}</h3><p>${text}</p>
    <div class="modal-btns"><button class="btn ghost" data-act="modal-close">Cancel</button>
    <button class="btn ${danger?'danger':'primary'}" id="m-ok">${esc(okLabel||'Confirm')}</button></div>`);
  $('m-ok').onclick=async ()=>{ closeModal(); await onOk(); };
}
function modalOptions({title,options,current,onPick}){
  openModal(`<h3>${esc(title)}</h3><div class="opt-list">${
    options.map(o=>`<button class="opt${o.v===current?' sel':''}" data-v="${o.v}">${esc(o.label)}</button>`).join('')
  }</div><div class="modal-btns"><button class="btn ghost" data-act="modal-close">Cancel</button></div>`);
  $('modalCard').querySelectorAll('.opt').forEach(b=>b.onclick=()=>{closeModal();onPick(b.dataset.v);});
}

/* ---------------- viewer ---------------- */
async function openViewer(pid){
  const p=S.photos.find(x=>x.rec.id===pid); if(!p) return;
  S.viewing=p;
  $('viewer').classList.remove('hidden');
  $('viewerImg').removeAttribute('src');
  $('viewerName').textContent=p.name;
  $('viewerDate').textContent=fmtDate(p.rec.addedAt);
  try{ $('viewerImg').src=await photoURL(p); resetLockTimer(); }
  catch(e){ toast('Could not decrypt this photo.'); }
}

/* ---------------- actions ---------------- */
async function handleAction(act,id,el){
  switch(act){
    case 'setup-go': await setupVault(); break;
    case 'unlock-go': await unlockVault(); break;
    case 'lock-now': doLock(); toast('Locked.'); break;
    case 'tab': setTab(id); break;
    case 'back':
      if(S.view.name==='album'){ const a=S.view.id==='unsorted'?null:albumById(S.view.id);
        if(a&&a.rec.collectionId){S.view={name:'collection',id:a.rec.collectionId};} else {S.view={name:'albums'};} }
      else if(S.view.name==='collection'){ S.view={name:'collections'}; }
      render(); break;

    case 'open-sheet': S.pendingAlbum=null; $('sheet-target').textContent='';
      $('sheet').classList.remove('hidden'); break;
    case 'close-sheet': $('sheet').classList.add('hidden'); break;
    case 'album-add': S.pendingAlbum=(id==='unsorted'?null:id);
      $('sheet-target').textContent='Photos will be added to this album.';
      $('sheet').classList.remove('hidden'); break;
    case 'sheet-camera': $('sheet').classList.add('hidden'); $('camerapicker').click(); break;
    case 'sheet-import': $('sheet').classList.add('hidden'); $('filepicker').click(); break;
    case 'sheet-new-album': {
      $('sheet').classList.add('hidden');
      const cols=S.collections.map(c=>({v:c.rec.id,label:c.name}));
      openModal(`<h3>New album</h3><input id="m-input" type="text" placeholder="Album name" maxlength="80">
        <select id="m-col"><option value="">No collection</option>${cols.map(c=>`<option value="${c.v}">${esc(c.label)}</option>`).join('')}</select>
        <div class="modal-btns"><button class="btn ghost" data-act="modal-close">Cancel</button>
        <button class="btn primary" id="m-ok">Create</button></div>`);
      $('m-ok').onclick=async()=>{ const n=$('m-input').value.trim(); if(!n){toast('Enter a name.');return;}
        const cid=$('m-col').value||null; closeModal(); await createAlbum(n,cid); toast('Album created.'); };
      break; }

    case 'open-album': S.view={name:'album',id}; render(); break;
    case 'open-collection': S.view={name:'collection',id}; render(); break;
    case 'open-photo': openViewer(id); break;
    case 'viewer-close': $('viewer').classList.add('hidden'); S.viewing=null; break;
    case 'photo-delete': {
      const p=S.viewing; if(!p) break;
      modalConfirm({title:'Delete photo?',text:'This permanently deletes the encrypted photo. This cannot be undone.',
        okLabel:'Delete',danger:true,onOk:()=>deletePhoto(p.rec.id)}); break; }
    case 'photo-move': {
      const p=S.viewing; if(!p) break;
      const opts=[{v:'unsorted',label:'Unsorted'},...S.albums.map(a=>({v:a.rec.id,label:a.name}))];
      modalOptions({title:'Move to album',options:opts,current:p.rec.albumId,
        onPick:v=>movePhotoTo(p.rec.id,v)}); break; }

    case 'album-rename': {
      const a=albumById(id); if(!a) break;
      modalInput({title:'Rename album',def:a.name,ok:'Rename',
        onOk:v=>renameAlbum(id,v)}); break; }
    case 'album-delete':
      modalConfirm({title:'Delete album?',text:'The album will be removed. Its photos move to Unsorted — they are not deleted.',
        okLabel:'Delete album',danger:true,onOk:()=>deleteAlbum(id)}); break;
    case 'new-collection':
      modalInput({title:'New collection',label:'Collection name',ok:'Create',
        onOk:v=>{createCollection(v);toast('Collection created.');}}); break;
    case 'col-rename': {
      const c=S.collections.find(x=>x.rec.id===id); if(!c) break;
      modalInput({title:'Rename collection',def:c.name,ok:'Rename',onOk:v=>renameCollection(id,v)}); break; }
    case 'col-delete':
      modalConfirm({title:'Delete collection?',text:'The collection will be removed. Its albums are kept — they simply become ungrouped.',
        okLabel:'Delete',danger:true,onOk:()=>deleteCollection(id)}); break;

    case 'modal-close': closeModal(); break;

    case 'set-autolock':
      modalOptions({title:'Auto-lock after',current:String(S.prefs.autolock),
        options:[{v:'1',label:'1 minute'},{v:'5',label:'5 minutes'},{v:'15',label:'15 minutes'},{v:'0',label:'Never'}],
        onPick:async v=>{ S.prefs.autolock=parseInt(v,10); await kvPut('prefs',S.prefs); render(); resetLockTimer(); }}); break;
    case 'set-changepw':
      openModal(`<h3>Change passphrase</h3><p>Everything is re-encrypted with the new passphrase.</p>
        <input id="cp-cur" type="password" placeholder="Current passphrase" autocomplete="current-password">
        <input id="cp-new" type="password" placeholder="New passphrase (12+ characters)" autocomplete="new-password">
        <input id="cp-new2" type="password" placeholder="Repeat new passphrase" autocomplete="new-password">
        <div class="modal-btns"><button class="btn ghost" data-act="modal-close">Cancel</button>
        <button class="btn primary" id="m-ok">Change</button></div>`);
      $('m-ok').onclick=async()=>{
        const cur=$('cp-cur').value,nw=$('cp-new').value,nw2=$('cp-new2').value;
        if(nw.length<8){toast('New passphrase needs at least 8 characters.');return;}
        if(nw!==nw2){toast('New passphrases do not match.');return;}
        closeModal(); toast('Re-encrypting…');
        try{ await changePassphrase(cur,nw); toast('Passphrase changed.'); }
        catch(e){ toast(e.message||'Could not change passphrase.'); }
      }; break;
    case 'set-export': exportBackup(); break;
    case 'set-import': $('backuppicker').click(); break;
    case 'set-wipe': {
      const btn=el;
      if(btn.dataset.armed){ 
        modalConfirm({title:'Delete everything?',text:'This permanently deletes all photos, albums, collections, and the vault itself from this device. This cannot be undone.',
          okLabel:'Delete everything',danger:true,onOk:async()=>{
            await Promise.all([clearRecs('photos'),clearRecs('albums'),clearRecs('collections')]);
            const d=await db(); await reqOf(d.transaction('kv','readwrite').objectStore('kv').delete('meta'));
            doLock(); toast('Vault deleted.'); }}); }
      else{ btn.dataset.armed='1'; btn.querySelector('.grow').textContent='Tap again to confirm deletion';
        setTimeout(()=>{delete btn.dataset.armed;const g=btn.querySelector('.grow');if(g)g.textContent='Delete all vault data';},4000); }
      break; }
  }
}

/* ---------------- events ---------------- */
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');
  if(!el) return;
  handleAction(el.dataset.act, el.dataset.id, el).catch(err=>toast('Error: '+(err.message||err)));
});
$('filepicker').addEventListener('change',e=>{ addFiles(e.target.files,S.pendingAlbum); e.target.value=''; S.pendingAlbum=null; });
$('camerapicker').addEventListener('change',e=>{ addFiles(e.target.files,S.pendingAlbum); e.target.value=''; S.pendingAlbum=null; });
$('backuppicker').addEventListener('change',e=>{ if(e.target.files[0]) importBackup(e.target.files[0]); e.target.value=''; });
$('lock-pw').addEventListener('keydown',e=>{ if(e.key==='Enter') unlockVault(); });
$('setup-pw2').addEventListener('keydown',e=>{ if(e.key==='Enter') setupVault(); });
$('setup-pw1').addEventListener('input',()=>{
  const v=$('setup-pw1').value, h=$('pw-hint');
  if(!v) h.textContent='';
  else if(v.length<8) h.textContent='Too short — aim for 12 or more.';
  else if(v.length<12) h.textContent='OK, but longer is stronger.';
  else h.textContent='Good length.';
});

/* ---------------- service worker (offline after first load; hosted only) ---------------- */
if('serviceWorker' in navigator && location.protocol.indexOf('http')===0){
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}

/* ---------------- boot ---------------- */
(async function(){
  armAutoLock();
  const t=await selfTest(); S.selftest=t;
  const lockErr=$('lock-error');
  if(!t.crypto||!t.storage){
    show('screen-lock'); $('lock-pw').style.display='none';
    document.querySelector('#screen-lock [data-act="unlock-go"]').style.display='none';
    lockErr.textContent='This browser cannot provide the encryption or storage this vault needs. '+(t.detail||'');
    return;
  }
  try{ S.prefs=Object.assign({autolock:5}, await kvGet('prefs')||{}); }catch(e){}
  let meta=null;
  try{ meta=await kvGet('meta'); }catch(e){}
  show(meta?'screen-lock':'screen-setup');
})();

</script>
</body>
</html>
